<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>봉숙이 AI 누끼 사이트</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .box { background: white; display: inline-block; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #loading { display: none; color: #0066ff; font-weight: bold; margin-top: 15px; }
        #result { max-width: 350px; margin-top: 20px; display: block; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🐶 봉숙이 배경 제거</h1>
        <p>봉숙이 사진을 선택하면 서버 AI가 배경을 지워줍니다!</p>
        <input type="file" id="upload" accept="image/*">
        <div id="loading">✨ 서버에서 봉숙이 누끼를 따는 중입니다...</div>
        <br>
        <img id="result" alt="결과 이미지가 여기에 나타납니다.">
    </div>

    <script>
        const uploadInput = document.getElementById('upload');
        const loadingDiv = document.getElementById('loading');
        const resultImg = document.getElementById('result');

        uploadInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loadingDiv.style.display = 'block';
            resultImg.src = '';

            try {
                // 본인의 Cloudflare Worker URL로 변경하세요
                const workerUrl = 'https://bongsuk-nukki.sujinohkor.workers.dev'; 

                const response = await fetch(workerUrl, {
                    method: 'POST',
                    body: file,
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || '서버 처리 실패');
                }

                const blob = await response.blob();
                resultImg.src = URL.createObjectURL(blob);
            } catch (err) {
                alert('오류가 발생했습니다: ' + err.message);
            } finally {
                loadingDiv.style.display = 'none';
            }
        });
    </script>
</body>
</html>
