<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>봉숙이 AI 누끼 생성기</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .box { background: white; display: inline-block; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #loading { display: none; color: #0066ff; font-weight: bold; margin-top: 15px; }
        #result { max-width: 350px; margin-top: 20px; display: block; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🐶 봉숙이 배경 제거</h1>
        <p>봉숙이 사진을 선택하면 브라우저 AI가 즉시 배경을 지워줍니다!</p>
        <input type="file" id="upload" accept="image/*">
        <div id="loading">✨ AI가 봉숙이 누끼를 따는 중입니다... (잠시만 기다려주세요)</div>
        <br>
        <img id="result" alt="결과 이미지가 여기에 나타납니다.">
    </div>

    <!-- 브라우저에서 직접 AI를 돌려주는 가벼운 라이브러리 CDN 연동 -->
    <script type="module">
        import { removeBackground, Config } from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.7/+esm';
    
        const uploadInput = document.getElementById('upload');
        const resultImg = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
    
        // [최적화] 모델 파일을 브라우저 캐시에 저장하도록 설정
        // 이렇게 하면 첫 다운로드 후, 다음부터는 로컬에서 불러와 훨씬 빠릅니다.
        const config: Config = {
            publicPath: 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.7/dist/', // 모델 파일 경로 고정
        };
    
        uploadInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
    
            loadingDiv.style.display = 'block';
            loadingDiv.textContent = "✨ AI 모델을 불러오는 중... (첫 실행 시 시간이 걸릴 수 있습니다)";
            resultImg.src = '';
    
            try {
                // [최적화] config를 두 번째 인자로 전달합니다.
                const blob = await removeBackground(file, config);
                const url = URL.createObjectURL(blob);
                resultImg.src = url;
                loadingDiv.style.display = 'none';
            } catch (error) {
                console.error(error);
                alert('배경 제거 중 오류가 발생했습니다.');
                loadingDiv.style.display = 'none';
            }
        });
    </script>
</body>
</html>
