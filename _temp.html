<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>봉숙이 AI 누끼 생성기</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .box { background: white; display: inline-block; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #loading { display: none; color: #0066ff; font-weight: bold; margin-top: 15px; }
        #result { max-width: 350px; margin-top: 20px; display: block; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🐶 봉숙이 배경 제거</h1>
        <p>봉숙이 사진을 선택하면 브라우저 AI가 즉시 배경을 지워줍니다!</p>
        <input type="file" id="upload" accept="image/*">
        <div id="loading">✨ AI가 봉숙이 누끼를 따는 중입니다... (잠시만 기다려주세요)</div>
        <br>
        <img id="result" alt="결과 이미지가 여기에 나타납니다.">
    </div>

    <!-- 브라우저에서 직접 AI를 돌려주는 가벼운 라이브러리 CDN 연동 -->
    <script type="module">
        import { removeBackground } from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.7/+esm';

        const uploadInput = document.getElementById('upload');
        const loadingDiv = document.getElementById('loading');
        const resultImg = document.getElementById('result');

        uploadInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loadingDiv.style.display = 'block';
            resultImg.src = '';

            try {
                // 브라우저 내부에서 AI 모델이 직접 배경을 제거합니다.
                const blob = await removeBackground(file);
                const url = URL.createObjectURL(blob);
                resultImg.src = url;
            } catch (error) {
                console.error(error);
                alert('배경 제거 중 오류가 발생했습니다.');
            } finally {
                loadingDiv.style.display = 'none';
            }
        });
    </script>
</body>
</html>
