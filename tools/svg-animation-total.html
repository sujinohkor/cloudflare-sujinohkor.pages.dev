<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Animation Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#101010;--panel:rgba(16,16,16,.28);--text:#fff;--muted:#888;--accent:#ff9e40;--field:rgba(255,255,255,.04);--border:rgba(255,158,64,.38)}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",sans-serif;min-height:100vh;overflow:hidden;transition:.25s}
body.light{--bg:#fff;--panel:rgba(255,255,255,.45);--text:#202020;--muted:#666;--field:rgba(0,0,0,.025)}
.app{display:flex;min-height:100vh;width:100%}
.sidebar{width:260px;height:calc(100vh - 40px);position:fixed;left:20px;top:20px;z-index:10;padding:25px 20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--border);border-radius:24px;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 40px rgba(0,0,0,.35);overflow:auto}
body.light .sidebar{background:rgba(255,255,255,.3);border-color:rgba(243,128,32,.35);box-shadow:0 20px 40px rgba(243,128,32,.15)}
.sidebar-title{color:#ff9e40;font-size:1.1rem;font-weight:bold;margin-bottom:5px;text-align:center;letter-spacing:1px}
.theme-toggle-btn,.menu-btn{width:100%;padding:11px 14px;cursor:pointer;text-align:center;background:rgba(255,255,255,.03);color:#ff9e40;border:1px solid rgba(255,158,64,.4);border-radius:50px;font-weight:bold;transition:.3s;font-size:.85rem}
.theme-toggle-btn:hover,.menu-btn:hover{background:rgba(255,158,64,.2);border-color:rgba(255,158,64,.65)}
body.light .theme-toggle-btn,body.light .menu-btn{background:rgba(0,0,0,.02);color:#F38020;border-color:rgba(243,128,32,.5)}
.selector-label{font-size:11px;color:var(--muted);padding-left:4px}
select,.control input{width:100%;padding:9px 10px;border:1px solid rgba(255,255,255,.13);border-radius:10px;background:var(--field);color:var(--text);outline:none;font-family:inherit}
select option{background:#202020;color:#fff}
body.light select,body.light .control input{border-color:rgba(0,0,0,.14);background:#fff;color:#202020}
body.light select option{background:#fff;color:#202020}
.palette-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.palette-btns .menu-btn.active{background:rgba(255,158,64,.2);border-color:rgba(255,158,64,.75)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0}
.control{display:flex;flex-direction:column;gap:5px}
.control label{font-size:11px;color:var(--muted);padding-left:4px}
.main{margin-left:300px;padding:40px;flex:1;height:100vh;width:calc(100% - 300px);display:flex;flex-direction:column;gap:20px;overflow:hidden}
header h1{font-size:1.8rem;margin-bottom:5px} header p{font-size:.95rem;color:var(--muted)}
.workspace{display:flex;gap:20px;flex:1;min-height:0}
.panel{border:2px solid var(--accent);border-radius:16px;background:rgba(0,0,0,.12);box-shadow:0 10px 20px rgba(0,0,0,.28);padding:20px;min-height:0}
body.light .panel{background:rgba(255,255,255,.5);border-color:#F38020;box-shadow:0 10px 20px rgba(243,128,32,.15)}
.left{flex:1;display:flex;flex-direction:column;gap:12px}.left label{color:var(--accent);font-weight:700}
textarea{width:100%;flex:1;resize:none;border-radius:12px;padding:15px;border:1px solid rgba(255,255,255,.15);background:var(--field);color:var(--text);font-size:16px;font-family:inherit;line-height:1.5;outline:none}
body.light textarea{background:rgba(0,0,0,.02);color:#202020;border-color:rgba(0,0,0,.15)}
textarea:focus{border-color:var(--accent)}.hint{font-size:12px;color:var(--muted);line-height:1.5}
.right{flex:1.2;overflow:auto;display:flex;align-items:flex-start;justify-content:flex-start}
.preview-wrap{min-width:680px;flex:0 0 auto}.preview-wrap svg{width:680px;min-width:680px;height:auto;display:block}
.menu-toggle{display:none;position:fixed;left:20px;bottom:20px;z-index:20;padding:10px 15px;background:var(--accent);color:#fff;border:none;border-radius:50px;font-weight:bold}
@media(max-width:900px){body{overflow:auto}.menu-toggle{display:block}.sidebar{transform:translateX(-320px);transition:.25s;background:var(--bg)}.sidebar.active{transform:translateX(0)}.main{margin-left:0;padding:20px;width:100vw;height:auto;min-height:100svh}.workspace{flex-direction:column}.left{min-height:330px}.right{min-height:300px}}
</style>
</head>
<body>
<button class="menu-toggle" id="menuToggle">MENU</button>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-title">SVG Animator</div>
  <button class="theme-toggle-btn" id="themeBtn">DAY / NIGHT</button>
  <button class="menu-btn" id="homeBtn">Home</button>

  <label class="selector-label" for="generatorType">Generator</label>
  <select id="generatorType">
    <option value="typewriter">Typewriter</option>
    <option value="code">Code Typing</option>
    <option value="terminal">Terminal</option>
    <option value="timeline">Timeline</option>
    <option value="progress">Progress Steps</option>
    <option value="notification">Notification</option>
    <option value="search">Search Bar</option>
    <option value="skill">Skill Badge</option>
    <option value="counter">Counter</option>
    <option value="flowchart">Flowchart</option>
    <option value="architecture">Architecture Diagram</option>
    <option value="beforeAfter">Before / After</option>
  </select>

  <div class="palette-btns">
    <button class="menu-btn active" id="blackBtn">Black</button>
    <button class="menu-btn" id="whiteBtn">White</button>
  </div>

  <div class="controls" id="controls"></div>

  <button class="menu-btn" id="applyBtn">Apply Animation</button>
  <button class="menu-btn" id="replayBtn">Replay</button>
  <button class="menu-btn" id="copyBtn">Copy SVG Code</button>
  <button class="menu-btn" id="downloadBtn">Download SVG</button>
  <button class="menu-btn" id="resetBtn">Reset</button>
</aside>

<main class="main" id="main">
<header>
  <h1 id="pageTitle">Typewriter SVG Generator</h1>
  <p id="pageDesc"></p>
</header>
<div class="workspace">
  <section class="panel left">
    <label id="inputLabel" for="mainInput">Text</label>
    <textarea id="mainInput" spellcheck="false"></textarea>
    <div class="hint" id="hint"></div>
  </section>
  <section class="panel right"><div class="preview-wrap" id="previewWrap"></div></section>
</div>
</main>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const mainInput=document.getElementById("mainInput"), previewWrap=document.getElementById("previewWrap");
const generatorType=document.getElementById("generatorType"), controls=document.getElementById("controls");

        controls: [

};
function esc(s){return String(s).replace(/[<>&'"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;","'":"&apos;",'"':"&quot;"}[c]))}
function n(id,f){const v=Number(document.getElementById(id)?.value);return Number.isFinite(v)?v:f}
function pal(){
 if(svgTheme==="white")return{bg:"#f3f3f3",border:"#cfcfcf",card:"#e5e5e5",card2:"#fff",text:"#202020",muted:"#626262",line:"#9a9a9a",active:"#333",activeText:"#fff"};
 return{bg:"#181818",border:"#333",card:"#252525",card2:"#242424",text:"#fff",muted:"#b8b8b8",line:"#555",active:"#fff",activeText:"#181818"};
}
function wrap(t,m){if(!t)return[""];const w=t.split(/\s+/).filter(Boolean),o=[];let c="";w.forEach(x=>{let q=c?c+" "+x:x;if(q.length>m&&c){o.push(c);c=x}else c=q});if(c)o.push(c);return o.length?o:[""]}
function measure(t,fs,mono=false){const c=measure.c||(measure.c=document.createElement("canvas")),x=c.getContext("2d");x.font=`600 ${fs}px ${mono?"Consolas":"Segoe UI"}`;return x.measureText(t).width}
function rootSvg(width,height,inside){const p=pal();return `<?xml version="1.0" encoding="UTF-8"?>\n<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="${NS}">\n<rect width="${width}" height="${height}" rx="16" fill="${p.bg}" stroke="${p.border}" stroke-width="2"/>\n${inside}\n</svg>`}

function buildTypewriter(mono=false){
 const s=mainInput.value.replace(/\r/g,"").split("\n"),sp=Math.max(.01,n("a",.07)),gap=Math.max(0,n("b",.35)),fs=Math.max(10,n("c",22)),w=Math.max(420,n("d",760)),p=pal();
 const lh=Math.round(fs*1.55),px=32,py=34,h=Math.max(150,py*2+Math.max(1,s.length)*lh);let t=0,o=[];
 s.forEach((line,i)=>{const y=py+fs+i*lh,ch=[...line];ch.forEach((_,j)=>{const b=t+j*sp,v=ch.slice(0,j+1).join("");o.push(`<text x="${px}" y="${y}" fill="${p.text}" font-size="${fs}" font-family="${mono?"Consolas, 'Courier New', monospace":"'Segoe UI', sans-serif"}" xml:space="preserve" opacity="0">${esc(v)}<animate attributeName="opacity" from="0" to="1" begin="${b.toFixed(3)}s" dur=".01s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="${(b+sp).toFixed(3)}s" dur=".01s" fill="freeze"/></text>`)});
 if(ch.length)o.push(`<text x="${px}" y="${y}" fill="${p.text}" font-size="${fs}" font-family="${mono?"Consolas, 'Courier New', monospace":"'Segoe UI', sans-serif"}" xml:space="preserve" opacity="0">${esc(line)}<animate attributeName="opacity" from="0" to="1" begin="${(t+(ch.length-1)*sp).toFixed(3)}s" dur=".01s" fill="freeze"/></text>`);
 t+=ch.length*sp+gap});

}
function buildCode(){
 const lines=mainInput.value.replace(/\r/g,"").split("\n"),sp=Math.max(.01,n("a",.045)),gap=Math.max(0,n("b",.3)),fs=Math.max(10,n("c",17)),w=Math.max(420,n("d",760)),p=pal(),lh=Math.round(fs*1.55),top=42,pad=20,noW=54,x=noW+18,h=Math.max(150,top+pad+lines.length*lh+28);let t=0,o=[`<line x1="${noW}" y1="${top}" x2="${noW}" y2="${h-12}" stroke="${p.border}"/>`];
 lines.forEach((line,i)=>{const y=top+pad+i*lh+fs,ch=[...line];o.push(`<text x="${noW-12}" y="${y}" fill="${p.muted}" font-size="${fs}" font-family="Consolas, monospace" text-anchor="end" opacity="0">${i+1}<animate attributeName="opacity" from="0" to="1" begin="${t.toFixed(3)}s" dur=".12s" fill="freeze"/></text>`);ch.forEach((_,j)=>{const b=t+j*sp;o.push(`<text x="${x}" y="${y}" fill="${p.text}" font-size="${fs}" font-family="Consolas, monospace" xml:space="preserve" opacity="0">${esc(ch.slice(0,j+1).join(""))}<animate attributeName="opacity" from="0" to="1" begin="${b.toFixed(3)}s" dur=".01s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="${(b+sp).toFixed(3)}s" dur=".01s" fill="freeze"/></text>`)});if(ch.length)o.push(`<text x="${x}" y="${y}" fill="${p.text}" font-size="${fs}" font-family="Consolas, monospace" xml:space="preserve" opacity="0">${esc(line)}<animate attributeName="opacity" from="0" to="1" begin="${(t+(ch.length-1)*sp).toFixed(3)}s" dur=".01s" fill="freeze"/></text>`);t+=ch.length*sp+gap});
 return rootSvg(w,h,o.join("\n"));
}
function buildTerminal(){
 const lines=mainInput.value.replace(/\r/g,"").split("\n"),sp=Math.max(.01,n("a",.055)),gap=Math.max(0,n("b",.4)),fs=Math.max(10,n("c",18)),w=Math.max(420,n("d",720)),p=pal(),lh=Math.round(fs*1.55),top=40,pad=22,h=Math.max(140,top+pad+lines.length*lh+28);let t=0,o=[`<rect width="${w}" height="40" rx="16" fill="${p.card}"/><circle cx="20" cy="20" r="6" fill="#ff5f57"/><circle cx="40" cy="20" r="6" fill="#febc2e"/><circle cx="60" cy="20" r="6" fill="#28c840"/>`];
 lines.forEach((line,i)=>{const y=top+pad+i*lh+fs,cmd=/^\s*[$>#]/.test(line),ch=[...line];if(cmd){ch.forEach((_,j)=>{const b=t+j*sp;o.push(`<text x="24" y="${y}" fill="${p.text}" font-size="${fs}" font-family="Consolas, monospace" xml:space="preserve" opacity="0">${esc(ch.slice(0,j+1).join(""))}<animate attributeName="opacity" from="0" to="1" begin="${b.toFixed(3)}s" dur=".01s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="${(b+sp).toFixed(3)}s" dur=".01s" fill="freeze"/></text>`)});if(ch.length)o.push(`<text x="24" y="${y}" fill="${p.text}" font-size="${fs}" font-family="Consolas, monospace" xml:space="preserve" opacity="0">${esc(line)}<animate attributeName="opacity" from="0" to="1" begin="${(t+(ch.length-1)*sp).toFixed(3)}s" dur=".01s" fill="freeze"/></text>`);t+=ch.length*sp+gap}else{o.push(`<text x="24" y="${y}" fill="${p.muted}" font-size="${fs}" font-family="Consolas, monospace" xml:space="preserve" opacity="0">${esc(line)}<animate attributeName="opacity" from="0" to="1" begin="${t.toFixed(3)}s" dur=".18s" fill="freeze"/></text>`);t+=gap}});
 return rootSvg(w,h,o.join("\n"));
}
function buildTimeline(){
 const items=mainInput.value.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{let i=x.indexOf("|");return i<0?["",x]:[x.slice(0,i).trim(),x.slice(i+1).trim()]}),del=Math.max(0,n("a",.55)),dur=Math.max(.05,n("b",.35)),fs=Math.max(10,n("c",17)),w=Math.max(480,n("d",760)),p=pal(),axis=170,cardX=206,cardW=w-cardX-28,lh=Math.round(fs*1.45);let y=34,o=[];
 items.forEach((it,k)=>{let lines=wrap(it[1],Math.max(16,Math.floor((cardW-32)/(fs*.55)))),ch=Math.max(48,28+lines.length*lh),cy=y+ch/2,b=(k*del).toFixed(3);o.push(`<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="${b}s" dur="${dur}s" fill="freeze"/><text x="${axis-20}" y="${cy+fs*.35}" fill="${p.text}" font-size="${fs}" font-family="Segoe UI" text-anchor="end" font-weight="600">${esc(it[0])}</text><circle cx="${axis}" cy="${cy}" r="7" fill="${p.active}"/><rect x="${cardX}" y="${y}" width="${cardW}" height="${ch}" rx="14" fill="${p.card}" stroke="${p.border}"/>${lines.map((z,i)=>`<text x="${cardX+16}" y="${y+18+fs+i*lh}" fill="${p.text}" font-size="${fs}" font-family="Segoe UI">${esc(z)}</text>`).join("")}</g>`);y+=ch+22});
 const h=Math.max(150,y+20);o.unshift(`<line x1="${axis}" y1="50" x2="${axis}" y2="${h-42}" stroke="${p.line}" stroke-width="3" stroke-linecap="round"/>`);return rootSvg(w,h,o.join("\n"));
}
function buildProgress(){
 const s=mainInput.value.split(/\n|→/).map(x=>x.trim()).filter(Boolean),del=Math.max(0,n("a",.7)),dur=Math.max(.05,n("b",.35)),fs=Math.max(10,n("c",17)),w=Math.max(520,n("d",820)),p=pal(),h=230,pad=70,cy=94,r=24,space=s.length<=1?0:(w-pad*2)/(s.length-1);let o=[];
 for(let i=0;i<s.length-1;i++){let x1=pad+i*space+r,x2=pad+(i+1)*space-r,b=((i+1)*del).toFixed(3);o.push(`<line x1="${x1}" y1="${cy}" x2="${x2}" y2="${cy}" stroke="${p.line}" stroke-width="8" stroke-linecap="round"/><line x1="${x1}" y1="${cy}" x2="${x2}" y2="${cy}" stroke="${p.active}" stroke-width="8" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" begin="${b}s" dur="${dur}s" fill="freeze"/></line>`)}
 s.forEach((z,i)=>{let x=pad+i*space,b=(i*del).toFixed(3);o.push(`<circle cx="${x}" cy="${cy}" r="${r}" fill="${p.card}" stroke="${p.border}"/><circle cx="${x}" cy="${cy}" r="${r}" fill="${p.active}" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="${b}s" dur="${dur}s" fill="freeze"/></circle><text x="${x}" y="${cy+fs*.35}" fill="${p.text}" font-size="${fs}" font-family="Segoe UI" text-anchor="middle">${i+1}</text><text x="${x}" y="${cy+62}" fill="${p.text}" font-size="${fs}" font-family="Segoe UI" text-anchor="middle">${esc(z)}</text>`)});return rootSvg(w,h,o.join("\n"));
