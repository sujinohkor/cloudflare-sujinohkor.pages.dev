<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather and Time</title>
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Three.js 및 Globe.gl CDN -->
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>

    <style>
        /* 1. Reset & Base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background-color: #202020;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
            min-height: 100%;
            transition: background 0.3s;
        }
        
        /* 2. Layout */
        .app-container { 
            display: block; 
            position: relative;
            min-height: 100vh;
        }
        .sidebar { 
            width: 250px; height: 100vh; position: fixed; left: 0; top: 0; 
            background-color: #101010; padding: 20px; z-index: 1000; 
            display: flex; flex-direction: column; transition: transform 0.3s ease;
        }
        
        .sidebar > * { margin-bottom: 10px; }
        .sidebar > *:last-child { margin-bottom: 0; }
        
        .main-content { 
            margin-left: 250px; 
            padding: 40px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            min-height: 100vh; 
            transition: 0.3s; 
        }

        .workspace-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
        }

        /* 3. Components (Sidebar Controls) */
        .menu-btn, .theme-btn, .reset-btn { 
            width: 100%; padding: 10px; cursor: pointer;
            background: #202020; color: #ff9e40; border: 2px solid #ff9e40; 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; text-align: center;
        }
        .menu-btn:hover, .reset-btn:hover { background: #ff9e40; color: #101010; }
        .theme-btn:hover { background-color: #FDF5E6; color: #F38020; border-color: #FDF5E6; }

        .search-box { display: flex; gap: 6px; }
        .search-input {
            flex: 1; padding: 8px 12px; background: #202020; border: 2px solid #ff9e40;
            border-radius: 16px; color: #fff; font-size: 0.85rem; outline: none; width: 100%;
        }
        .search-btn {
            padding: 8px 12px; background: #ff9e40; color: #101010; border: none;
            border-radius: 16px; cursor: pointer; font-weight: bold; font-size: 0.85rem;
        }

        .api-switcher { display: flex; gap: 6px; }
        .api-btn {
            flex: 1; padding: 8px 0; background: #202020; color: #888;
            border: 1px solid #444; border-radius: 16px; cursor: pointer; font-size: 0.8rem; font-weight: bold;
            transition: all 0.2s;
        }
        .api-btn.active { background: #ff9e40; color: #101010; border-color: #ff9e40; }

        .view-switcher { display: flex; flex-direction: column; gap: 10px; }
        .view-btn {
            width: 100%; padding: 8px 0; background: #202020; color: #ff9e40;
            border: 2px solid #ff9e40; border-radius: 16px; cursor: pointer; font-size: 0.8rem; font-weight: bold;
            transition: all 0.2s; text-align: center;
        }
        .view-btn.active { background: #ff9e40; color: #101010; }

        /* 4. Weather Display Components */
        .card { 
            background: #101010; padding: 30px; border-radius: 16px; border: 2px solid #ff9e40; 
            width: 300px; height: 320px; flex-shrink: 0; text-align: center; display: flex; flex-direction: column;
            justify-content: center; align-items: center; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .forecast-panel {
            background: #101010; padding: 25px; border-radius: 16px; border: 2px solid #ff9e40; 
            flex-grow: 1; height: 500px; display: flex; flex-direction: column; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .forecast-title {
            font-size: 1.1rem; color: #ff9e40; font-weight: bold; margin-bottom: 15px;
            padding-bottom: 8px; border-bottom: 1px solid #333;
        }

        .forecast-list {
            overflow-y: auto; overflow-x: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; flex: 1;
            -webkit-overflow-scrolling: touch;
        }
        .forecast-list::-webkit-scrollbar { width: 6px; }
        .forecast-list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .forecast-item {
            display: grid;
            grid-template-columns: 100px 1fr 80px 80px 80px 70px 60px;
            align-items: center;
            padding: 12px 16px;
            background: #202020;
            border-radius: 12px;
            font-size: 0.85rem;
            gap: 10px;
            min-width: 650px;
        }
        .forecast-time { color: #888; font-weight: bold; }
        .forecast-desc { color: #ccc; text-align: left; }
        .forecast-rain { color: #64b5f6; text-align: center; }
        .forecast-wind { color: #aaa; text-align: center; }
        .forecast-humidity { color: #81c784; text-align: center; }
        .forecast-uv { color: #ffb74d; text-align: center; }
        .forecast-temp { color: #ff9e40; font-weight: bold; text-align: right; }

        .city { font-size: 1.8rem; color: #ff9e40; font-weight: bold; margin-bottom: 10px; text-transform: capitalize; }
        .temp { font-size: 3.5rem; font-weight: bold; margin: 15px 0; }
        .desc { font-size: 1.1rem; color: #ccc; }
        .details { margin-top: 20px; font-size: 0.9rem; color: #888; display: flex; justify-content: space-around; width: 100%; }

        /* Map & Globe Container Views */
        .map-view-container, .globe-view-container {
            display: none;
            width: 100%;
            height: 500px;
            background: #b5d0d0;
            border: 2px solid #ff9e40;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
        }
        .globe-view-container { background: #101010; }
        
        #map, #globeViz { 
            position: absolute !important;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100% !important; 
            height: 100% !important; 
        }
        #map { background: #b5d0d0 !important; }

        /* 3D Globe 우측 상단 커스텀 정보 패널 스타일 */
        .globe-info-card {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(16, 16, 16, 0.9);
            border: 2px solid #ff9e40;
            border-radius: 12px;
            padding: 20px;
            width: 260px;
            z-index: 99;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: none;
            font-family: 'Segoe UI', sans-serif;
        }
        .globe-info-card h3 { color: #ff9e40; font-size: 1.2rem; margin-bottom: 8px; }
        .globe-info-card p { font-size: 0.9rem; color: #ccc; margin-bottom: 12px; }
        .globe-info-btn {
            width: 100%;
            background: #ff9e40;
            color: #101010;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .globe-info-btn:hover { background: #ffb74d; }

        /* 5. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #000; }
        body.light-mode .sidebar { background-color: #FDF5E6; box-shadow: 4px 0 15px rgba(0,0,0,0.05); }
        body.light-mode .menu-btn, body.light-mode .theme-btn, body.light-mode .reset-btn { background: #FDF5E6; color: #F38020; border-color: #F38020; }
        body.light-mode .menu-btn:hover, body.light-mode .reset-btn:hover { background: #F38020; color: #ffffff; border-color: #F38020; }
        body.light-mode .theme-btn:hover { background-color: #202020; color: #ff9e40; border-color: #202020; }
        body.light-mode .top-section h1 { color: #000; }
        body.light-mode .top-section p { color: #202020; }
        
        body.light-mode .card, body.light-mode .forecast-panel, body.light-mode .map-view-container, body.light-mode .globe-view-container { 
            background-color: #FDF5E6; 
            border-color: #F38020; 
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15); 
        }
        body.light-mode .forecast-title { color: #F38020; border-bottom-color: #fbd3b1; }
        body.light-mode .forecast-item { 
            background: #fff; 
            color: #000; 
            border: 1px solid #fce3ce; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.03); 
        }
        body.light-mode .forecast-time { color: #202020; }
        body.light-mode .forecast-desc { color: #000; }
        body.light-mode .forecast-rain { color: #1976d2; }
        body.light-mode .forecast-wind { color: #424242; }
        body.light-mode .forecast-humidity { color: #2e7d32; }
        body.light-mode .forecast-uv { color: #f57c00; }
        body.light-mode .forecast-temp { color: #F38020; }
        body.light-mode .city { color: #F38020; }
        body.light-mode .temp { color: #000; }
        body.light-mode .desc { color: #000; }
        body.light-mode .details { color: #202020; }
        body.light-mode .search-input { background: #fff; color: #000; border-color: #F38020; }
        body.light-mode .search-input::placeholder { color: #666; }
        body.light-mode .search-btn { background: #F38020; color: #fff; }
        body.light-mode .api-btn, body.light-mode .view-btn { background: #fff; border-color: #ccc; color: #202020; }
        body.light-mode .api-btn.active, body.light-mode .view-btn.active { background: #F38020; color: #fff; border-color: #F38020; }
        body.light-mode .menu-toggle-btn { color: #ffffff; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        body.light-mode .globe-info-card { background: rgba(253, 245, 230, 0.95); border-color: #F38020; color: #000; }
        body.light-mode .globe-info-card h3 { color: #F38020; }
        body.light-mode .globe-info-card p { color: #333; }
        body.light-mode .globe-info-btn { background: #F38020; color: #fff; }

        /* 6. 모바일 대응 */
        @media (max-width: 1100px) {
            .workspace-container { flex-direction: column; }
            .card { width: 100%; height: 260px; }
            .forecast-panel { width: 100%; height: 450px; }
            .map-view-container, .globe-view-container { height: 450px; }
        }

        .menu-toggle-btn { display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }
        
        @media (max-width: 680px) {
            .menu-toggle-btn { display: block; }
            .sidebar { transform: translateX(-250px); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0 !important; padding: 20px; width: 100%; }
        }
    </style>
</head>
<body>

<button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>

<div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <button class="menu-btn" onclick="location.href='../index'">Home</button>
        <button id="theme-toggle" class="theme-btn">DAY / NIGHT</button>

        <div class="search-box">
            <input type="text" id="city-input" list="city-list" class="search-input" placeholder="Select/type city" onchange="searchCity()" onkeydown="if(event.key==='Enter') searchCity()">
            <datalist id="city-list">
                <option value="Seoul"></option>
                <option value="Tokyo"></option>
                <option value="New York"></option>
                <option value="London"></option>
                <option value="Paris"></option>
                <option value="Sydney"></option>
                <option value="Berlin"></option>
                <option value="Toronto"></option>
                <option value="Singapore"></option>
                <option value="Dubai"></option>
            </datalist>
            <button class="search-btn" onclick="searchCity()">Search</button>
        </div>

        <div class="api-switcher">
            <button class="api-btn active" id="btn-wttr" onclick="switchApi('wttr')">wttr.in</button>
            <button class="api-btn" id="btn-meteo" onclick="switchApi('meteo')">Open-Meteo</button>
        </div>

        <div class="view-switcher">
            <button class="view-btn active" id="btn-weather-view" onclick="switchView('weather')">Weather</button>
            <button class="view-btn" id="btn-leaflet-view" onclick="switchView('leaflet')">Leaflet Map</button>
            <button class="view-btn" id="btn-globe-view" onclick="switchView('globe')">3D Globe</button>
            <button class="view-btn reset-btn" onclick="initLocation()">Reset Location</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-section">
            <h1 id="main-title">Weather and Time</h1>
            <p id="main-desc">Check the weather and time now.</p>
        </header>
        
        <!-- 날씨 대시보드 뷰 -->
        <div class="workspace-container" id="weather-workspace">
            <section class="card">
                <div class="city" id="city-name">Detecting...</div>
                <div class="desc" id="weather-desc">Loading...</div>
                <div class="temp" id="temp">--°C</div>
                <div class="details">
                    <span id="detail-1">Feels Like --°C</span>
                    <span id="detail-2">Humidity --%</span>
                </div>
            </section>

            <section class="forecast-panel">
                <div class="forecast-title" id="forecast-title">3-Day Forecast (Every 3 Hours)</div>
                <div class="forecast-list" id="forecast-list">
                    <div style="color: #888; text-align: center; margin-top: 20px;">Loading forecast...</div>
                </div>
            </section>
        </div>

        <!-- Leaflet 지도 뷰 -->
        <div class="map-view-container" id="leaflet-workspace">
            <div id="map"></div>
        </div>

        <!-- 3D 지구본 뷰 -->
        <div class="globe-view-container" id="globe-workspace">
            <div id="globeViz"></div>
            <div class="globe-info-card" id="globe-info-card">
                <h3 id="card-city-name">City</h3>
                <p id="card-city-time">Time: --</p>
                <button class="globe-info-btn" onclick="selectCityFromGlobe()">이 도시 날씨 보기</button>
            </div>
        </div>
    </main>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    const sidebar = document.getElementById('sidebar');
    let currentProvider = 'wttr';
    let currentCity = 'Seoul';
    let currentCoords = null;
    let map = null;
    let globeInstance = null;
    let isLeafletInitialized = false;
    let isGlobeInitialized = false;
    let selectedGlobeCity = null;

    function toggleSidebar() { sidebar.classList.toggle('active'); }
    document.getElementById('theme-toggle').addEventListener('click', () => { document.body.classList.toggle('light-mode'); });
    document.querySelector('.main-content').addEventListener('click', () => { if (sidebar.classList.contains('active')) { sidebar.classList.remove('active'); } });

    function switchView(viewType) {
        const weatherView = document.getElementById('weather-workspace');
        const leafletView = document.getElementById('leaflet-workspace');
        const globeView = document.getElementById('globe-workspace');
        const btnWeather = document.getElementById('btn-weather-view');
        const btnLeaflet = document.getElementById('btn-leaflet-view');
        const btnGlobe = document.getElementById('btn-globe-view');
        const title = document.getElementById('main-title');
        const desc = document.getElementById('main-desc');

        weatherView.style.display = 'none';
        leafletView.style.display = 'none';
        globeView.style.display = 'none';
        btnWeather.classList.remove('active');
        btnLeaflet.classList.remove('active');
        btnGlobe.classList.remove('active');

        if (viewType === 'weather') {
            weatherView.style.display = 'flex';
            btnWeather.classList.add('active');
            title.innerText = 'Weather';
            desc.innerText = 'Check the weather now.';
        } else if (viewType === 'leaflet') {
            leafletView.style.display = 'flex';
            btnLeaflet.classList.add('active');
            title.innerText = 'Leaflet World Map';
            desc.innerText = 'Explore 2D global map and time zones.';

            if (!isLeafletInitialized) {
                initLeafletMap();
                isLeafletInitialized = true;
            } else {
                map.invalidateSize();
            }
        } else if (viewType === 'globe') {
            globeView.style.display = 'flex';
            btnGlobe.classList.add('active');
            title.innerText = '3D Globe & Time';
            desc.innerText = 'Drag to spin the 3D globe, click markers to check time.';

            if (!isGlobeInitialized) {
                init3DGlobe();
                isGlobeInitialized = true;
            }
        }
    }

    function getCityData() {
        return [
            { name: 'Seoul', lat: 37.5665, lng: 126.9780, tz: 'Asia/Seoul' },
            { name: 'Tokyo', lat: 35.6762, lng: 139.6503, tz: 'Asia/Tokyo' },
            { name: 'Beijing', lat: 39.9042, lng: 116.4074, tz: 'Asia/Shanghai' },
            { name: 'Shanghai', lat: 31.2304, lng: 121.4737, tz: 'Asia/Shanghai' },
            { name: 'Hong Kong', lat: 22.3193, lng: 114.1694, tz: 'Asia/Hong_Kong' },
            { name: 'Singapore', lat: 1.3521, lng: 103.8198, tz: 'Asia/Singapore' },
            { name: 'Bangkok', lat: 13.7563, lng: 100.5018, tz: 'Asia/Bangkok' },
            { name: 'New Delhi', lat: 28.6139, lng: 77.2090, tz: 'Asia/Kolkata' },
            { name: 'Mumbai', lat: 19.0760, lng: 72.8777, tz: 'Asia/Kolkata' },
            { name: 'Dubai', lat: 25.2048, lng: 55.2708, tz: 'Asia/Dubai' },
            { name: 'London', lat: 51.5074, lng: -0.1278, tz: 'Europe/London' },
            { name: 'Paris', lat: 48.8566, lng: 2.3522, tz: 'Europe/Paris' },
            { name: 'Berlin', lat: 52.5200, lng: 13.4050, tz: 'Europe/Berlin' },
            { name: 'Rome', lat: 41.9028, lng: 12.4964, tz: 'Europe/Rome' },
            { name: 'Madrid', lat: 40.4168, lng: -3.7038, tz: 'Europe/Madrid' },
            { name: 'Moscow', lat: 55.7558, lng: 37.6173, tz: 'Europe/Moscow' },
            { name: 'New York', lat: 40.7128, lng: -74.0060, tz: 'America/New_York' },
            { name: 'Los Angeles', lat: 34.0522, lng: -118.2437, tz: 'America/Los_Angeles' },
            { name: 'Chicago', lat: 41.8781, lng: -87.6298, tz: 'America/Chicago' },
            { name: 'Toronto', lat: 43.6532, lng: -79.3832, tz: 'America/Toronto' },
            { name: 'Mexico City', lat: 19.4326, lng: -99.1332, tz: 'America/Mexico_City' },
            { name: 'Sao Paulo', lat: -23.5505, lng: -46.6333, tz: 'America/Sao_Paulo' },
            { name: 'Buenos Aires', lat: -34.6037, lng: -58.3816, tz: 'America/Argentina/Buenos_Aires' },
            { name: 'Cairo', lat: 30.0444, lng: 31.2357, tz: 'Africa/Cairo' },
            { name: 'Johannesburg', lat: -26.2041, lng: 28.0473, tz: 'Africa/Johannesburg' },
            { name: 'Sydney', lat: -33.8688, lng: 151.2093, tz: 'Australia/Sydney' },
            { name: 'Melbourne', lat: -37.8136, lng: 144.9631, tz: 'Australia/Melbourne' },
            { name: 'Auckland', lat: -36.8485, lng: 174.7633, tz: 'Pacific/Auckland' }
        ];
    }

    function initLeafletMap() {
        map = L.map('map', {
            minZoom: 2,
            maxBoundsViscosity: 0.8
        }).setView([20, 0], 2);

        map.setMaxBounds([[-85, -540], [85, 540]]);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            minZoom: 2,
            noWrap: false,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const cities = getCityData();

        cities.forEach(city => {
            const marker = L.marker([city.lat, city.lng]).addTo(map);
            marker.bindPopup(`
                <div style="color: #000; font-family: 'Segoe UI', sans-serif; text-align: center;">
                    <b style="font-size: 1.1rem; color: #F38020;">${city.name}</b><br>
                    <span style="font-size: 0.9rem;">현재 시간:</span><br>
                    <b>${getCityTime(city.tz)}</b><br><br>
                    <button onclick="selectCityFromMap('${city.name}')" style="background: #F38020; color: #fff; border: none; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-weight: bold;">이 도시 날씨 보기</button>
                </div>
            `);
        });

        setTimeout(() => {
            map.invalidateSize();
        }, 100);
    }

    function init3DGlobe() {
        const cities = getCityData();

        globeInstance = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .labelsData(cities)
            .labelLat(d => d.lat)
            .labelLng(d => d.lng)
            .labelText(d => d.name)
            .labelSize(1.5)
            .labelColor(() => '#ff9e40')
            .labelDotRadius(0.5)
            .onLabelClick(city => {
                selectedGlobeCity = city.name;
                const timeStr = getCityTime(city.tz);
                
                document.getElementById('card-city-name').innerText = city.name;
                document.getElementById('card-city-time').innerText = `현재 시간: ${timeStr}`;
                document.getElementById('globe-info-card').style.display = 'block';
            });

        globeInstance.controls().autoRotate = true;
        globeInstance.controls().autoRotateSpeed = 0.8;
    }

    function getCityTime(timeZone) {
        return new Intl.DateTimeFormat('ko-KR', {
            timeZone: timeZone,
            dateStyle: 'medium',
            timeStyle: 'medium'
        }).format(new Date());
    }

    function selectCityFromMap(cityName) {
        currentCoords = null;
        currentCity = cityName;
        document.getElementById('city-input').value = cityName;
        switchView('weather');
        updateWeather();
    }

    function selectCityFromGlobe() {
        if (!selectedGlobeCity) return;
        document.getElementById('globe-info-card').style.display = 'none';
        selectCityFromMap(selectedGlobeCity);
    }

    function getWeatherDescription(code) {
        if (code === 0) return '☀️ Clear sky';
        if (code >= 1 && code <= 3) return '⛅ Partly cloudy';
        if (code >= 45 && code <= 48) return '🌫️ Fog';
        if (code >= 51 && code <= 67) return '🌧️ Drizzle / Rain';
        if (code >= 71 && code <= 77) return '❄️ Snow fall';
        if (code >= 80 && code <= 82) return '🌦️ Rain showers';
        if (code >= 95) return '🌩️ Thunderstorm';
        return '☁️ Overcast';
    }

    function formatWttrDescription(desc) {
        const lower = desc.toLowerCase();
        if (lower.includes('sun') || lower.includes('clear')) return `☀️ ${desc}`;
        if (lower.includes('partly')) return `⛅ ${desc}`;
        if (lower.includes('cloud') || lower.includes('overcast')) return `☁️ ${desc}`;
        if (lower.includes('rain') || lower.includes('drizzle')) return `🌧️ ${desc}`;
        if (lower.includes('snow') || lower.includes('ice')) return `❄️ ${desc}`;
        if (lower.includes('thunder')) return `🌩️ ${desc}`;
        if (lower.includes('fog') || lower.includes('mist')) return `🌫️ ${desc}`;
        return `🌡️ ${desc}`;
    }

    async function getCoordinates(city) {
        if (currentCoords) return currentCoords;
        const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
        const response = await fetch(url);
        const data = await response.json();

        if (!data.results || data.results.length === 0) throw new Error('City not found');
        return { latitude: data.results[0].latitude, longitude: data.results[0].longitude };
    }

    async function fetchWttr() {
        const query = currentCoords ? `${currentCoords.latitude},${currentCoords.longitude}` : encodeURIComponent(currentCity);
        const response = await fetch(`https://wttr.in/${query}?format=j1`);
        if (!response.ok) throw new Error('wttr.in request failed');
        const data = await response.json();

        const current = data.current_condition[0];
        if (currentCoords && data.nearest_area?.[0]?.areaName?.[0]?.value) {
            currentCity = data.nearest_area[0].areaName[0].value;
            document.getElementById('city-input').value = currentCity;
        }
        
        const forecastList = [];
        const now = new Date();

        data.weather.slice(0, 3).forEach(day => {
            const dateStr = day.date.slice(5); 
            
            day.hourly.forEach(hour => {
                const timeNum = parseInt(hour.time, 10) / 100; 
                const hoursFormatted = String(timeNum).padStart(2, '0');
                const forecastTime = new Date(`${day.date}T${hoursFormatted}:00:00`);

                if (forecastTime >= now) {
                    const timeFormatted = `${dateStr} ${hoursFormatted}:00`;
                    const windMs = (parseInt(hour.windspeedKmph, 10) / 3.6).toFixed(1);

                    forecastList.push({
                        time: timeFormatted,
                        desc: formatWttrDescription(hour.weatherDesc[0].value),
                        rainChance: `☔ ${hour.chanceofrain}%`,
                        wind: `💨 ${windMs}m/s`,
                        humidity: `💧 ${hour.humidity}%`,
                        uv: `☀️ UV ${hour.uvIndex}`,
                        temp: `${hour.tempC}°C`
                    });
                }
            });
        });

        return {
            current: {
                temp: current.temp_C,
                desc: formatWttrDescription(current.weatherDesc[0].value),
                detail1: `Feels Like ${current.FeelsLikeC}°C`,
                detail2: `Humidity ${current.humidity}%`
            },
            forecast: forecastList
        };
    }

    async function fetchOpenMeteo() {
        const coords = await getCoordinates(currentCity);
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.latitude}&longitude=${coords.longitude}&current_weather=true&hourly=temperature_2m,relativehumidity_2m,precipitation_probability,windspeed_10m,weathercode,uv_index&forecast_days=16`;
            
        const response = await fetch(url);
        if (!response.ok) throw new Error('Open-Meteo request failed');
        const data = await response.json();
    
        const currentWeather = data.current_weather;
        const hourly = data.hourly;
        const currentHumidity = hourly.relativehumidity_2m[0];
    
        const forecastList = [];
        const now = new Date();
        const maxFutureTime = new Date(now.getTime() + 16 * 24 * 60 * 60 * 1000);
    
        for (let i = 0; i < hourly.time.length; i++) {
            const forecastTime = new Date(hourly.time[i]);
    
            if (forecastTime >= now && forecastTime <= maxFutureTime) {
                const timeStr = hourly.time[i].replace('T', ' ').slice(5);
                const windMs = (hourly.windspeed_10m[i] / 3.6).toFixed(1);
    
                forecastList.push({
                    time: timeStr,
                    desc: getWeatherDescription(hourly.weathercode[i]),
                    rainChance: `☔ ${hourly.precipitation_probability[i]}%`,
                    wind: `💨 ${windMs}m/s`,
                    humidity: `💧 ${hourly.relativehumidity_2m[i]}%`,
                    uv: `☀️ UV ${hourly.uv_index[i] !== undefined ? hourly.uv_index[i] : '-'}` ,
                    temp: `${Math.round(hourly.temperature_2m[i])}°C`
                });
            }
        }
    
        return {
            current: {
                temp: Math.round(currentWeather.temperature),
                desc: getWeatherDescription(currentWeather.weathercode),
                detail1: `Wind ${currentWeather.windspeed}m/s`,
                detail2: `Humidity ${currentHumidity}%`
            },
            forecast: forecastList
        };
    }

    async function updateWeather() {
        document.getElementById('weather-desc').innerText = 'Loading...';
        document.getElementById('forecast-list').innerHTML = `<div style="color: #888; text-align: center; margin-top: 20px;">Loading forecast...</div>`;

        const titleEl = document.getElementById('forecast-title');
        if (currentProvider === 'wttr') {
            titleEl.innerText = '3-Day Forecast (Every 3 Hours)';
        } else {
            titleEl.innerText = '16-Day Forecast (Every 1 Hour)';
        }

        try {
            const data = currentProvider === 'wttr' ? await fetchWttr() : await fetchOpenMeteo();

            document.getElementById('city-name').innerText = currentCity;
            document.getElementById('temp').innerText = `${data.current.temp}°C`;
            document.getElementById('weather-desc').innerText = data.current.desc;
            document.getElementById('detail-1').innerText = data.current.detail1;
            document.getElementById('detail-2').innerText = data.current.detail2;

            const forecastContainer = document.getElementById('forecast-list');
            forecastContainer.innerHTML = '';

            data.forecast.forEach(item => {
                const el = document.createElement('div');
                el.className = 'forecast-item';
                el.innerHTML = `
                    <span class="forecast-time">${item.time}</span>
                    <span class="forecast-desc">${item.desc}</span>
                    <span class="forecast-rain">${item.rainChance}</span>
                    <span class="forecast-wind">${item.wind}</span>
                    <span class="forecast-humidity">${item.humidity}</span>
                    <span class="forecast-uv">${item.uv}</span>
                    <span class="forecast-temp">${item.temp}</span>
                `;
                forecastContainer.appendChild(el);
            });

        } catch (error) {
            console.error('Failed to fetch weather data:', error);
            document.getElementById('weather-desc').innerText = 'Data Load Failed';
            document.getElementById('forecast-list').innerHTML = `<div style="color: #ff4d4d; text-align: center; margin-top: 20px;">Failed to load forecast</div>`;
        }
    }

    function searchCity() {
        const input = document.getElementById('city-input').value.trim();
        if (!input) return;

        currentCoords = null;
        currentCity = input;
        updateWeather();
    }

    function switchApi(provider) {
        if (currentProvider === provider) return;
        currentProvider = provider;

        document.getElementById('btn-wttr').classList.toggle('active', provider === 'wttr');
        document.getElementById('btn-meteo').classList.toggle('active', provider === 'meteo');

        updateWeather();
    }

    async function fetchIpLocation() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            if (!response.ok) throw new Error('IP location failed');
            const data = await response.json();
            
            if (data.latitude && data.longitude) {
                currentCoords = {
                    latitude: data.latitude,
                    longitude: data.longitude
                };
                currentCity = data.city || 'Seoul';
                document.getElementById('city-input').value = currentCity;
                updateWeather();
            } else {
                throw new Error('No coordinates in IP data');
            }
        } catch (err) {
            console.error('IP location fallback failed:', err);
            currentCoords = null;
            currentCity = 'Seoul';
            document.getElementById('city-input').value = currentCity;
            updateWeather();
        }
    }

    function initLocation() {
        document.getElementById('city-input').value = '';
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentCoords = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude
                    };
                    updateWeather();
                },
                () => {
                    fetchIpLocation();
                },
                { timeout: 5000 }
            );
        } else {
            fetchIpLocation();
        }
    }

    initLocation();
</script>
