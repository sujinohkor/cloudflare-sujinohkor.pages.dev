<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="Visualizer for neural network, deep learning and machine learning models." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; frame-src 'none'">
    <meta name="version" content="9.2.2">
    <meta name="date" content="2026-08-14 18:02:52">
    <title>Netron - ONNX Reader</title>
    
    <link rel="stylesheet" type="text/css" href="/codes/onnx/grapher.css">
    
    <style>
        html { touch-action: none; overflow: hidden; width: 100%; height: 100%; -ms-text-size-adjust: 100%; -webkit-text-size-adjust: 100%; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; -moz-font-smoothing: antialiased; }
        body { touch-action: none; overflow: hidden; width: 100%; height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", "Ubuntu", "Droid Sans", sans-serif; font-size: 12px; text-rendering: geometricPrecision; }
        button { font-family: inherit; }
        .center { position: absolute; margin: auto; top: 0; right: 0; bottom: 0; left: 0; user-select: none; }
        .select { user-select: text; }
        .target { display: flex; height: 100%; width: 100%; overflow: auto; outline: none; touch-action: pan-x pan-y; }
        .canvas { margin: auto; flex-shrink: 0; text-rendering: geometricPrecision; user-select: none; }
        .open-file-dialog { display: none; }
        .default { background-color: #404040; }
        .default .logo { display: none; }
        .default .target { display: flex; opacity: 1; }
        .default .toolbar { display: flex; }
        .toolbar { display: flex; align-items: center; position: absolute; bottom: 10px; left: 10px; padding: 0; margin: 0; user-select: none; }
        .toolbar button:focus { outline: 0; }
        .toolbar-button { background: None; border-radius: 6px; border: 0; margin: 0 1px 0 0; padding: 0; fill: None; stroke: #777; cursor: pointer; width: 32px; height: 32px; }
        .message { display: none; opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; justify-content: flex-start; }
        .message-text { display: inline; text-align: center; width: 562px; font-size: 13px; line-height: 20px; margin-top: 50vh; padding-top: 56px; padding-bottom: 20px; margin-left: auto; margin-right: auto; user-select: text; }
        .logo-button { font-size: 12px; font-weight: bold; line-height: 1.25; text-align: center; vertical-align: middle; min-width: 5em; height: 2.7em; border-radius: 1.3em; transition: 0.1s; user-select: none; color: #888888; background-color: #1e1e1e; border: 1px solid #888888; cursor: pointer; }
        .logo-button:hover { color: #1e1e1e; background-color: #888888; }
        .logo-button:focus { outline: 0; }
        .open-file-button { top: 170px; left: 0px; width: 10.5em; z-index: 10; }
        .progress { top: 120px; height: 2px; width: 400px; }
        .progress-bar { height: 100%; width: 0%; background-color: #888888; }
        .welcome body, .welcome { background-color: #1e1e1e; color: #888888; }
        .welcome.spinner .logo-spinner { display: block; animation: orbit 0.5s infinite linear; cursor: wait; }
        .sidebar { display: flex; flex-direction: column; font-family: inherit; font-size: 12px; height: 100%; right: -100%; position: fixed; transition: 0.1s; top: 0; background-color: #2d2d2d; color: #dfdfdf; overflow: hidden; border-left: 1px solid transparent; opacity: 0; z-index: 100; }
        .sidebar-title { font-weight: bold; font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; height: 20px; margin: 0; padding: 20px; user-select: none; }
        .sidebar-closebutton { padding: 8px 8px 8px 32px; text-decoration: none; font-size: 25px; color: #777777; display: block; position: absolute; top: 0; right: 15px; }
        .sidebar-closebutton:hover { color: #ffffff; }
        .sidebar-content { display: flex; flex-direction: column; flex-grow: 1; height: 0; }
        @keyframes orbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="welcome">
    <div id="target" class="target" tabindex="0"></div>
    <div id="sidebar" class="sidebar">
        <h1 id="sidebar-title" class="sidebar-title"></h1>
        <a id="sidebar-closebutton" class="sidebar-closebutton" href="javascript:void(0)">&times;</a>
        <div id="sidebar-content" class="sidebar-content"></div>
    </div>
    
    <div id="logo" class="center logo" style="width: 400px; height: 300px; position: absolute;">
        <button id="open-file-button" class="center logo-button open-file-button">Open Model&hellip;</button>
        <div class="center progress">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <!-- 확장자 필터에 .onnx 추가 -->
        <input type="file" id="open-file-dialog" class="open-file-dialog" accept=".onnx,.pb,.tflite,.h5,.mlmodel">
    </div>

    <div id="message" class="message">
        <div id="message-text" class="message-text"></div>
        <button id="message-button" class="logo-button message-button">OK</button>
    </div>

    <!-- 순서대로 스크립트 연결 및 강제 바인딩 처리 -->
    <script type="text/javascript" src="./index.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const openBtn = document.getElementById('open-file-button');
            const fileInput = document.getElementById('open-file-dialog');

            if (openBtn && fileInput) {
                openBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    fileInput.click();
                });
            }
        });
    </script>
</body>
</html>
