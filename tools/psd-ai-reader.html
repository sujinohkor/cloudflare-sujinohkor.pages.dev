<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSD AI Reader</title>
    <!-- Favicon settings -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
        <!-- 1. PSD Parser Library -->
    <script src="https://unpkg.com/psd/dist/psd.min.js"></script>
    <script src="/codes/psd.min.js"></script>
        <!-- 2. AI (PDF Compatible Data) Parser Library (PDF.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }
                        
        .app-container { display: flex; min-height: 100vh; width: 100%; }

        /* Fully transparent floating sidebar (Desktop only) */
        .sidebar { 
            width: 260px; 
            height: calc(100vh - 40px); 
            position: fixed; 
            left: 20px; 
            top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        /* DAY/NIGHT button top placement style */
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* Main content area */
        .main-content { 
            margin-left: 300px; 
            padding: 40px; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            gap: 20px; 
            overflow: hidden; 
            transition: 0.3s; 
            width: calc(100% - 300px);
        }

        /* 3. Components */
        .menu-btn { 
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .bottom-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bottom-btns > .menu-btn {
            margin-bottom: 0;
        }

        .workspace-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 10px;
            min-height: 0;
        }

        #file-name-label {
            color: #ff9e40;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .content-mid { 
            flex: 1; 
            border: 2px solid #ff9e40; 
            border-radius: 16px; 
            display: flex; 
            overflow: auto; 
            padding: 20px; 
            color: #888; 
            font-family: 'Consolas', 'Courier New', 'Monaco', monospace, sans-serif; 
            font-size: 1rem;
            cursor: pointer; 
            transition: all 0.3s ease; 
            user-select: none;
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            text-align: center;
            position: relative;
            background: transparent;
        }
        .content-mid.dragover { background-color: rgba(255, 158, 64, 0.1); border-style: dashed; color: #ff9e40; }
        .content-mid.has-file {
            background-color: rgba(255, 158, 64, 0.05);
            padding: 10px;
        }

        #resultImg, #viewCanvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background-image: linear-gradient(45deg, #ccc 25%, transparent 25%),
                               linear-gradient(-45deg, #ccc 25%, transparent 25%),
                               linear-gradient(45deg, transparent 75%, #ccc 75%),
                               linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            background-color: #fff;
            display: none;
        }

        /* Dark mode card/panel shadow */
        .card, .content-mid {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }
                
        body.light-mode .menu-btn, body.light-mode .theme-btn, body.light-mode .theme-toggle-btn { 
            background: rgba(0, 0, 0, 0.02); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.5); 
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover { 
            background: rgba(243, 128, 32, 0.15); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.4); 
        }
        
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode .content-mid { color: #666; }
        body.light-mode .content-mid.has-file { background-color: rgba(243, 128, 32, 0.05); }
        body.light-mode .content-mid.dragover { background-color: rgba(243, 128, 32, 0.1); border-style: dashed; color: #f38020; }
        body.light-mode .menu-toggle-btn { color: #000000; }
        body.light-mode #file-name-label { color: #F38020; }

        body.light-mode .card, 
        body.light-mode .content-mid {
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15);
        }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { 
            display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; 
            padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; 
            font-weight: bold; cursor: pointer; color: #ffffff; 
        }

        @media (max-width: 900px) { 
            .menu-toggle-btn { display: block; } 
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; 
            } 
            body.light-mode .sidebar { 
                background: #ffffff !important; 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; 
            } 
            .sidebar.active { transform: translateX(0); } 
            .main-content { margin-left: 0; padding: 20px; width: 100vw; max-height: 100svh; height: auto; overflow-y: auto; } 
            .workspace-container { flex-direction: column; flex: none; height: auto; }
            .content-mid { flex: none; min-height: 350px; }
        }
    </style>
</head>
<body>

<button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
<input type="file" id="file-selector" accept=".psd,.ai,image/*" style="display: none;">
<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-title">PSD AI Reader</div>
        <div class="sidebar-top">
            <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
        </div>
        <button class="menu-btn" onclick="location.href='../index'">Home</button>

        <div class="bottom-btns">
            <button class="menu-btn" onclick="uploadFile()">Upload</button>
            <button class="menu-btn" onclick="savePNG()">Save as PNG</button>
            <button class="menu-btn" onclick="resetAll()">Reset</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-section">
            <h1>PSD AI Reader</h1>
            <p id="status-desc">Upload a file below to view content.</p>
        </header>

        <div class="workspace-container">
            <label id="file-name-label">File name will be appeared here.</label>
            <section class="content-mid" id="drop-zone">
                <div id="default-ui">
                    <div style="font-size: 3rem;">🖼️</div>
                    <div>Drag & Drop a PSD, AI, SVG, or image file here or click to upload.</div>
                </div>
                <img id="resultImg" alt="Preview">
                <canvas id="viewCanvas"></canvas>
            </section>
        </div>
    </main>
</div>

<script>
    if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }

    const sidebar = document.getElementById('sidebar');
    const dropZone = document.getElementById('drop-zone');
    const defaultUI = document.getElementById('default-ui');
    const fileSelector = document.getElementById('file-selector');
    const fileNameLabel = document.getElementById('file-name-label');
    const canvas = document.getElementById('viewCanvas');
    const resultImg = document.getElementById('resultImg');
    const ctx = canvas.getContext('2d');

    let loadedFile = null;

    function toggleSidebar() { 
        sidebar.classList.toggle('active'); 
    }

    sidebar.querySelectorAll('button').forEach(element => {
        element.addEventListener('click', () => {
            if (window.innerWidth <= 900) {
                if (element.id === 'file-selector') return;
                sidebar.classList.remove('active');
            }
        });
    });

    document.getElementById('theme-toggle').addEventListener('click', () => { 
        document.body.classList.toggle('light-mode'); 
    });

    document.querySelector('.main-content').addEventListener('click', (e) => { 
        if (sidebar.classList.contains('active') && !e.target.closest('.sidebar') && !e.target.closest('.menu-toggle-btn')) { 
            sidebar.classList.remove('active'); 
        } 
    });

    function setInitialUI() {
        dropZone.classList.remove('has-file');
        defaultUI.style.display = 'block';
        resultImg.style.display = 'none';
        canvas.style.display = 'none';
        resultImg.src = '';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        fileNameLabel.innerText = 'File name will be appeared here.';
    }

    async function handleFile(file) {
        if (!file) return;

        loadedFile = file;
        const fileName = file.name.toLowerCase();

        defaultUI.style.display = 'none';
        resultImg.style.display = 'none';
        canvas.style.display = 'none';
        dropZone.classList.add('has-file');
        fileNameLabel.innerText = `${file.name} (Analyzing...)`;

        try {
            if (fileName.endsWith('.psd')) {
                await renderPSD(file);
            } else if (fileName.endsWith('.ai')) {
                const arrayBuffer = await file.arrayBuffer();
                await renderAI(arrayBuffer, file.name);
            } else if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    resultImg.src = e.target.result;
                    resultImg.style.display = 'inline-block';
                    fileNameLabel.innerText = `${file.name}`;
                };
                reader.readAsDataURL(file);
            } else {
                fileNameLabel.innerText = 'Unsupported file format.';
            }
        } catch (err) {
            console.error('File Parsing Error:', err);
            fileNameLabel.innerText = `Error occurred: ${err.message || 'Unable to read file.'}`;
        }
    }

    function renderPSD(file) {
        return new Promise((resolve, reject) => {
            fileNameLabel.innerText = `${file.name} (Analyzing PSD...)`;

            const PSDParser = window.PSD || (window.require && window.require('psd'));

            if (!PSDParser) {
                reject(new Error('PSD library is not loaded. Please check your internet connection.'));
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const psd = new PSDParser(new Uint8Array(e.target.result));
                    psd.parse();
                    const image = psd.image.toPng();

                    resultImg.src = image.src;
                    resultImg.style.display = 'inline-block';
                    fileNameLabel.innerText = `${file.name} (${psd.header.width} x ${psd.header.height} px)`;
                    resolve();
                } catch (err) {
                    reject(new Error('PSD compatibility error (Only 8-bit RGB PSDs are supported)'));
                }
            };
            reader.onerror = () => reject(new Error('Failed to read file'));
            reader.readAsArrayBuffer(file);
        });
    }

    async function renderAI(buffer, originalFileName) {
        fileNameLabel.innerText = `${originalFileName} (Analyzing AI...)`;

        if (typeof pdfjsLib === 'undefined') {
            throw new Error('PDF.js library is not loaded.');
        }

        const loadingTask = pdfjsLib.getDocument({ data: buffer });
        const pdf = await loadingTask.promise;

        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 1.5 });

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        const renderContext = {
            canvasContext: ctx,
            viewport: viewport
        };

        await page.render(renderContext).promise;
        canvas.style.display = 'inline-block';
        fileNameLabel.innerText = `${originalFileName} (${Math.round(viewport.width)} x ${Math.round(viewport.height)} px)`;
    }

    function savePNG() {
        if (!loadedFile) {
            alert('No file to save.');
            return;
        }

        let downloadUrl = '';

        if (canvas.style.display !== 'none' && canvas.width > 0) {
            downloadUrl = canvas.toDataURL('image/png');
        } else if (resultImg.style.display !== 'none' && resultImg.src) {
            if (resultImg.src.startsWith('data:image/png')) {
                downloadUrl = resultImg.src;
            } else {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = resultImg.naturalWidth || resultImg.width;
                tempCanvas.height = resultImg.naturalHeight || resultImg.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(resultImg, 0, 0);
                downloadUrl = tempCanvas.toDataURL('image/png');
            }
        }

        if (!downloadUrl) {
            alert('Unable to extract image data.');
            return;
        }

        const link = document.createElement('a');
        link.download = 'PsdAiReader.png';
        link.href = downloadUrl;
        link.click();
    }

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', (e) => { 
        e.preventDefault(); 
        dropZone.classList.remove('dragover'); 
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            handleFile(e.dataTransfer.files[0]);
        }
    });
    dropZone.addEventListener('click', () => { fileSelector.click(); });

    function uploadFile() { fileSelector.click(); }

    fileSelector.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            handleFile(e.target.files[0]);
            e.target.value = ''; 
        }
    });

    function resetAll() {
        loadedFile = null;
        setInitialUI();
    }

    setInitialUI();
</script>
</body>
</html>
