<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>유튜브 영상 재생기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #ff0000;
        }

        .input-container {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #1e1e1e;
            color: #ffffff;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #cc0000;
        }

        .player-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>YouTube Player</h1>

    <div class="input-container">
        <input type="text" id="urlInput" value="https://www.youtube.com/watch?v=GotlA1KKWoo" placeholder="유튜브 링크를 입력하세요">
        <button onclick="loadVideo()">재생하기</button>
    </div>

    <div class="player-container">
        <!-- youtube-nocookie 도메인 및 정밀 보안 속성 적용 -->
        <iframe id="ytPlayer" 
                src="https://www.youtube-nocookie.com/embed/GotlA1KKWoo?autoplay=1&enablejsapi=1" 
                referrerpolicy="strict-origin-when-cross-origin"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen></iframe>
    </div>

    <script>
        function extractVideoID(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const videoId = extractVideoID(url);
            const iframe = document.getElementById('ytPlayer');

            if (videoId) {
                iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&enablejsapi=1`;
            } else {
                alert('올바른 유튜브 링크가 아닙니다.');
            }
        }
    </script>

</body>
</html>
