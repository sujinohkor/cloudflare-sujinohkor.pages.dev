<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Schema Builder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; overflow: hidden; }
        .sidebar { width: 350px; background: #181818; border-right: 1px solid rgba(255, 158, 64, 0.3); display: flex; flex-direction: column; padding: 20px; gap: 15px; }
        .sidebar h2 { color: #ff9e40; font-size: 1.1rem; }
        textarea { flex: 1; background: #111; color: #fff; border: 1px solid #444; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.85rem; resize: none; }
        button { background: #ff9e40; color: #101010; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .canvas-area { flex: 1; position: relative; background: radial-gradient(circle, #222 1px, transparent 1px) #101010; background-size: 20px 20px; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Project List Input</h2>
        <textarea id="inputText">Guest Book (guest-book)
- https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js
- https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js
- DB: firebase

Color Picker (color-picker)
- /codes/color-picker/ntcColors.js</textarea>
        <button onclick="generateSchema()">Generate Schema</button>
    </div>
    <div class="canvas-area">
        <canvas id="schemaCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('schemaCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            generateSchema();
        }
        window.addEventListener('resize', resize);

        function parseText(text) {
            const lines = text.split('\n');
            const projects = [];
            let currentProj = null;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (!trimmed.startsWith('-')) {
                    if (currentProj) projects.push(currentProj);
                    currentProj = { name: trimmed, dependencies: [] };
                } else if (currentProj) {
                    currentProj.dependencies.push(trimmed.substring(1).trim());
                }
            });
            if (currentProj) projects.push(currentProj);
            return projects;
        }

        function generateSchema() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const rawText = document.getElementById('inputText').value;
            const projects = parseText(rawText);

            let startX = 60;
            let startY = 60;
            const boxWidth = 260;
            const boxHeight = 110;

            projects.forEach((proj, index) => {
                let x = startX + (index % 3) * 300;
                let y = startY + Math.floor(index / 3) * 140;

                // 상자 배경 및 테두리
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#ff9e40';
                ctx.lineWidth = 2;
                ctx.fillRect(x, y, boxWidth, boxHeight);
                ctx.strokeRect(x, y, boxWidth, boxHeight);

                // 프로젝트 이름
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px Segoe UI';
                ctx.fillText(proj.name, x + 15, y + 25);

                // 구분선
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x + 15, y + 35);
                ctx.lineTo(x + boxWidth - 15, y + 35);
                ctx.stroke();

                // 의존성 목록 출력
                ctx.font = '11px Segoe UI';
                ctx.fillStyle = '#94a3b8';
                proj.dependencies.forEach((dep, dIdx) => {
                    if (dIdx < 3) {
                        let displayDep = dep;
                        if (displayDep.startsWith('https://')) {
                            try {
                                const url = new URL(displayDep);
                                displayDep = url.pathname;
                            } catch (e) {}
                        }
                        if (displayDep.length > 32) {
                            displayDep = displayDep.substring(0, 29) + '...';
                        }
                        ctx.fillText(`• ${displayDep}`, x + 15, y + 55 + (dIdx * 18));
                    }
                });
            });
        }

        window.onload = resize;
    </script>
</body>
</html>
