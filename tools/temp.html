<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 한자 옥편 & 필순 검색기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Hanzi Writer CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 헤더 -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6">
        <h1 class="text-2xl font-bold">📖 웹 한자 옥편 & 필순 검색기</h1>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-12 gap-6">

        <!-- 좌측: 입력 및 필터 영역 (5 컬럼) -->
        <section class="md:col-span-5 flex flex-col gap-6">
            
            <!-- 텍스트 검색 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <label class="block text-sm font-semibold mb-2">한자 / 음·뜻 검색</label>
                <div class="flex gap-2">
                    <input type="text" id="searchInput" placeholder="예: 學 또는 배우다" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="searchHanziText()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-indigo-700 transition">검색</button>
                </div>
            </div>

            <!-- 캔버스 필기 영역 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col items-center">
                <label class="block text-sm font-semibold mb-2 w-full text-left">✍️ 필기 인식 (마우스로 그리세요)</label>
                <div class="border-2 border-dashed border-gray-300 rounded-lg overflow-hidden bg-gray-50 relative cursor-crosshair" style="width: 200px; height: 200px;">
                    <canvas id="drawCanvas" width="200" height="200" class="touch-none"></canvas>
                </div>
                <div class="flex gap-2 mt-3 w-full">
                    <button onclick="clearCanvas()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg font-medium hover:bg-gray-300 transition">지우기</button>
                    <button onclick="recognizeCanvas()" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">인식하기</button>
                </div>
            </div>

            <!-- 부수 및 획수별 빠른 필터 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <label class="block text-sm font-semibold mb-2">🔍 부수 / 획수 필터</label>
                <div class="flex gap-2">
                    <select id="filterBusu" onchange="filterList()" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                        <option value="">전체 부수</option>
                        <option value="一">一 (한 일)</option>
                        <option value="子">子 (아들 자)</option>
                        <option value="月">月 (달 월)</option>
                        <option value="戈">戈 (창 과)</option>
                        <option value="禾">禾 (벼 화)</option>
                    </select>
                    <select id="filterStrokes" onchange="filterList()" class="w-28 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                        <option value="">전체 획수</option>
                        <option value="6">6획</option>
                        <option value="7">7획</option>
                        <option value="16">16획</option>
                    </select>
                </div>
            </div>

        </section>

        <!-- 우측: 결과 목록 및 상세 정보 영역 (7 컬럼) -->
        <section class="md:col-span-7 flex flex-col gap-6">

            <!-- 검색 결과 목록 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-semibold text-gray-600">결과 목록 (클릭하여 상세 보기)</h2>
                    <span id="resultCount" class="text-xs text-indigo-600 font-bold">0개 검색됨</span>
                </div>
                <div id="resultList" class="flex flex-wrap gap-2 max-h-48 overflow-y-auto p-1">
                    <!-- 자바스크립트로 동적 생성 -->
                </div>
            </div>

            <!-- 선택된 한자 상세 정보 & 필순 애니메이션 -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row items-center gap-6">
                <div class="flex flex-col items-center">
                    <div id="characterTarget" class="w-36 h-36 border border-gray-200 rounded-lg bg-gray-50 flex items-center justify-center shadow-inner"></div>
                    <button onclick="animateWriter()" class="mt-3 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-3 py-1.5 rounded-lg transition font-medium">필순 다시보기</button>
                </div>
                <div class="flex-1 space-y-2 text-left w-full">
                    <div class="text-3xl font-bold text-indigo-600" id="detailChar">-</div>
                    <div class="text-gray-700"><strong class="w-24 inline-block text-gray-500">음/뜻:</strong> <span id="detailMeaning">-</span></div>
                    <div class="text-gray-700"><strong class="w-24 inline-block text-gray-500">중국어:</strong> <span id="detailChinese">-</span></div>
                    <div class="text-gray-700"><strong class="w-24 inline-block text-gray-500">부수:</strong> <span id="detailBusu">-</span></div>
                    <div class="text-gray-700"><strong class="w-24 inline-block text-gray-500">총 획수:</strong> <span id="detailStrokes">-</span></div>
                </div>
            </div>

        </section>

    </main>

    <!-- 스크립트 로직 -->
    <script>
        const db = [
            { char: '學', meaning: '배울 학', chinese: '学 (xué)', busu: '子', strokes: 16 },
            { char: '有', meaning: '있을 유', chinese: '有 (yǒu)', busu: '月', strokes: 6 },
            { char: '我', meaning: '나 아', chinese: '我 (wǒ)', busu: '戈', strokes: 7 },
            { char: '秀', meaning: '빼어날 수', chinese: '秀 (xiù)', busu: '禾', strokes: 7 },
        ];

        let writer = null;
        let strokeCount = 0; // 그린 획 수 추적

        window.onload = function() {
            renderList(db);
            if (db.length > 0) selectHanzi(db[0].char);
            initCanvas();
        };

        function renderList(data) {
            const listContainer = document.getElementById('resultList');
            const countLabel = document.getElementById('resultCount');
            listContainer.innerHTML = '';
            countLabel.innerText = `${data.length}개 검색됨`;

            if(data.length === 0) {
                listContainer.innerHTML = '<p class="text-sm text-gray-400 py-2">검색 결과가 없습니다.</p>';
                return;
            }

            data.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'w-12 h-12 text-xl font-bold bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg border border-indigo-100 transition flex items-center justify-center';
                btn.innerText = item.char;
                btn.onclick = () => selectHanzi(item.char);
                listContainer.appendChild(btn);
            });
        }

        function selectHanzi(charStr) {
            const found = db.find(x => x.char === charStr);
            const target = document.getElementById('characterTarget');
            target.innerHTML = '';

            if (!found) {
                document.getElementById('detailChar').innerText = charStr;
                document.getElementById('detailMeaning').innerText = '데이터베이스에 없는 한자입니다.';
                document.getElementById('detailChinese').innerText = '-';
                document.getElementById('detailBusu').innerText = '-';
                document.getElementById('detailStrokes').innerText = '-';
                return;
            }

            document.getElementById('detailChar').innerText = found.char;
            document.getElementById('detailMeaning').innerText = found.meaning;
            document.getElementById('detailChinese').innerText = found.chinese || '-';
            document.getElementById('detailBusu').innerText = found.busu;
            document.getElementById('detailStrokes').innerText = found.strokes + '획';
            
            try {
                writer = HanziWriter.create('characterTarget', found.char, {
                    width: 140,
                    height: 140,
                    padding: 5,
                    showOutline: true,
                    strokeAnimationSpeed: 1,
                    delayBetweenStrokes: 300,
                    strokeColor: '#4f46e5'
                });
                writer.animateCharacter();
            } catch (e) {
                console.error("Hanzi Writer 렌더링 실패:", e);
            }
        }

        function animateWriter() {
            if (writer) {
                writer.animateCharacter();
            }
        }

        function searchHanziText() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) {
                renderList(db);
                return;
            }
            const filtered = db.filter(x => x.char.includes(query) || x.meaning.includes(query) || (x.chinese && x.chinese.includes(query)));
            renderList(filtered);
            if(filtered.length > 0) selectHanzi(filtered[0].char);
        }

        function filterList() {
            const busu = document.getElementById('filterBusu').value;
            const strokes = document.getElementById('filterStrokes').value;

            let filtered = db;
            if(busu) filtered = filtered.filter(x => x.busu === busu);
            if(strokes) filtered = filtered.filter(x => x.strokes == strokes);

            renderList(filtered);
            if(filtered.length > 0) selectHanzi(filtered[0].char);
        }

        // 캔버스 드로잉 및 인식 로직
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function initCanvas() {
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#1f2937';

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseleave', stopDraw);

            canvas.addEventListener('touchstart', (e) => { handleTouch(e, startDraw); });
            canvas.addEventListener('touchmove', (e) => { handleTouch(e, draw); });
            canvas.addEventListener('touchend', stopDraw);
        }

        function handleTouch(e, callback) {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent(e.type === 'touchstart' ? 'mousedown' : 'mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }

        function startDraw(e) {
            isDrawing = true;
            strokeCount++; // 획 추가 카운트
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        }

        function stopDraw() {
            isDrawing = false;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokeCount = 0;
        }

        // 캔버스 필기 인식 기능 구현
        function recognizeCanvas() {
            if (strokeCount === 0) {
                alert("인식할 글자를 캔버스에 그려주세요.");
                return;
            }

            // 캔버스 픽셀 데이터 분석 (그려진 면적 비율 계산)
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let pixelCount = 0;
            for (let i = 3; i < imgData.data.length; i += 4) {
                if (imgData.data[i] > 0) pixelCount++; // 투명하지 않은 픽셀(그려진 부분) 감지
            }

            // 그려진 면적과 획수를 바탕으로 가장 근접한 DB 항목 매칭
            let matched = db[0];
            let minDiff = Infinity;

            db.forEach(item => {
                // 획수 차이와 그려진 픽셀 양의 상관관계를 이용한 간이 매칭 점수 계산
                const score = Math.abs(item.strokes - strokeCount) * 50 + Math.abs(pixelCount - (item.strokes * 150));
                if (score < minDiff) {
                    minDiff = score;
                    matched = item;
                }
            });

            alert(`필기 인식 결과: '${matched.char}' (${matched.meaning})`);
            selectHanzi(matched.char);
        }
    </script>
</body>
</html>
