<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean Typing Practice</title>
    <!-- Favicon settings -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }                                
        .app-container { display: flex; min-height: 100vh; width: 100%; position: relative; }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar {                         
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px;                         
            background: rgba(16, 16, 16, 0.25);                         
            backdrop-filter: blur(16px);                         
            -webkit-backdrop-filter: blur(16px);                        
            padding: 25px 20px; z-index: 1000;                         
            display: flex; flex-direction: column; gap: 12px;                         
            border: 1px solid rgba(255, 158, 64, 0.35);                         
            border-radius: 24px;                        
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);                        
            transition: transform 0.3s ease, opacity 0.3s ease, background 0.3s, border 0.3s;                 
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        /* DAY/NIGHT 버튼 최상단 배치 스타일 (데스크톱용) */
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* 메인 콘텐츠 영역 */
        .main-content {                         
            margin-left: 300px; padding: 40px; flex: 1;                         
            display: flex; flex-direction: column; height: 100vh;                         
            gap: 20px; overflow: hidden; transition: all 0.3s ease;                         
            width: calc(100% - 300px);
        }

        /* 3. Components */
        .menu-btn {                         
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;                        
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35);                         
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;                        
            display: flex; align-items: center; justify-content: center; line-height: 1;        
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }
        .menu-btn.active { background: rgba(255, 158, 64, 0.35); color: #fff; }

        .control-group { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
        .control-label { font-size: 0.8rem; color: #ff9e40; font-weight: bold; padding-left: 5px; }

        .bottom-btns {                        
            display: flex;                        
            flex-direction: column;                        
            gap: 10px;                        
            margin-top: auto;
        }

        .content-card {                         
            border: 2px solid #ff9e40;                         
            border-radius: 16px;                         
            flex: 1;                         
            display: flex;                         
            flex-direction: column;
            overflow: hidden;                         
            background-color: #1a1a1a;
            position: relative;             
            transition: all 0.3s ease;
            padding: 30px;
            justify-content: space-between;
            align-items: center;
        }

        /* Fullscreen button style */
        .fullscreen-btn {                         
            position: absolute;                         
            top: 15px;                         
            right: 15px;                         
            z-index: 2001;                         
            background: #202020;                         
            color: #ff9e40;                         
            border: 1px solid #ff9e40;                         
            padding: 6px 14px;                         
            border-radius: 8px;                         
            cursor: pointer;                         
            font-size: 0.8rem;                         
            font-weight: bold;                         
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);                         
            transition: all 0.3s;                 
        }
        .fullscreen-btn:hover {                         
            background: #ff9e40;                         
            color: #101010;         
        }

        /* 풀스크린 활성화 시 스타일 */
        body.is-fullscreen .sidebar {            
            transform: translateX(-120%);            
            opacity: 0;            
            pointer-events: none;        }
        body.is-fullscreen .main-content {            
            margin-left: 0 !important;            
            width: 100vw !important;            
            padding: 0 !important;            
            height: 100vh !important;        }
        body.is-fullscreen .top-section {            
            display: none !important;        }
        body.is-fullscreen .content-card {            
            position: fixed !important;            
            top: 0 !important;            
            left: 0 !important;            
            right: 0 !important;            
            bottom: 0 !important;            
            width: 100vw !important;            
            height: 100vh !important;            
            z-index: 9999 !important;            
            border-radius: 0 !important;            
            border: none !important;            
            padding: 40px !important;            
            margin: 0 !important;        }

        /* 타자 연습 메인 판넬 디자인 */
        .stats-container {
            display: flex;
            gap: 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 158, 64, 0.35);
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #ff9e40;
        }

        .typing-board {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .target-sentence {
            font-size: 1.8rem;
            line-height: 1.6;
            text-align: center;
            word-break: keep-all;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            color: #e0e0e0;
        }

        /* 타자 글자별 스타일 색상 */
        .char-correct { color: #81c784; }
        .char-incorrect { color: #e57373; text-decoration: underline; background: rgba(229, 115, 115, 0.1); }
        .char-current { border-bottom: 2px solid #ff9e40; color: #ff9e40; }
        .char-default { color: #777; }

        .typing-input {
            width: 100%;
            padding: 16px 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 158, 64, 0.5);
            border-radius: 50px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            text-align: center;
            transition: 0.3s;
        }
        .typing-input:focus {
            border-color: #ff9e40;
            box-shadow: 0 0 15px rgba(255, 158, 64, 0.3);
        }

        .keyboard-guide {
            font-size: 0.85rem;
            color: #888;
        }

        /* 4. Theme (Light Mode) */                
        body.light-mode { background-color: #f5f5f5; color: #202020; }                
        body.light-mode .sidebar {                         
            background: rgba(255, 255, 255, 0.85);                         
            border-color: rgba(243, 128, 32, 0.35);                         
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15);                 
        }                        
        body.light-mode .menu-btn, body.light-mode .theme-toggle-btn {                         
            background: rgba(0, 0, 0, 0.02);                         
            color: #F38020;                         
            border-color: rgba(243, 128, 32, 0.5);         
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover {                         
            background: rgba(243, 128, 32, 0.15);                         
            color: #F38020;                         
            border-color: rgba(243, 128, 32, 0.4);         
        }                        
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode .content-card { background-color: #eaeaea; border-color: #F38020; }
        body.light-mode .fullscreen-btn { background: #FDF5E6; color: #F38020; border-color: #F38020; }
        body.light-mode .fullscreen-btn:hover { background: #F38020; color: #ffffff; }
        body.light-mode .menu-toggle-btn { color: #ffffff; }
        body.light-mode .stats-container { background: rgba(0, 0, 0, 0.03); border-color: rgba(243, 128, 32, 0.4); color: #d06000; }
        body.light-mode .target-sentence { color: #333; }
        body.light-mode .typing-input { background: rgba(0, 0, 0, 0.02); color: #202020; border-color: rgba(243, 128, 32, 0.5); }
        body.light-mode .menu-btn.active { background: #F38020; color: #fff; }

        /* 5. Mobile Responsive */
        .menu-toggle-btn {                         
            display: none; position: fixed; bottom: 20px; left: 20px; z-index: 4000;                         
            padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px;                         
            font-weight: bold; cursor: pointer; color: #ffffff;         
        }                        
        @media (max-width: 900px) {                         
            .menu-toggle-btn { display: block; }                         
            .sidebar {                                 
                transform: translateX(-320px);                                 
                background: #101010 !important;                                 
                backdrop-filter: none !important;                                
                -webkit-backdrop-filter: none !important;                                
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important;                 
                z-index: 3000;            
            }                         
            body.light-mode .sidebar {                                 
                background: #ffffff !important;                                 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important;             
            }
            .sidebar.active { transform: translateX(0); }                         
            .main-content { margin-left: 0; padding: 20px; width: 100vw; height: 100svh; }                         
            .content-card { min-height: 0; height: 100%; padding: 20px; }            
            .target-sentence { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    <div class="app-container">
        <!-- 사이드바 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">Typing Practice</div>
            <div class="sidebar-top">
                <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
            </div>                                                
            <button class="menu-btn" onclick="location.href='../index'">Home</button>
            
            <div class="control-group">
                <span class="control-label">Practice Mode</span>
                <button class="menu-btn active" id="mode-sentence" onclick="setMode('sentence')">Short Sentences</button>
                <button class="menu-btn" id="mode-proverb" onclick="setMode('proverb')">Korean Proverbs</button>
            </div>

            <div class="bottom-btns">
                <button class="menu-btn" onclick="nextSentence()">Next Sentence (Tab)</button>
            </div>
        </aside>

        <!-- 메인 콘텐츠 -->
        <main class="main-content" id="main-content">                        
            <header class="top-section">                                
                <h1>Korean Typing Practice</h1>                                
                <p>Improve your Korean typing speed and accuracy</p>
            </header>                        
            <section class="content-card" id="content-card">                                
                <button class="fullscreen-btn" id="fullscreen-btn" onclick="toggleFullscreen()">Maximize ⛶</button>                                
                
                <!-- 상단 실시간 통계 바 -->
                <div class="stats-container">
                    <div>Speed: <span id="stat-speed">0</span> 타/분</div>
                    <div>Accuracy: <span id="stat-accuracy">100</span>%</div>
                </div>

                <!-- 중앙 타자연습 보드 영역 -->
                <div class="typing-board">
                    <div class="target-sentence" id="target-sentence">연습 문장이 여기에 표시됩니다.</div>
                    <input type="text" id="typing-input" class="typing-input" placeholder="문장을 입력하고 Enter를 누르세요..." autocomplete="off" oninput="handleTyping()" onkeydown="handleKeyDown(event)">
                </div>

                <!-- 하단 가이드 -->
                <div class="keyboard-guide">
                    Tip: Press <b>Enter</b> to submit or <b>Tab</b> to skip to the next sentence.
                </div>
            </section>                
        </main>
    </div>

    <script>                
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        const contentCard = document.getElementById('content-card');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        
        const targetSentenceEl = document.getElementById('target-sentence');
        const typingInputEl = document.getElementById('typing-input');
        const statSpeedEl = document.getElementById('stat-speed');
        const statAccuracyEl = document.getElementById('stat-accuracy');

        // 연습용 문장 데이터 리스트
        const sentences = {
            sentence: [
                "삶이 그대를 속일지라도 슬퍼하거나 노하지 말라.",
                "오늘 할 일을 내일로 미루지 말라.",
                "내일은 내일의 태양이 뜬다.",
                "작은 고추가 더 맵다.",
                "시작이 반이다.",
                "천 리 길도 한 걸음부터.",
                "고생 끝에 낙이 온다.",
                "웃음에는 돈이 들지 않는다.",
                "시간은 금이다."
            ],
            proverb: [
                "개구리 올리작모 시절 모른다.",
                "벼는 익을수록 고개를 숙인다.",
                "소로 잃고 외양간 고친다.",
                "돌다리도 두드려 보고 건너라.",
                "구슬이 서 말이라도 꿰어야 보배.",
                "급할수록 돌아가라.",
                "말 한마디로 천 냥 빚을 갚는다.",
                "원수는 외나무다리에서 만난다."
            ]
        };

        let currentMode = 'sentence';
        let currentIndex = 0;
        let startTime = null;
        let totalTypedChars = 0;
        let correctTypedChars = 0;

        window.onload = function() {                        
            loadSentence();
            checkCloseSidebar();
        };

        window.toggleFullscreen = function() {                        
            contentCard.classList.toggle('fullscreen');
            document.body.classList.toggle('is-fullscreen');
            if (contentCard.classList.contains('fullscreen')) {                                
                fullscreenBtn.textContent = 'Minimize 🗗';                        
            } else {                                
                fullscreenBtn.textContent = 'Maximize ⛶';                        
            }
            setTimeout(() => typingInputEl.focus(), 100);
        };

        function toggleSidebar() {                         
            sidebar.classList.toggle('active');                 
        }

        function closeSidebar() {
            sidebar.classList.remove('active');
        }

        function checkCloseSidebar() {
            if (window.innerWidth <= 900) {
                closeSidebar();
            }
        }

        // 사이드바 내부 버튼 클릭 시 모바일에서 자동 닫힘 처리
        sidebar.querySelectorAll('button').forEach(element => {                        
            element.addEventListener('click', () => {                                
                if (window.innerWidth <= 900) {                                        
                    if (element.id === 'theme-toggle') return;
                    closeSidebar();                                
                }            
            });                
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {                         
            document.body.classList.toggle('light-mode');                 
        });

        mainContent.addEventListener('click', () => {                         
            if (window.innerWidth <= 900 && sidebar.classList.contains('active')) {                                 
                closeSidebar();                         
            }         
        });

        // 모드 전환
        function setMode(mode) {
            currentMode = mode;
            currentIndex = 0;
            document.getElementById('mode-sentence').classList.toggle('active', mode === 'sentence');
            document.getElementById('mode-proverb').classList.toggle('active', mode === 'proverb');
            loadSentence();
            checkCloseSidebar();
        }

        // 문장 불러오기 및 렌더링
        function loadSentence() {
            const list = sentences[currentMode];
            const targetText = list[currentIndex];
            
            // 글자 단위로 분할하여 HTML 코드로 렌더링
            let html = '';
            for (let i = 0; i < targetText.length; i++) {
                html += `<span class="char-default">${targetText[i]}</span>`;
            }
            targetSentenceEl.innerHTML = html;
            typingInputEl.value = '';
            startTime = null;
        }

        // 실시간 타이핑 피드백 및 정확도 체크
        function handleTyping() {
            if (!startTime && typingInputEl.value.length > 0) {
                startTime = new Date();
            }

            const targetText = sentences[currentMode][currentIndex];
            const inputText = typingInputEl.value;
            const charSpans = targetSentenceEl.querySelectorAll('span');

            let correctCount = 0;

            for (let i = 0; i < charSpans.length; i++) {
                if (i < inputText.length) {
                    if (inputText[i] === targetText[i]) {
                        charSpans[i].className = 'char-correct';
                        correctCount++;
                    } else {
                        charSpans[i].className = 'char-incorrect';
                    }
                } else if (i === inputText.length) {
                    charSpans[i].className = 'char-current';
                } else {
                    charSpans[i].className = 'char-default';
                }
            }

            // 실시간 정확도 계산
            if (inputText.length > 0) {
                const accuracy = Math.round((correctCount / inputText.length) * 100);
                statAccuracyEl.textContent = accuracy;
            } else {
                statAccuracyEl.textContent = '100';
            }

            // 실시간 타자 속도(타/분) 계산
            if (startTime && inputText.length > 0) {
                const elapsedTimeMinutes = (new Date() - startTime) / 60000;
                if (elapsedTimeMinutes > 0) {
                    const speed = Math.round(inputText.length / elapsedTimeMinutes);
                    statSpeedEl.textContent = speed;
                }
            }

            // 문장 완성 체크
            if (inputText === targetText) {
                setTimeout(() => {
                    nextSentence();
                }, 200);
            }
        }

        // 키보드 단축키 처리 (Enter: 제출/다음, Tab: 다음 문장 스킵)
        function handleKeyDown(event) {
            if (event.key === 'Tab') {
                event.preventDefault();
                nextSentence();
            }
        }

        // 다음 문장으로 이동
        function nextSentence() {
            const list = sentences[currentMode];
            currentIndex = (currentIndex + 1) % list.length;
            loadSentence();
            typingInputEl.focus();
        }
    </script>
</body>
</html>
