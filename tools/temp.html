<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Architecture Inspector</title>
    <!-- Favicon settings -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; display: block; }
        .app-container { display: flex; min-height: 100vh; width: 100%; position: relative; }
        
        /* 모바일 백드롭 오버레이 */        
        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* 플로팅 사이드바 (기준 소스와 동일한 width: 260px 적용) */
        .sidebar {
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px;
            background: rgba(16, 16, 16, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 1000;
            display: flex; flex-direction: column; gap: 12px;
            border: 1px solid rgba(255, 158, 64, 0.35);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, opacity 0.3s ease, background 0.3s, border 0.3s;
            overflow: hidden;
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; flex-shrink: 0; }
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; flex-shrink: 0; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); border-color: rgba(255, 158, 64, 0.6); }
        
        .menu-section-title { font-size: 0.8rem; color: #ff9e40; font-weight: bold; margin-top: 5px; padding-left: 5px; letter-spacing: 0.5px; flex-shrink: 0; }
        .menu-btn {
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35);
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1; flex-shrink: 0;
        }        
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); border-color: rgba(255, 158, 64, 0.6); }        

        /* 앱 스크롤 리스트 컨테이너 */
        .app-list-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
            margin-top: 5px;
        }
        .app-list-container::-webkit-scrollbar { width: 4px; }
        .app-list-container::-webkit-scrollbar-thumb { background: rgba(255, 158, 64, 0.3); border-radius: 4px; }

        .app-item {
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 158, 64, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .app-item:hover { background: rgba(255, 158, 64, 0.1); border-color: rgba(255, 158, 64, 0.5); }
        .app-item.active { background: rgba(255, 158, 64, 0.3); border-color: #ff9e40; color: #fff; }
        .app-item-title { font-size: 0.85rem; font-weight: bold; color: #ff9e40; }
        .app-item.active .app-item-title { color: #fff; }
        .app-item-sub { font-size: 0.75rem; color: #aaa; margin-top: 2px; }

        /* 메인 콘텐츠 영역 (사이드바 폭에 맞춰 margin-left: 300px, width 수정) */
        .main-content {
            margin-left: 300px; padding: 40px; flex: 1;
            display: flex; flex-direction: column; height: 100vh;
            gap: 20px; overflow: hidden; transition: all 0.3s ease;
            width: calc(100% - 300px);
        }
        
        .top-section h1 { color: #ff9e40; font-size: 1.5rem; margin-bottom: 5px; }
        .top-section p { color: #aaa; font-size: 0.9rem; }

        /* 도트무늬 배경 적용 카드 */
        .content-card {                     
            border: 2px solid #ff9e40;                     
            border-radius: 16px;                     
            flex: 1;                     
            display: flex;                     
            flex-direction: column;
            overflow: hidden;                     
            background: radial-gradient(circle, #222 1px, transparent 1px) #101010;
            background-size: 20px 20px;
            position: relative;             
            transition: all 0.3s ease;
        }

        /* 상세 내용 뷰어 영역 (Grid 구조) */
        .detail-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            height: 100%;
            padding: 30px;
            overflow-y: auto;
            z-index: 15;
        }
        .detail-panel {
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(255, 158, 64, 0.4);
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .detail-panel.full-span {
            grid-column: span 2;
        }
        .detail-panel h3 { color: #ff9e40; font-size: 1.2rem; margin-bottom: 5px; border-bottom: 1px solid rgba(255, 158, 64, 0.2); padding-bottom: 8px; }
        .detail-section { display: flex; flex-direction: column; gap: 6px; }
        .detail-section label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .detail-section p { font-size: 0.9rem; color: #ddd; line-height: 1.5; }
        .detail-section ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .detail-section li { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; font-family: monospace; border-left: 3px solid #ff9e40; color: #fff; }

        /* Light Mode */
        body.light-mode { background-color: #fff; color: #202020; }                
        body.light-mode .sidebar {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(243, 128, 32, 0.35);
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15);
        }                         
        body.light-mode .menu-btn, body.light-mode .theme-toggle-btn {
            background: rgba(0, 0, 0, 0.02);
            color: #F38020;
            border-color: rgba(243, 128, 32, 0.5);
        }        
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover {
            background: rgba(243, 128, 32, 0.15);
            border-color: rgba(243, 128, 32, 0.4);
        }                         
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }        
        body.light-mode .content-card { background: radial-gradient(circle, #ddd 1px, transparent 1px) #fff; background-size: 20px 20px; border-color: #F38020; box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15); }        
        body.light-mode .app-item { background: rgba(0, 0, 0, 0.02); border-color: rgba(243, 128, 32, 0.2); }
        body.light-mode .app-item-title { color: #F38020; }
        body.light-mode .app-item.active { background: #F38020; border-color: #F38020; color: #fff; }
        body.light-mode .app-item.active .app-item-title { color: #fff; }
        body.light-mode .app-item.active .app-item-sub { color: #eee; }
        body.light-mode .detail-panel { background: rgba(255, 255, 255, 0.9); border-color: rgba(243, 128, 32, 0.4); color: #202020; box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15); }
        body.light-mode .detail-panel h3 { color: #F38020; border-bottom-color: rgba(243, 128, 32, 0.2); }
        body.light-mode .detail-section p { color: #444; }
        body.light-mode .detail-section li { background: rgba(0, 0, 0, 0.02); border-color: rgba(0, 0, 0, 0.05); border-left-color: #F38020; color: #202020; }

        .menu-toggle-btn {
            display: none; position: fixed; bottom: 20px; left: 20px; z-index: 4000;
            padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px;
            font-weight: bold; cursor: pointer; color: #ffffff;
        }                 
        @media (max-width: 900px) {                             
            .menu-toggle-btn { display: block; }                             
            .sidebar {
                transform: translateX(-320px);
                background: #101010 !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important;
                z-index: 3000;
            }                             
            body.light-mode .sidebar {
                background: #ffffff !important;
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important;
            }            
            .sidebar.active { transform: translateX(0); }                             
            .sidebar-backdrop.active { display: block; opacity: 1; }            
            .main-content { margin-left: 0; padding: 20px; width: 100vw; height: 100vh; }                             
            .content-card { min-height: 0; height: 100%; }            
        }    </style>
</head>
<body>    
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>
    
    <div class="app-container">
        <!-- 사이드바 (50개 앱 리스트 스크롤 영역) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">Apps Directory</div>
            <div class="sidebar-top">
                <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
            </div>
            <a href="../index" class="menu-btn">Home</a>
            
            <div class="menu-section-title">Applications (50)</div>
            <div class="app-list-container" id="appListContainer">
                <!-- 자바스크립트로 50개 앱 리스트 동적 생성 -->
            </div>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content" id="main-content">                    
            <header class="top-section">                        
                <h1 id="selectedAppTitle">App Architecture Inspector</h1>
                <p id="selectedAppSub">좌측 목록에서 애플리케이션을 선택하여 상세 인프라 구성을 확인하세요.</p>
            </header>                    
            <section class="content-card" id="content-card">                        
                <!-- 상세 정보 뷰어 영역 (Grid 구조) -->        
                <div class="detail-view">
                    <div class="detail-panel full-span">
                        <h3 id="panelAppName">애플리케이션을 선택하세요</h3>
                        <div class="detail-section">
                            <label>Description / Path</label>
                            <p id="panelAppDesc">-</p>
                        </div>
                    </div>
                    <div class="detail-panel">
                        <h3>Libraries & Dependencies</h3>
                        <div class="detail-section">
                            <ul id="panelAppDeps">
                                <li>-</li>
                            </ul>
                        </div>
                    </div>
                    <div class="detail-panel">
                        <h3>Backend Infrastructure</h3>
                        <div class="detail-section">
                            <ul id="panelAppBackend">
                                <li>-</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </section>            
        </main>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        const mainContent = document.getElementById('main-content');

        function toggleSidebar() {                      
            const isActive = sidebar.classList.toggle('active');            
            if (isActive) {                
                backdrop.classList.add('active');            
            } else {                
                backdrop.classList.remove('active');            
            }
        }

        function closeSidebar() {            
            sidebar.classList.remove('active');            
            backdrop.classList.remove('active'); 
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {                      
            document.body.classList.toggle('light-mode');            
            if (window.innerWidth <= 900) closeSidebar();
        });

        mainContent.addEventListener('click', () => {                      
            if (window.innerWidth <= 900 && sidebar.classList.contains('active')) {                                  
                closeSidebar(); 
            }             
        });

        /* --- 50개 앱 데이터 생성 및 연동 로직 --- */
        const appsData = Array.from({ length: 50 }, (_, i) => {
            const id = i + 1;
            const names = [
                "Guest Book", "Color Picker", "Markdown Editor", "JSON Formatter", "Regex Tester",
                "Code Snippet Manager", "Pomodoro Timer", "Unit Converter", "Base64 Encoder", "QR Code Generator"
            ];
            const baseName = names[i % names.length];
            const name = id <= 10 ? baseName : `${baseName} v${Math.floor(id/10)+1}`;
            const slug = `app-module-${id}`;
            
            return {
                id: id,
                name: name,
                slug: slug,
                path: `/codes/${slug}/index.html`,
                desc: `${name} 시스템은 독립적인 클라이언트 모듈로 동작하며, 실시간 데이터 처리와 사용자 인터랙션을 지원합니다.`,
                deps: [
                    i % 3 === 0 ? "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js" : "/assets/lib/core.min.js",
                    i % 2 === 0 ? "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js" : `/codes/${slug}/module.js`,
                    "https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
                ],
                backends: [
                    i % 2 === 0 ? "DB: Firebase Firestore" : "DB: Cloudflare Workers KV",
                    i % 4 === 0 ? "Worker: auth-service.worker.js" : "Worker: api-router.worker.js",
                    i % 5 === 0 ? "Automation: Google Apps Script" : "Static Hosting: Cloudflare Pages"
                ]
            };
        });

        const appListContainer = document.getElementById('appListContainer');
        const selectedAppTitle = document.getElementById('selectedAppTitle');
        const selectedAppSub = document.getElementById('selectedAppSub');
        const panelAppName = document.getElementById('panelAppName');
        const panelAppDesc = document.getElementById('panelAppDesc');
        const panelAppDeps = document.getElementById('panelAppDeps');
        const panelAppBackend = document.getElementById('panelAppBackend');

        function renderAppList() {
            appListContainer.innerHTML = '';
            appsData.forEach((app, index) => {
                const item = document.createElement('div');
                item.className = 'app-item';
                item.innerHTML = `
                    <div class="app-item-title">${index + 1}. ${app.name}</div>
                    <div class="app-item-sub">/${app.slug}</div>
                `;
                item.onclick = () => selectApp(app, item);
                appListContainer.appendChild(item);
            });
        }

        function selectApp(app, element) {
            document.querySelectorAll('.app-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            selectedAppTitle.textContent = app.name;
            selectedAppSub.textContent = `Path: ${app.path}`;
            
            panelAppName.textContent = `${app.name} (${app.slug})`;
            panelAppDesc.textContent = app.desc;

            panelAppDeps.innerHTML = '';
            app.deps.forEach(dep => {
                const li = document.createElement('li');
                li.textContent = dep;
                panelAppDeps.appendChild(li);
            });

            panelAppBackend.innerHTML = '';
            app.backends.forEach(backend => {
                const li = document.createElement('li');
                li.textContent = backend;
                panelAppBackend.appendChild(li);
            });

            if (window.innerWidth <= 900) closeSidebar();
        }

        window.addEventListener('load', () => {
            renderAppList();
            if (appListContainer.firstChild) {
                appListContainer.firstChild.click();
            }
        });
    </script>
</body>
</html>
