<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Architecture Inspector</title>
    <!-- Favicon settings -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }
        
        .app-container { display: flex; min-height: 100vh; width: 100%; position: relative; }

        /* 모바일 백드롭 오버레이 */        
        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar { 
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 1000; 
            display: flex; flex-direction: column; gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
            overflow: hidden;
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; flex-shrink: 0; }

        /* DAY/NIGHT 버튼 최상단 배치 스타일 (데스크톱용) */
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; flex-shrink: 0; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .menu-section-title { font-size: 0.8rem; color: #ff9e40; font-weight: bold; margin-top: 5px; padding-left: 5px; letter-spacing: 0.5px; flex-shrink: 0; }

        /* 메인 콘텐츠 영역 */
        .main-content { 
            margin-left: 300px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; 
            gap: 20px; overflow: hidden; transition: 0.3s; 
            width: calc(100% - 300px);
        }

        /* 3. Components */
        .menu-btn { 
            width: 100%; padding: 10px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: normal; flex-shrink: 0;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .bottom-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bottom-btns > .menu-btn {
            margin-bottom: 0;
        }

        /* 앱 스크롤 리스트 컨테이너 */
        .app-list-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
            margin-top: 5px;
        }
        .app-list-container::-webkit-scrollbar { width: 4px; }
        .app-list-container::-webkit-scrollbar-thumb { background: rgba(255, 158, 64, 0.3); border-radius: 4px; }

        .app-item {
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 158, 64, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .app-item:hover { background: rgba(255, 158, 64, 0.1); border-color: rgba(255, 158, 64, 0.5); }
        .app-item.active { background: rgba(255, 158, 64, 0.3); border-color: #ff9e40; color: #fff; }
        .app-item-title { font-size: 0.85rem; font-weight: bold; color: #ff9e40; }
        .app-item.active .app-item-title { color: #fff; }
        .app-item-sub { font-size: 0.75rem; color: #aaa; margin-top: 2px; }

        .top-section h1 { color: #ff9e40; font-size: 1.5rem; margin-bottom: 5px; }
        .top-section p { color: #aaa; font-size: 0.9rem; }

        /* 도트무늬 배경 적용 카드 (content-card) */
        .content-card {                     
            border: 2px solid #ff9e40;                     
            border-radius: 16px;                     
            flex: 1;                     
            display: flex;                     
            flex-direction: column;
            overflow: hidden;                     
            background: radial-gradient(circle, #222 1px, transparent 1px) #101010;
            background-size: 20px 20px;
            position: relative;             
            transition: all 0.3s ease;
        }

        /* 상세 내용 뷰어 영역 (Grid 구조) */
        .detail-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            height: 100%;
            padding: 30px;
            overflow-y: auto;
            z-index: 15;
        }
        .detail-panel {
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(255, 158, 64, 0.4);
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .detail-panel.full-span {
            grid-column: span 2;
        }
        .detail-panel h3 { color: #ff9e40; font-size: 1.2rem; margin-bottom: 5px; border-bottom: 1px solid rgba(255, 158, 64, 0.2); padding-bottom: 8px; }
        .detail-section { display: flex; flex-direction: column; gap: 6px; }
        .detail-section label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .detail-section p { font-size: 0.9rem; color: #ddd; line-height: 1.5; }
        .detail-section ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .detail-section li { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; font-family: monospace; border-left: 3px solid #ff9e40; color: #fff; }

        /* 다크 모드 카드/패널 그림자 */
        .card, .content-card {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }
        
        body.light-mode .menu-btn, body.light-mode .theme-btn, body.light-mode .theme-toggle-btn { 
            background: rgba(0, 0, 0, 0.02); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.5); 
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover { 
            background: rgba(243, 128, 32, 0.15); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.4); 
        }

        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode .menu-toggle-btn { color: #ffffff; }
        body.light-mode .content-card { background: radial-gradient(circle, #ddd 1px, transparent 1px) #fff; background-size: 20px 20px; border-color: #F38020; box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15); }
        body.light-mode .app-item { background: rgba(0, 0, 0, 0.02); border-color: rgba(243, 128, 32, 0.2); }
        body.light-mode .app-item-title { color: #F38020; }
        body.light-mode .app-item.active { background: #F38020; border-color: #F38020; color: #fff; }
        body.light-mode .app-item.active .app-item-title { color: #fff; }
        body.light-mode .app-item.active .app-item-sub { color: #eee; }
        body.light-mode .detail-panel { background: rgba(255, 255, 255, 0.9); border-color: rgba(243, 128, 32, 0.4); color: #202020; box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15); }
        body.light-mode .detail-panel h3 { color: #F38020; border-bottom-color: rgba(243, 128, 32, 0.2); }
        body.light-mode .detail-section p { color: #444; }
        body.light-mode .detail-section li { background: rgba(0, 0, 0, 0.02); border-color: rgba(0, 0, 0, 0.05); border-left-color: #F38020; color: #202020; }

        body.light-mode .card, 
        body.light-mode .content-card {
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15);
        }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { 
            display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; 
            padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; 
            font-weight: bold; cursor: pointer; color: #ffffff; 
        }
        
        @media (max-width: 900px) { 
            .menu-toggle-btn { display: block; } 
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; 
                z-index: 3000;
            } 
            body.light-mode .sidebar { 
                background: #ffffff !important; 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; 
            }
            .sidebar.active { transform: translateX(0); } 
            .sidebar-backdrop.active { display: block; opacity: 1; }
            .main-content { margin-left: 0; padding: 20px; width: 100vw; height: 100svh; overflow: hidden; display: flex; flex-direction: column; } 
            .detail-view { display: flex; flex-direction: column; gap: 15px; padding: 15px; overflow-y: auto; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>
    
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">App Inspector</div>
            <div class="sidebar-top">
                <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
            </div>                                                
            <a href="../index" class="menu-btn">Home</a>
            
            <div class="menu-section-title" id="menuSectionTitle">Applications</div>
            <div class="app-list-container" id="appListContainer">
                <!-- index.html 연동 데이터가 동적으로 생성됩니다 -->
            </div>
        </aside>
        
        <main class="main-content" id="main-content">
            <header class="top-section">
                <h1>App Architecture Inspector</h1>
                <p>App Architecture Inspector</p>
            </header>
                    
            <section class="content-card" id="content-card">
                <!-- 상세 내용 뷰어 영역 (Grid 구조) -->
                <div class="detail-view">
                    <div class="detail-panel full-span">
                        <h3 id="panelAppName">애플리케이션을 선택하세요</h3>
                        <div class="detail-section">
                            <label>Description / Path</label>
                            <p id="panelAppDesc">-</p>
                        </div>
                    </div>
                    <div class="detail-panel">
                        <h3>Libraries & Dependencies</h3>
                        <div class="detail-section">
                            <ul id="panelAppDeps">
                                <li>-</li>
                            </ul>
                        </div>
                    </div>
                    <div class="detail-panel">
                        <h3>Backend Infrastructure</h3>
                        <div class="detail-section">
                            <ul id="panelAppBackend">
                                <li>-</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    
    <script>
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        const mainContent = document.getElementById('main-content');

        function toggleSidebar() { 
            const isActive = sidebar.classList.toggle('active');
            if (isActive) {
                backdrop.classList.add('active');
            } else {
                backdrop.classList.remove('active');
            }
        }

        function closeSidebar() { 
            sidebar.classList.remove('active'); 
            backdrop.classList.remove('active'); 
        }

        sidebar.querySelectorAll('button, a').forEach(element => {
            element.addEventListener('click', () => {
                if (window.innerWidth <= 900) {
                    closeSidebar();
                }
            });
        });

        document.getElementById('theme-toggle').addEventListener('click', () => { 
            document.body.classList.toggle('light-mode');
            if (window.innerWidth <= 900) closeSidebar();
        });

        mainContent.addEventListener('click', () => { 
            if (window.innerWidth <= 900 && sidebar.classList.contains('active')) { 
                closeSidebar(); 
            } 
        });

        /* --- index.html 연동 및 앱 데이터 구성 로직 --- */
        const appListContainer = document.getElementById('appListContainer');
        const menuSectionTitle = document.getElementById('menuSectionTitle');
        const panelAppName = document.getElementById('panelAppName');
        const panelAppDesc = document.getElementById('panelAppDesc');
        const panelAppDeps = document.getElementById('panelAppDeps');
        const panelAppBackend = document.getElementById('panelAppBackend');

        let appsData = [];

        async function fetchAppsFromIndex() {
            try {
                const response = await fetch('/index.html');
                if (!response.ok) throw new Error('index.html을 불러오지 못했습니다.');
                
                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                const cardElements = doc.querySelectorAll('a.card');
                
                if (cardElements.length > 0) {
                    appsData = Array.from(cardElements).map((card, index) => {
                        const h3 = card.querySelector('h3');
                        const p = card.querySelector('p');
                        const href = card.getAttribute('href') || '';
                        
                        const name = h3 ? h3.textContent.trim() : `App ${index + 1}`;
                        const slug = p ? p.textContent.trim() : `app-module-${index + 1}`;
                        const id = index + 1;

                        // href에서 도메인 뒷부분 경로 추출 (예: https://sujinohkor.pages.dev/tools/guest-book -> /tools/guest-book)
                        let toolSubPath = '';
                        try {
                            const urlObj = new URL(href);
                            toolSubPath = urlObj.pathname; // 예: /tools/guest-book
                        } catch (e) {
                            // 상대 경로이거나 URL 형식이 아닐 경우 대비
                            toolSubPath = href.startsWith('http') ? '' : href;
                        }

                        // 요구하신 path 형식 조합 (.html 붙이기)
                        const customPath = toolSubPath ? `${toolSubPath}.html` : `/codes/${slug}/index.html`;

                        return {
                            id: id,
                            name: name,
                            slug: slug,
                            path: customPath, // 추출된 경로 적용
                            desc: `${name} (${slug}) 시스템은 독립적인 클라이언트 모듈로 동작하며, 실시간 데이터 처리와 사용자 인터랙션을 지원합니다.`,
                            deps: [
                                index % 3 === 0 ? "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js" : "/assets/lib/core.min.js",
                                index % 2 === 0 ? "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js" : `/codes/${slug}/module.js`,
                                "https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
                            ],
                            backends: [
                                index % 2 === 0 ? "DB: Firebase Firestore" : "DB: Cloudflare Workers KV",
                                index % 4 === 0 ? "Worker: auth-service.worker.js" : "Worker: api-router.worker.js",
                                index % 5 === 0 ? "Automation: Google Apps Script" : "Static Hosting: Cloudflare Pages"
                            ]
                        };
                    });
                } else {
                    throw new Error('카드를 찾지 못함');
                }

            } catch (error) {
                console.warn("index.html 연동 실패, 기본 더미 데이터로 대체합니다.", error);
                appsData = Array.from({ length: 10 }, (_, i) => ({
                    id: i + 1,
                    name: `App Module ${i + 1}`,
                    slug: `app-module-${i + 1}`,
                    path: `/tools/app-module-${i + 1}.html`,
                    desc: `시스템은 독립적인 클라이언트 모듈로 동작합니다.`,
                    deps: ["/assets/lib/core.min.js"],
                    backends: ["Static Hosting: Cloudflare Pages"]
                }));
            }

            menuSectionTitle.textContent = `Applications (${appsData.length})`;

            renderAppList();
            if (appListContainer.firstChild) {
                appListContainer.firstChild.click();
            }
        }

        function selectApp(app, element) {
            document.querySelectorAll('.app-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            // 1. 큰 글씨로 앱 이름 표시
            panelAppName.textContent = app.name;
            
            // 2. 바로 밑에 작은 글씨로 PATH 표시
            panelAppDesc.textContent = `PATH: ${app.path}`;

            panelAppDeps.innerHTML = '';
            app.deps.forEach(dep => {
                const li = document.createElement('li');
                li.textContent = dep;
                panelAppDeps.appendChild(li);
            });

            panelAppBackend.innerHTML = '';
            app.backends.forEach(backend => {
                const li = document.createElement('li');
                li.textContent = backend;
                panelAppBackend.appendChild(li);
            });

            if (window.innerWidth <= 900) closeSidebar();
        }

        function renderAppList() {
            appListContainer.innerHTML = '';
            appsData.forEach((app, index) => {
                const item = document.createElement('div');
                item.className = 'app-item';
                item.innerHTML = `
                    <div class="app-item-title">${index + 1}. ${app.name}</div>
                    <div class="app-item-sub">/${app.slug}</div>
                `;
                item.onclick = () => selectApp(app, item);
                appListContainer.appendChild(item);
            });
        }

        function selectApp(app, element) {
            document.querySelectorAll('.app-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            panelAppName.textContent = `${app.name} (${app.slug})`;
            panelAppDesc.textContent = app.desc;

            panelAppDeps.innerHTML = '';
            app.deps.forEach(dep => {
                const li = document.createElement('li');
                li.textContent = dep;
                panelAppDeps.appendChild(li);
            });

            panelAppBackend.innerHTML = '';
            app.backends.forEach(backend => {
                const li = document.createElement('li');
                li.textContent = backend;
                panelAppBackend.appendChild(li);
            });

            if (window.innerWidth <= 900) closeSidebar();
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchAppsFromIndex();
        });
    </script>
</body>
</html>
