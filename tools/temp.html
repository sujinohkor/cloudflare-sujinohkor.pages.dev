<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Game Emulator</title>
    <!-- Favicon settings -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }
        
        .app-container { display: flex; min-height: 100vh; width: 100%; }

        /* Fully transparent floating sidebar (Desktop only) */
        .sidebar { 
            width: 260px; 
            height: calc(100vh - 40px); 
            position: fixed; 
            left: 20px; 
            top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* Main content area */
        .main-content { 
            margin-left: 300px; 
            padding: 40px; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            gap: 20px; 
            overflow: hidden; 
            transition: 0.3s; 
            width: calc(100% - 300px);
        }

        .menu-btn { 
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .bottom-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .workspace-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 10px;
            min-height: 0;
        }

        #file-name-label {
            color: #ff9e40;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .content-mid { 
            flex: 1; 
            border: 2px solid #ff9e40; 
            border-radius: 16px; 
            display: flex; 
            overflow: hidden; 
            padding: 20px; 
            color: #888; 
            font-family: 'Consolas', monospace; 
            font-size: 1rem;
            cursor: pointer; 
            transition: all 0.3s ease; 
            user-select: none;
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            text-align: center;
            position: relative;
            background: transparent;
        }
        .content-mid.dragover { background-color: rgba(255, 158, 64, 0.1); border-style: dashed; color: #ff9e40; }
        .content-mid.has-file {
            background-color: #000;
            padding: 0;
            border-color: #ff9e40;
        }

        /* 에뮬레이터 화면 컨테이너 (레이아웃 충돌 방지) */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
        }

        .card, .content-mid {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }
        body.light-mode .menu-btn, body.light-mode .theme-toggle-btn { 
            background: rgba(0, 0, 0, 0.02); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.5); 
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover { 
            background: rgba(243, 128, 32, 0.15); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.4); 
        }
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode .content-mid { color: #666; }
        body.light-mode .content-mid.dragover { background-color: rgba(243, 128, 32, 0.1); border-style: dashed; color: #f38020; }
        body.light-mode .menu-toggle-btn { color: #000000; }
        body.light-mode #file-name-label { color: #F38020; }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { 
            display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; 
            padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; 
            font-weight: bold; cursor: pointer; color: #ffffff; 
        }

        @media (max-width: 900px) { 
            .menu-toggle-btn { display: block; } 
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            } 
            body.light-mode .sidebar { background: #ffffff !important; }
            .sidebar.active { transform: translateX(0); } 
            .main-content { margin-left: 0; padding: 20px; width: 100vw; max-height: 100svh; } 
        }
    </style>
</head>
<body>

<button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
<input type="file" id="file-selector" accept=".gba,.gb,.gbc,.nes,.snes" style="display: none;">

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-title">GBA Emulator</div>
        <div class="sidebar-top">
            <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
        </div>
        <button class="menu-btn" onclick="location.href='../index'">Home</button>

        <div class="bottom-btns">
            <button class="menu-btn" onclick="uploadFile()">Upload ROM</button>
            <button class="menu-btn" onclick="resetAll()">Reset / Change Game</button>
        </div>
    </aside>

    <main class="main-content" id="main-content">
        <header class="top-section">
            <h1>GBA & Retro Emulator</h1>
            <p id="status-desc">Upload or drag a ROM file (.gba, .gb, .gbc, .nes, .snes) to play.</p>
        </header>

        <div class="workspace-container">
            <label id="file-name-label">No game loaded.</label>
            <section class="content-mid" id="drop-zone">
                <div id="default-ui">
                    <div style="font-size: 3rem;">🎮</div>
                    <div>Drag & Drop a ROM file (.gba, .gb, .gbc, .nes, .snes) here or click to upload.</div>
                </div>
                <!-- 에뮬레이터가 정상 구동되도록 독립된 컨테이너 구조 적용 -->
                <div id="game-container">
                    <div id="game"></div>
                </div>
            </section>
        </div>
    </main>
</div>

<script>
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('main-content');
    const dropZone = document.getElementById('drop-zone');
    const defaultUI = document.getElementById('default-ui');
    const fileSelector = document.getElementById('file-selector');
    const fileNameLabel = document.getElementById('file-name-label');
    const gameContainer = document.getElementById('game-container');

    let loadedFile = null;

    function toggleSidebar() { 
        sidebar.classList.toggle('active'); 
    }

    document.getElementById('theme-toggle').addEventListener('click', () => { 
        document.body.classList.toggle('light-mode'); 
    });

    mainContent.addEventListener('click', (e) => { 
        if (sidebar.classList.contains('active')) { 
            sidebar.classList.remove('active'); 
        }
    });

    function setInitialUI() {
        dropZone.classList.remove('has-file');
        defaultUI.style.display = 'block';
        gameContainer.style.display = 'none';
        fileNameLabel.innerText = 'No game loaded.';
    }

    function handleFile(file) {
        if (!file) return;

        loadedFile = file;
        const fileName = file.name.toLowerCase();
        let core = 'gba';

        if (fileName.endsWith('.nes')) {
            core = 'nes';
        } else if (fileName.endsWith('.snes') || fileName.endsWith('.smc')) {
            core = 'snes';
        } else if (fileName.endsWith('.gb') || fileName.endsWith('.gbc')) {
            core = 'gb';
        } else if (!fileName.endsWith('.gba')) {
            alert('지원하지 않는 파일 형식입니다. (.gba, .gb, .gbc, .nes, .snes 파일만 가능합니다)');
            return;
        }

        defaultUI.style.display = 'none';
        dropZone.classList.add('has-file');
        gameContainer.style.display = 'block';
        fileNameLabel.innerText = `Running: ${file.name}`;

        const fileUrl = URL.createObjectURL(file);

        window.EJS_player = '#game';
        window.EJS_core = core;
        window.EJS_startOnLoaded = true;
        window.EJS_biosUrl = '';
        window.EJS_gameUrl = fileUrl;
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';

        const script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/latest/data/loader.js';
        document.body.appendChild(script);
    }

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', (e) => { 
        e.preventDefault(); 
        dropZone.classList.remove('dragover'); 
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    dropZone.addEventListener('click', () => { 
        if (!loadedFile) {
            fileSelector.click(); 
        }
    });

    function uploadFile() { fileSelector.click(); }

    fileSelector.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            handleFile(e.target.files[0]);
            e.target.value = ''; 
        }
    });

    function resetAll() {
        window.location.reload();
    }

    setInitialUI();
</script>
</body>
</html>
