<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CloudDesk OS</title>
<style>
  :root {
    --bg: #eaf1ff;
    --panel: rgba(255,255,255,.72);
    --panel-strong: rgba(255,255,255,.9);
    --text: #142033;
    --muted: #6d7a90;
    --line: rgba(30,60,110,.12);
    --accent: #4e7cff;
    --shadow: 0 20px 60px rgba(34,55,95,.18);
    --taskbar-h: 58px;
  }
  [data-theme="dark"] {
    --bg:#101726;
    --panel:rgba(18,27,45,.76);
    --panel-strong:rgba(21,31,50,.96);
    --text:#eef4ff;
    --muted:#9aa9c2;
    --line:rgba(255,255,255,.08);
    --accent:#7c9cff;
    --shadow:0 20px 60px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
  body{
    background:
      radial-gradient(circle at 20% 20%, rgba(112,154,255,.35), transparent 28%),
      radial-gradient(circle at 80% 10%, rgba(127,223,255,.28), transparent 24%),
      linear-gradient(135deg, var(--bg), color-mix(in srgb, var(--bg) 80%, #7ea2ff 20%));
  }
  button,input,textarea{font:inherit}
  button{color:inherit}
  .desktop{position:relative;width:100%;height:100%;padding:18px 18px calc(var(--taskbar-h) + 24px)}
  .desktop-icons{display:grid;grid-template-columns:repeat(auto-fill,84px);grid-auto-rows:92px;gap:8px;width:max-content}
  .icon{
    width:84px;height:88px;border:0;background:transparent;border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    cursor:default;user-select:none;
  }
  .icon:hover{background:rgba(255,255,255,.18)}
  .icon .glyph{
    width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
    background:var(--panel-strong);box-shadow:0 10px 26px rgba(45,74,124,.15);
    font-size:24px;border:1px solid var(--line)
  }
  .icon span{font-size:12px;text-shadow:0 1px 8px rgba(255,255,255,.8)}
  [data-theme="dark"] .icon span{text-shadow:0 1px 8px rgba(0,0,0,.65)}
  .taskbar{
    position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
    height:var(--taskbar-h);min-width:420px;max-width:calc(100vw - 20px);
    background:var(--panel);backdrop-filter:blur(26px) saturate(1.35);
    border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:8px;padding:8px 10px;z-index:9999
  }
  .taskbar button{
    border:0;background:transparent;width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:18px
  }
  .taskbar button:hover{background:rgba(255,255,255,.2)}
  .taskbar .running{display:flex;gap:6px;min-width:0;flex:1}
  .taskbar .running button{position:relative}
  .taskbar .running button::after{
    content:"";position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
    width:14px;height:3px;border-radius:3px;background:var(--accent)
  }
  .tray{display:flex;align-items:center;gap:10px;padding-left:8px;border-left:1px solid var(--line);font-size:12px;color:var(--muted)}
  .start-menu{
    position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(10px);
    width:min(560px,calc(100vw - 24px));background:var(--panel-strong);
    backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:24px;
    box-shadow:var(--shadow);padding:18px;z-index:9998;opacity:0;pointer-events:none;transition:.18s ease
  }
  .start-menu.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .search{
    width:100%;border:1px solid var(--line);background:rgba(255,255,255,.3);color:var(--text);
    border-radius:14px;padding:12px 14px;outline:none
  }
  [data-theme="dark"] .search{background:rgba(255,255,255,.04)}
  .apps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
  .app-tile{
    border:0;background:transparent;border-radius:16px;padding:14px 8px;cursor:pointer;display:flex;
    flex-direction:column;align-items:center;gap:8px
  }
  .app-tile:hover{background:rgba(100,130,190,.1)}
  .app-tile b{font-size:13px}
  .app-tile .glyph{font-size:26px}
  .window{
    position:absolute;width:720px;height:470px;min-width:320px;min-height:220px;
    background:var(--panel-strong);backdrop-filter:blur(30px);border:1px solid var(--line);
    border-radius:18px;box-shadow:var(--shadow);overflow:hidden;resize:both
  }
  .window.maximized{
    left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;
    height:calc(100vh - var(--taskbar-h) - 28px)!important;border-radius:16px;resize:none
  }
  .titlebar{
    height:44px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;
    border-bottom:1px solid var(--line);cursor:move;user-select:none
  }
  .titlebar .title{font-weight:650;font-size:13px;flex:1}
  .controls{display:flex;gap:4px}
  .controls button{
    width:34px;height:28px;border:0;border-radius:9px;background:transparent;cursor:pointer
  }
  .controls button:hover{background:rgba(100,130,190,.12)}
  .controls .close:hover{background:#ff5d68;color:#fff}
  .window-body{height:calc(100% - 44px);overflow:auto;background:color-mix(in srgb,var(--panel-strong) 96%, transparent)}
  .split{height:100%;display:grid;grid-template-columns:180px 1fr}
  .sidebar{border-right:1px solid var(--line);padding:12px}
  .sidebar button{
    width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer
  }
  .sidebar button:hover{background:rgba(100,130,190,.1)}
  .content{padding:18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .card{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.16)}
  .card .big{font-size:28px}
  .card small{color:var(--muted)}
  .notes{width:100%;height:100%;border:0;outline:none;resize:none;padding:18px;background:transparent;color:var(--text);line-height:1.6}
  .settings{padding:20px}
  .setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
  .pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 12px;cursor:pointer}
  .terminal{height:100%;background:#0b1020;color:#d9e4ff;padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;overflow:auto}
  .terminal-line{white-space:pre-wrap}
  .terminal-input-row{display:flex;gap:8px}
  .terminal-input{flex:1;background:transparent;color:#fff;border:0;outline:none;font-family:inherit}
  .browser{height:100%;display:grid;grid-template-rows:50px 1fr}
  .browser-bar{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
  .browser-bar input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:transparent;color:var(--text)}
  .browser-page{display:grid;place-items:center;text-align:center;padding:30px}
  .clock-big{font-size:72px;font-weight:700;letter-spacing:-4px}
  .muted{color:var(--muted)}
  @media (max-width:680px){
    .taskbar{min-width:0;width:calc(100vw - 16px)}
    .apps-grid{grid-template-columns:repeat(3,1fr)}
    .window{width:calc(100vw - 20px)!important;left:10px!important}
    .split{grid-template-columns:120px 1fr}
  }
</style>
</head>
<body>
<div class="desktop" id="desktop">
  <div class="desktop-icons" id="desktopIcons"></div>
</div>

<div class="start-menu" id="startMenu">
  <input class="search" id="search" placeholder="앱 검색..." />
  <div class="apps-grid" id="appsGrid"></div>
</div>

<div class="taskbar">
  <button id="startBtn" title="시작">◈</button>
  <div class="running" id="runningApps"></div>
  <div class="tray">
    <span>☁</span>
    <span id="clock"></span>
  </div>
</div>

<script>
const apps = {
  files: { name:"Files", icon:"📁", desktop:true, render: renderFiles },
  notes: { name:"Notes", icon:"📝", desktop:true, render: renderNotes },
  terminal: { name:"Terminal", icon:"⌨️", desktop:true, render: renderTerminal },
  browser: { name:"Cloud", icon:"🌐", desktop:false, render: renderBrowser },
  settings: { name:"Settings", icon:"⚙️", desktop:true, render: renderSettings },
  clock: { name:"Clock", icon:"🕒", desktop:false, render: renderClock }
};

const state = {
  windows: [],
  z: 20,
  theme: localStorage.getItem("clouddesk-theme") || "light"
};
document.documentElement.dataset.theme = state.theme;

const desktop = document.getElementById("desktop");
const startMenu = document.getElementById("startMenu");
const appsGrid = document.getElementById("appsGrid");
const desktopIcons = document.getElementById("desktopIcons");
const runningApps = document.getElementById("runningApps");
const search = document.getElementById("search");

function createLauncher(appId, desktopMode=false){
  const app = apps[appId];
  const el = document.createElement("button");
  el.className = desktopMode ? "icon" : "app-tile";
  el.dataset.appId = appId;
  el.innerHTML = desktopMode
    ? `<div class="glyph">${app.icon}</div><span>${app.name}</span>`
    : `<div class="glyph">${app.icon}</div><b>${app.name}</b>`;
  el.ondblclick = desktopMode ? () => openApp(appId) : null;
  el.onclick = desktopMode ? null : () => { openApp(appId); toggleStart(false); };
  return el;
}

Object.keys(apps).forEach(id => {
  appsGrid.appendChild(createLauncher(id));
  if(apps[id].desktop) desktopIcons.appendChild(createLauncher(id, true));
});

document.getElementById("startBtn").onclick = () => toggleStart();
desktop.addEventListener("click", e => {
  if(!startMenu.contains(e.target) && e.target.id !== "startBtn") toggleStart(false);
});
search.addEventListener("input", () => {
  const q = search.value.toLowerCase();
  [...appsGrid.children].forEach(el => {
    const app = apps[el.dataset.appId];
    el.style.display = app.name.toLowerCase().includes(q) ? "" : "none";
  });
});
function toggleStart(force){
  const open = typeof force === "boolean" ? force : !startMenu.classList.contains("open");
  startMenu.classList.toggle("open", open);
  if(open) setTimeout(() => search.focus(), 50);
}

function openApp(appId){
  const app = apps[appId];
  const existing = state.windows.find(w => w.appId === appId && !w.closed);
  if(existing){
    existing.el.style.display = "";
    focusWindow(existing);
    return;
  }
  const idx = state.windows.length;
  const win = document.createElement("div");
  win.className = "window";
  win.style.left = `${120 + (idx*26)%260}px`;
  win.style.top = `${70 + (idx*22)%180}px`;
  win.style.zIndex = ++state.z;
  win.innerHTML = `
    <div class="titlebar">
      <span>${app.icon}</span>
      <div class="title">${app.name}</div>
      <div class="controls">
        <button class="min" title="최소화">—</button>
        <button class="max" title="최대화">□</button>
        <button class="close" title="닫기">×</button>
      </div>
    </div>
    <div class="window-body"></div>`;
  desktop.appendChild(win);
  const obj = { appId, el:win, closed:false };
  state.windows.push(obj);

  const body = win.querySelector(".window-body");
  app.render(body);

  win.addEventListener("mousedown", () => focusWindow(obj));
  win.querySelector(".min").onclick = e => { e.stopPropagation(); win.style.display="none"; };
  win.querySelector(".close").onclick = e => {
    e.stopPropagation(); obj.closed = true; win.remove(); renderTaskbar();
  };
  win.querySelector(".max").onclick = e => {
    e.stopPropagation(); win.classList.toggle("maximized"); focusWindow(obj);
  };

  enableDrag(win, win.querySelector(".titlebar"));
  renderTaskbar();
}

function focusWindow(obj){
  obj.el.style.zIndex = ++state.z;
  obj.el.style.display = "";
  renderTaskbar();
}

function renderTaskbar(){
  runningApps.innerHTML = "";
  state.windows.filter(w => !w.closed).forEach(w => {
    const app = apps[w.appId];
    const b = document.createElement("button");
    b.title = app.name;
    b.textContent = app.icon;
    b.onclick = () => {
      if(w.el.style.display === "none") focusWindow(w);
      else if(Number(w.el.style.zIndex) === state.z) w.el.style.display = "none";
      else focusWindow(w);
    };
    runningApps.appendChild(b);
  });
}

function enableDrag(win, handle){
  let dragging=false, ox=0, oy=0;
  handle.addEventListener("mousedown", e => {
    if(e.target.closest(".controls") || win.classList.contains("maximized")) return;
    dragging=true; ox=e.clientX-win.offsetLeft; oy=e.clientY-win.offsetTop;
  });
  window.addEventListener("mousemove", e => {
    if(!dragging) return;
    const maxX = window.innerWidth - 120;
    const maxY = window.innerHeight - 100;
    win.style.left = Math.max(-win.offsetWidth+120, Math.min(maxX, e.clientX-ox)) + "px";
    win.style.top = Math.max(0, Math.min(maxY, e.clientY-oy)) + "px";
  });
  window.addEventListener("mouseup", () => dragging=false);
}

function renderFiles(root){
  root.innerHTML = `
    <div class="split">
      <div class="sidebar">
        <button>🏠 Home</button>
        <button>🖥 Desktop</button>
        <button>📄 Documents</button>
        <button>🖼 Pictures</button>
        <button>🗑 Trash</button>
      </div>
      <div class="content">
        <h2 style="margin-top:0">Home</h2>
        <div class="cards">
          <div class="card"><div class="big">📁</div><b>Documents</b><br><small>3 items</small></div>
          <div class="card"><div class="big">🖼</div><b>Pictures</b><br><small>8 items</small></div>
          <div class="card"><div class="big">📦</div><b>Projects</b><br><small>2 items</small></div>
          <div class="card"><div class="big">☁️</div><b>Cloud</b><br><small>Ready for R2</small></div>
        </div>
      </div>
    </div>`;
}

function renderNotes(root){
  const ta = document.createElement("textarea");
  ta.className = "notes";
  ta.placeholder = "여기에 메모하세요. 자동 저장됩니다.";
  ta.value = localStorage.getItem("clouddesk-notes") || "";
  ta.addEventListener("input", () => localStorage.setItem("clouddesk-notes", ta.value));
  root.appendChild(ta);
}

function renderSettings(root){
  root.innerHTML = `
    <div class="settings">
      <h2 style="margin-top:0">Settings</h2>
      <div class="setting-row">
        <div><b>Appearance</b><div class="muted">Light / Dark</div></div>
        <button class="pill" id="themeBtn"></button>
      </div>
      <div class="setting-row">
        <div><b>Cloudflare</b><div class="muted">Pages / Workers ready</div></div>
        <span>☁️</span>
      </div>
      <div class="setting-row">
        <div><b>Storage</b><div class="muted">현재는 localStorage 사용</div></div>
        <span class="muted">Local</span>
      </div>
    </div>`;
  const btn = root.querySelector("#themeBtn");
  const update = () => btn.textContent = document.documentElement.dataset.theme === "dark" ? "Dark" : "Light";
  update();
  btn.onclick = () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("clouddesk-theme", next);
    update();
  };
}

function renderTerminal(root){
  const term = document.createElement("div");
  term.className = "terminal";
  term.innerHTML = `<div class="terminal-line">CloudDesk Shell v0.1</div>
  <div class="terminal-line muted">Type "help" for commands.</div><br>`;
  const row = document.createElement("div");
  row.className = "terminal-input-row";
  row.innerHTML = `<span>guest@cloud:~$</span><input class="terminal-input" autocomplete="off" />`;
  term.appendChild(row);
  root.appendChild(term);
  const input = row.querySelector("input");
  input.focus();
  input.addEventListener("keydown", e => {
    if(e.key !== "Enter") return;
    const cmd = input.value.trim();
    const out = document.createElement("div");
    out.className = "terminal-line";
    out.textContent = `guest@cloud:~$ ${cmd}`;
    term.insertBefore(out, row);
    const res = document.createElement("div");
    res.className = "terminal-line";
    res.textContent = runCommand(cmd);
    term.insertBefore(res, row);
    input.value="";
    term.scrollTop = term.scrollHeight;
  });
}
function runCommand(cmd){
  if(cmd === "help") return "help, date, clear, ls, whoami, echo <text>";
  if(cmd === "date") return new Date().toString();
  if(cmd === "ls") return "Documents  Pictures  Projects  Notes.txt";
  if(cmd === "whoami") return "guest";
  if(cmd.startsWith("echo ")) return cmd.slice(5);
  if(cmd === "clear"){
    setTimeout(() => {
      document.querySelectorAll(".terminal").forEach(t => {
        [...t.children].filter(c => !c.classList.contains("terminal-input-row")).forEach(c => c.remove());
      });
    },0);
    return "";
  }
  return cmd ? `command not found: ${cmd}` : "";
}

function renderBrowser(root){
  root.innerHTML = `
    <div class="browser">
      <div class="browser-bar">
        <button class="pill">←</button>
        <button class="pill">→</button>
        <input value="cloud://home" />
      </div>
      <div class="browser-page">
        <div>
          <div style="font-size:58px">☁️</div>
          <h1>CloudDesk</h1>
          <p class="muted">Cloudflare Pages + Workers용 Web OS 시작 화면입니다.</p>
        </div>
      </div>
    </div>`;
}

function renderClock(root){
  root.innerHTML = `<div class="browser-page" style="height:100%"><div><div class="clock-big" id="bigClock"></div><div class="muted" id="bigDate"></div></div></div>`;
  const tick = () => {
    const d = new Date();
    const c = root.querySelector("#bigClock");
    const dt = root.querySelector("#bigDate");
    if(!c || !dt) return;
    c.textContent = d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
    dt.textContent = d.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
  };
  tick(); setInterval(tick, 1000);
}

function updateClock(){
  const d = new Date();
  document.getElementById("clock").innerHTML =
    `${d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}<br>${d.toLocaleDateString("ko-KR",{month:"2-digit",day:"2-digit"})}`;
}
updateClock(); setInterval(updateClock, 1000);

// Welcome
setTimeout(()=>openApp("files"), 250);
</script>
</body>
</html>
