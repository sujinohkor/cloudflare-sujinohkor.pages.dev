<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅 애니메이션 생성기</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #242424;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        .input-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            margin-top: 10px;
            background-color: #0079ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005bb5;
        }

        .preview-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        svg {
            width: 100%;
            max-width: 550px;
            height: auto;
        }

        .bubble {
            fill: #e9e9eb;
        }

        text {
            fill: #242424;
            font-size: 18px;
            letter-spacing: -0.02em;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #dcdcdc;
            }
            .input-box, .preview-container {
                background: #1e1e1e;
            }
            .bubble {
                fill: #3b3b3d;
            }
            text {
                fill: #dcdcdc;
            }
            textarea {
                background: #2a2a2a;
                color: #dcdcdc;
                border-color: #444;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="input-box">
            <h3>채팅 문구 입력 (줄바꿈으로 구분)</h3>
            <textarea id="messageInput" placeholder="출력할 문장을 한 줄씩 입력하세요."></textarea>
            <br>
            <button onclick="generateAnimation()">애니메이션 적용</button>
        </div>

        <div class="preview-container">
            <svg id="chatSvg" viewBox="0 0 550 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="svgContent"></g>
            </svg>
        </div>
    </div>

    <script>
        function generateAnimation() {
            const rawText = document.getElementById('messageInput').value;
            const lines = rawText.split('\n').filter(line => line.trim() !== '');
            const svgContent = document.getElementById('svgContent');
            const svgElement = document.getElementById('chatSvg');

            svgContent.innerHTML = '';

            if (lines.length === 0) {
                svgElement.setAttribute('height', 100);
                return;
            }

            let currentTime = 0;
            let totalHeight = 20;

            lines.forEach((text, index) => {
                const yOffset = totalHeight;
                const bubbleHeight = 42;
                const typingDuration = 1.2;
                const waitTime = currentTime;

                // 타이핑 애니메이션 추가
                const typingGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
                typingGroup.setAttribute("transform", `translate(10, ${yOffset})`);
                typingGroup.style.opacity = "0";
                typingGroup.style.animation = `fade-in-out ${typingDuration}s ${waitTime}s forwards`;
                
                typingGroup.innerHTML = `
                    <rect x="8.27246" width="69.7276" height="42" rx="20.9774" class="bubble" />
                    <circle cx="13.591" cy="33.091" r="7.68185" class="bubble" />
                    <circle cx="3.54547" cy="41.9547" r="3.54547" class="bubble" />
                    <circle cx="27.4778" cy="20.9773" r="5.02275" fill="#999999">
                        <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="42.8411" cy="20.9773" r="5.02275" fill="#999999">
                        <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.2s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="58.2054" cy="20.9773" r="5.02275" fill="#999999">
                        <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="0.4s" repeatCount="indefinite" />
                    </circle>
                `;
                svgContent.appendChild(typingGroup);

                const msgTime = waitTime + typingDuration;
                
                // 실제 메시지 그룹 추가
                const msgGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
                msgGroup.setAttribute("transform", `translate(10, ${yOffset})`);
                msgGroup.style.opacity = "0";
                
                // 대략적인 텍스트 너비 계산 (폰트 크기 고려)
                const estimatedWidth = Math.max(120, text.length * 11 + 30);

                msgGroup.style.animation = `msg-appear 0.2s ${msgTime}s forwards`;

                msgGroup.innerHTML = `
                    <rect width="${estimatedWidth}" height="${bubbleHeight}" rx="18.0355" class="bubble" />
                    <text x="15" y="27">${text}</text>
                `;
                svgContent.appendChild(msgGroup);

                currentTime = msgTime + 0.5;
                totalHeight += 50;
            });

            svgElement.setAttribute('height', totalHeight + 10);
        }

        // 동적 애니메이션 키프레임 주입
        const styleSheet = document.createElement("style");
        styleSheet.type = "text/css";
        styleSheet.styleSheet ? styleSheet.styleSheet.cssText = getKeys() : styleSheet.appendChild(document.createTextNode(getKeys()));
        document.head.appendChild(styleSheet);

        function getKeys() {
            return `
                @keyframes fade-in-out {
                    0%, 100% { opacity: 0; }
                    25%, 90% { opacity: 1; }
                }
                @keyframes msg-appear {
                    0% { opacity: 0; transform: translate(10px, 5px); }
                    100% { opacity: 1; transform: translate(10px, 0); }
                }
            `;
        }

        // 초기 실행
        window.onload = () => {
            document.getElementById('messageInput').value = "Hi, I'm Chansung\nSoftware Engineer and Researcher\nBuilding SDN for Optical Access Network\nHave a great day!";
            generateAnimation();
        };
    </script>
</body>
</html>
