<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanzi Dictionary</title>
    <!-- Favicon settings -->
    <link rel="icon" type="image/png" href="https://sujinohkor.pages.dev/assets/LOGO-orange.png">
    <!-- Hanzi Writer CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <!-- ONNX Runtime Web 엔진 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <!-- 외부 한자 데이터베이스 로드 -->
    <script src="/codes/trad_with_simp.js"></script>
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }
                
        .app-container { display: flex; min-height: 100vh; width: 100%; }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar { 
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 1000; 
            display: flex; flex-direction: column; gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
            overflow-y: auto;
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .search-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 5px;
        }
        .search-input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            border: 1px solid rgba(255, 158, 64, 0.35);
            border-radius: 50px;
            outline: none;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .search-input::placeholder { color: #888; }

        .control-group { display: flex; flex-direction: column; gap: 3px; margin-top: 5px; }
        .control-label { font-size: 0.8rem; color: #ff9e40; font-weight: bold; padding-left: 5px; }

        select.search-input {
            cursor: pointer;
        }
        select.search-input option { background: #101010; color: #fff; }

        /* 메인 콘텐츠 영역 */
        .main-content { 
            margin-left: 300px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; 
            gap: 20px; overflow: hidden; transition: 0.3s; 
            width: calc(100% - 300px);
        }

        /* 3. Components */
        .menu-btn { 
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .top-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .top-btns > .menu-btn {
            margin-bottom: 0;
        }

        .bottom-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bottom-btns > .menu-btn {
            margin-bottom: 0;
        }

        .workspace-container {
            display: flex;
            flex-direction: row;
            flex: 1;
            gap: 20px;
            min-height: 0;
            position: relative;
        }

        /* 왼쪽 박스: 필기 인식 영역 */
        .content-mid { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; display: flex; 
            padding: 25px; background: transparent; flex-direction: column; 
            align-items: center; justify-content: flex-start;
            gap: 15px; overflow-y: auto;
        }
                
        /* 오른쪽 박스: 결과 목록 & 상세 정보 영역 (1:1 세로 분할) */
        .content-down { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; display: flex; flex-direction: column; 
            overflow: hidden; padding: 20px; background: transparent; gap: 15px; position: relative;
        }

        .calc-card {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1; /* 1:1 세로 공간 균등 분할 */
            min-height: 0;
            position: relative;
        }
        .calc-card h3 {
            font-size: 0.9rem;
            color: #ff9e40;
            flex-shrink: 0;
        }

        /* 입력 및 버튼 스타일 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            width: 100%;
        }
        .input-group label {
            font-size: 0.85rem;
            color: #ff9e40;
            font-weight: 600;
        }
                
        .input-group input {
            width: 100%;
            padding: 12px 18px;
            background: #202020;
            border: 2px solid #ff9e40;
            color: #fff;
            border-radius: 50px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus {
            border-color: #ff9e40;
            box-shadow: 0 0 10px rgba(255, 158, 64, 0.3);
        }

        .action-btn {
            background: #202020;
            color: #ff9e40;
            border: 2px solid #ff9e40;
            padding: 12px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-align: center;
        }
        .action-btn:hover { background: #ff9e40; color: #101010; }

        .secondary-btn {
            background: #202020;
            color: #ff9e40;
            border: 1px solid #ff9e40;
            padding: 8px 12px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .secondary-btn:hover { background: #ff9e40; color: #101010; }

        /* 필기 인식 캔버스 스타일 */
        .canvas-wrapper {
            border: 2px dashed #ff9e40;
            border-radius: 12px;
            overflow: hidden;
            background: #202020;
            position: relative;
            cursor: crosshair;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #drawCanvas {
            touch-action: none;
            background: #fff;
            border-radius: 8px;
            width: 300px;
            height: 300px;
        }

        /* 후보군 리스트 패널 */
        #candidateList {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            min-height: 40px;
            align-items: center;
            width: 100%;
        }

        /* 결과 목록 스타일 */
        .history-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-content: flex-start;
        }
        .hanzi-result-btn {
            width: 44px;
            height: 44px;
            font-size: 1.1rem;
            font-weight: bold;
            background: #252525;
            color: #ff9e40;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hanzi-result-btn:hover {
            background: #ff9e40;
            color: #101010;
            border-color: #ff9e40;
        }

        /* 상세 정보 스타일 */
        .detail-container {
            display: flex;
            gap: 15px;
            align-items: center;
            height: 100%;
        }
        .character-target {
            width: 140px;
            height: 140px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #202020;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .detail-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.85rem;
            color: #ccc;
            overflow-y: auto;
            max-height: 100%;
        }
        .detail-char-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff9e40;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .calc-card, .content-mid, .content-down {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }
                
        body.light-mode .menu-btn, body.light-mode .theme-btn, body.light-mode .theme-toggle-btn { 
            background: rgba(0, 0, 0, 0.02); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.5); 
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover { 
            background: rgba(243, 128, 32, 0.15); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.4); 
        }

        body.light-mode .search-input {
            background: rgba(0, 0, 0, 0.02);
            color: #202020;
            border-color: rgba(243, 128, 32, 0.5);
        }
        body.light-mode .search-input::placeholder { color: #888; }
        body.light-mode select.search-input option { background: #fff; color: #202020; }

        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode .content-mid, body.light-mode .content-down, body.light-mode .calc-card {
            background-color: #fafafa;
            border-color: #F38020;
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15);
        }
        body.light-mode .input-group input { background: #FDF5E6; border-color: #e68a35; color: #000; }
        body.light-mode .input-group input:focus { border-color: #F38020; box-shadow: 0 0 10px rgba(243, 128, 32, 0.2); }
        body.light-mode .input-group label { color: #e68a35; }
        body.light-mode .calc-card { background: #fff; border-color: #ddd; }
        body.light-mode .calc-card h3 { color: #e68a35; }
        body.light-mode .action-btn, body.light-mode .secondary-btn { background: #FDF5E6; color: #e68a35; border-color: #e68a35; }
        body.light-mode .action-btn:hover, body.light-mode .secondary-btn:hover { background: #F38020; color: #fff; border-color: #F38020; }
        body.light-mode .hanzi-result-btn { background: #fff; color: #e68a35; border-color: #ddd; }
        body.light-mode .hanzi-result-btn:hover { background: #F38020; color: #fff; border-color: #F38020; }
        body.light-mode .character-target { background: #fff; border-color: #ddd; }
        body.light-mode .canvas-wrapper { background: #fafafa; border-color: #e68a35; }
        body.light-mode .detail-info { color: #202020; }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; color: #ffffff; }
        @media (max-width: 900px) {                            
            .menu-toggle-btn { display: block; }                            
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; 
            }                            
            body.light-mode .sidebar { 
                background: #ffffff !important; 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; 
            }
            .sidebar.active { transform: translateX(0); }                            
            .main-content { margin-left: 0; padding: 20px; width: 100vw; max-height: 100svh; overflow-y: auto; height: auto; }                            
            .workspace-container { flex-direction: column; overflow: visible; }                            
            .content-mid { height: auto; overflow: visible; flex: none; align-items: center; }                            
            .content-down { height: auto; overflow: visible; min-height: 500px; }                            
            .canvas-wrapper {
                width: 220px;
                height: 220px;
            }
            #drawCanvas {
                width: 220px;
                height: 220px;
            }
        }
    </style>
</head>

<div class="app-container">

    <main class="main-content">
        <header class="top-section">

                    </div>
                    <div class="history-list" id="resultList">
                        <div style="font-size: 0.8rem; color: #888; text-align: center; padding: 20px 0; width: 100%;">검색 결과가 없습니다.</div>
                    </div>
                </div>

                <!-- 상세 정보 및 필순 카드 -->
                <div class="calc-card">
                    <h3>상세 정보 & 필순</h3>
                    <div class="detail-container">
                        <div class="character-target" id="characterTarget">
                            <span style="font-size: 0.8rem; color: #888;">선택 없음</span>
                        </div>

                            <div class="detail-char-title" id="detailChar">-</div>

                            <div><strong>중국어:</strong> <span id="detailChinese">-</span></div>
                            <div><strong>부수:</strong> <span id="detailBusu">-</span></div>
                            <div><strong>총 획수:</strong> <span id="detailStrokes">-</span></div>

</div>
<script>
    // ONNX Runtime 싱글스레드 및 경로 고정 설정
    ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";
    ort.env.wasm.numThreads = 1; 
    ort.env.logLevel = "warning";

    const sidebar = document.getElementById('sidebar');
    function toggleSidebar() { sidebar.classList.toggle('active'); }

    document.getElementById('theme-toggle').addEventListener('click', () => { 
        document.body.classList.toggle('light-mode'); 
    });

    document.querySelector('.main-content').addEventListener('click', (e) => { 
        if (sidebar.classList.contains('active')) { sidebar.classList.remove('active'); }
    });

    const db = typeof trad_with_simp !== 'undefined' ? trad_with_simp : [];
    let writer = null;
    let strokeCount = 0; 
    let hanziSession = null;
    let charDict = [];

    // 조각 파일(part1~part5) 및 사전 파일(mandarin-onnx.txt)을 병행 로드하여 모델 구축
    async function getHanziSession() {
        if (hanziSession && charDict.length > 0) return { session: hanziSession, dict: charDict };
        try {
            console.log("Loading split ONNX model parts & dict file...");
            const partFiles = [
                '/models/mandarin.onnx.part1',
                '/models/mandarin.onnx.part2',
                '/models/mandarin.onnx.part3',
                '/models/mandarin.onnx.part4',
                '/models/mandarin.onnx.part5'
            ];

            const bufferPromises = partFiles.map(async (url) => {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`모델 조각 로드 실패: ${url}`);
                return await res.arrayBuffer();
            });

            const dictPromise = fetch('/models/mandarin-onnx.txt').then(async (res) => {
                if (!res.ok) throw new Error("사전 파일(mandarin-onnx.txt) 로드 실패");
                const text = await res.text();
                return text.split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 0);
            });

            const results = await Promise.all([...bufferPromises, dictPromise]);
            charDict = results.pop();
            const arrays = results;

            console.log(`사전 로드 완료! 총 글자 수: ${charDict.length}개`);

            const totalLength = arrays.reduce((sum, buf) => sum + buf.byteLength, 0);
            const combinedArray = new Uint8Array(totalLength);
            let offset = 0;
            for (const buf of arrays) {
                combinedArray.set(new Uint8Array(buf), offset);
                offset += buf.byteLength;
            }

            console.log(`모델 병합 완료! 총 크기: ${(combinedArray.byteLength / (1024 * 1024)).toFixed(2)} MB`);

            hanziSession = await ort.InferenceSession.create(combinedArray.buffer, { 
                executionProviders: ['wasm'], 
                graphOptimizationLevel: "all" 
            });
            console.log("ONNX Model Loaded Successfully from parts!");
        } catch (err) {
            console.error("ONNX Model 또는 사전 로드 실패:", err);
            throw err;
        }
        return { session: hanziSession, dict: charDict };
    }

    window.onload = function() {
        renderList(db);
        if (db.length > 0) selectHanzi(db[0].char);
        initCanvas();
        getHanziSession().catch(e => console.warn("Background model preload warning:", e));
    };

    function renderList(data) {
        const listContainer = document.getElementById('resultList');
        const countLabel = document.getElementById('resultCount');
        listContainer.innerHTML = '';
        countLabel.innerText = `${data.length}개 검색됨`;

        if(data.length === 0) {
            listContainer.innerHTML = '<div style="font-size: 0.8rem; color: #888; text-align: center; padding: 20px 0; width: 100%;">검색 결과가 없습니다.</div>';
            return;
        }

        data.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'hanzi-result-btn';
            btn.innerText = item.char;
            btn.onclick = () => selectHanzi(item.char);
            listContainer.appendChild(btn);
        });
    }

    function selectHanzi(charStr) {
        const found = db.find(x => x.char === charStr);
        const target = document.getElementById('characterTarget');
        target.innerHTML = '';

        if (!found) {
            document.getElementById('detailChar').innerText = charStr;
            document.getElementById('detailMeaning').innerText = '데이터베이스에 없는 한자입니다.';
            document.getElementById('detailChinese').innerText = '-';
            document.getElementById('detailBusu').innerText = '-';
            document.getElementById('detailStrokes').innerText = '-';
            return;
        }

        document.getElementById('detailChar').innerText = found.char;
        document.getElementById('detailMeaning').innerText = found.meaning;
        document.getElementById('detailChinese').innerText = found.chinese || '-';
        document.getElementById('detailBusu').innerText = found.busu;
        document.getElementById('detailStrokes').innerText = found.strokes + '획';
        
        try {
            writer = HanziWriter.create('characterTarget', found.char, {
                width: 130,
                height: 130,
                padding: 5,
                showOutline: true,
                strokeAnimationSpeed: 1,
                delayBetweenStrokes: 300,
                strokeColor: '#ff9e40'
            });
            writer.animateCharacter();
        } catch (e) {
            console.error("Hanzi Writer 렌더링 실패:", e);
        }
    }

    function animateWriter() {
        if (writer) {
            writer.animateCharacter();
        }
    }

    function searchHanziText() {
        const query = document.getElementById('searchInput').value.trim();
        if(!query) {
            renderList(db);
            return;
        }
        const filtered = db.filter(x => x.char.includes(query) || x.meaning.toLowerCase().includes(query.toLowerCase()) || (x.chinese && x.chinese.includes(query)));
        renderList(filtered);
        if(filtered.length > 0) selectHanzi(filtered[0].char);
    }

    function filterList() {
        const busu = document.getElementById('filterBusu').value;
        const strokes = document.getElementById('filterStrokes').value;

        let filtered = db;
        if(busu) filtered = filtered.filter(x => x.busu === busu);
        if(strokes) filtered = filtered.filter(x => x.strokes == strokes);

        renderList(filtered);
        if(filtered.length > 0) selectHanzi(filtered[0].char);
    }

    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function initCanvas() {
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#101010';

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);

        canvas.addEventListener('touchstart', (e) => { handleTouch(e, startDraw); });
        canvas.addEventListener('touchmove', (e) => { handleTouch(e, draw); });
        canvas.addEventListener('touchend', stopDraw);
    }

    function handleTouch(e, callback) {
        e.preventDefault();
        const touch = e.touches[0];
        const mouseEvent = new MouseEvent(e.type === 'touchstart' ? 'mousedown' : 'mousemove', {
            clientX: touch.clientX,
            clientY: touch.clientY
        });
        canvas.dispatchEvent(mouseEvent);
    }

    function startDraw(e) {
        isDrawing = true;
        strokeCount++;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        ctx.beginPath();
        ctx.moveTo((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
    }

    function draw(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        ctx.lineTo((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
        ctx.stroke();
    }

    function stopDraw() {
        isDrawing = false;
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        strokeCount = 0;
        document.getElementById('candidateList').innerHTML = '<span style="font-size: 0.8rem; color: #888;">글씨를 그린 후 \'인식하기\'를 누르세요.</span>';
    }

    // 후보군 버튼 UI 렌더링 함수
    function renderCandidates(candidates) {
        const container = document.getElementById('candidateList');
        container.innerHTML = '';

        if (candidates.length === 0) {
            container.innerHTML = '<span style="font-size: 0.8rem; color: #888;">인식된 순수 한자 후보가 없습니다.</span>';
            return;
        }

        candidates.forEach((cand, idx) => {
            const btn = document.createElement('button');
            btn.className = 'secondary-btn';
            btn.style.flex = '1';
            btn.style.padding = '8px 4px';
            btn.style.fontSize = '0.8rem';
            btn.innerHTML = `<strong>${idx + 1}.</strong> ${cand.char} <span style="font-size:0.65rem; color:#ff9e40;">(${cand.confidence}%)</span>`;
            
            btn.onclick = () => {
                const found = db.find(x => x.char === cand.char);
                if (found) {
                    selectHanzi(found.char);
                } else {
                    document.getElementById('detailChar').innerText = cand.char;
                    document.getElementById('detailMeaning').innerText = '상세 정보가 등록되지 않은 한자입니다.';
                    document.getElementById('detailChinese').innerText = '-';
                    document.getElementById('detailBusu').innerText = '-';
                    document.getElementById('detailStrokes').innerText = '-';
                }
            };
            container.appendChild(btn);
        });
    }

    // ONNX 모델 추론 및 동적 비율(Dynamic Width, Height 48, RGB 3채널) 전처리 적용 함수
    async function recognizeCanvas() {
        if (strokeCount === 0) {
            alert("인식할 글자를 캔버스에 그려주세요.");
            return;
        }

        try {
            const { session, dict } = await getHanziSession();
            
            const targetHeight = 48; // 모델이 요구하는 고정 높이
            const srcAspect = canvas.width / canvas.height;
            const targetWidth = Math.max(48, Math.round(targetHeight * srcAspect)); // 비율 유지 동적 너비

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = targetWidth;
            tempCanvas.height = targetHeight;
            const tempCtx = tempCanvas.getContext('2d');
            
            // 흰색 배경 채우기
            tempCtx.fillStyle = "#FFFFFF";
            tempCtx.fillRect(0, 0, targetWidth, targetHeight);
            
            // 비율 유지하며 드로잉 캔버스 내용 복사
            tempCtx.drawImage(canvas, 0, 0, targetWidth, targetHeight);
            
            const imgData = tempCtx.getImageData(0, 0, targetWidth, targetHeight).data;
            const floatData = new Float32Array(3 * targetWidth * targetHeight);
            
            for (let i = 0; i < targetWidth * targetHeight; i++) {
                // 흰 배경(255) / 검은 선(0) 반전 처리
                const r = 255 - imgData[i * 4];
                const g = 255 - imgData[i * 4 + 1];
                const b = 255 - imgData[i * 4 + 2];
                
                // RGB 3채널 정규화 (0~1 범위)
                floatData[i] = r / 255.0;
                floatData[targetWidth * targetHeight + i] = g / 255.0;
                floatData[targetWidth * targetHeight * 2 + i] = b / 255.0;
            }

            // 동적 텐서 [1, 3, 48, targetWidth] 생성
            const inputTensor = new ort.Tensor('float32', floatData, [1, 3, targetHeight, targetWidth]);
            const feeds = { [session.inputNames[0]]: inputTensor };
            
            const inferenceResults = await session.run(feeds);
            const outputTensor = inferenceResults[session.outputNames[0]];
            const dims = outputTensor.dims; 
            const outputData = outputTensor.data;

            console.log("모델 출력 텐서 형태(Dims):", dims);
            console.log("출력 데이터 상위 20개:", outputData.slice(0, 20));

            const seqLen = dims[1];    
            const numClasses = dims[2]; 

            const t = 0; 
            const stepOffset = t * numClasses;
            
            let scoredClasses = [];
            for (let i = 0; i < numClasses; i++) {
                scoredClasses.push({ index: i, score: outputData[stepOffset + i] });
            }

            scoredClasses.sort((a, b) => b.score - a.score);

            // 순수 한자(CJK Unified Ideographs)만 필터링하여 상위 5개 추출
            let filteredTop5 = [];
            for (let item of scoredClasses) {
                if (filteredTop5.length >= 5) break;
                
                let idx = item.index;
                if (idx > 0 && idx < dict.length) {
                    let char = dict[idx];
                    const isHanzi = /^[\u4e00-\u9fa5]+$/.test(char);
                    if (isHanzi) {
                        filteredTop5.push(item);
                    }
                }
            }

            if (filteredTop5.length === 0) {
                alert("인식된 순수 한자가 없습니다.");
                return;
            }

            const maxScore = filteredTop5[0].score;
            const expScores = filteredTop5.map(item => Math.exp(item.score - maxScore));
            const sumExp = expScores.reduce((a, b) => a + b, 0);
            const confidences = expScores.map(exp => (exp / sumExp) * 100);

            let candidateList = [];
            filteredTop5.forEach((item, idx) => {
                candidateList.push({
                    char: dict[item.index],
                    confidence: confidences[idx].toFixed(1)
                });
            });

            renderCandidates(candidateList);

            const bestChar = candidateList[0].char;
            const found = db.find(x => x.char === bestChar);
            if (found) {
                selectHanzi(found.char);
            } else {
                document.getElementById('detailChar').innerText = bestChar;
                document.getElementById('detailMeaning').innerText = '상세 정보가 등록되지 않은 한자입니다.';
                document.getElementById('detailChinese').innerText = '-';
                document.getElementById('detailBusu').innerText = '-';
                document.getElementById('detailStrokes').innerText = '-';
            }

        } catch (err) {
            console.error("ONNX 추론 오류:", err);
            alert("모델 추론 중 오류가 발생했습니다. (콘솔창 확인)");
        }
    }

    function resetAll() {
        document.getElementById('searchInput').value = '';
        document.getElementById('filterBusu').value = '';
        document.getElementById('filterStrokes').value = '';
        clearCanvas();
        renderList(db);
        if (db.length > 0) selectHanzi(db[0].char);
    }
</script>
