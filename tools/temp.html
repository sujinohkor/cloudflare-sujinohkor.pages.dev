<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Schema Builder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .app-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
        header { padding: 15px 30px; border-bottom: 1px solid rgba(255, 158, 64, 0.3); background: #181818; flex-shrink: 0; }
        h1 { color: #ff9e40; font-size: 1.2rem; letter-spacing: 1px; }
        .canvas-container { flex: 1; position: relative; background: radial-gradient(circle, #222 1px, transparent 1px) #101010; background-size: 20px 20px; width: 100%; height: 100%; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        .info-panel { position: absolute; bottom: 20px; left: 20px; background: rgba(20, 20, 20, 0.85); border: 1px solid #ff9e40; padding: 15px 20px; border-radius: 12px; backdrop-filter: blur(10px); max-width: 300px; z-index: 10; }
        .info-panel h3 { color: #ff9e40; font-size: 0.95rem; margin-bottom: 6px; }
        .info-panel p { font-size: 0.8rem; color: #ccc; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>System Architecture Schema</h1>
        </header>
        <div class="canvas-container" id="canvasContainer">
            <canvas id="schemaCanvas"></canvas>
            <div class="info-panel">
                <h3>Structure Guide</h3>
                <p>클라이언트 앱들이 Cloudflare Workers, Firebase, Apps Script 및 오픈소스 라이브러리와 연결되는 구조를 나타낸 모식도입니다. 노드를 드래그하여 이동할 수 있습니다.</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('schemaCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');

        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            draw();
        }
        window.addEventListener('resize', resize);

        const nodes = [
            { id: 'client', label: 'Client Apps (50+)', x: 200, y: 300, color: '#ff9e40' },
            { id: 'workers', label: 'Cloudflare Workers', x: 550, y: 150, color: '#f38020' },
            { id: 'firebase', label: 'Firebase Backend', x: 550, y: 300, color: '#ffca28' },
            { id: 'appscript', label: 'Google Apps Script', x: 550, y: 450, color: '#34a853' },
            { id: 'opensource', label: 'Open Source Libs', x: 200, y: 150, color: '#64748b' }
        ];

        const connections = [
            { from: 'client', to: 'workers' },
            { from: 'client', to: 'firebase' },
            { from: 'client', to: 'appscript' },
            { from: 'opensource', to: 'client' }
        ];

        let draggedNode = null;
        let offsetX = 0, offsetY = 0;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            connections.forEach(conn => {
                const fromNode = nodes.find(n => n.id === conn.from);
                const toNode = nodes.find(n => n.id === conn.to);
                if (fromNode && toNode) {
                    ctx.beginPath();
                    ctx.moveTo(fromNode.x, fromNode.y);
                    ctx.bezierCurveTo(fromNode.x + 80, fromNode.y, toNode.x - 80, toNode.y, toNode.x, toNode.y);
                    ctx.strokeStyle = '#444';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            nodes.forEach(node => {
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = node.color;
                ctx.lineWidth = 2;
                
                const w = 180, h = 50;
                ctx.fillRect(node.x - w/2, node.y - h/2, w, h);
                ctx.strokeRect(node.x - w/2, node.y - h/2, w, h);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px Segoe UI';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(node.label, node.x, node.y);
            });
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            nodes.forEach(node => {
                if (Math.abs(x - node.x) < 90 && Math.abs(y - node.y) < 25) {
                    draggedNode = node;
                    offsetX = x - node.x;
                    offsetY = y - node.y;
                }
            });
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!draggedNode) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            draggedNode.x = (e.clientX - rect.left) * scaleX - offsetX;
            draggedNode.y = (e.clientY - rect.top) * scaleY - offsetY;
            draw();
        });

        canvas.addEventListener('mouseup', () => { draggedNode = null; });

        window.onload = resize;
    </script>
</body>
</html>
