<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Bar SVG Animation Generator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:#101010; --panel:rgba(16,16,16,.28); --text:#fff; --muted:#888;
  --accent:#ff9e40; --field:rgba(255,255,255,.04); --border:rgba(255,158,64,.38);
}
body {
  background:var(--bg); color:var(--text); font-family:"Segoe UI",sans-serif;
  min-height:100vh; overflow:hidden; transition:.25s;
}
body.light {
  --bg:#fff; --panel:rgba(255,255,255,.45); --text:#202020;
  --muted:#666; --field:rgba(0,0,0,.025);
}
.app { display:flex; min-height:100vh; width:100%; }

.sidebar {
  width:260px; height:calc(100vh - 40px); position:fixed; left:20px; top:20px; z-index:10;
  padding:25px 20px; display:flex; flex-direction:column; gap:12px;
  border:1px solid var(--border); border-radius:24px; background:var(--panel);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 20px 40px rgba(0,0,0,.35);
}
body.light .sidebar {
  background:rgba(255,255,255,.3);
  border-color:rgba(243,128,32,.35);
  box-shadow:0 20px 40px rgba(243,128,32,.15);
}
.sidebar-title {
  color:#ff9e40; font-size:1.1rem; font-weight:bold; margin-bottom:5px;
  text-align:center; letter-spacing:1px;
}
.sidebar-top { display:flex; flex-direction:column; gap:10px; margin-bottom:5px; }

.theme-toggle-btn {
  width:100%; padding:11px; background:rgba(255,255,255,.03); color:#ff9e40;
  border:1px solid rgba(255,158,64,.5); border-radius:50px; font-weight:bold;
  cursor:pointer; transition:.3s; text-align:center;
}
.theme-toggle-btn:hover { background:rgba(255,158,64,.2); border-color:rgba(255,158,64,.6); }

.menu-btn {
  width:100%; padding:11px 14px; cursor:pointer; text-align:center;
  background:rgba(255,255,255,.03); color:#ff9e40; border:1px solid rgba(255,158,64,.35);
  border-radius:50px; font-weight:bold; transition:all .3s; font-size:.85rem;
  display:flex; align-items:center; justify-content:center; line-height:1;
}
.menu-btn:hover { background:rgba(255,158,64,.2); border-color:rgba(255,158,64,.6); }

body.light .menu-btn,
body.light .theme-toggle-btn {
  background:rgba(0,0,0,.02); color:#F38020; border-color:rgba(243,128,32,.5);
}
body.light .menu-btn:hover,
body.light .theme-toggle-btn:hover {
  background:rgba(243,128,32,.15); border-color:rgba(243,128,32,.4);
}

.palette-btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.palette-btns .menu-btn.active {
  background:rgba(255,158,64,.2); border-color:rgba(255,158,64,.75);
}

.controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:4px 0; }
.control { display:flex; flex-direction:column; gap:5px; }
.control label { font-size:11px; color:var(--muted); padding-left:4px; }
.control input {
  width:100%; padding:9px 10px; border:1px solid rgba(255,255,255,.13);
  border-radius:10px; background:var(--field); color:var(--text); outline:none;
}
body.light .control input { border-color:rgba(0,0,0,.14); }

.main {
  margin-left:300px; padding:40px; flex:1; height:100vh; width:calc(100% - 300px);
  display:flex; flex-direction:column; gap:20px; overflow:hidden;
}
header h1 { font-size:1.8rem; margin-bottom:5px; }
header p { font-size:.95rem; color:var(--muted); }

.workspace { display:flex; gap:20px; flex:1; min-height:0; }

.panel {
  border:2px solid var(--accent); border-radius:16px; background:rgba(0,0,0,.12);
  box-shadow:0 10px 20px rgba(0,0,0,.28); padding:20px; min-height:0;
}
body.light .panel {
  background:rgba(255,255,255,.5); border-color:#F38020;
  box-shadow:0 10px 20px rgba(243,128,32,.15);
}

.left { flex:1; display:flex; flex-direction:column; gap:12px; }
.left label { color:var(--accent); font-weight:700; }

textarea {
  width:100%; flex:1; resize:none; border-radius:12px; padding:15px;
  border:1px solid rgba(255,255,255,.15); background:var(--field); color:var(--text);
  font-size:16px; font-family:inherit; line-height:1.5; outline:none;
}
body.light textarea {
  background:rgba(0,0,0,.02); color:#202020; border-color:rgba(0,0,0,.15);
}
textarea:focus { border-color:var(--accent); }

.hint { font-size:12px; color:var(--muted); line-height:1.5; }

.right {
  flex:1.2; overflow:auto; display:flex; align-items:flex-start; justify-content:flex-start;
}
.preview-wrap { min-width:620px; flex:0 0 auto; }
.preview-wrap svg { width:620px; min-width:620px; height:auto; display:block; }

.menu-toggle {
  display:none; position:fixed; left:20px; bottom:20px; z-index:20; width:auto;
  padding:10px 15px; background:var(--accent); color:#fff; border:none;
  border-radius:50px; font-weight:bold;
}

@media(max-width:900px) {
  body { overflow:auto; }
  .menu-toggle { display:block; }
  .sidebar {
    transform:translateX(-320px); transition:.25s; background:var(--bg);
  }
  .sidebar.active { transform:translateX(0); }
  .main {
    margin-left:0; padding:20px; width:100vw; height:auto; min-height:100svh;
  }
  .workspace { flex-direction:column; }
  .left { min-height:330px; }
  .right { min-height:300px; }
}
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle">MENU</button>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Search SVG Animator</div>

    <div class="sidebar-top">
      <button class="theme-toggle-btn" id="themeBtn">DAY / NIGHT</button>
    </div>

    <button class="menu-btn" onclick="location.href='../index'">Home</button>

    <div class="palette-btns">
      <button class="menu-btn active" id="blackBtn">Black</button>
      <button class="menu-btn" id="whiteBtn">White</button>
    </div>

    <div class="controls">
      <div class="control">
        <label for="typingSpeed">Typing Speed</label>
        <input id="typingSpeed" type="number" min="0.01" step="0.01" value="0.07">
      </div>
      <div class="control">
        <label for="resultDelay">Result Delay</label>
        <input id="resultDelay" type="number" min="0" step="0.1" value="0.45">
      </div>
      <div class="control">
        <label for="fontSize">Font Size</label>
        <input id="fontSize" type="number" min="10" step="1" value="16">
      </div>
      <div class="control">
        <label for="canvasWidth">Width</label>
        <input id="canvasWidth" type="number" min="420" step="10" value="720">
      </div>
    </div>

    <button class="menu-btn" id="applyBtn">Apply Animation</button>
    <button class="menu-btn" id="replayBtn">Replay</button>
    <button class="menu-btn" id="copyBtn">Copy SVG Code</button>
    <button class="menu-btn" id="downloadBtn">Download SVG</button>
    <button class="menu-btn" id="resetBtn">Reset</button>
  </aside>

  <main class="main" id="main">
    <header>
      <h1>Search Bar SVG Generator</h1>
      <p>Type a search query and display matching result cards sequentially as an animated SVG.</p>
    </header>

    <div class="workspace">
      <section class="panel left">
        <label for="searchInput">Search Data</label>
        <textarea id="searchInput" spellcheck="false"></textarea>
        <div class="hint">
          First line = search query. Remaining lines = results in the format <strong>Title | Description</strong>.
        </div>
      </section>

      <section class="panel right">
        <div class="preview-wrap" id="previewWrap"></div>
      </section>
    </div>
  </main>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";
const searchInput = document.getElementById("searchInput");
const previewWrap = document.getElementById("previewWrap");
const blackBtn = document.getElementById("blackBtn");
const whiteBtn = document.getElementById("whiteBtn");

let searchTheme = "black";

const defaults = {
  text:
`SVG animation generator
Chat SVG Generator | Create animated chat bubbles.
Token SVG Generator | Generate sequential word-box animations.
Timeline SVG Generator | Build animated timelines from dates and events.
Architecture Diagram Generator | Create simple system diagrams.`,
  typingSpeed: 0.07,
  resultDelay: 0.45,
  fontSize: 16,
  canvasWidth: 720
};

function escapeXml(value) {
  return value.replace(/[<>&'"]/g, ch => ({
    "<":"&lt;", ">":"&gt;", "&":"&amp;", "'":"&apos;", '"':"&quot;"
  }[ch]));
}

function num(id, fallback) {
  const value = Number(document.getElementById(id).value);
  return Number.isFinite(value) ? value : fallback;
}

function palette() {
  if (searchTheme === "white") {
    return {
      bg:"#f3f3f3",
      border:"#cfcfcf",
      search:"#ffffff",
      searchBorder:"#bfbfbf",
      text:"#202020",
      muted:"#686868",
      card:"#e7e7e7",
      icon:"#202020",
      cursor:"#202020"
    };
  }

  return {
    bg:"#181818",
    border:"#333333",
    search:"#242424",
    searchBorder:"#464646",
    text:"#ffffff",
    muted:"#b9b9b9",
    card:"#242424",
    icon:"#ffffff",
    cursor:"#ffffff"
  };
}

function parseData() {
  const lines = searchInput.value.replace(/\r/g, "").split("\n");
  const query = (lines.shift() || "").trim();

  const results = lines
    .map(line => line.trim())
    .filter(Boolean)
    .map(line => {
      const i = line.indexOf("|");
      if (i === -1) return { title:line, desc:"" };

      return {
        title:line.slice(0, i).trim(),
        desc:line.slice(i + 1).trim()
      };
    });

  return { query, results };
}

function wrapText(text, maxChars) {
  if (!text) return [""];

  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let current = "";

  words.forEach(word => {
    const test = current ? `${current} ${word}` : word;

    if (test.length > maxChars && current) {
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  });

  if (current) lines.push(current);
  return lines.length ? lines : [""];
}

function buildSvg() {
  const { query, results } = parseData();
  const typingSpeed = Math.max(0.01, num("typingSpeed", defaults.typingSpeed));
  const resultDelay = Math.max(0, num("resultDelay", defaults.resultDelay));
  const fontSize = Math.max(10, num("fontSize", defaults.fontSize));
  const width = Math.max(420, num("canvasWidth", defaults.canvasWidth));
  const p = palette();

  const pad = 28;
  const searchY = 28;
  const searchH = 54;
  const searchX = pad;
  const searchW = width - pad * 2;
  const iconX = searchX + 24;
  const textX = searchX + 48;
  const queryY = searchY + 34;

  const chars = [...query];
  const typingDuration = chars.length * typingSpeed;
  const typed = [];

  chars.forEach((char, index) => {
    const begin = index * typingSpeed;
    const visible = chars.slice(0, index + 1).join("");

    typed.push(
`<text x="${textX}" y="${queryY}" fill="${p.text}" font-size="${fontSize}" font-family="'Segoe UI', sans-serif" opacity="0">${escapeXml(visible)}
  <animate attributeName="opacity" from="0" to="1" begin="${begin.toFixed(3)}s" dur="0.01s" fill="freeze"/>
  <animate attributeName="opacity" from="1" to="0" begin="${(begin + typingSpeed).toFixed(3)}s" dur="0.01s" fill="freeze"/>
</text>`
    );
  });

  if (chars.length) {
    typed.push(
`<text x="${textX}" y="${queryY}" fill="${p.text}" font-size="${fontSize}" font-family="'Segoe UI', sans-serif" opacity="0">${escapeXml(query)}
  <animate attributeName="opacity" from="0" to="1" begin="${Math.max(0, (chars.length - 1) * typingSpeed).toFixed(3)}s" dur="0.01s" fill="freeze"/>
</text>`
    );
  }

  const resultParts = [];
  let y = searchY + searchH + 22;
  const cardGap = 12;
  const cardPadX = 16;
  const cardPadY = 13;
  const titleSize = Math.round(fontSize * 1.02);
  const lineHeight = Math.round(fontSize * 1.35);

  results.forEach((item, index) => {
    const maxChars = Math.max(20, Math.floor((searchW - cardPadX * 2) / (fontSize * .52)));
    const descLines = wrapText(item.desc, maxChars);
    const cardH = Math.max(68, cardPadY * 2 + titleSize + 8 + descLines.length * lineHeight);
    const begin = typingDuration + 0.3 + index * resultDelay;

    const tspans = descLines.map((line, li) =>
      `<tspan x="${searchX + cardPadX}" y="${y + cardPadY + titleSize + 18 + li * lineHeight}">${escapeXml(line)}</tspan>`
    ).join("");

    resultParts.push(`
<g opacity="0" transform="translate(0,10)">
  <animate attributeName="opacity" from="0" to="1" begin="${begin.toFixed(3)}s" dur="0.3s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0"
                    begin="${begin.toFixed(3)}s" dur="0.3s" fill="freeze"/>
  <rect x="${searchX}" y="${y}" width="${searchW}" height="${cardH}" rx="14"
        fill="${p.card}" stroke="${p.border}" stroke-width="1"/>
  <text x="${searchX + cardPadX}" y="${y + cardPadY + titleSize}"
        fill="${p.text}" font-size="${titleSize}" font-family="'Segoe UI', sans-serif"
        font-weight="700">${escapeXml(item.title)}</text>
  <text fill="${p.muted}" font-size="${fontSize}" font-family="'Segoe UI', sans-serif">
    ${tspans}
  </text>
</g>`);

    y += cardH + cardGap;
  });

  const height = Math.max(150, y + pad - cardGap);

  return `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="${NS}">
  <rect width="${width}" height="${height}" rx="16" fill="${p.bg}" stroke="${p.border}" stroke-width="2"/>
  <rect x="${searchX}" y="${searchY}" width="${searchW}" height="${searchH}" rx="27"
        fill="${p.search}" stroke="${p.searchBorder}" stroke-width="1.5"/>
  <circle cx="${iconX}" cy="${searchY + 25}" r="8" fill="none" stroke="${p.icon}" stroke-width="2"/>
  <line x1="${iconX + 6}" y1="${searchY + 31}" x2="${iconX + 12}" y2="${searchY + 37}"
        stroke="${p.icon}" stroke-width="2" stroke-linecap="round"/>
  ${typed.join("\n  ")}
  <rect x="${textX + Math.min(chars.length * fontSize * .53, searchW - 90)}"
        y="${searchY + 17}" width="2" height="${fontSize + 4}" fill="${p.cursor}">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
  ${resultParts.join("\n")}
</svg>`;
}

function render() {
  const svg = buildSvg();
  previewWrap.innerHTML = svg.replace(/^<\?xml[^>]*>\s*/i, "");
  return svg;
}

function replay() {
  const svg = buildSvg();
  previewWrap.innerHTML = "";
  requestAnimationFrame(() => {
    previewWrap.innerHTML = svg.replace(/^<\?xml[^>]*>\s*/i, "");
  });
}

async function copySvg() {
  try {
    await navigator.clipboard.writeText(buildSvg());
  } catch {}
}

function downloadSvg() {
  const blob = new Blob([buildSvg()], { type:"image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "search-bar-animation.svg";

  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function setSearchTheme(theme) {
  searchTheme = theme === "white" ? "white" : "black";

  blackBtn.classList.toggle("active", searchTheme === "black");
  whiteBtn.classList.toggle("active", searchTheme === "white");

  replay();
}

function resetAll() {
  searchInput.value = defaults.text;
  document.getElementById("typingSpeed").value = defaults.typingSpeed;
  document.getElementById("resultDelay").value = defaults.resultDelay;
  document.getElementById("fontSize").value = defaults.fontSize;
  document.getElementById("canvasWidth").value = defaults.canvasWidth;

  searchTheme = "black";
  blackBtn.classList.add("active");
  whiteBtn.classList.remove("active");

  render();
}

document.getElementById("applyBtn").addEventListener("click", replay);
document.getElementById("replayBtn").addEventListener("click", replay);
document.getElementById("copyBtn").addEventListener("click", copySvg);
document.getElementById("downloadBtn").addEventListener("click", downloadSvg);
document.getElementById("resetBtn").addEventListener("click", resetAll);

document.getElementById("themeBtn").addEventListener("click", () => {
  document.body.classList.toggle("light");
});

document.getElementById("menuToggle").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("active");
});

document.getElementById("main").addEventListener("click", () => {
  document.getElementById("sidebar").classList.remove("active");
});

blackBtn.addEventListener("click", () => setSearchTheme("black"));
whiteBtn.addEventListener("click", () => setSearchTheme("white"));

let renderTimer = null;
[searchInput, ...document.querySelectorAll(".control input")].forEach(el => {
  el.addEventListener("input", () => {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(replay, 120);
  });
});

window.addEventListener("load", resetAll);
</script>
</body>
</html>
