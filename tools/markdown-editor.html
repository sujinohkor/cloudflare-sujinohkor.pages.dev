<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor</title>
    <!-- 파비콘 설정 -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <!-- 마크다운 파싱을 위한 Marked.js 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }
                
        .app-container { display: flex; min-height: 100vh; width: 100%; }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar { 
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 1000; 
            display: flex; flex-direction: column; gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        /* DAY/NIGHT 버튼 최상단 배치 스타일 (데스크톱용) */
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* 메인 콘텐츠 영역 */
        .main-content { 
            margin-left: 300px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; 
            gap: 20px; overflow: hidden; transition: 0.3s; 
            width: calc(100% - 300px);
        }

        /* 3. Components */
        .menu-btn { 
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover, .menu-btn.active { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .top-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .top-btns > .menu-btn {
            margin-bottom: 0;
        }

        .bottom-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bottom-btns > .menu-btn {
            margin-bottom: 0;
        }

        /* Workspace Structure */
        .workspace-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
            min-height: 0;
            position: relative;
        }

        /* ===== Maximize / Minimize 상태별 제어 클래스 ===== */
                
        /* 1단계: 왼쪽(마크다운 입력창)이 화면 전체를 채우도록 고정 */
        .workspace-container.state-left {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999 !important;
            background: #101010;
            padding: 20px;
            margin: 0 !important;
            grid-template-columns: 1fr !important;
            gap: 0 !important;
        }
        .workspace-container.state-left .content-down-wrapper {
            display: none !important;
        }
        .workspace-container.state-left .content-mid {
            display: flex !important;
            width: 100% !important;
            height: 100% !important;
        }

        /* 2단계: 화면 전체에 좌우 분할 Maximize */
        .workspace-container.state-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999 !important;
            background: #101010;
            padding: 20px;
            margin: 0 !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 20px !important;
        }
        .workspace-container.state-fullscreen .content-mid {
            display: flex !important;
        }
        .workspace-container.state-fullscreen .content-down-wrapper {
            display: flex !important;
        }

        /* 3단계: 오른쪽(프리뷰)이 화면 전체를 채우도록 고정 */
        .workspace-container.state-right {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999 !important;
            background: #101010;
            padding: 20px;
            margin: 0 !important;
            grid-template-columns: 1fr !important;
            gap: 0 !important;
        }
        .workspace-container.state-right .content-mid {
            display: none !important;
        }
        .workspace-container.state-right .content-down-wrapper {
            display: flex !important;
            width: 100% !important;
            height: 100% !important;
        }

        /* Maximize 버튼 스타일 (z-index를 낮춰 사이드바보다 밑에 오도록 수정) */
        .maximize-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            background: #202020;
            color: #ff9e40;
            border: 1px solid #ff9e40;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.3s;
        }
        .maximize-btn:hover {
            background: #ff9e40;
            color: #101010;
        }

        /* ===== [Markdown Editor 영역] ===== */
        .content-mid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
            min-height: 0;
            min-width: 0;
        }
        .content-mid-header {
            color: #ff9e40;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .code-editor-container {
            position: relative;
            display: flex;
            width: 100%;
            flex: 1;
            min-height: 0;
            background: #141414;
            border: 2px solid #ff9e40;
            border-radius: 16px;
            overflow: hidden;
            font-family: 'Consolas', 'Fira Code', Monaco, monospace;
            font-size: 0.88rem;
            line-height: 1.5;
        }
        .line-numbers {
            padding: 12px 8px 12px 12px;
            background: #0a0a0a;
            color: #555;
            text-align: right;
            user-select: none;
            border-right: 1px solid #282828;
            font-family: inherit;
            overflow-y: hidden;
        }
        .code-output-wrapper {
            position: relative;
            flex: 1;
            height: 100%;
            overflow: hidden;
        }
        .editor-textarea {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 12px;
            margin: 0;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            white-space: pre-wrap;
            word-break: break-all;
            overflow: auto;
            tab-size: 2;
            background: transparent;
            color: #fff;
            caret-color: #fff;
            resize: none;
            z-index: 2;
        }

        /* Copy Button */
        .copy-btn {
            background: transparent;
            border: 1px solid #ff9e40;
            color: #ff9e40;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background: #ff9e40;
            color: #101010;
        }

        /* ===== [Preview 영역] ===== */
        .content-down-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
            min-height: 0;
            min-width: 0;
        }
        .content-down-wrapper label {
            color: #ff9e40;
            font-weight: bold;
            flex-shrink: 0;
        }
        .content-down {
            position: relative;
            flex: 1;
            min-height: 0;
            border: 2px solid #ff9e40;
            border-radius: 16px;
            background: #1a1a1a;
            color: #ddd;
            overflow-y: auto;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            line-height: 1.6;
            word-wrap: break-word;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        /* 마크다운 렌더링 스타일 (다크 모드 기본) */
        .content-down h1, .content-down h2, .content-down h3 { color: #ff9e40; margin-bottom: 10px; }
        .content-down p { margin-bottom: 10px; }
        .content-down ul, .content-down ol { padding-left: 20px; margin-bottom: 10px; }
        .content-down code { background: #2d2d2d; color: #ff79c6; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .content-down pre { background: #111; padding: 15px; border-radius: 8px; overflow-x: auto; margin-bottom: 10px; }
        .content-down pre code { background: transparent; color: #f8f8f2; padding: 0; }
        .content-down blockquote { border-left: 4px solid #ff9e40; padding-left: 15px; color: #aaa; margin-bottom: 10px; }
        .content-down table { border-collapse: collapse; width: 100%; margin-bottom: 10px; }
        .content-down th, .content-down td { border: 1px solid #444; padding: 8px; text-align: left; }
        .content-down th { background: #2a2a2a; }

        /* 카드/패널 그림자 */
        .card, .content-mid, .content-down, .code-editor-container {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }
                
        /* 라이트 모드 사이드바 버튼 및 토글 버튼 호버 시 투명한 주황색 스타일 적용 */
        body.light-mode .menu-btn, body.light-mode .theme-btn, body.light-mode .theme-toggle-btn { 
            background: rgba(0, 0, 0, 0.02); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.5); 
        }
        body.light-mode .menu-btn:hover, body.light-mode .menu-btn.active, body.light-mode .theme-toggle-btn:hover { 
            background: rgba(243, 128, 32, 0.15); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.4); 
        }

        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode .menu-toggle-btn { color: #ffffff; }
        body.light-mode .code-editor-container { background: #fafafa; border-color: #F38020; }
        body.light-mode .line-numbers { background: #f0f0f0; color: #aaa; border-right-color: #ddd; }
        body.light-mode .editor-textarea { color: #24292e; caret-color: #000; }
        body.light-mode .copy-btn { border-color: #F38020; color: #F38020; }
        body.light-mode .copy-btn:hover { background: #F38020; color: #fff; }
                                
        body.light-mode .workspace-container.state-left,
        body.light-mode .workspace-container.state-fullscreen,
        body.light-mode .workspace-container.state-right { background: #fff !important; }

        body.light-mode .maximize-btn { background: #FDF5E6; color: #F38020; border-color: #F38020; }
        body.light-mode .maximize-btn:hover { background: #F38020; color: #fff; }

        /* Light Mode Preview 스타일 */
        body.light-mode .content-down { background: #ffffff; color: #24292e; }
        body.light-mode .content-down h1, body.light-mode .content-down h2, body.light-mode .content-down h3 { color: #F38020; }
        body.light-mode .content-down code { background: #f6f8fa; color: #d73a49; }
        body.light-mode .content-down pre { background: #f6f8fa; }
        body.light-mode .content-down pre code { color: #24292e; }
        body.light-mode .content-down blockquote { border-left-color: #F38020; color: #6a737d; }
        body.light-mode .content-down th { background: #f6f8fa; }
        body.light-mode .content-down th, body.light-mode .content-down td { border-color: #dfe2e5; }
        body.light-mode .card, body.light-mode .content-mid, body.light-mode .content-down, body.light-mode .code-editor-container {
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15);
        }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { 
            display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; 
            padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; 
            font-weight: bold; cursor: pointer; color: #ffffff; 
        }
                
        @media (max-width: 900px) {                        
            .menu-toggle-btn { display: block; }                        
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; 
            }                        
            body.light-mode .sidebar { 
                background: #ffffff !important; 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; 
            }
            .sidebar.active { transform: translateX(0); }                        
            .main-content { margin-left: 0; padding: 20px; width: 100vw; max-height: 100svh; overflow-y: auto; height: auto; }                        
            .workspace-container { 
                display: flex;
                flex-direction: column;
                gap: 15px;
                height: 600px;
            }
            .content-mid, .content-down-wrapper {
                flex: 1 1 50%;
                height: 50%;
            }
        }
    </style>
</head>
<body>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">Markdown Editor</div>
            <div class="sidebar-top">
                <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
            </div>
            
            <div class="top-btns" style="width: 100%;">
                <button class="menu-btn" onclick="location.href='../index'">Home</button>
            </div>

            <div class="bottom-btns" style="width: 100%;">
                <button class="menu-btn" onclick="saveCode()">Save</button>
                <button class="menu-btn" onclick="resetCode()">Reset</button>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="top-section">
                <h1 id="page-title">Markdown Editor</h1>
                <p id="page-desc">Type markdown on the left, see rendered HTML on the right.</p>
            </header>
            
            <div class="workspace-container" id="workspace-container">
                <!-- 4단계 순환 Maximize/Minimize 버튼 추가 (z-index를 10으로 낮춰 사이드바보다 밑에 오도록 수정) -->
                <button class="maximize-btn" id="maximize-btn" onclick="toggleMaximize()">Maximize ⛶</button>

                <div class="content-mid">
                    <div class="content-mid-header">
                        <span>Markdown Input</span>
                        <button class="copy-btn" onclick="copyCode()">Copy</button>
                    </div>
                    <div class="code-editor-container">
                        <div class="line-numbers" id="line-numbers">1</div>
                        <div class="code-output-wrapper">
                            <textarea id="code-textarea" class="editor-textarea" spellcheck="false"></textarea>
                        </div>
                    </div>
                </div>

                <div class="content-down-wrapper">
                    <label>Preview</label>
                    <div class="content-down" id="preview-area">
                        <!-- 마크다운 렌더링 결과가 출력되는 곳 -->
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
        const sidebar = document.getElementById('sidebar');
        const codeTextarea = document.getElementById('code-textarea');
        const lineNumbers = document.getElementById('line-numbers');
        const previewArea = document.getElementById('preview-area');
        const workspaceContainer = document.getElementById('workspace-container');
        const maximizeBtn = document.getElementById('maximize-btn');

        let maximizeState = 0; // 0: 기본, 1: 왼쪽(마크다운창) Maximize, 2: 전체화면(좌우분할), 3: 오른쪽(프리뷰) Maximize
        function toggleMaximize() {
            maximizeState = (maximizeState + 1) % 4;

            // 클래스 초기화
            workspaceContainer.classList.remove('state-left', 'state-right', 'state-fullscreen');

            if (maximizeState === 0) {
                // 4번째 클릭: Minimize (기본 상태)
                maximizeBtn.textContent = 'Maximize ⛶';
            } else if (maximizeState === 1) {
                // 1번째 클릭: 왼쪽창(마크다운창)이 화면 전체 Maximize
                workspaceContainer.classList.add('state-left');
                maximizeBtn.textContent = 'Fullscreen ⛶';
            } else if (maximizeState === 2) {
                // 2번째 클릭: 화면 전체에 좌우 분할 Maximize
                workspaceContainer.classList.add('state-fullscreen');
                maximizeBtn.textContent = 'Preview Max ⛶';
            } else if (maximizeState === 3) {
                // 3번째 클릭: 오른쪽창(프리뷰)이 화면 전체 Maximize
                workspaceContainer.classList.add('state-right');
                maximizeBtn.textContent = 'Minimize 🗗';
            }
        }

        const defaultCode = `# Welcome to Markdown Editor! ✨
Type your markdown text on the left and see it rendered instantly on the right.

## Features
- Real-time preview
- Supports **bold**, *italic*, and \`code\`
- Dark and Light mode integration

> "Simplicity is the soul of efficiency." — Austin Freeman

### Code Example
\`\`\`javascript
function greet() {
    console.log("Hello, Markdown!");
}
\`\`\``;        

        function toggleSidebar() { 
            sidebar.classList.toggle('active'); 
        }

        document.getElementById('theme-toggle').addEventListener('click', () => { 
            document.body.classList.toggle('light-mode'); 
        });

        document.querySelector('.main-content').addEventListener('click', () => { 
            if (sidebar.classList.contains('active')) { 
                sidebar.classList.remove('active'); 
            } 
        });

        function updateEditor() {
            const code = codeTextarea.value;
            const lines = code.split('\n');

            // 가상으로 너비를 측정할 임시 div 생성 (textarea와 동일한 스타일 적용)
            const measureDiv = document.createElement('div');
            measureDiv.style.font = window.getComputedStyle(codeTextarea).font;
            measureDiv.style.width = (codeTextarea.clientWidth - 24) + 'px'; // padding 12px * 2 제외
            measureDiv.style.visibility = 'hidden';
            measureDiv.style.position = 'absolute';
            measureDiv.style.whiteSpace = 'pre-wrap';
            measureDiv.style.wordBreak = 'break-all';
            measureDiv.style.lineHeight = window.getComputedStyle(codeTextarea).lineHeight;
            document.body.appendChild(measureDiv);

            let lineNumbersHTML = '';
            let currentLineNum = 1;

            lines.forEach((line) => {
                measureDiv.textContent = line === '' ? ' ' : line;
                const computedHeight = measureDiv.clientHeight;
                const lineHeight = parseFloat(window.getComputedStyle(codeTextarea).lineHeight);
                // 해당 물리적 한 줄이 화면에서 자동 줄바꿈으로 인해 몇 줄로 나뉘었는지 계산
                const subLineCount = Math.max(1, Math.round(computedHeight / lineHeight));

                for (let i = 0; i < subLineCount; i++) {
                    if (i === 0) {
                        lineNumbersHTML += currentLineNum + '<br>';
                    } else {
                        lineNumbersHTML += '&nbsp;<br>'; // 줄바꿈으로 꺾인 하위 줄은 번호 대신 빈칸 처리
                    }
                }
                currentLineNum++;
            });

            document.body.removeChild(measureDiv);
            lineNumbers.innerHTML = lineNumbersHTML || '1';

            // 2. 마크다운을 HTML로 변환하여 프리뷰 영역에 반영
            previewArea.innerHTML = marked.parse(code);
        }

        codeTextarea.addEventListener('scroll', () => {
            lineNumbers.scrollTop = codeTextarea.scrollTop;
        });

        codeTextarea.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = codeTextarea.selectionStart;
                const end = codeTextarea.selectionEnd;

                codeTextarea.value = codeTextarea.value.substring(0, start) + "  " + codeTextarea.value.substring(end);
                codeTextarea.selectionStart = codeTextarea.selectionEnd = start + 2;
                updateEditor();
            }
        });

        codeTextarea.addEventListener('input', updateEditor);

        function copyCode() {
            const code = codeTextarea.value;
            if (!code) return;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = 'Copied!';
                setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
            });
        }

        function saveCode() {
            const code = codeTextarea.value;
            const fileName = 'MarkdownNote.md';

            if (!code) {
                alert('No text to save.');
                return;
            }

            localStorage.setItem('saved_markdown_text', code);
            const blob = new Blob([code], { type: 'text/markdown;charset=utf-8;' });
            const link = document.createElement('a');                                
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            link.style.display = 'none';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            URL.revokeObjectURL(link.href);
        }

        function resetCode() {
            if (confirm('Are you sure you want to reset?')) {
                localStorage.removeItem('saved_markdown_text');
                codeTextarea.value = defaultCode;
                updateEditor();
            }
        }

        function loadSavedCode() {
            const savedCode = localStorage.getItem('saved_markdown_text');

            if (savedCode !== null) {
                codeTextarea.value = savedCode;
            } else {
                codeTextarea.value = defaultCode;
            }
        }

        loadSavedCode();
        updateEditor();
    </script>
</body>
</html>
