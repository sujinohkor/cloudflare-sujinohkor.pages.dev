<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HWP/HWPX Editor</title>
    <!-- Favicon settings -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }
                        
        .app-container { display: flex; min-height: 100vh; width: 100%; }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar { 
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 1000; 
            display: flex; flex-direction: column; gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
            overflow-y: auto;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255, 158, 64, 0.3); border-radius: 4px; }

        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        /* DAY/NIGHT 버튼 최상단 배치 스타일 (데스크톱용) */
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* 메인 콘텐츠 영역 */
        .main-content { 
            margin-left: 300px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; 
            gap: 20px; overflow: hidden; transition: 0.3s; 
            width: calc(100% - 300px);
        }

        /* 3. Components */
        .menu-btn { 
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .bottom-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bottom-btns > .menu-btn {
            margin-bottom: 0;
        }

        /* Workspace Structure */
        .workspace-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        /* ===== [HWP 에디터 영역] ===== */
        .content-mid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            min-height: 0;
            min-width: 0;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
            min-height: 0;
        }

        .content-mid-header {
            color: #ff9e40;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        /* 전체화면 버튼 스타일 (에디터 내부 우측 상단 고정, z-index를 사이드바보다 낮게 조정) */
        .fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            color: #ff9e40;
            border: 1px solid rgba(255, 158, 64, 0.5);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.3s;
        }
        .fullscreen-btn:hover {
            background: rgba(255, 158, 64, 0.2);
            color: #ff9e40;
            border-color: rgba(255, 158, 64, 0.8);
        }

        .editor-container-wrapper {
            position: relative;
            display: flex;
            width: 100%;
            flex: 1;
            min-height: 0;
            background: #141414;
            border: 2px solid #ff9e40;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        /* 전체화면 활성화 클래스 */
        .editor-container-wrapper.fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999 !important;
            border-radius: 0 !important;
            border: none !important;
            padding: 0;
            background: #101010;
        }

        /* @rhwp/editor가 마운트될 DOM 영역 */
        #editor {
            width: 100%;
            height: 100%;
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }                        
        body.light-mode .menu-btn, body.light-mode .theme-toggle-btn { 
            background: rgba(0, 0, 0, 0.02); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.5); 
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover { 
            background: rgba(243, 128, 32, 0.15); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.4); 
        }

        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode .menu-toggle-btn { color: #ffffff; }
        body.light-mode .editor-container-wrapper { background: #fafafa; border-color: #F38020; box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15); }
        body.light-mode .editor-container-wrapper.fullscreen { background: #fff !important; }
        body.light-mode .fullscreen-btn { background: rgba(0, 0, 0, 0.02); color: #F38020; border-color: rgba(243, 128, 32, 0.5); }
        body.light-mode .fullscreen-btn:hover { background: rgba(243, 128, 32, 0.15); color: #F38020; border-color: rgba(243, 128, 32, 0.4); }

        /* 5. Mobile Responsive */
        .menu-toggle-btn {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 3000;
            padding: 10px 15px;
            background: #ff9e40;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            color: #ffffff;
        }

        @media (max-width: 900px) {
            .menu-toggle-btn { display: block; }
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; 
            }
            body.light-mode .sidebar { 
                background: #ffffff !important; 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; 
            }
            .sidebar.active { transform: translateX(0); }
            .main-content {
                margin-left: 0;
                padding: 20px;
                width: 100vw;
                max-height: 100svh;
            }
            .workspace-container {
                min-height: 0;
                height: 100%;
            }
            .content-mid {
                min-height: 0;
                height: 100%;
            }
        }
    </style>
</head>
<body>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">HWP/HWPX Editor</div>
            <div class="sidebar-top">
                <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
            </div>
            
            <button class="menu-btn" onclick="location.href='../index'">Home</button>
            
            <div class="bottom-btns">
                <button class="menu-btn" onclick="document.getElementById('hwp-file-input').click()">Open File</button>
                <input type="file" id="hwp-file-input" accept=".hwp,.hwpx" style="display: none;">
                <button class="menu-btn" onclick="resetAll()">Reset</button>
            </div>
        </aside>

        <main class="main-content" id="main-content">
            <header class="top-section">
                <h1>HWP/HWPX Editor</h1>
                <p>Embed a full-featured HWP/HWPX editor directly into your web browser.</p>
            </header>

            <div class="workspace-container">
                <div class="content-mid">
                    <div class="controls">
                        <div class="content-mid-header">
                            <span id="file-name-display">Please use the 'Open File' button to open a file. The file name will appear here.</span>
                        </div>
                        <div class="editor-container-wrapper" id="editor-wrapper">
                            <button class="fullscreen-btn" id="fullscreen-btn" onclick="toggleFullscreen()">Maximize ⛶</button>
                            <div id="editor"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { createEditor } from 'https://cdn.jsdelivr.net/npm/@rhwp/editor/+esm';

        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');

        window.toggleSidebar = function() { 
            sidebar.classList.toggle('active'); 
        }

        // 모바일 화면에서 사이드바 내부의 버튼을 클릭하면 사이드바가 닫히도록 설정
        sidebar.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', () => {
                if (window.innerWidth <= 900) {
                    sidebar.classList.remove('active');
                }
            });
        });

        document.getElementById('theme-toggle').addEventListener('click', () => { 
            document.body.classList.toggle('light-mode'); 
        });

        mainContent.addEventListener('click', () => { 
            if (sidebar.classList.contains('active')) { 
                sidebar.classList.remove('active'); 
            } 
        });

        let editorInstance = null;
        const fileInput = document.getElementById('hwp-file-input');
        const fileNameDisplay = document.getElementById('file-name-display');
        const editorWrapper = document.getElementById('editor-wrapper');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        window.toggleFullscreen = function() {
            editorWrapper.classList.toggle('fullscreen');
            if (editorWrapper.classList.contains('fullscreen')) {
                fullscreenBtn.textContent = 'Minimize 🗗';
            } else {
                fullscreenBtn.textContent = 'Maximize ⛶';
            }
        };

        async function initEditor() {
            try {
                editorInstance = await createEditor('#editor');
                console.log('HWP/HWPX Editor initialized successfully:', editorInstance);
            } catch (err) {
                console.error('Failed to initialize HWP/HWPX editor:', err);
                document.getElementById('editor').innerHTML = '<div style="padding: 20px; color: #ff6b6b; text-align: center;">Failed to load the editor. Please check package settings.</div>';
            }
        }

        initEditor();

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !editorInstance) return;

            try {
                const buffer = await file.arrayBuffer();
                
                if (typeof editorInstance.loadFile === 'function') {
                    await editorInstance.loadFile(buffer, file.name);
                } else if (typeof editorInstance.open === 'function') {
                    await editorInstance.open(buffer);
                } else {
                    console.warn('Supported file load method not found. Please check the editor object.', editorInstance);
                }

                fileNameDisplay.textContent = file.name;
            } catch (err) {
                console.error('Failed to open the file:', err);
                fileNameDisplay.textContent = 'Failed to open file';
            } finally {
                fileInput.value = ''; 
            }
        });

        window.resetAll = function() {
            location.reload();
        }
    </script>
</body>
</html>
