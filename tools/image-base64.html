<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Base64</title>
    <!-- 파비콘 설정 추가 -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
        
    <!-- PSD 파서 라이브러리 -->
    <script src="https://unpkg.com/psd/dist/psd.min.js"></script>
    <!-- AI(PDF 호환 데이터) 파서 라이브러리 (PDF.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
        
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }
                
        .app-container { display: flex; min-height: 100vh; width: 100%; }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar { 
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 1000; 
            display: flex; flex-direction: column; gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        /* DAY/NIGHT 버튼 최상단 배치 스타일 */
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* 메인 콘텐츠 영역 */
        .main-content { 
            margin-left: 300px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; 
            gap: 20px; overflow: hidden; transition: 0.3s; 
            width: calc(100% - 300px);
        }

        /* 3. Components */
        .menu-btn { 
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .bottom-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bottom-btns > .menu-btn {
            margin-bottom: 0;
        }

        /* 3분할 컨테이너 스타일 */
        .editors-container {
            display: flex;
            gap: 20px;
            flex: 1;
            overflow: hidden;
        }

        .content-card { 
            border: 2px solid #ff9e40; 
            border-radius: 16px; 
            flex: 1; 
            display: flex; 
            overflow: hidden; 
            background: transparent;
            position: relative; 
        }

        /* 업로드 존 및 결과 렌더링 뷰어 스타일 공통 적용 */
        .content-viewer { 
            flex: 1; 
            border: 2px solid #ff9e40; 
            border-radius: 16px; 
            display: flex; 
            overflow: auto; 
            padding: 20px; 
            color: #888; 
            font-family: 'Consolas', monospace; 
            font-size: 0.9rem;
            cursor: pointer; 
            transition: all 0.3s ease; 
            user-select: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            text-align: center; 
            position: relative;
            background: transparent;
        }
        .content-viewer.dragover { background-color: rgba(255, 158, 64, 0.1); border-style: dashed; color: #ff9e40; }
        .content-viewer.has-file { background-color: rgba(255, 158, 64, 0.05); padding: 10px; }
                
        .preview-img, .render-img, #viewCanvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background-image: linear-gradient(45deg, #ccc 25%, transparent 25%),
                              linear-gradient(-45deg, #ccc 25%, transparent 25%),
                              linear-gradient(45deg, transparent 75%, #ccc 75%),
                              linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            background-color: #fff;
            display: none;
        }

        /* Editor Wrapper & Textarea */
        .editor-wrapper { 
            display: flex; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
        }
        textarea { 
            flex: 1; 
            height: 100%; 
            padding: 40px 20px; 
            background: transparent; 
            border: none; 
            color: #fff; 
            font-family: 'Consolas', sans-serif; 
            font-size: 0.9rem; 
            resize: none; 
            outline: none; 
            line-height: 1.5; 
            white-space: pre-wrap; 
            word-break: break-all; 
            overflow-y: auto; 
        }

        .card, .content-card, .content-viewer { 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5); 
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }
                
        /* 라이트 모드 사이드바 버튼 및 토글 버튼 호버 시 투명한 주황색 스타일 적용 */
        body.light-mode .menu-btn, body.light-mode .theme-btn, body.light-mode .theme-toggle-btn { 
            background: rgba(0, 0, 0, 0.02); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.5); 
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover { 
            background: rgba(243, 128, 32, 0.15); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.4); 
        }

        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode textarea { color: #000; }
        body.light-mode .menu-toggle-btn { color: #000000; }
                
        /* 데이 모드 카드/패널 그림자 */
        body.light-mode .card, 
        body.light-mode .content-card,
        body.light-mode .content-viewer { 
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15); 
        }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { 
            display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; 
            padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; 
            font-weight: bold; cursor: pointer; color: #ffffff; 
        }
                
        @media (max-width: 900px) { 
            .menu-toggle-btn { display: block; } 
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; 
            } 
            body.light-mode .sidebar { 
                background: #ffffff !important; 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; 
            }
            .sidebar.active { transform: translateX(0); } 
            .main-content { margin-left: 0; padding: 20px; width: 100vw; max-height: 100svh; } 
            .editors-container { flex-direction: column; }
            .content-card, .content-viewer { min-height: 200px; } 
        }
    </style>
</head>
<body>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    <!-- 숨겨진 파일 선택기 -->
    <input type="file" id="file-selector" accept=".psd,.ai,image/*" style="display: none;">

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">Image to Base64</div>
            <div class="sidebar-top">
                <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
            </div>
                        
            <button class="menu-btn" onclick="location.href='../index'">Home</button>

            <div class="bottom-btns">
                <button class="menu-btn" onclick="uploadFile()">Upload Image</button>
                <button class="menu-btn" onclick="copyBase64()">Copy Base64</button>
                <button class="menu-btn" onclick="resetText()">Reset</button>
            </div>
        </aside>
        <main class="main-content">
            <header class="top-section">
                <h1>Image to Base64</h1>
                <p id="status-desc">Upload image to div 1, view Base64 in div 2, render image in div 3.</p>
            </header>
                            
            <!-- 3분할 컨테이너 -->
            <div class="editors-container">
                <!-- 1번 div: 이미지 업로드 영역 -->
                <section class="content-viewer" id="drop-zone">
                    <div id="default-ui-1">
                        <div style="font-size: 2.5rem;">🖼️</div>
                        <div style="font-size: 0.85rem;">Drag & Drop PSD, AI, Image or click to upload.</div>
                    </div>
                    <img id="resultImg" class="preview-img" alt="업로드 미리보기">
                    <canvas id="viewCanvas"></canvas>
                </section>

                <!-- 2번 div: Base64 입출력 영역 -->
                <section class="content-card" id="content-card-2">
                    <div class="editor-wrapper">
                        <textarea id="text-input-2" placeholder="Base64 code will appear here or paste code..."></textarea>
                    </div>
                </section>

                <!-- 3번 div: Base64 이미지 렌더링 결과 영역 -->
                <section class="content-viewer" id="render-zone">
                    <div id="default-ui-3">
                        <div style="font-size: 2.5rem;">✨</div>
                        <div style="font-size: 0.85rem;">Base64 rendered image will appear here.</div>
                    </div>
                    <img id="renderImg" class="render-img" alt="렌더링 결과">
                </section>
            </div>
        </main>
    </div>
    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }

        const sidebar = document.getElementById('sidebar');
        const dropZone = document.getElementById('drop-zone');
        const defaultUI1 = document.getElementById('default-ui-1');
        const defaultUI3 = document.getElementById('default-ui-3');
        const fileSelector = document.getElementById('file-selector');
        const canvas = document.getElementById('viewCanvas');
        const resultImg = document.getElementById('resultImg');
        const renderImg = document.getElementById('renderImg');
        const ctx = canvas.getContext('2d');
        const textInput2 = document.getElementById('text-input-2');
                        
        let loadedFile = null;

        function toggleSidebar() { 
            sidebar.classList.toggle('active'); 
        }

        sidebar.querySelectorAll('button').forEach(element => {
            element.addEventListener('click', () => {
                if (window.innerWidth <= 900) {
                    if (element.id === 'file-selector') return;
                    sidebar.classList.remove('active');
                }
            });
        });

        document.getElementById('theme-toggle').addEventListener('click', () => { 
            document.body.classList.toggle('light-mode'); 
        });

        document.querySelector('.main-content').addEventListener('click', (e) => { 
            if (sidebar.classList.contains('active') && !e.target.closest('.sidebar') && !e.target.closest('.menu-toggle-btn')) { 
                sidebar.classList.remove('active'); 
            } 
        });

        function setInitialUI() {
            dropZone.classList.remove('has-file');
            defaultUI1.style.display = 'block';
            resultImg.style.display = 'none';
            canvas.style.display = 'none';
            resultImg.src = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            defaultUI3.style.display = 'block';
            renderImg.style.display = 'none';
            renderImg.src = '';
        }

        async function handleFile(file) {
            if (!file) return;
            loadedFile = file;
            const fileName = file.name.toLowerCase();

            defaultUI1.style.display = 'none';
            resultImg.style.display = 'none';
            canvas.style.display = 'none';
            dropZone.classList.add('has-file');

            try {
                if (fileName.endsWith('.psd')) {
                    await renderPSD(file);
                } else if (fileName.endsWith('.ai')) {
                    const arrayBuffer = await file.arrayBuffer();
                    await renderAI(arrayBuffer, file.name);
                } else if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const base64Val = e.target.result;
                        resultImg.src = base64Val;
                        resultImg.style.display = 'inline-block';
                                                                        
                        textInput2.value = base64Val;
                        renderBase64ToDiv3(base64Val);
                    };
                    reader.readAsDataURL(file);
                }
            } catch (err) {
                console.error('File Parsing Error:', err);
            }
        }

        function renderPSD(file) {
            return new Promise((resolve, reject) => {
                const PSDParser = window.PSD || (window.require && window.require('psd'));
                if (!PSDParser) return reject(new Error('PSD 라이브러리 없음'));

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const psd = new PSDParser(new Uint8Array(e.target.result));
                        psd.parse();
                        const image = psd.image.toPng();

                        resultImg.src = image.src;
                        resultImg.style.display = 'inline-block';
                                                                        
                        textInput2.value = image.src;
                        renderBase64ToDiv3(image.src);
                        resolve();
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        async function renderAI(buffer, originalFileName) {
            if (typeof pdfjsLib === 'undefined') return;

            const loadingTask = pdfjsLib.getDocument({ data: buffer });
            const pdf = await loadingTask.promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 1.5 });

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            const renderContext = { canvasContext: ctx, viewport: viewport };
            await page.render(renderContext).promise;
            canvas.style.display = 'inline-block';

            const dataUrl = canvas.toDataURL('image/png');
            textInput2.value = dataUrl;
            renderBase64ToDiv3(dataUrl);
        }

        function renderBase64ToDiv3(base64Str) {
            const val = base64Str.trim();
            if (val.startsWith('data:image/')) {
                defaultUI3.style.display = 'none';
                renderImg.style.display = 'inline-block';
                renderImg.src = val;
            } else {
                defaultUI3.style.display = 'block';
                renderImg.style.display = 'none';
                renderImg.src = '';
            }
        }

        textInput2.addEventListener('input', () => {
            renderBase64ToDiv3(textInput2.value);
        });

        function copyBase64() {
            const base64Text = textInput2.value;
            if (!base64Text.trim()) {
                return alert('No Base64 content to copy.');
            }
            navigator.clipboard.writeText(base64Text).then(() => {
                alert('Base64 code copied successfully!');
            }).catch(() => {
                alert('Failed to copy text.');
            });
        }

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => { 
            e.preventDefault(); 
            dropZone.classList.remove('dragover'); 
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        dropZone.addEventListener('click', () => { fileSelector.click(); });

        function uploadFile() { 
            fileSelector.click(); 
        }

        fileSelector.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                handleFile(e.target.files[0]);
                e.target.value = ''; 
            }
        });

        function resetText() {
            textInput2.value = '';
            setInitialUI();
        }

        setInitialUI();
    </script>
</body>
</html>
