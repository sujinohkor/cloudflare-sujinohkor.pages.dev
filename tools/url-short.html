<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="icon" type="image/png" href="https://sujinohkor.pages.dev/assets/LOGO-orange.png">
    <style>
        /* 1. Reset & Base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #202020; color: #fff; transition: background 0.3s, color 0.3s; }
                
        /* 2. Layout */
        .app-container { display: flex; min-height: 100vh; }
        .sidebar { 
            width: 250px; height: 100vh; position: fixed; left: 0; top: 0; 
            background-color: #101010; padding: 20px; z-index: 1000; 
            display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.3s ease; 
        }                
        .main-content { 
            margin-left: 250px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; gap: 20px; overflow: hidden; transition: 0.3s; 
        }
        .workspace-container {
            display: flex;
            flex-direction: row;
            flex: 1;
            gap: 20px;
            min-height: 0;
            position: relative;
        }

        /* 3. Components */
        .menu-btn, .theme-btn { 
            width: 100%; padding: 10px; margin-bottom: 10px; cursor: pointer;
            background: #202020; color: #ff9e40; border: 2px solid #ff9e40; 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; text-align: center;
        }
        .menu-btn:hover { background: #ff9e40; color: #101010; }
        .theme-btn:hover { background-color: #FDF5E6; color: #F38020; border-color: #FDF5E6; }

        /* 왼쪽 박스: URL 단축 폼 */
        .content-mid { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; display: flex; 
            padding: 25px; background: transparent; flex-direction: column; 
            gap: 20px; overflow-y: auto;
        }
        
        /* 오른쪽 박스: QR 코드 및 히스토리 (1:1 세로 분할) */
        .content-down { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; display: flex; flex-direction: column; 
            overflow: hidden; padding: 20px; background: transparent; gap: 15px; position: relative;
        }

        .calc-card {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-height: 0;
            position: relative;
        }
        .calc-card h3 {
            font-size: 0.9rem;
            color: #ff9e40;
            flex-shrink: 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }
        .input-group label {
            font-size: 0.85rem;
            color: #ff9e40;
            font-weight: 600;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 18px;
            background: #202020;
            border: 2px solid #ff9e40;
            color: #fff;
            border-radius: 50px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus {
            border-color: #ff9e40;
            box-shadow: 0 0 10px rgba(255, 158, 64, 0.3);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #ccc;
            cursor: pointer;
            margin-top: 5px;
        }
        .checkbox-group input {
            accent-color: #ff9e40;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .action-btn {
            background: #202020;
            color: #ff9e40;
            border: 2px solid #ff9e40;
            padding: 12px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-align: center;
        }
        .action-btn:hover { background: #ff9e40; color: #101010; }

        .result-box {
            background: #252525;
            border-radius: 12px;
            padding: 15px;
            font-size: 0.9rem;
            color: #fff;
            border: 1px dashed #444;
            display: none;
        }
        .result-box.active { display: block; }
        .result-url {
            color: #ff9e40;
            font-weight: bold;
            word-break: break-all;
            margin-bottom: 6px;
        }
        .created-at {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 10px;
        }
        
        .copy-btn {
            background: #202020;
            color: #ff9e40;
            border: 2px solid #ff9e40;
            padding: 8px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        .copy-btn:hover { background: #ff9e40; color: #101010; }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.85rem;
            display: none;
        }
        .error-msg.active { display: block; }

        .qr-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-height: 0;
        }
        .qr-wrapper img {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            background: #fff;
            padding: 6px;
        }
        .history-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .history-item {
            background: #252525;
            border: 1px solid #333;
            padding: 8px 10px;
            border-radius: 50px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding-left: 15px;
        }
        .history-info {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
        }
        .history-url {
            color: #ff9e40;
            font-weight: bold;
            text-decoration: none;
        }
        .history-url:hover { text-decoration: underline; }
        .history-date { color: #888; font-size: 0.7rem; }
        
        .mini-copy-btn {
            background: #202020;
            color: #ff9e40;
            border: 1px solid #ff9e40;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }
        .mini-copy-btn:hover { background: #ff9e40; color: #101010; }
        
        .clear-history-btn {
            background: transparent;
            border: 1px solid #ff9e40;
            color: #ff9e40;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .clear-history-btn:hover {
            background: #ff9e40;
            color: #101010;
        }

        .calc-card, .content-mid, .content-down {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #000; }
        body.light-mode .sidebar { background-color: #FDF5E6; box-shadow: 4px 0 15px rgba(0, 0, 0, 0.05); }
        body.light-mode .menu-btn, body.light-mode .theme-btn { background: #FDF5E6; color: #e68a35; border-color: #e68a35; }
        body.light-mode .menu-btn:hover { background: #F38020; color: #ffffff; border-color: #F38020; }
        body.light-mode .theme-btn:hover { background-color: #202020; color: #ff9e40; border-color: #202020; }
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #000000; }
        body.light-mode .content-mid, body.light-mode .content-down, body.light-mode .calc-card {
            background-color: #fafafa;
            border-color: #F38020;
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15);
        }
        body.light-mode .input-group input { background: #FDF5E6; border-color: #e68a35; color: #000; }
        body.light-mode .input-group input:focus { border-color: #F38020; box-shadow: 0 0 10px rgba(243, 128, 32, 0.2); }
        body.light-mode .input-group label { color: #e68a35; }
        body.light-mode .result-box, body.light-mode .history-item { background: #fff; color: #000; border-color: #ccc; }
        body.light-mode .checkbox-group { color: #555; }
        body.light-mode .action-btn { background: #FDF5E6; color: #e68a35; border-color: #e68a35; }
        body.light-mode .action-btn:hover { background: #F38020; color: #fff; border-color: #F38020; }
        body.light-mode .copy-btn, body.light-mode .mini-copy-btn { background: #FDF5E6; color: #e68a35; border-color: #e68a35; }
        body.light-mode .copy-btn:hover, body.light-mode .mini-copy-btn:hover { background: #F38020; color: #fff; border-color: #F38020; }
        body.light-mode .clear-history-btn { background: transparent; border-color: #e68a35; color: #e68a35; }
        body.light-mode .clear-history-btn:hover { background: #F38020; color: #fff; border-color: #F38020; }
        body.light-mode .menu-toggle-btn { color: #ffffff; }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }
        @media (max-width: 768px) {            
            .menu-toggle-btn { display: block; color: #ffffff; }            
            .sidebar { transform: translateX(-250px); }            
            .sidebar.active { transform: translateX(0); }            
            .main-content { margin-left: 0; padding: 20px; width: 100%; height: auto; overflow: visible; }            
            .workspace-container { flex-direction: column; overflow: visible; }            
            .content-mid { height: auto; overflow: visible; flex: none; }            
            .content-down { height: auto; overflow: visible; min-height: 400px; }
        }
    </style>
</head>
<body>

<button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="top-btns" style="width: 100%;">
            <button class="menu-btn" onclick="location.href='../index'">Home</button>
            <button id="theme-toggle" class="theme-btn">DAY / NIGHT</button>
            <button class="menu-btn" onclick="resetAll()">Reset</button>
        </div>
        <div class="bottom-btns" style="width: 100%;"></div>
    </aside>

    <main class="main-content">
        <header class="top-section">
            <h1>URL Shortener</h1>
            <p>Links are valid for 30 days.</p>
        </header>

        <div class="workspace-container">
            <!-- 왼쪽 박스: URL 단축 폼 -->
            <section class="content-mid">
                <div class="input-group">
                    <label>Enter URL to shorten (Unicode / Korean characters not allowed)</label>
                    <input type="text" id="longUrl" placeholder="https://example.com/long-url...">
                </div>

                <label class="checkbox-group">
                    <input type="checkbox" id="customCheck" onchange="toggleCustomInput()"> Create your own custom short URL
                </label>

                <div class="input-group" id="customGroup" style="display: none;">
                    <label>Custom URL (English letters and numbers only, up to 10 characters)</label>
                    <!-- 입력할 때 자동으로 소문자로 변환되도록 이벤트를 추가했습니다 -->
                    <input type="text" id="customSlug" maxlength="10" placeholder="예: mylink123" oninput="this.value = this.value.toLowerCase()">
                </div>

                <button class="action-btn" onclick="shortenUrl()">Shorten</button>
                <div id="errorMsg" class="error-msg"></div>

                <div id="resultBox" class="result-box">
                    <label style="color: #aaa; font-size: 0.75rem; margin-bottom: 4px; display: block;">Generated short URL</label>
                    <div class="result-url" id="resultUrl"></div>
                    <div class="created-at" id="createdAt"></div>
                    <button class="copy-btn" onclick="copyUrl()">Copy</button>
                </div>
            </section>

            <!-- 오른쪽 박스: QR 코드 & 최근 생성 기록 (1:1 세로 분할) -->
            <section class="content-down">
                <!-- QR 코드 미리보기 카드 -->
                <div class="calc-card">
                    <h3>QR Code Preview</h3>
                    <div class="qr-wrapper" id="qrContainer">
                        <span style="font-size: 0.8rem; color: #888;">Generate a link to view QR code</span>
                    </div>
                </div>

                <!-- 최근 생성 기록 카드 -->
                <div class="calc-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
                        <h3>Recent History</h3>
                        <button class="clear-history-btn" onclick="clearHistory()">Clear All</button>
                    </div>
                    <div class="history-list" id="historyList">
                        <div style="font-size: 0.8rem; color: #888; text-align: center; padding: 20px 0;">No history yet.</div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>

<script>
    const sidebar = document.getElementById('sidebar');
    function toggleSidebar() { sidebar.classList.toggle('active'); }

    document.getElementById('theme-toggle').addEventListener('click', () => { 
        document.body.classList.toggle('light-mode'); 
    });

    document.querySelector('.main-content').addEventListener('click', (e) => { 
        if (sidebar.classList.contains('active')) { sidebar.classList.remove('active'); }
    });

    document.addEventListener('DOMContentLoaded', loadHistory);

    function toggleCustomInput() {
        const isChecked = document.getElementById('customCheck').checked;
        document.getElementById('customGroup').style.display = isChecked ? 'block' : 'none';
    }

    async function shortenUrl() {
        const longUrl = document.getElementById('longUrl').value.trim();
        const isCustom = document.getElementById('customCheck').checked;
        
        // 전송하기 전에도 한 번 더 .toLowerCase()로 소문자 변환 안전장치 적용
        const customSlug = document.getElementById('customSlug').value.trim().toLowerCase();
        
        const errorMsg = document.getElementById('errorMsg');
        const resultBox = document.getElementById('resultBox');

        errorMsg.classList.remove('active');
        resultBox.classList.remove('active');

        if (!longUrl) {
            errorMsg.innerText = 'Please enter a URL.';
            errorMsg.classList.add('active');
            return;
        }

        const nonAsciiRegex = /[^\x00-\x7F]/;
        if (nonAsciiRegex.test(longUrl)) {
            errorMsg.innerText = 'URLs cannot contain Korean or Unicode characters.';
            errorMsg.classList.add('active');
            return;
        }

        if (isCustom && customSlug) {
            const customRegex = /^[a-z0-9]{1,10}$/; // 대문자를 제외하고 소문자 및 숫자로만 검증
            if (!customRegex.test(customSlug)) {
                errorMsg.innerText = 'Custom URLs can only be a combination of English lowercase letters and numbers up to 10 digits, without special symbols or Unicode.';
                errorMsg.classList.add('active');
                return;
            }
        }

        try {
            const response = await fetch('https://sjoh.kr/api/shorten', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ url: longUrl, isCustom, slug: customSlug })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'An error has occurred.');
            }

            document.getElementById('resultUrl').innerText = data.shortUrl;
            
            let formattedDate = '';
            if (data.createdAt) {
                const dateObj = new Date(data.createdAt);
                formattedDate = dateObj.toLocaleString('ko-KR', {
                    timeZone: 'Asia/Seoul',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                document.getElementById('createdAt').innerText = `Creation date & time: ${formattedDate} (Links are valid for 30 days)`;
            }

            resultBox.classList.add('active');

            const qrContainer = document.getElementById('qrContainer');
            qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(data.shortUrl)}" alt="QR Code">`;

            saveHistory(data.shortUrl, longUrl, formattedDate);

        } catch (err) {
            errorMsg.innerText = err.message;
            errorMsg.classList.add('active');
        }
    }

    function copyUrl() {
        const urlText = document.getElementById('resultUrl').innerText;
        navigator.clipboard.writeText(urlText).then(() => {
            alert('Shortened URL copied!');
        });
    }

    function saveHistory(shortUrl, longUrl, dateStr) {
        let history = JSON.parse(localStorage.getItem('url_history')) || [];
        history.unshift({ shortUrl, longUrl, dateStr });
        if (history.length > 10) history.pop();
        localStorage.setItem('url_history', JSON.stringify(history));
        loadHistory();
    }

    function loadHistory() {
        const historyList = document.getElementById('historyList');
        let history = JSON.parse(localStorage.getItem('url_history')) || [];

        if (history.length === 0) {
            historyList.innerHTML = `<div style="font-size: 0.8rem; color: #888; text-align: center; padding: 20px 0;">No history yet.</div>`;
            return;
        }

        historyList.innerHTML = '';
        history.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div class="history-info">
                    <a href="${item.shortUrl}" target="_blank" class="history-url">${item.shortUrl}</a>
                    <div class="history-date">${item.dateStr}</div>
                </div>
                <button class="mini-copy-btn" onclick="navigator.clipboard.writeText('${item.shortUrl}').then(() => alert('Shortened URL copied!'))">Copy</button>
            `;
            historyList.appendChild(div);
        });
    }

    function clearHistory() {
        if (confirm('Do you want to delete all history?')) {
            localStorage.removeItem('url_history');
            loadHistory();
            document.getElementById('qrContainer').innerHTML = `<span style="font-size: 0.8rem; color: #888;">Generate a link to view QR code</span>`;
        }
    }

    function resetAll() {
        document.getElementById('longUrl').value = '';
        document.getElementById('customSlug').value = '';
        document.getElementById('customCheck').checked = false;
        document.getElementById('customGroup').style.display = 'none';
        document.getElementById('resultBox').classList.remove('active');
        document.getElementById('errorMsg').classList.remove('active');
        document.getElementById('qrContainer').innerHTML = `<span style="font-size: 0.8rem; color: #888;">Generate a link to view QR code</span>`;
    }
</script>

</body>
</html>
