<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanzi Dictionary</title>
    <!-- Favicon settings -->
    <link rel="icon" type="image/png" href="https://sujinohkor.pages.dev/assets/LOGO-orange.png">
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }
                
        .app-container { display: flex; min-height: 100vh; width: 100%; }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar { 
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 1000; 
            display: flex; flex-direction: column; gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
            overflow-y: auto;
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        /* DAY/NIGHT 버튼 최상단 배치 스타일 (데스크톱용) */
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .search-container {
            display: flex;
            flex-direction: column;
            gap: 3px; /* 텍스트박스와 라벨 사이 여백 3px */
            margin-bottom: 5px;
        }
        .search-input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            border: 1px solid rgba(255, 158, 64, 0.35);
            border-radius: 50px;
            outline: none;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .search-input::placeholder { color: #888; }

        .control-group { display: flex; flex-direction: column; gap: 3px; margin-top: 5px; } /* 콤보박스 그룹도 동일하게 3px 여백 적용 */
        .control-label { font-size: 0.8rem; color: #ff9e40; font-weight: bold; padding-left: 5px; }

        select.search-input {
            cursor: pointer;
        }
        select.search-input option { background: #101010; color: #fff; }

        /* 메인 콘텐츠 영역 */
        .main-content { 
            margin-left: 300px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; 
            gap: 20px; overflow: hidden; transition: 0.3s; 
            width: calc(100% - 300px);
        }

        /* 3. Components */
        .menu-btn { 
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .top-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .top-btns > .menu-btn {
            margin-bottom: 0;
        }

        .bottom-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bottom-btns > .menu-btn {
            margin-bottom: 0;
        }

        .workspace-container {
            display: flex;
            flex-direction: row;
            flex: 1;
            gap: 20px;
            min-height: 0;
            position: relative;
        }

        /* 왼쪽 박스: URL 단축 폼 */
        .content-mid { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; display: flex; 
            padding: 25px; background: transparent; flex-direction: column; 
            gap: 20px; overflow-y: auto;
        }
                
        /* 오른쪽 박스: QR 코드 및 히스토리 (1:1 세로 분할) */
        .content-down { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; display: flex; flex-direction: column; 
            overflow: hidden; padding: 20px; background: transparent; gap: 15px; position: relative;
        }

        .calc-card {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1; /* 1:1 세로 공간 균등 분할 */
            min-height: 0;
            position: relative;
        }
        .calc-card h3 {
            font-size: 0.9rem;
            color: #ff9e40;
            flex-shrink: 0;
        }

        /* 텍스트박스와 라벨 배치 구조 개선 (라벨 위, 입력창 아래) */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }
        .input-group label {
            font-size: 0.85rem;
            color: #ff9e40;
            font-weight: 600;
        }
                
        .input-group input {
            width: 100%;
            padding: 12px 18px;
            background: #202020;
            border: 2px solid #ff9e40;
            color: #fff;
            border-radius: 50px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus {
            border-color: #ff9e40;
            box-shadow: 0 0 10px rgba(255, 158, 64, 0.3);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #ccc;
            cursor: pointer;
            margin-top: 5px;
        }
        .checkbox-group input {
            accent-color: #ff9e40;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .action-btn {
            background: #202020;
            color: #ff9e40;
            border: 2px solid #ff9e40;
            padding: 12px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-align: center;
        }
        .action-btn:hover { background: #ff9e40; color: #101010; }

        .result-box {
            background: #252525;
            border-radius: 12px;
            padding: 15px;
            font-size: 0.9rem;
            color: #fff;
            border: 1px dashed #444;
            display: none;
        }
        .result-box.active { display: block; }
        .result-url {
            color: #ff9e40;
            font-weight: bold;
            word-break: break-all;
            margin-bottom: 6px;
        }
        .created-at {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 10px;
        }
                
        /* 복사 버튼 색상 주황색 계열로 변경 */
        .copy-btn {
            background: #202020;
            color: #ff9e40;
            border: 2px solid #ff9e40;
            padding: 8px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        .copy-btn:hover { background: #ff9e40; color: #101010; }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.85rem;
            display: none;
        }
        .error-msg.active { display: block; }

        /* 히스토리 및 QR 세부 스타일 (QR 이미지 크기 확대) */
        .qr-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-height: 0;
        }
        .qr-wrapper img {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            background: #fff;
            padding: 6px;
        }
        .history-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .history-item {
            background: #252525;
            border: 1px solid #333;
            padding: 8px 10px;
            border-radius: 50px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding-left: 15px;
        }
        .history-info {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
        }
        .history-url {
            color: #ff9e40;
            font-weight: bold;
            text-decoration: none;
        }
        .history-url:hover { text-decoration: underline; }
        .history-date { color: #888; font-size: 0.7rem; }
                
        /* 미니 복사 버튼 색상 주황색 계열로 변경 */
        .mini-copy-btn {
            background: #202020;
            color: #ff9e40;
            border: 1px solid #ff9e40;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }
        .mini-copy-btn:hover { background: #ff9e40; color: #101010; }
                
        /* Clear All 버튼 디자인 */
        .clear-history-btn {
            background: transparent;
            border: 1px solid #ff9e40;
            color: #ff9e40;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .clear-history-btn:hover {
            background: #ff9e40;
            color: #101010;
        }

        /* 그림자 설정 */
        .calc-card, .content-mid, .content-down {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }
                
        body.light-mode .menu-btn, body.light-mode .theme-btn, body.light-mode .theme-toggle-btn { 
            background: rgba(0, 0, 0, 0.02); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.5); 
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover { 
            background: rgba(243, 128, 32, 0.15); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.4); 
        }

        body.light-mode .search-input {
            background: rgba(0, 0, 0, 0.02);
            color: #202020;
            border-color: rgba(243, 128, 32, 0.5);
        }
        body.light-mode .search-input::placeholder { color: #888; }
        body.light-mode select.search-input option { background: #fff; color: #202020; }

        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode .content-mid, body.light-mode .content-down, body.light-mode .calc-card {
            background-color: #fafafa;
            border-color: #F38020;
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15);
        }
        body.light-mode .input-group input { background: #FDF5E6; border-color: #e68a35; color: #000; }
        body.light-mode .input-group input:focus { border-color: #F38020; box-shadow: 0 0 10px rgba(243, 128, 32, 0.2); }
        body.light-mode .input-group label { color: #e68a35; }
        body.light-mode .result-box, body.light-mode .history-item { background: #fff; color: #000; border-color: #ccc; }
        body.light-mode .checkbox-group { color: #555; }
        body.light-mode .action-btn { background: #FDF5E6; color: #e68a35; border-color: #e68a35; }
        body.light-mode .action-btn:hover { background: #F38020; color: #fff; border-color: #F38020; }
                
        body.light-mode .copy-btn, body.light-mode .mini-copy-btn { background: #FDF5E6; color: #e68a35; border-color: #e68a35; }
        body.light-mode .copy-btn:hover, body.light-mode .mini-copy-btn:hover { background: #F38020; color: #fff; border-color: #F38020; }
                
        body.light-mode .clear-history-btn {
            background: transparent;
            border-color: #e68a35;
            color: #e68a35;
        }
        body.light-mode .clear-history-btn:hover {
            background: #F38020;
            color: #fff;
            border-color: #F38020;
        }
                
        body.light-mode .menu-toggle-btn { color: #ffffff; }

        body.light-mode .card, 
        body.light-mode .content-card {
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15);
        }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; color: #ffffff; }
        @media (max-width: 900px) {                    
            .menu-toggle-btn { display: block; }                    
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; 
            }                    
            body.light-mode .sidebar { 
                background: #ffffff !important; 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; 
            }
            .sidebar.active { transform: translateX(0); }                    
            .main-content { margin-left: 0; padding: 20px; width: 100vw; max-height: 100svh; overflow-y: auto; height: auto; }                    
            .workspace-container { flex-direction: column; overflow: visible; }                    
            .content-mid { height: auto; overflow: visible; flex: none; }                    
            .content-down { height: auto; overflow: visible; min-height: 400px; }        
        }
    </style>
</head>

                <div class="input-group">

                    </div>

                        <h3>Recent History</h3>
                        <button class="clear-history-btn" onclick="clearHistory()">Clear All</button>
                    </div>
                    <div class="history-list" id="historyList">

<script>
    const sidebar = document.getElementById('sidebar');
    function toggleSidebar() { sidebar.classList.toggle('active'); }

    document.getElementById('theme-toggle').addEventListener('click', () => { 
        document.body.classList.toggle('light-mode'); 
    });

    document.querySelector('.main-content').addEventListener('click', (e) => { 
        if (sidebar.classList.contains('active')) { sidebar.classList.remove('active'); }
    });

    document.addEventListener('DOMContentLoaded', loadHistory);

    function toggleCustomInput() {
        const isChecked = document.getElementById('customCheck').checked;
        document.getElementById('customGroup').style.display = isChecked ? 'block' : 'none';
    }

    async function shortenUrl() {
        const longUrl = document.getElementById('longUrl').value.trim();
        const isCustom = document.getElementById('customCheck').checked;
        const customSlug = document.getElementById('customSlug').value.trim().toLowerCase();
        const errorMsg = document.getElementById('errorMsg');
        const resultBox = document.getElementById('resultBox');

        errorMsg.classList.remove('active');
        resultBox.classList.remove('active');

        if (!longUrl) {
            errorMsg.innerText = 'Please enter a URL.';
            errorMsg.classList.add('active');
            return;
        }

        const nonAsciiRegex = /[^\x00-\x7F]/;
        if (nonAsciiRegex.test(longUrl)) {
            errorMsg.innerText = 'URLs cannot contain Korean or Unicode characters.';
            errorMsg.classList.add('active');
            return;
        }

        if (isCustom && customSlug) {
            const customRegex = /^[a-zA-Z0-9]{1,10}$/;
            if (!customRegex.test(customSlug)) {
                errorMsg.innerText = 'Custom URLs can only be a combination of English letters and numbers up to 10 digits, without special symbols or Unicode.';
                errorMsg.classList.add('active');
                return;
            }
        }

        try {
            const response = await fetch('https://sjoh.kr/api/shorten', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ url: longUrl, isCustom, slug: customSlug })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'An error has occurred.');
            }

            document.getElementById('resultUrl').innerText = data.shortUrl;
                    
            let formattedDate = '';
            if (data.createdAt) {
                const dateObj = new Date(data.createdAt);
                formattedDate = dateObj.toLocaleString('ko-KR', {
                    timeZone: 'Asia/Seoul',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                document.getElementById('createdAt').innerText = `Creation date & time: ${formattedDate} (Links are valid for 30 days)`;
            }

            resultBox.classList.add('active');

            const qrContainer = document.getElementById('qrContainer');
            qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(data.shortUrl)}" alt="QR Code">`;

            saveHistory(data.shortUrl, longUrl, formattedDate);
        } catch (err) {
            errorMsg.innerText = err.message;
            errorMsg.classList.add('active');
        }
    }

    function copyUrl() {
        const urlText = document.getElementById('resultUrl').innerText;
        navigator.clipboard.writeText(urlText).then(() => {
            alert('Shortened URL copied!');
        });
    }

    function saveHistory(shortUrl, longUrl, dateStr) {
        let history = JSON.parse(localStorage.getItem('url_history')) || [];
        history.unshift({ shortUrl, longUrl, dateStr });
        if (history.length > 10) history.pop();
        localStorage.setItem('url_history', JSON.stringify(history));
        loadHistory();
    }

    function loadHistory() {
        const historyList = document.getElementById('historyList');
        let history = JSON.parse(localStorage.getItem('url_history')) || [];

        if (history.length === 0) {
            historyList.innerHTML = `<div style="font-size: 0.8rem; color: #888; text-align: center; padding: 20px 0;">No history yet.</div>`;
            return;
        }

        historyList.innerHTML = '';
        history.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div class="history-info">
                    <a href="${item.shortUrl}" target="_blank" class="history-url">${item.shortUrl}</a>
                    <div class="history-date">${item.dateStr}</div>
                </div>
                <button class="mini-copy-btn" onclick="navigator.clipboard.writeText('${item.shortUrl}').then(() => alert('Shortened URL copied!'))">Copy</button>
            `;
            historyList.appendChild(div);
        });
    }

    function clearHistory() {
        if (confirm('Do you want to delete all history?')) {
            localStorage.removeItem('url_history');
            loadHistory();
            document.getElementById('qrContainer').innerHTML = `<span style="font-size: 0.8rem; color: #888;">Generate a link to view QR code</span>`;
        }
    }

    function resetAll() {
        document.getElementById('longUrl').value = '';
        document.getElementById('customSlug').value = '';
        document.getElementById('customCheck').checked = false;
        document.getElementById('customGroup').style.display = 'none';
        document.getElementById('resultBox').classList.remove('active');
        document.getElementById('errorMsg').classList.remove('active');
        document.getElementById('qrContainer').innerHTML = `<span style="font-size: 0.8rem; color: #888;">Generate a link to view QR code</span>`;
        document.getElementById('search-input').value = '';
        document.getElementById('filterBusu').value = '';
        document.getElementById('filterStrokes').value = '';
    }

    function filterNotes() {
        const keyword = document.getElementById('search-input').value.toLowerCase();
    }

    }
</script>
