<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Explainer</title>
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }
                
        .app-container { display: flex; min-height: 100vh; width: 100%; }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar { 
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 1000; 
            display: flex; flex-direction: column; gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        /* DAY/NIGHT 버튼 최상단 배치 스타일 */
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: #ff9e40; color: #101010; }

        /* 메인 콘텐츠 영역 */
        .main-content { 
            margin-left: 300px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; 
            gap: 20px; overflow: hidden; transition: 0.3s; 
            width: calc(100% - 300px);
        }

        .workspace-container {
            display: flex;
            flex-direction: row;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }

        /* 3. Components */
        .menu-btn { 
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .bottom-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bottom-btns > .menu-btn {
            margin-bottom: 0;
        }

        /* 공통 이미지/결과 컨테이너 (좌우 동일한 틀) */
        .content-box { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; display: flex; 
            padding: 20px; background: transparent; flex-direction: column; 
            align-items: center; justify-content: center; gap: 10px; text-align: center;
            overflow: hidden; position: relative;
            cursor: pointer;
        }
        .content-mid.dragover { background-color: rgba(255, 158, 64, 0.1); border-style: dashed; }
                
        .image-preview-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            position: relative;
        }
        .preview-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        .empty-msg {
            color: #888;
            font-family: 'Consolas', monospace;
            font-size: 1rem;
        }

        /* 오른쪽 결과 박스 내부 스타일 */
        .result-content {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 0.95rem;
            display: none;
        }

        #loading-msg {
            display: none;
            color: #ff9e40;
            font-weight: bold;
            font-size: 0.95rem;
            margin-top: 10px;
        }

        /* 다크 모드 그림자 */
        .card, .content-box {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }
        body.light-mode .menu-btn, body.light-mode .theme-toggle-btn { background: rgba(0, 0, 0, 0.02); color: #F38020; border-color: rgba(243, 128, 32, 0.5); }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover { background: #F38020; color: #ffffff; border-color: #F38020; }
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode .menu-toggle-btn { color: #ffffff; }
        body.light-mode .card, body.light-mode .content-box {
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15);
        }
        body.light-mode .empty-msg { color: #666; }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; color: #ffffff; }
                
        @media (max-width: 900px) {
            .menu-toggle-btn { display: block; }
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; 
            }
            body.light-mode .sidebar {
                background: #ffffff !important; 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; 
            }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px; width: 100vw; max-height: 100svh; overflow-y: auto; height: auto; }
            
            .workspace-container { 
                flex-direction: column; 
                flex: none;
                height: auto;
                min-height: auto;
                gap: 15px;
            }
            
            .content-box { 
                flex: none;
                min-height: 250px;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    <input type="file" id="file-selector" accept="image/*" style="display: none;">
    
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">AI Image Explainer</div>
            <div class="sidebar-top">
                <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
            </div>
            
            <button class="menu-btn" onclick="location.href='../index'">Home</button>

            <div class="bottom-btns">
                <button class="menu-btn" onclick="uploadFile()">Upload</button>
                <button class="menu-btn" onclick="resetAll()">Reset</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-section">
                <h1>AI Image Explainer</h1>
                <p>Upload an image to get a detailed explanation.</p>
            </header>

            <div class="workspace-container">
                <!-- 왼쪽 박스: 원본 사진 영역 -->
                <section class="content-box content-mid" id="drop-zone">
                    <div class="image-preview-container" id="original-container">
                        <div class="empty-msg">Drag & Drop an image file here or click to upload.</div>
                    </div>
                </section>
                <!-- 오른쪽 박스: AI 설명 결과 영역 -->
                <section class="content-box" id="result-zone">
                    <div class="image-preview-container" style="flex-direction: column; justify-content: center;">
                        <div class="empty-msg" id="result-placeholder">AI explanation will appear here.</div>
                        <div class="result-content" id="result-box"></div>
                    </div>
                    <div id="loading-msg">✨ AI is analyzing the image... ⏳</div>
                </section>
            </div>
        </main>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const dropZone = document.getElementById('drop-zone');
        const originalContainer = document.getElementById('original-container');
        const resultBox = document.getElementById('result-box');
        const resultPlaceholder = document.getElementById('result-placeholder');
        const fileSelector = document.getElementById('file-selector');
        const loadingMsg = document.getElementById('loading-msg');

        let selectedFile = null;

        window.toggleSidebar = function() { 
            sidebar.classList.toggle('active'); 
        }

        sidebar.querySelectorAll('button').forEach(element => {
            element.addEventListener('click', () => {
                if (window.innerWidth <= 900) {
                    if (element.id === 'file-selector') return;
                    sidebar.classList.remove('active');
                }
            });
        });

        document.getElementById('theme-toggle').addEventListener('click', () => { 
            document.body.classList.toggle('light-mode'); 
        });

        document.querySelector('.main-content').addEventListener('click', (e) => { 
            if (sidebar.classList.contains('active') && !e.target.closest('.sidebar') && !e.target.closest('.menu-toggle-btn')) { 
                sidebar.classList.remove('active'); 
            } 
        });

        function setInitialUI() {
            originalContainer.innerHTML = `<div class="empty-msg">Drag & Drop an image file here or click to upload.</div>`;
            resultPlaceholder.style.display = 'block';
            resultBox.style.display = 'none';
            resultBox.innerText = '';
            loadingMsg.style.display = 'none';
            fileSelector.value = '';
            selectedFile = null;
        }
        setInitialUI();

        async function processImage(file) {
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file.');
                return;
            }

            selectedFile = file;
            
            // 1. 원본 미리보기 표시
            const reader = new FileReader();
            reader.onload = (e) => {
                originalContainer.innerHTML = `<img src="${e.target.result}" alt="Original Preview" class="preview-img">`;
            };
            reader.readAsDataURL(file);

            resultPlaceholder.style.display = 'none';
            resultBox.style.display = 'none';
            resultBox.innerText = '';
            loadingMsg.style.display = 'block';

            try {
                // 2. [속도 개선] AI 전송용 이미지 압축 (최대 너비 500px, JPEG 화질 0.7)
                const compressedBlob = await resizeImage(file, 500, 0.7);

                const formData = new FormData();
                formData.append('image', compressedBlob, 'image.jpg');

                const workerUrl = 'https://image-explainer.sujinohkor.workers.dev';
                
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (data.response) {
                    resultBox.innerText = data.response;
                } else if (data.error) {
                    resultBox.innerText = `Error: ${data.error}`;
                } else {
                    resultBox.innerText = 'Failed to load the explanation.';
                }
                resultBox.style.display = 'block';
            } catch (err) {
                console.error(err);
                resultBox.innerText = 'An error occurred. Please try again.';
                resultBox.style.display = 'block';
            } finally {
                loadingMsg.style.display = 'none';
            }
        }

        // 브라우저 상에서 이미지를 빠르게 축소해 주는 헬퍼 함수
        function resizeImage(file, maxWidth, quality) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', quality);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => { 
            e.preventDefault(); 
            dropZone.classList.remove('dragover'); 
            const file = e.dataTransfer.files[0]; 
            processImage(file); 
        });

        dropZone.addEventListener('click', () => { fileSelector.click(); });

        window.uploadFile = function() {
            fileSelector.click();
        };

        fileSelector.addEventListener('change', (e) => {
            const file = e.target.files[0];
            processImage(file);
        });

        window.resetAll = function() {
            setInitialUI();
        };
    </script>
</body>
</html>
