<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Tower Defense - Fixed Map per Wave</title>
    <!-- Favicon settings -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; display: block; }                                   .app-container { display: flex; min-height: 100vh; width: 100%; position: relative; }
        
        /* 모바일 백드롭 오버레이 */        
        .sidebar-backdrop {            display: none;            position: fixed;            top: 0; left: 0; width: 100vw; height: 100vh;            background: rgba(0, 0, 0, 0.5);            z-index: 999;            opacity: 0;            transition: opacity 0.3s ease;        }

        /* 플로팅 사이드바 */        .sidebar {                         width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px;                         background: rgba(16, 16, 16, 0.25);                         backdrop-filter: blur(16px);                         -webkit-backdrop-filter: blur(16px);                        padding: 25px 20px; z-index: 1000;                         display: flex; flex-direction: column; gap: 12px;                         border: 1px solid rgba(255, 158, 64, 0.35);                         border-radius: 24px;                        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);                        transition: transform 0.3s ease, opacity 0.3s ease, background 0.3s, border 0.3s;            overflow-y: auto;                 }        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); border-color: rgba(255, 158, 64, 0.6); }
        
        .main-content {                         margin-left: 300px; padding: 40px; flex: 1;                         display: flex; flex-direction: column; height: 100vh;                         gap: 20px; overflow: hidden; transition: all 0.3s ease;                         width: calc(100% - 300px);        }
        
        .menu-section-title { font-size: 0.8rem; color: #ff9e40; font-weight: bold; margin-top: 5px; padding-left: 5px; letter-spacing: 0.5px; }
        .menu-btn {                         width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;                        background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35);                         border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;                        display: flex; align-items: center; justify-content: center; line-height: 1;       }        
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); border-color: rgba(255, 158, 64, 0.6); }        
        .menu-btn.active-tool { background: rgba(255, 158, 64, 0.35); color: #fff; border-color: #ff9e40; }
        
        .status-box { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 158, 64, 0.35); border-radius: 12px; padding: 12px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 6px; }
        .status-item { display: flex; justify-content: space-between; font-weight: bold; }

        .bottom-btns {                       display: flex;                       flex-direction: column;                       gap: 10px;        }

        /* 도트무늬 배경 적용 카드 */
        .content-card {                         
            border: 2px solid #ff9e40;                         
            border-radius: 16px;                         
            flex: 1;                         
            display: flex;                         
            overflow: hidden;                         
            background: radial-gradient(circle, #222 1px, transparent 1px) #101010;
            background-size: 20px 20px;
            position: relative;             
            transition: all 0.3s ease;       }
        
        .card-btn-group {            position: absolute;            top: 15px;            right: 15px;            z-index: 2001;            display: flex;            gap: 8px;        }
        .action-btn {                         background: #202020;                         color: #ff9e40;                         border: 1px solid #ff9e40;                         padding: 6px 14px;                         border-radius: 8px;                         cursor: pointer;                         font-size: 0.8rem;                         font-weight: bold;                         box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);                         transition: all 0.3s;       }        .action-btn:hover {                         background: #ff9e40;                         color: #101010;       }

        body.is-fullscreen .sidebar {            transform: translateX(-120%);            opacity: 0;            pointer-events: none;        }        body.is-fullscreen .main-content {            margin-left: 0 !important;            width: 100vw !important;            padding: 0 !important;            height: 100vh !important;        }        body.is-fullscreen .top-section {            display: none !important;        }        body.is-fullscreen .content-card {            position: fixed !important;            top: 0 !important;            left: 0 !important;            right: 0 !important;            bottom: 0 !important;            width: 100vw !important;            height: 100vh !important;            z-index: 9999 !important;            border-radius: 0 !important;            border: none !important;            padding: 0 !important;            margin: 0 !important;        }

        .effect-view {            display: block;            width: 100%;            height: 100%;            position: absolute;            top: 0;            left: 0;            background: transparent;            z-index: 15;        }
        .effect-canvas {            display: block;            width: 100%;            height: 100%;            cursor: crosshair;        }

        /* Light Mode */
        body.light-mode { background-color: #fff; color: #202020; }                
        body.light-mode .sidebar {                         background: rgba(255, 255, 255, 0.4);                         border-color: rgba(243, 128, 32, 0.35);                         box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15);                 }                         
        body.light-mode .menu-btn, body.light-mode .theme-toggle-btn {                         background: rgba(0, 0, 0, 0.02);                         color: #F38020;                         border-color: rgba(243, 128, 32, 0.5);         }        
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover {                         background: rgba(243, 128, 32, 0.15);                         border-color: rgba(243, 128, 32, 0.4);         }                         
        body.light-mode .menu-btn.active-tool { background: #F38020; color: #fff; }        
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }        
        body.light-mode .action-btn { background: #FDF5E6; color: #F38020; border-color: #F38020; }        
        body.light-mode .action-btn:hover { background: #F38020; color: #ffffff; }        
        body.light-mode .content-card { background: radial-gradient(circle, #ddd 1px, transparent 1px) #fff; background-size: 20px 20px; border-color: #F38020; box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15); }        
        body.light-mode .content-card.fullscreen { background: radial-gradient(circle, #ddd 1px, transparent 1px) #fff !important; background-size: 20px 20px !important; }

        .menu-toggle-btn {                         display: none; position: fixed; bottom: 20px; left: 20px; z-index: 4000;                         padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px;                         font-weight: bold; cursor: pointer; color: #ffffff;         }                 
        @media (max-width: 900px) {                         
            .menu-toggle-btn { display: block; }                         
            .sidebar {                                 transform: translateX(-320px);                                 background: #101010 !important;                                 backdrop-filter: none !important;                                -webkit-backdrop-filter: none !important;                                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important;                 z-index: 3000;             }                         
            body.light-mode .sidebar {                                background: #ffffff !important;                                 box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important;             }            
            .sidebar.active { transform: translateX(0); }                         
            .sidebar-backdrop.active { display: block; opacity: 1; }            
            .main-content { margin-left: 0; padding: 20px; width: 100vw; height: 100vh; }                         
            .content-card { min-height: 0; height: 100%; }        
        }    
    </style>
</head>
<body>    
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>
    
    <div class="app-container">
        <!-- 사이드바 (게임 패널) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">Tower Defense</div>
            <div class="sidebar-top">
                <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
            </div>                
            
            <a href="../index" class="menu-btn" style="margin-bottom: 5px;">Home</a>
            
            <div class="status-box">
                <div class="status-item"><span>Gold:</span> <span id="stat-gold" style="color: #ff9e40;">150</span></div>
                <div class="status-item"><span>Life:</span> <span id="stat-life" style="color: #ff4d4d;">10</span></div>
                <div class="status-item"><span>Wave:</span> <span id="stat-wave">1</span></div>
                <div class="status-item"><span>Map Style:</span> <span id="stat-map" style="color: #38bdf8;">Parametric</span></div>
            </div>

            <div class="menu-section-title">Build Tower (Cost: 50G)</div>
            <button class="menu-btn active-tool" id="btn-build" onclick="selectTool('BUILD', this)">Build Tower</button>
            
            <div class="menu-section-title" style="margin-top: 10px;">Game Control</div>
            <div class="bottom-btns">                           
                <button class="menu-btn" onclick="startWave()" id="btn-wave">Start Wave</button>
                <button class="menu-btn" onclick="resetGame()">Reset Game</button>
            </div>                
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content" id="main-content">                        
            <header class="top-section">                                
                <h1 id="effect-title">Mini Tower Defense</h1>
                <p id="effect-desc">The map stays fixed during waves. Click 'Reset Game' to generate a brand new map!</p>
            </header>                        
            <section class="content-card" id="content-card">                                
                <div class="card-btn-group">                    
                    <button class="action-btn" id="fullscreen-btn" onclick="toggleFullscreen()">Maximize ⛶</button>                                
                </div>

                <!-- 게임 캔버스 뷰어 -->                
                <div class="effect-view">                    
                    <canvas id="gameCanvas" class="effect-canvas"></canvas>                </div>
            </section>                
        </main>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        const mainContent = document.getElementById('main-content');
        const contentCard = document.getElementById('content-card');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        window.toggleFullscreen = function() {                        
            contentCard.classList.toggle('fullscreen');            
            document.body.classList.toggle('is-fullscreen');            
            if (contentCard.classList.contains('fullscreen')) {                                
                fullscreenBtn.textContent = 'Minimize 🗗';            
            } else {                                
                fullscreenBtn.textContent = 'Maximize ⛶';            
            }
            setTimeout(resizeCanvas, 50);
            setTimeout(resizeCanvas, 300);
        };

        function toggleSidebar() {                          
            const isActive = sidebar.classList.toggle('active');            
            if (isActive) {                
                backdrop.classList.add('active');            
            } else {                
                backdrop.classList.remove('active');            
            }
        }

        function closeSidebar() {            
            sidebar.classList.remove('active');            
            backdrop.classList.remove('active');        }

        document.getElementById('theme-toggle').addEventListener('click', () => {                          
            document.body.classList.toggle('light-mode');            
            if (window.innerWidth <= 900) closeSidebar();        });

        mainContent.addEventListener('click', () => {                          
            if (window.innerWidth <= 900 && sidebar.classList.contains('active')) {                                  
                closeSidebar();            }                 
        });

        /* --- 타워 디펜스 게임 로직 --- */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gold = 150;
        let life = 10;
        let wave = 1;
        let isWaveRunning = false;
        let spawnInterval = null;
        let spawnedCount = 0;
        let totalEnemiesInWave = 0;

        let towers = [];
        let enemies = [];
        let bullets = [];
        let waypoints = [];
        let mapTypeName = "Parametric";

        function generateMathMap() {
            const width = canvas.width || 800;
            const height = canvas.height || 500;
            
            waypoints = [];
            
            let startX = 50;
            let startY = Math.random() * (height - 200) + 100;
            let endX = width - 50;
            let endY = Math.random() * (height - 200) + 100;
            
            waypoints.push({ x: startX, y: startY });

            let steps = 7;
            let frequency = Math.random() * 2.5 + 1;
            let amplitude = Math.random() * 100 + 40;
            let phase = Math.random() * Math.PI * 2;

            for (let i = 1; i < steps; i++) {
                let t = i / steps;
                let x = startX + (endX - startX) * t;
                
                let baseY = (1 - t) * startY + t * endY;
                let y = baseY + Math.sin(t * Math.PI * frequency + phase) * amplitude + Math.cos(t * Math.PI * 2) * (amplitude * 0.3);
                
                y = Math.max(50, Math.min(height - 50, y));

                waypoints.push({ x: x, y: y });
            }

            waypoints.push({ x: endX, y: endY });
            
            mapTypeName = `Wave F:${frequency.toFixed(1)} A:${Math.round(amplitude)}`;
            document.getElementById('stat-map').innerText = mapTypeName;
        }

        class Tower {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.range = 120;
                this.cooldown = 0;
                this.maxCooldown = 25;
            }
            draw() {
                const isLight = document.body.classList.contains('light-mode');
                ctx.fillStyle = '#ff9e40';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = isLight ? '#202020' : '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = isLight ? '#ffffff' : '#101010';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                ctx.fill();
            }
            update() {
                if (this.cooldown > 0) this.cooldown--;

                let target = null;
                for (let enemy of enemies) {
                    let dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                    if (dist < this.range) {
                        target = enemy;
                        break;
                    }
                }

                if (target && this.cooldown === 0) {
                    bullets.push(new Bullet(this.x, this.y, target));
                    this.cooldown = this.maxCooldown;
                }
            }
        }

        class Enemy {
            constructor() {
                this.x = waypoints[0].x;
                this.y = waypoints[0].y;
                this.targetIndex = 1;
                this.speed = 1.5 + wave * 0.15;
                this.maxHp = 25 + wave * 12;
                this.hp = this.maxHp;
                this.radius = 10;
            }
            update() {
                let wp = waypoints[this.targetIndex];
                let dx = wp.x - this.x;
                let dy = wp.y - this.y;
                let dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    this.x = wp.x;
                    this.y = wp.y;
                    this.targetIndex++;
                    if (this.targetIndex >= waypoints.length) {
                        life--;
                        updateUI();
                        return true; 
                    }
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
                return false;
            }
            draw() {
                ctx.fillStyle = '#ff4d4d';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#333';
                ctx.fillRect(this.x - 12, this.y - 18, 24, 4);
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(this.x - 12, this.y - 18, 24 * (this.hp / this.maxHp), 4);
            }
        }

        class Bullet {
            constructor(x, y, target) {
                this.x = x;
                this.y = y;
                this.target = target;
                this.speed = 6;
                this.damage = 15;
            }
            update() {
                if (!this.target || this.target.hp <= 0) return true;

                let dx = this.target.x - this.x;
                let dy = this.target.y - this.y;
                let dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    this.target.hp -= this.damage;
                    if (this.target.hp <= 0) {
                        gold += 12;
                        updateUI();
                    }
                    return true; 
                }

                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
                return false;
            }
            draw() {
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 기존 스크립트 내 적당한 위치에 추가
        function selectTool(toolName, btnElement) {
            document.querySelectorAll('.menu-btn').forEach(btn => {
                if (btn.id.startsWith('btn-')) btn.classList.remove('active-tool');
            });
            if (btnElement) btnElement.classList.add('active-tool');
        
            // 모바일 환경(폭 900px 이하)인 경우 사이드바 자동 닫기
            if (window.innerWidth <= 900) {
                closeSidebar();
            }
        }
        
        function startWave() {
            if (isWaveRunning) return;
            
            isWaveRunning = true;
            spawnedCount = 0;
            totalEnemiesInWave = 5 + wave * 2;

            // 버튼 즉시 비활성화 및 잠금 처리
            const waveBtn = document.getElementById('btn-wave');
            waveBtn.disabled = true;
            waveBtn.style.opacity = '0.4';
            waveBtn.style.cursor = 'not-allowed';

            spawnInterval = setInterval(() => {
                enemies.push(new Enemy());
                spawnedCount++;
                if (spawnedCount >= totalEnemiesInWave) {
                    clearInterval(spawnInterval);
                }
            }, 900);

            // ★ 이 부분을 추가합니다 (모바일 화면에서 웨이브 시작 시 사이드바 닫기)
            if (window.innerWidth <= 900) {
                closeSidebar();
            }
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (gold >= 50) {
                let canBuild = true;
                for (let t of towers) {
                    if (Math.hypot(t.x - x, t.y - y) < 30) {
                        canBuild = false;
                        break;
                    }
                }

                if (canBuild) {
                    towers.push(new Tower(x, y));
                    gold -= 50;
                    updateUI();
                }
            }
        });

        function updateUI() {
            document.getElementById('stat-gold').innerText = gold;
            document.getElementById('stat-life').innerText = life;
            document.getElementById('stat-wave').innerText = wave;
        }

        function resetGame() {
            if (spawnInterval) clearInterval(spawnInterval);
            gold = 150;
            life = 10;
            wave = 1;
            isWaveRunning = false;
            spawnedCount = 0;
            totalEnemiesInWave = 0;
            towers = [];
            enemies = [];
            bullets = [];
            
            const waveBtn = document.getElementById('btn-wave');
            waveBtn.disabled = false;
            waveBtn.style.opacity = '1';
            waveBtn.style.cursor = 'pointer';

            generateMathMap(); 
            updateUI();
            if (window.innerWidth <= 900) closeSidebar();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (waypoints.length > 0) {
                ctx.strokeStyle = 'rgba(255, 158, 64, 0.25)';
                ctx.lineWidth = 24;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(waypoints[0].x, waypoints[0].y);
                for (let i = 1; i < waypoints.length; i++) {
                    ctx.lineTo(waypoints[i].x, waypoints[i].y);
                }
                ctx.stroke();
            }

            towers.forEach(t => {
                t.update();
                t.draw();
            });

            for (let i = enemies.length - 1; i >= 0; i--) {
                let reachedEnd = enemies[i].update();
                if (reachedEnd || enemies[i].hp <= 0) {
                    enemies.splice(i, 1);
                } else {
                    enemies[i].draw();
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let hit = bullets[i].update();
                if (hit) {
                    bullets.splice(i, 1);
                } else {
                    bullets[i].draw();
                }
            }

            // 웨이브 클리어 조건: 모든 적이 스폰되었고(spawnedCount >= totalEnemiesInWave), 남은 적이 0명일 때만 해제
            if (isWaveRunning && spawnedCount >= totalEnemiesInWave && enemies.length === 0) {
                isWaveRunning = false;
                wave++;
                gold += 60; 
                
                const waveBtn = document.getElementById('btn-wave');
                waveBtn.disabled = false;
                waveBtn.style.opacity = '1';
                waveBtn.style.cursor = 'pointer';

                updateUI();
            }

            if (life <= 0) {
                alert("Game Over! Try again.");
                resetGame();
            }

            requestAnimationFrame(gameLoop);
        }

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            if (waypoints.length === 0) {
                generateMathMap(); 
            }
        }

        window.addEventListener('load', () => {
            resizeCanvas();
            gameLoop();
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
        });
    </script>
</body>
</html>
