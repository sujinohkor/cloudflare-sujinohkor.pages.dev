<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator</title>
    <!-- 파비콘 설정 추가 -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }

        .app-container { display: flex; min-height: 100vh; width: 100%; }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar { 
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 2000; 
            display: flex; flex-direction: column; gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        /* DAY/NIGHT 버튼 최상단 배치 스타일 (데스크톱용) */
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* 메인 콘텐츠 영역 */
        .main-content { 
            margin-left: 300px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; 
            gap: 20px; overflow: hidden; transition: 0.3s; 
            width: calc(100% - 300px);
        }

        /* 3. Components */
        .menu-btn { 
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* 통계 패널(카드) 스타일 */
        .info-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 158, 64, 0.25);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #ccc;
        }
        .info-row span:last-child {
            color: #ff9e40;
            font-weight: bold;
        }

        .bottom-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bottom-btns > .menu-btn {
            margin-bottom: 0;
        }

        .content-top { 
            flex: 2; border: 2px solid #ff9e40; border-radius: 16px; 
            display: flex; overflow: hidden; background: rgba(0, 0, 0, 0.2); 
            position: relative; 
        }

        .content-down { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; 
            display: flex; overflow: hidden; background: rgba(0, 0, 0, 0.2); 
        }

        textarea { 
            flex: 1; padding: 20px; background: transparent; border: none; 
            color: #fff; font-family: 'Consolas', sans-serif; 
            font-size: 1rem; resize: none; outline: none; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
        }

        /* Controls */
        .qr-generator-controls, .qr-decoder-controls { 
            background: rgba(255, 255, 255, 0.02); 
            padding: 20px; display: flex; flex-direction: column; gap: 15px; 
            align-items: center; justify-content: flex-start; flex-shrink: 0; overflow-y: auto; 
        }
        .qr-generator-controls { width: auto; min-width: 500px; min-height: 500px; border-left: 2px dashed rgba(255, 158, 64, 0.35); }
        .qr-decoder-controls { width: auto; min-width: 300px; min-height: 200px; border-right: 2px dashed rgba(255, 158, 64, 0.35); }

        .button-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .decoder-button-group { display: flex; gap: 10px; justify-content: center; flex-direction: column; align-items: center; }

        .action-btn { 
            width: 100px; padding: 10px; cursor: pointer; 
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; 
            border: 1px solid rgba(255, 158, 64, 0.35); border-radius: 50px; 
            font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
        }
        .action-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        #qr-image { max-width: 100%; margin-top: 10px; border: none; display: none; }
        #file-name { color: #888; font-size: 0.85rem; }
        .load-image-container { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

        /* 다크 모드 카드/패널 그림자 */
        .card, .content-top, .content-down { 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5); 
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }
        body.light-mode .menu-btn, body.light-mode .theme-toggle-btn, body.light-mode .action-btn { 
            background: rgba(0, 0, 0, 0.02); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.5); 
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover, body.light-mode .action-btn:hover { 
            background: rgba(243, 128, 32, 0.15); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.4); 
        }
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode textarea { color: #000; }
        body.light-mode .menu-toggle-btn { color: #ffffff; }
        body.light-mode .content-top, body.light-mode .content-down { background: rgba(255, 255, 255, 0.5); border-color: #F38020; }
        body.light-mode .qr-generator-controls, body.light-mode .qr-decoder-controls { background: rgba(0, 0, 0, 0.02); border-color: rgba(243, 128, 32, 0.5); }
        body.light-mode .info-panel {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(243, 128, 32, 0.5);
        }
        body.light-mode .info-row { color: #202020; }
        body.light-mode .info-row span:last-child { color: #F38020; }
        body.light-mode .card, body.light-mode .content-top, body.light-mode .content-down { 
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15); 
        }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { 
            display: none; position: fixed; bottom: 20px; left: 20px; z-index: 3000; 
            padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; 
            font-weight: bold; cursor: pointer; color: #ffffff; 
        }

        @media (max-width: 900px) { 
            .menu-toggle-btn { display: block; } 
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; 
            } 
            body.light-mode .sidebar { 
                background: #ffffff !important; 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; 
            }
            .sidebar.active { transform: translateX(0); } 
            .main-content { margin-left: 0; padding: 20px; width: 100vw; max-height: 100svh; } 
            .content-top, .content-down { flex-direction: column; overflow-y: visible; }
            .qr-generator-controls { flex-direction: row; width: 100%; min-width: 0; min-height: auto; border-left: none; border-top: 2px dashed rgba(255, 158, 64, 0.35); align-items: flex-start; justify-content: flex-start; gap: 20px; padding: 20px; }
            body.light-mode .qr-generator-controls { border-top-color: rgba(243, 128, 32, 0.5); }
            .button-group { flex-direction: column; width: 100px; }
            .action-btn { width: 100px; margin-bottom: 5px; }
            #placeholder-container { width: calc(100% - 120px); height: 100%; flex-grow: 1; display: flex; flex-direction: column; align-items: flex-start; }
            #qr-image { width: 150px; height: 150px; margin-top: 0; }
            #text-input { min-height: 150px; }
            .qr-decoder-controls { width: 100%; min-height: 0; height: auto; border-right: none; border-bottom: 2px dashed rgba(255, 158, 64, 0.35); display: flex; flex-direction: column; align-items: flex-start; padding: 20px; gap: 10px; }
            body.light-mode .qr-decoder-controls { border-bottom-color: rgba(243, 128, 32, 0.5); }
            .load-image-container { flex-direction: row; justify-content: flex-start; }
            .decoder-button-group { flex-direction: row; justify-content: flex-start; }
            #file-name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            #resultText { border-top: none !important; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">QR Generator</div>
            <div class="sidebar-top">
                <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
            </div>

            <button class="menu-btn" onclick="location.href='../index'">Home</button>

            <div class="info-panel">
                <div class="info-row">
                    <span>Byte Count</span>
                    <span id="byte-count">0/1000 B</span>
                </div>
            </div>
        </aside>

        <main class="main-content" id="main-content">
            <header class="top-section">
                <h1>QR Generator</h1>
                <p>You can make your own QR, etc.</p>
            </header>

            <section class="content-top">
                <textarea id="text-input" placeholder="Enter text or url here. Maximum 1,000 bytes."></textarea>
                <div class="qr-generator-controls">
                    <div class="button-group">
                        <button class="action-btn" onclick="generateQR()">Generate</button>
                        <button class="action-btn" onclick="saveQR()">Save QR</button>
                        <button class="action-btn" onclick="resetGenerator()">Reset</button>
                    </div>
                    <img id="qr-image" alt="QR">
                    <div id="placeholder-container">
                        <div id="qr-placeholder" style="color: #888;">QR will be here.</div>
                    </div>
                </div>
            </section>

            <section class="content-down">
                <div class="qr-decoder-controls">
                    <div class="load-image-container">
                        <button class="action-btn" onclick="document.getElementById('fileInput').click()">Load Image</button>
                        <span id="file-name">No file chosen</span>
                    </div>
                    <div class="decoder-button-group">
                        <button class="action-btn" onclick="decodeQR()">Decode QR</button>
                        <button class="action-btn" onclick="resetDecoder()">Reset</button>
                    </div>
                </div>
                <textarea id="resultText" readonly placeholder="Decoded text will appear here."></textarea>
            </section>
        </main>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const qrImage = document.getElementById('qr-image');
        const qrPlaceholder = document.getElementById('qr-placeholder');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('file-name');
        const resultText = document.getElementById('resultText');
        const byteCountDisplay = document.getElementById('byte-count');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');

        document.getElementById('theme-toggle').addEventListener('click', () => document.body.classList.toggle('light-mode'));
        
        function toggleSidebar() { 
            sidebar.classList.toggle('active'); 
        }

        sidebar.querySelectorAll('button').forEach(element => {
            element.addEventListener('click', () => {
                if (window.innerWidth <= 900) {
                    sidebar.classList.remove('active');
                }
            });
        });

        mainContent.addEventListener('click', () => { 
            if (sidebar.classList.contains('active')) { 
                sidebar.classList.remove('active'); 
            } 
        });

        function updateByteCount() {
            const encoder = new TextEncoder();
            let text = textInput.value;
            if (encoder.encode(text).length > 1000) {
                while (encoder.encode(text).length > 1000) text = text.slice(0, -1);
                textInput.value = text;
            }
            byteCountDisplay.textContent = encoder.encode(text).length + '/1000 B';
        }
        textInput.addEventListener('input', updateByteCount);

        async function generateQR() {
            updateByteCount();
            const text = textInput.value.trim();
            if (!text) return alert("Please enter text first.");

            const url = `https://api.qrserver.com/v1/create-qr-code/?size=350x350&data=${encodeURIComponent(text)}`;
            try {
                const response = await fetch(url);
                if (response.ok) {
                    qrImage.src = url;
                    qrImage.style.display = "inline-block";
                    qrPlaceholder.style.display = "none";
                } else {
                    alert("Failed to generate QR.");
                }
            } catch (e) {
                alert("An error occurred.");
            }
        }

        async function saveQR() {
            if (!qrImage.src || qrImage.style.display === 'none') return alert("Please generate a QR first.");
            const response = await fetch(qrImage.src);
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'QRGenerator.png';
            link.click();
        }

        function resetGenerator() {
            textInput.value = '';
            qrImage.style.display = 'none';
            qrPlaceholder.style.display = 'block';
            updateByteCount();
        }

        function resetDecoder() {
            fileInput.value = '';
            fileName.innerText = "No file chosen";
            resultText.value = '';
        }

        fileInput.addEventListener('change', (e) => { 
            if (e.target.files[0]) fileName.innerText = e.target.files[0].name; 
        });

        async function decodeQR() {
            const file = fileInput.files[0];
            if (!file) return alert("Please load a QR first.");
            const formData = new FormData();
            formData.append('file', file);
            try {
                const response = await fetch('https://api.qrserver.com/v1/read-qr-code/', { method: 'POST', body: formData });
                const data = await response.json();
                resultText.value = data[0]?.symbol[0]?.data || "QR not found.";
            } catch { 
                alert("Failed to decode."); 
            }
        }
    </script>
</body>
</html>
