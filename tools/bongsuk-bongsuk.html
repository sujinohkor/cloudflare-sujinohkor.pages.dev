<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이것은 봉숙이인가?</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #ff6b6b; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 20px; }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background-color: #ff6b6b;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
            transition: background 0.3s;
        }
        .upload-btn:hover { background-color: #ff5252; }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 20px;
            border-radius: 10px;
            display: none;
        }
        #result {
            margin-top: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .loading {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🐾 봉숙이 판별기 🐾</h1>
        <p>사진을 업로드하면 이 사진이 '봉숙이'인지 판별해 드립니다!</p>

        <!-- 파일 업로드 버튼 -->
        <label for="imageInput" class="upload-btn">사진 선택하기</label>
        <input type="file" id="imageInput" accept="image/*">

        <div>
            <img id="preview" alt="미리보기">
        </div>

        <div id="result"></div>
    </div>
    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const resultDiv = document.getElementById('result');

        // 본인의 워커 주소 확인 (끝에 슬래시 / 포함)
        const WORKER_URL = 'https://여기에-본인-워커주소.workers.dev/';

        // 🔥 최대 크기를 400픽셀로 대폭 줄여서 토큰 초과 방지
        function resizeImage(file, maxDimension = 400) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxDimension) {
                                height *= maxDimension / width;
                                width = maxDimension;
                            }
                        } else {
                            if (height > maxDimension) {
                                width *= maxDimension / height;
                                height = maxDimension;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                        }, 'image/jpeg', 0.7); // 화질 70%로 가볍게 압축
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        imageInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            resultDiv.className = 'loading';
            resultDiv.innerText = '사진을 가볍게 압축하고 분석 중입니다... 🔄';

            try {
                // 1. 400픽셀 이하로 강력 리사이즈
                const resizedFile = await resizeImage(file, 400);

                // 2. 미리보기 표시
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(resizedFile);

                // 3. 서버로 전송할 FormData 생성
                const formData = new FormData();
                formData.append('image', resizedFile);

                // 4. 워커로 전송
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = '';
                    resultDiv.innerText = data.response || JSON.stringify(data);
                } else {
                    resultDiv.className = '';
                    resultDiv.innerText = `에러 발생: ${data.error || '알 수 없는 오류'}`;
                }
            } catch (error) {
                resultDiv.className = '';
                resultDiv.innerText = `처리 실패: ${error.message}`;
            }
        });
    </script>
</body>
</html>
