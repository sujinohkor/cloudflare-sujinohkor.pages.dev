<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이것은 봉숙이인가?</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #ff6b6b; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 20px; }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background-color: #ff6b6b;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
            transition: background 0.3s;
        }
        .upload-btn:hover { background-color: #ff5252; }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 20px;
            border-radius: 10px;
            display: none;
        }
        #result {
            margin-top: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .loading {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🐾 봉숙이 판별기 🐾</h1>
        <p>사진을 업로드하면 이 사진이 '봉숙이'인지 판별해 드립니다!</p>

        <!-- 파일 업로드 버튼 -->
        <label for="imageInput" class="upload-btn">사진 선택하기</label>
        <input type="file" id="imageInput" accept="image/*">

        <div>
            <img id="preview" alt="미리보기">
        </div>

        <div id="result"></div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const resultDiv = document.getElementById('result');

        // 🔥 여기에 방금 만든 새로운 워커 주소를 넣어주세요!
        const WORKER_URL = 'https://bongsuk-checker.sujinohkor.workers.dev';

        imageInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            // 1. 이미지 미리보기 띄우기
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);

            // 2. 결과창 초기화 및 로딩 표시
            resultDiv.className = 'loading';
            resultDiv.innerText = '봉숙이의 흔적을 분석하는 중... 🤔';

            // 3. 서버(Worker)로 전송할 FormData 생성
            const formData = new FormData();
            formData.append('image', file);

            try {
                // 4. 워커에 POST 요청 보내기
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = '';
                    // AI가 응답한 텍스트 출력
                    resultDiv.innerText = data.response || JSON.stringify(data);
                } else {
                    resultDiv.className = '';
                    resultDiv.innerText = `에러 발생: ${data.error || '알 수 없는 오류'}`;
                }
            } catch (error) {
                resultDiv.className = '';
                resultDiv.innerText = `서버 통신 실패: ${error.message}`;
            }
        });
    </script>

</body>
</html>
