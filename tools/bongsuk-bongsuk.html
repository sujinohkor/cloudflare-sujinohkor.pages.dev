<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이것은 봉숙이인가?</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #ff6b6b; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 20px; }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background-color: #ff6b6b;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
            transition: background 0.3s;
        }
        .upload-btn:hover { background-color: #ff5252; }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 20px;
            border-radius: 10px;
            display: none;
        }
        #result {
            margin-top: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .loading {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🐾 봉숙이 판별기 🐾</h1>
        <p>사진을 업로드하면 이 사진이 '봉숙이'인지 판별해 드립니다!</p>

        <!-- 파일 업로드 버튼 -->
        <label for="imageInput" class="upload-btn">사진 선택하기</label>
        <input type="file" id="imageInput" accept="image/*">

        <div>
            <img id="preview" alt="미리보기">
        </div>

        <div id="result"></div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const resultDiv = document.getElementById('result');

        // 🔥 본인의 워커 주소로 정확히 입력해주세요 (끝에 슬래시 / 포함)
        const WORKER_URL = 'https://bongsuk-checker.sujinohkor.workers.dev/';

        imageInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            resultDiv.className = 'loading';
            resultDiv.innerText = '사진을 압축하고 분석 중입니다... 🔄';

            try {
                // 1. 이미지를 로드해서 확실하게 300픽셀 크기로 줄이기 (토큰 폭탄 원천 차단)
                const compressedFile = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const max = 300; // 크기를 300px로 고정하여 용량을 수십 KB 수준으로 압축
                            let w = img.width;
                            let h = img.height;
                            
                            if (w > h) {
                                if (w > max) { h *= max / w; w = max; }
                            } else {
                                if (h > max) { w *= max / h; h = max; }
                            }

                            canvas.width = w;
                            canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);

                            canvas.toBlob((blob) => {
                                resolve(new File([blob], "compressed.jpg", { type: 'image/jpeg' }));
                            }, 'image/jpeg', 0.6);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });

                // 2. 미리보기 표시
                const previewReader = new FileReader();
                previewReader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                previewReader.readAsDataURL(compressedFile);

                // 3. 서버로 전송할 FormData 생성
                const formData = new FormData();
                formData.append('image', compressedFile);

                // 4. 워커로 전송
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = '';
                    resultDiv.innerText = data.response || JSON.stringify(data);
                } else {
                    resultDiv.className = '';
                    resultDiv.innerText = `에러 발생: ${data.error || '알 수 없는 오류'}`;
                }
            } catch (error) {
                resultDiv.className = '';
                resultDiv.innerText = `처리 실패: ${error.message}`;
            }
        });
    </script>

</body>
</html>
