<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <style>
        /* 1. Reset & Base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #202020; color: #fff; transition: background 0.3s; }
                
        /* 2. Layout */
        .app-container { display: flex; min-height: 100vh; }
        .sidebar { 
            width: 250px; height: 100vh; position: fixed; left: 0; top: 0; 
            background-color: #101010; padding: 20px; z-index: 1000; 
            display: flex; flex-direction: column; transition: transform 0.3s ease;
        }
        .main-content { 
            margin-left: 250px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; gap: 20px; overflow: hidden; transition: 0.3s;
        }

        /* 3. Components */
        .menu-btn, .theme-btn { 
            width: 100%; padding: 10px; margin-bottom: 10px; cursor: pointer;
            background: #202020; color: #ff9e40; border: 2px solid #ff9e40; 
            border-radius: 50px; font-weight: bold; transition: all 0.3s;
        }
        .menu-btn:hover { background: #ff9e40; color: #101010; }
        .theme-btn:hover { background-color: #FDF5E6; color: #F38020; border-color: #FDF5E6; }

        .content-top { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(255, 158, 64, 0.02); min-height: 140px; padding: 15px; position: relative;
        }
        .time-title { font-size: 1.1rem; color: #ff9e40; margin-bottom: 8px; font-weight: bold; letter-spacing: 1px; }
        .time-display { font-size: 5rem; font-weight: bold; font-family: 'Consolas', monospace; color: #fff; text-align: center; width: 100%; word-break: break-all; line-height: 1.1; }
        .time-sub-group { margin-top: 8px; text-align: center; display: flex; gap: 12px; align-items: center; justify-content: center; }
        .time-sub { font-size: 1.1rem; color: #aaa; }
        .time-zone-sub { font-size: 1.1rem; color: #ff9e40; font-family: 'Consolas', monospace; font-weight: bold; }

        .content-down { 
            flex: 2; display: flex; flex-direction: row; gap: 20px; overflow: hidden; 
        }
        
        /* Half-box 기본 스타일 설정 */
        .half-box { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; 
            overflow: hidden; display: flex; flex-direction: column; position: relative;
            background: rgba(255, 158, 64, 0.02); padding: 20px; align-items: center; justify-content: center;
        }

        /* 전체화면 버튼 스타일 (우측 상단 고정) */
        .fullscreen-btn { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            z-index: 10000; 
            background: #202020; 
            color: #ff9e40; 
            border: 1px solid #ff9e40; 
            padding: 6px 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.8rem; 
            font-weight: bold; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); 
            transition: all 0.3s; 
        }
        .fullscreen-btn:hover { 
            background: #ff9e40; 
            color: #101010; 
        }

        /* 전체화면 활성화 클래스 (공통) */
        .content-top.fullscreen, .half-box.fullscreen { 
            position: fixed !important; 
            top: 0 !important; 
            left: 0 !important; 
            right: 0 !important; 
            bottom: 0 !important; 
            width: 100vw !important; 
            height: 100vh !important; 
            z-index: 9999 !important; 
            border-radius: 0 !important; 
            border: none !important; 
            padding: 40px !important; 
            margin: 0 !important; 
            background: #202020 !important; 
        }

        /* 전체화면 상태일 때 다른 박스들의 버튼을 숨기는 클래스 */
        body.has-fullscreen .fullscreen-btn:not(.active-fullscreen) {
            display: none !important;
        }

        .box-title { font-size: 1.1rem; color: #ff9e40; font-weight: bold; margin-bottom: 15px; letter-spacing: 1px; }
        .tool-display { font-size: 5rem; font-weight: bold; font-family: 'Consolas', monospace; color: #fff; margin-bottom: 20px; text-align: center; line-height: 1.1; }
        
        .timer-inputs { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
        .timer-inputs input {
            width: 90px; height: 80px; background: #151515; border: 2px solid #ff9e40; border-radius: 12px;
            color: #fff; font-size: 3rem; font-family: 'Consolas', monospace; text-align: center; outline: none;
        }
        .timer-inputs span { font-size: 3rem; font-weight: bold; color: #ff9e40; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 100%; }
        .control-btn {
            padding: 10px 24px; background: #202020; color: #ff9e40; border: 2px solid #ff9e40;
            border-radius: 20px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem;
        }
        .control-btn:hover { background: #ff9e40; color: #101010; }

        .laps-container {
            width: 100%; max-height: 120px; overflow-y: auto; margin-top: 15px; border-top: 1px solid rgba(255, 158, 64, 0.2);
            padding-top: 10px; font-family: 'Consolas', monospace; font-size: 0.95rem; color: #ccc; display: flex; flex-direction: column; gap: 5px; align-items: center;
        }

        /* 다크 모드 카드/패널 그림자 */
        .card, .content-mid, .content-down, .content-top, .half-box {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; }
        body.light-mode .sidebar { background-color: #FDF5E6; box-shadow: 4px 0 15px rgba(0, 0, 0, 0.05); }
        body.light-mode .menu-btn, body.light-mode .theme-btn { background: #FDF5E6; color: #F38020; border-color: #F38020; }
        body.light-mode .menu-btn:hover { background: #F38020; color: #ffffff; border-color: #F38020; }
        body.light-mode .theme-btn:hover { background-color: #202020; color: #ff9e40; border-color: #202020; }
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode .time-display, body.light-mode .tool-display { color: #000; }
        body.light-mode .menu-toggle-btn { color: #000000; }
        body.light-mode .time-sub { color: #555; }
        body.light-mode .timer-inputs input { background: #fff; color: #000; }
        body.light-mode .content-top.fullscreen, body.light-mode .half-box.fullscreen { background: #fff !important; }

        /* 데이 모드 컨트롤 버튼 색상 통일 */
        body.light-mode .control-btn {
            background: #FDF5E6;
            color: #F38020;
            border-color: #F38020;
        }
        body.light-mode .control-btn:hover {
            background: #F38020;
            color: #ffffff;
        }

        body.light-mode .fullscreen-btn { 
            background: #FDF5E6; 
            color: #F38020; 
            border-color: #F38020; 
        }
        body.light-mode .fullscreen-btn:hover { 
            background: #F38020; 
            color: #ffffff; 
        }

        body.light-mode .card, 
        body.light-mode .content-mid, 
        body.light-mode .content-down,
        body.light-mode .content-top,
        body.light-mode .half-box {
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15);
        }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }
        
        @media (max-width: 768px) {
            .menu-toggle-btn { display: block; color: #ffffff; }
            .sidebar { transform: translateX(-250px); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 15px; width: 100%; overflow-y: auto; height: auto; }
            .content-top { min-height: 120px; padding: 10px; }
            .time-display { font-size: 2.3rem; }
            .content-down { flex-direction: column; flex: none; height: auto; min-height: auto; gap: 15px; }
            .half-box { padding: 15px 10px; }
            .tool-display { font-size: 2.5rem; margin-bottom: 15px; }
            .timer-inputs input { width: 55px; height: 50px; font-size: 1.6rem; border-radius: 8px; }
            .timer-inputs span { font-size: 1.6rem; }
            .control-btn { padding: 6px 12px; font-size: 0.75rem; border-radius: 15px; border-width: 1.5px; }
            .btn-group { gap: 5px; }
            .fullscreen-btn { padding: 4px 10px; font-size: 0.7rem; top: 10px; right: 10px; }
        }
    </style>
</head>
<body>
<button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <button class="menu-btn" onclick="location.href='../index'">Home</button>
        <button id="theme-toggle" class="theme-btn">DAY / NIGHT</button>
        <div class="bottom-btns">
            <button class="menu-btn" onclick="fetchIPInfo()">Refresh Clock</button>
        </div>
    </aside>
    <main class="main-content">
        <header class="top-section">
            <h1>Clock</h1>
            <p>Live world clock, customizable timer, and stopwatch.</p>
        </header>
        
        <!-- Current Time Box -->
        <section class="content-top" id="time-box">
            <button class="fullscreen-btn" id="time-fullscreen-btn" onclick="toggleTimeFullscreen()">Maximize ⛶</button>
            <div class="time-title" id="time-title">CURRENT TIME (IP)</div>
            <div class="time-display" id="current-time">Loading...</div>
            <div class="time-sub-group">
                <span class="time-sub" id="time-sub-label">Syncing timezone...</span>
                <span class="time-zone-sub" id="time-zone-sub"></span>
            </div>
        </section>

        <section class="content-down">
            <!-- 왼쪽 박스: 타이머 (99:59:59 지원) -->
            <div class="half-box" id="timer-box">
                <button class="fullscreen-btn" id="timer-fullscreen-btn" onclick="toggleTimerFullscreen()">Maximize ⛶</button>
                <div class="box-title">TIMER (Max 99:59:59)</div>
                <div class="timer-inputs" id="timer-input-area">
                    <input type="number" id="t-hour" min="0" max="99" value="00" placeholder="HH">
                    <span>:</span>
                    <input type="number" id="t-min" min="0" max="59" value="05" placeholder="MM">
                    <span>:</span>
                    <input type="number" id="t-sec" min="0" max="59" value="00" placeholder="SS">
                </div>
                <div class="tool-display" id="timer-display" style="display: none;">00:05:00</div>
                <div class="btn-group">
                    <button class="control-btn" id="timer-start-btn" onclick="startTimer()">Start</button>
                    <button class="control-btn" onclick="pauseTimer()">Pause</button>
                    <button class="control-btn" onclick="resetTimer()">Reset</button>
                </div>
            </div>
            <!-- 오른쪽 박스: 스톱워치 -->
            <div class="half-box" id="stopwatch-box">
                <button class="fullscreen-btn" id="stopwatch-fullscreen-btn" onclick="toggleStopwatchFullscreen()">Maximize ⛶</button>
                <div class="box-title">STOPWATCH</div>
                <div class="tool-display" id="stopwatch-display">00:00:00</div>
                <div class="btn-group">
                    <button class="control-btn" onclick="startStopwatch()">Start</button>
                    <button class="control-btn" onclick="pauseStopwatch()">Pause</button>
                    <button class="control-btn" onclick="lapStopwatch()">Lap</button>
                    <button class="control-btn" onclick="resetStopwatch()">Reset</button>
                </div>
                <div class="laps-container" id="laps-list"></div>
            </div>
        </section>
    </main>
</div>
<script>
    const sidebar = document.getElementById('sidebar');
    const currentTimeElement = document.getElementById('current-time');
    const timeTitleElement = document.getElementById('time-title');
    const timeSubLabel = document.getElementById('time-sub-label');
    const timeZoneSub = document.getElementById('time-zone-sub');

    let timeInterval = null;
    let timeOffsetSeconds = null;

    function toggleSidebar() { sidebar.classList.toggle('active'); }
    document.getElementById('theme-toggle').addEventListener('click', () => { document.body.classList.toggle('light-mode'); });
    document.querySelector('.main-content').addEventListener('click', () => { if (sidebar.classList.contains('active')) { sidebar.classList.remove('active'); } });

    // 전체화면 토글 함수들 (다른 버튼 숨김 처리 연동)
    const timeBox = document.getElementById('time-box');
    const timeFullscreenBtn = document.getElementById('time-fullscreen-btn');
    
    const timerBox = document.getElementById('timer-box');
    const timerFullscreenBtn = document.getElementById('timer-fullscreen-btn');

    const stopwatchBox = document.getElementById('stopwatch-box');
    const stopwatchFullscreenBtn = document.getElementById('stopwatch-fullscreen-btn');

    function toggleTimeFullscreen() {
        timerBox.classList.remove('fullscreen');
        timerFullscreenBtn.classList.remove('active-fullscreen');
        timerFullscreenBtn.textContent = 'Maximize ⛶';

        stopwatchBox.classList.remove('fullscreen');
        stopwatchFullscreenBtn.classList.remove('active-fullscreen');
        stopwatchFullscreenBtn.textContent = 'Maximize ⛶';

        timeBox.classList.toggle('fullscreen');
        if (timeBox.classList.contains('fullscreen')) {
            timeFullscreenBtn.classList.add('active-fullscreen');
            timeFullscreenBtn.textContent = 'Minimize 🗗';
            document.body.classList.add('has-fullscreen');
        } else {
            timeFullscreenBtn.classList.remove('active-fullscreen');
            timeFullscreenBtn.textContent = 'Maximize ⛶';
            document.body.classList.remove('has-fullscreen');
        }
    }

    function toggleTimerFullscreen() {
        timeBox.classList.remove('fullscreen');
        timeFullscreenBtn.classList.remove('active-fullscreen');
        timeFullscreenBtn.textContent = 'Maximize ⛶';

        stopwatchBox.classList.remove('fullscreen');
        stopwatchFullscreenBtn.classList.remove('active-fullscreen');
        stopwatchFullscreenBtn.textContent = 'Maximize ⛶';

        timerBox.classList.toggle('fullscreen');
        if (timerBox.classList.contains('fullscreen')) {
            timerFullscreenBtn.classList.add('active-fullscreen');
            timerFullscreenBtn.textContent = 'Minimize 🗗';
            document.body.classList.add('has-fullscreen');
        } else {
            timerFullscreenBtn.classList.remove('active-fullscreen');
            timerFullscreenBtn.textContent = 'Maximize ⛶';
            document.body.classList.remove('has-fullscreen');
        }
    }

    function toggleStopwatchFullscreen() {
        timeBox.classList.remove('fullscreen');
        timeFullscreenBtn.classList.remove('active-fullscreen');
        timeFullscreenBtn.textContent = 'Maximize ⛶';

        timerBox.classList.remove('fullscreen');
        timerFullscreenBtn.classList.remove('active-fullscreen');
        timerFullscreenBtn.textContent = 'Maximize ⛶';

        stopwatchBox.classList.toggle('fullscreen');
        if (stopwatchBox.classList.contains('fullscreen')) {
            stopwatchFullscreenBtn.classList.add('active-fullscreen');
            stopwatchFullscreenBtn.textContent = 'Minimize 🗗';
            document.body.classList.add('has-fullscreen');
        } else {
            stopwatchFullscreenBtn.classList.remove('active-fullscreen');
            stopwatchFullscreenBtn.textContent = 'Maximize ⛶';
            document.body.classList.remove('has-fullscreen');
        }
    }

    function startTimeClock(offsetSeconds, labelText, tzString = "") {
        if (timeInterval) clearInterval(timeInterval);

        function updateClock() {
            const now = new Date(new Date().getTime() + (offsetSeconds * 1000));
            const hours = String(now.getUTCHours()).padStart(2, '0');
            const minutes = String(now.getUTCMinutes()).padStart(2, '0');
            const seconds = String(now.getUTCSeconds()).padStart(2, '0');
            currentTimeElement.innerText = `${hours}:${minutes}:${seconds}`;
        }

        updateClock();
        timeInterval = setInterval(updateClock, 1000);
        timeSubLabel.innerText = labelText;
        timeZoneSub.innerText = tzString ? `(${tzString})` : "";
    }

    function formatTzOffset(offsetSeconds) {
        const hours = offsetSeconds / 3600;
        const sign = hours >= 0 ? "+" : "-";
        const absHours = Math.abs(hours).toString().padStart(2, '0');
        return `UTC ${sign}${absHours}:00`;
    }

    async function fetchIPInfo() {
        currentTimeElement.innerText = "Loading...";

        try {
            const response = await fetch('https://ipwho.is/');
            if (!response.ok) throw new Error('Network response was not ok');

            const data = await response.json();
            if (!data.success) throw new Error(data.message || 'IP lookup failed');

            let tzOffsetStr = "UTC";
            if (data.timezone && data.timezone.offset !== undefined) {
                timeOffsetSeconds = data.timezone.offset;
                tzOffsetStr = formatTzOffset(timeOffsetSeconds);
                timeTitleElement.innerText = "CURRENT TIME (IP)";
                startTimeClock(timeOffsetSeconds, data.timezone.id || "IP-based", tzOffsetStr);
            } else {
                timeOffsetSeconds = -new Date().getTimezoneOffset() * 60;
                tzOffsetStr = formatTzOffset(timeOffsetSeconds);
                startTimeClock(timeOffsetSeconds, "Local System", tzOffsetStr);
            }
        } catch (error) {
            console.error("IP Fetch Error:", error);
            timeOffsetSeconds = -new Date().getTimezoneOffset() * 60;
            startTimeClock(timeOffsetSeconds, "Local System (Fallback)", formatTzOffset(timeOffsetSeconds));
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    try {
                        const browserOffset = -new Date().getTimezoneOffset() * 60;
                        timeOffsetSeconds = browserOffset;
                        const gpsTzStr = formatTzOffset(timeOffsetSeconds);
                        timeTitleElement.innerText = "CURRENT TIME (GPS)";
                        startTimeClock(timeOffsetSeconds, "Accurate GPS Location", gpsTzStr);
                    } catch (e) {
                        console.warn("GPS 타임존 계산 실패", e);
                    }
                },
                (geoError) => {
                    console.warn("GPS 권한 거부 또는 조회 불가:", geoError);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    }

    // --- TIMER LOGIC (Max 99:59:59) ---
    let timerInterval = null;
    let totalSecondsLeft = 0;
    let isTimerRunning = false;

    const tHourInput = document.getElementById('t-hour');
    const tMinInput = document.getElementById('t-min');
    const tSecInput = document.getElementById('t-sec');
    const timerDisplay = document.getElementById('timer-display');
    const timerInputArea = document.getElementById('timer-input-area');

    function formatPad(num) {
        return String(num).padStart(2, '0');
    }

    function startTimer() {
        if (!isTimerRunning) {
            if (timerDisplay.style.display === "none") {
                let h = parseInt(tHourInput.value) || 0;
                let m = parseInt(tMinInput.value) || 0;
                let s = parseInt(tSecInput.value) || 0;

                if (h > 99) h = 99;
                if (m > 59) m = 59;
                if (s > 59) s = 59;

                totalSecondsLeft = (h * 3600) + (m * 60) + s;
                if (totalSecondsLeft <= 0) {
                    alert("Please set a valid time up to 99:59:59.");
                    return;
                }

                timerInputArea.style.display = "none";
                timerDisplay.style.display = "block";
            }

            if (totalSecondsLeft > 0) {
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    if (totalSecondsLeft > 0) {
                        totalSecondsLeft--;
                        updateTimerDisplay();
                    } else {
                        pauseTimer();
                        alert("Timer Finished!");
                    }
                }, 1000);
            }
        }
    }

    function updateTimerDisplay() {
        let h = Math.floor(totalSecondsLeft / 3600);
        let m = Math.floor((totalSecondsLeft % 3600) / 60);
        let s = totalSecondsLeft % 60;
        timerDisplay.innerText = `${formatPad(h)}:${formatPad(m)}:${formatPad(s)}`;
    }

    function pauseTimer() {
        isTimerRunning = false;
        clearInterval(timerInterval);
    }

    function resetTimer() {
        pauseTimer();
        timerDisplay.style.display = "none";
        timerInputArea.style.display = "flex";
        tHourInput.value = "00";
        tMinInput.value = "05";
        tSecInput.value = "00";
    }

    // --- STOPWATCH LOGIC ---
    let swInterval = null;
    let swTotalSeconds = 0;
    let isSwRunning = false;
    const stopwatchDisplay = document.getElementById('stopwatch-display');
    const lapsList = document.getElementById('laps-list');

    function startStopwatch() {
        if (!isSwRunning) {
            isSwRunning = true;
            swInterval = setInterval(() => {
                swTotalSeconds++;
                updateStopwatchDisplay();
            }, 1000);
        }
    }

    function updateStopwatchDisplay() {
        let h = Math.floor(swTotalSeconds / 3600);
        let m = Math.floor((swTotalSeconds % 3600) / 60);
        let s = swTotalSeconds % 60;
        stopwatchDisplay.innerText = `${formatPad(h)}:${formatPad(m)}:${formatPad(s)}`;
    }

    function pauseStopwatch() {
        isSwRunning = false;
        clearInterval(swInterval);
    }

    function lapStopwatch() {
        if (isSwRunning) {
            const lapItem = document.createElement('div');
            lapItem.innerText = `Lap: ${stopwatchDisplay.innerText}`;
            lapsList.prepend(lapItem);
        }
    }

    function resetStopwatch() {
        pauseStopwatch();
        swTotalSeconds = 0;
        updateStopwatchDisplay();
        lapsList.innerHTML = "";
    }

    window.addEventListener('DOMContentLoaded', fetchIPInfo);
</script>
</body>
</html>
