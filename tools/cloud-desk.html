<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudDesk OS — Pages + IndexedDB</title>
<style>
:root{
  --bg:#e9f1ff;--panel:rgba(255,255,255,.72);--panel2:rgba(255,255,255,.94);
  --text:#172133;--muted:#718097;--line:rgba(36,67,120,.12);--accent:#557cff;
  --shadow:0 20px 60px rgba(41,63,105,.18);--taskbar:58px;
}
[data-theme="dark"]{
  --bg:#101724;--panel:rgba(18,27,43,.78);--panel2:rgba(22,31,48,.96);
  --text:#edf3ff;--muted:#9eabc0;--line:rgba(255,255,255,.08);--accent:#7e9cff;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 18% 18%,rgba(115,154,255,.38),transparent 28%),
    radial-gradient(circle at 82% 12%,rgba(120,222,255,.28),transparent 24%),
    linear-gradient(135deg,var(--bg),color-mix(in srgb,var(--bg) 80%,#7ea2ff 20%));
}
button,input,textarea{font:inherit;color:inherit}
.desktop{position:relative;width:100%;height:100%;padding:18px 18px calc(var(--taskbar) + 24px)}
.desktop-icons{display:grid;grid-template-columns:repeat(auto-fill,84px);grid-auto-rows:92px;gap:8px;width:max-content}
.icon{width:84px;height:88px;border:0;background:transparent;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:default}
.icon:hover{background:rgba(255,255,255,.18)}
.glyph{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);box-shadow:0 10px 26px rgba(45,74,124,.15);font-size:24px}
.icon span{font-size:12px}
.taskbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);height:var(--taskbar);width:min(700px,calc(100vw - 18px));background:var(--panel);backdrop-filter:blur(26px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:8px 10px;z-index:9999}
.taskbar button{border:0;background:transparent;width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:18px}.taskbar button:hover{background:rgba(255,255,255,.16)}
.running{display:flex;gap:6px;flex:1}.running button{position:relative}.running button::after{content:"";position:absolute;width:14px;height:3px;border-radius:3px;background:var(--accent);left:50%;bottom:2px;transform:translateX(-50%)}
.tray{display:flex;gap:10px;align-items:center;padding-left:8px;border-left:1px solid var(--line);font-size:12px;color:var(--muted)}
.start-menu{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(10px);width:min(580px,calc(100vw - 24px));background:var(--panel2);backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px;z-index:9998;opacity:0;pointer-events:none;transition:.18s}
.start-menu.open{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.search{width:100%;border:1px solid var(--line);background:transparent;border-radius:14px;padding:12px 14px;outline:none}
.apps-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.app-tile{border:0;background:transparent;border-radius:16px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}.app-tile:hover{background:rgba(100,130,190,.1)}.app-tile .glyph{background:transparent;border:0;box-shadow:none;width:auto;height:auto;font-size:28px}
.window{position:absolute;width:760px;height:500px;min-width:320px;min-height:220px;background:var(--panel2);backdrop-filter:blur(30px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;resize:both}
.window.maximized{left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;height:calc(100vh - var(--taskbar) - 28px)!important;resize:none}
.titlebar{height:44px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);cursor:move;user-select:none}.title{flex:1;font-size:13px;font-weight:650}
.controls{display:flex;gap:4px}.controls button{width:34px;height:28px;border:0;border-radius:9px;background:transparent;cursor:pointer}.controls button:hover{background:rgba(100,130,190,.12)}.controls .close:hover{background:#ff5d68;color:#fff}
.window-body{height:calc(100% - 44px);overflow:auto}
.split{display:grid;grid-template-columns:190px 1fr;height:100%}.sidebar{border-right:1px solid var(--line);padding:12px}.sidebar button{width:100%;border:0;background:transparent;text-align:left;border-radius:10px;padding:9px 10px;cursor:pointer}.sidebar button:hover,.sidebar button.active{background:rgba(100,130,190,.1)}
.content{padding:18px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 11px;cursor:pointer}.btn:hover{background:rgba(100,130,190,.1)}.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.file-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.1);min-height:108px;cursor:pointer}.file-card:hover{transform:translateY(-1px)}.file-card .big{font-size:30px}.file-card small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notes-wrap{height:100%;display:grid;grid-template-rows:46px 1fr}.notes-toolbar{padding:7px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.notes{width:100%;height:100%;border:0;outline:0;resize:none;background:transparent;padding:18px;line-height:1.6}
.center{height:100%;display:grid;place-items:center;text-align:center;padding:28px}.muted{color:var(--muted)}.clock-big{font-size:72px;font-weight:700;letter-spacing:-4px}
.settings{padding:20px}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 12px;cursor:pointer}
.terminal{height:100%;background:#0b1020;color:#d9e4ff;padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;overflow:auto}.terminal-line{white-space:pre-wrap}.terminal-input-row{display:flex;gap:8px}.terminal-input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-family:inherit}
.viewer{height:100%;display:grid;place-items:center;padding:20px}.viewer img{max-width:100%;max-height:100%;object-fit:contain}.viewer pre{width:100%;height:100%;overflow:auto;white-space:pre-wrap}
.toast-wrap{position:fixed;right:18px;bottom:84px;z-index:12000;display:flex;flex-direction:column;gap:8px}.toast{background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:10px 12px;font-size:13px}
.hidden{display:none!important}
@media(max-width:680px){.apps-grid{grid-template-columns:repeat(3,1fr)}.window{width:calc(100vw - 20px)!important;left:10px!important}.split{grid-template-columns:120px 1fr}}
</style>
</head>
<body>
<div class="desktop" id="desktop"><div class="desktop-icons" id="desktopIcons"></div></div>

<div class="start-menu" id="startMenu">
  <input class="search" id="search" placeholder="앱 검색...">
  <div class="apps-grid" id="appsGrid"></div>
</div>

<div class="taskbar">
  <button id="startBtn">◈</button>
  <div class="running" id="runningApps"></div>
  <div class="tray"><span>💾 IndexedDB</span><span id="clock"></span></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
const API_BASE="https://clouddesk-api.sujinohkor.workers.dev";
const DB_NAME="CloudDeskDB";
const DB_VERSION=1;
let db=null;

function openDatabase(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded=()=>{
      const database=request.result;

      if(!database.objectStoreNames.contains("files")){
        const files=database.createObjectStore("files",{keyPath:"id"});
        files.createIndex("folder","folder",{unique:false});
      }

      if(!database.objectStoreNames.contains("notes")){
        database.createObjectStore("notes",{keyPath:"id"});
      }

      if(!database.objectStoreNames.contains("settings")){
        database.createObjectStore("settings",{keyPath:"key"});
      }
    };

    request.onsuccess=()=>{
      db=request.result;
      resolve(db);
    };

    request.onerror=()=>reject(request.error);
  });
}

function store(name,mode="readonly"){
  return db.transaction(name,mode).objectStore(name);
}

function idbPut(name,value){
  return new Promise((resolve,reject)=>{
    const req=store(name,"readwrite").put(value);
    req.onsuccess=()=>resolve(value);
    req.onerror=()=>reject(req.error);
  });
}

function idbGet(name,key){
  return new Promise((resolve,reject)=>{
    const req=store(name).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}

function idbDelete(name,key){
  return new Promise((resolve,reject)=>{
    const req=store(name,"readwrite").delete(key);
    req.onsuccess=()=>resolve();
    req.onerror=()=>reject(req.error);
  });
}

function idbAll(name){
  return new Promise((resolve,reject)=>{
    const req=store(name).getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error);
  });
}

const apps={
  files:{name:"Files",icon:"📁",desktop:true,render:renderFiles},
  notes:{name:"Notes",icon:"📝",desktop:true,render:renderNotes},
  terminal:{name:"Terminal",icon:"⌨️",desktop:true,render:renderTerminal},
  storage:{name:"Storage",icon:"💾",desktop:true,render:renderStorage},
  settings:{name:"Settings",icon:"⚙️",desktop:true,render:renderSettings},
  clock:{name:"Clock",icon:"🕒",desktop:false,render:renderClock}
};

const state={windows:[],z:20,theme:localStorage.getItem("clouddesk-theme")||"light"};
document.documentElement.dataset.theme=state.theme;

const desktop=document.getElementById("desktop");
const startMenu=document.getElementById("startMenu");
const appsGrid=document.getElementById("appsGrid");
const desktopIcons=document.getElementById("desktopIcons");
const runningApps=document.getElementById("runningApps");
const search=document.getElementById("search");

function toast(msg){
  const el=document.createElement("div");
  el.className="toast";el.textContent=msg;
  document.getElementById("toastWrap").appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

function launcher(id,desktopMode=false){
  const app=apps[id],b=document.createElement("button");
  b.className=desktopMode?"icon":"app-tile";
  b.dataset.appId=id;
  b.innerHTML=desktopMode?`<div class="glyph">${app.icon}</div><span>${app.name}</span>`:`<div class="glyph">${app.icon}</div><b>${app.name}</b>`;
  if(desktopMode)b.ondblclick=()=>openApp(id);
  else b.onclick=()=>{openApp(id);toggleStart(false)};
  return b;
}

Object.keys(apps).forEach(id=>{
  appsGrid.appendChild(launcher(id));
  if(apps[id].desktop)desktopIcons.appendChild(launcher(id,true));
});

document.getElementById("startBtn").onclick=()=>toggleStart();
search.oninput=()=>{
  const q=search.value.toLowerCase();
  [...appsGrid.children].forEach(el=>{
    el.style.display=apps[el.dataset.appId].name.toLowerCase().includes(q)?"":"none";
  });
};

function toggleStart(force){
  const open=typeof force==="boolean"?force:!startMenu.classList.contains("open");
  startMenu.classList.toggle("open",open);
  if(open)setTimeout(()=>search.focus(),50);
}

function openApp(appId,options={}){
  if(appId!=="viewer"){
    const existing=state.windows.find(w=>w.appId===appId&&!w.closed);
    if(existing){focusWindow(existing);return;}
  }

  const app=appId==="viewer"
    ? {name:options.title||"Viewer",icon:"👁️",render:r=>renderViewer(r,options.file)}
    : apps[appId];

  const idx=state.windows.length;
  const win=document.createElement("div");
  win.className="window";
  win.style.left=`${110+(idx*28)%280}px`;
  win.style.top=`${60+(idx*24)%180}px`;
  win.style.zIndex=++state.z;
  win.innerHTML=`<div class="titlebar"><span>${app.icon}</span><div class="title">${escapeHtml(app.name)}</div><div class="controls"><button class="min">—</button><button class="max">□</button><button class="close">×</button></div></div><div class="window-body"></div>`;
  desktop.appendChild(win);

  const obj={appId,el:win,closed:false,icon:app.icon,name:app.name};
  state.windows.push(obj);
  app.render(win.querySelector(".window-body"));

  win.onmousedown=()=>focusWindow(obj);
  win.querySelector(".min").onclick=e=>{e.stopPropagation();win.style.display="none"};
  win.querySelector(".max").onclick=e=>{e.stopPropagation();win.classList.toggle("maximized");focusWindow(obj)};
  win.querySelector(".close").onclick=e=>{e.stopPropagation();obj.closed=true;win.remove();renderTaskbar()};
  enableDrag(win,win.querySelector(".titlebar"));
  renderTaskbar();
}

function focusWindow(obj){
  obj.el.style.display="";
  obj.el.style.zIndex=++state.z;
  renderTaskbar();
}

function renderTaskbar(){
  runningApps.innerHTML="";
  state.windows.filter(w=>!w.closed).forEach(w=>{
    const b=document.createElement("button");
    b.textContent=w.icon;b.title=w.name;
    b.onclick=()=>{
      if(w.el.style.display==="none")focusWindow(w);
      else if(Number(w.el.style.zIndex)===state.z)w.el.style.display="none";
      else focusWindow(w);
    };
    runningApps.appendChild(b);
  });
}

function enableDrag(win,handle){
  let moving=false,ox=0,oy=0;
  handle.onmousedown=e=>{
    if(e.target.closest(".controls")||win.classList.contains("maximized"))return;
    moving=true;ox=e.clientX-win.offsetLeft;oy=e.clientY-win.offsetTop;
  };
  window.addEventListener("mousemove",e=>{
    if(!moving)return;
    win.style.left=Math.max(-win.offsetWidth+120,Math.min(innerWidth-120,e.clientX-ox))+"px";
    win.style.top=Math.max(0,Math.min(innerHeight-100,e.clientY-oy))+"px";
  });
  window.addEventListener("mouseup",()=>moving=false);
}

async function renderFiles(root){
  root.innerHTML=`<div class="split">
    <div class="sidebar">
      <div class="muted" style="font-size:11px;padding:6px 10px">DRIVES</div>
      <button class="active" data-drive="local">💻 Local</button>
      <button data-drive="cloud">☁️ Cloud</button>

      <div class="muted" style="font-size:11px;padding:16px 10px 6px">FOLDERS</div>
      <button class="folder-nav active" data-folder="">🏠 Home</button>
      <button class="folder-nav" data-folder="Documents">📄 Documents</button>
      <button class="folder-nav" data-folder="Pictures">🖼 Pictures</button>
      <button class="folder-nav" data-folder="Projects">📦 Projects</button>
    </div>

    <div class="content">
      <div class="toolbar">
        <strong id="driveTitle">💻 Local</strong>
        <span class="muted" id="connectionState"></span>
        <span style="flex:1"></span>
        <button class="btn primary" id="uploadBtn">⬆ Upload</button>
        <button class="btn" id="folderBtn">＋ Folder</button>
        <button class="btn" id="refreshBtn">↻ Refresh</button>
        <input id="fileInput" type="file" multiple class="hidden">
      </div>
      <div class="muted" id="fileStatus"></div>
      <div class="file-grid" id="fileGrid"></div>
    </div>
  </div>`;

  let drive="local";
  let folder="";
  const grid=root.querySelector("#fileGrid");
  const status=root.querySelector("#fileStatus");
  const input=root.querySelector("#fileInput");
  const driveTitle=root.querySelector("#driveTitle");
  const connectionState=root.querySelector("#connectionState");

  function setDriveUI(){
    driveTitle.textContent=drive==="local"?"💻 Local":"☁️ Cloud";
    connectionState.textContent=drive==="local"?"이 브라우저에 저장":"D1 + R2";
  }

  async function cloudFetch(path,options={}){
    const res=await fetch(API_BASE+path,options);
    if(!res.ok){
      let detail="";
      try{
        const data=await res.json();
        detail=data.error||JSON.stringify(data);
      }catch{
        detail=await res.text();
      }
      throw new Error(detail||`HTTP ${res.status}`);
    }
    const type=res.headers.get("content-type")||"";
    return type.includes("application/json")?res.json():res;
  }

  async function getItems(){
    if(drive==="local"){
      const all=await idbAll("files");
      return all.filter(x=>(x.folder||"")===folder);
    }
    return await cloudFetch("/api/files?folder="+encodeURIComponent(folder));
  }

  async function load(){
    grid.innerHTML="";
    status.textContent="Loading...";
    try{
      const items=await getItems();
      items.sort((a,b)=>
        a.kind===b.kind
          ? String(a.name).localeCompare(String(b.name))
          : a.kind==="folder" ? -1 : 1
      );

      status.textContent=items.length
        ? `${items.length} item(s) · ${folder||"Home"}`
        : `${folder||"Home"} · 비어 있습니다.`;

      for(const item of items){
        const card=document.createElement("div");
        card.className="file-card";
        card.innerHTML=`<div class="big">${item.kind==="folder"?"📁":fileIcon(item)}</div>
          <b>${escapeHtml(item.name)}</b>
          <small>${item.kind==="folder"?"Folder":formatBytes(item.size||0)}</small>`;

        card.ondblclick=()=>{
          if(item.kind==="folder"){
            folder=item.name;
            syncFolderButtons();
            load();
            return;
          }

          if(drive==="local"){
            openApp("viewer",{title:item.name,file:item});
          }else{
            window.open(API_BASE+"/api/file/"+encodeURIComponent(item.id),"_blank","noopener");
          }
        };

        card.oncontextmenu=async e=>{
          e.preventDefault();
          if(!confirm(`"${item.name}" 삭제할까요?`))return;
          try{
            if(drive==="local"){
              await idbDelete("files",item.id);
            }else{
              await cloudFetch("/api/files/"+encodeURIComponent(item.id),{method:"DELETE"});
            }
            toast("삭제했습니다.");
            load();
          }catch(err){
            toast("삭제 실패: "+err.message);
          }
        };

        grid.appendChild(card);
      }
    }catch(err){
      status.textContent="불러오기 실패";
      grid.innerHTML=`<div class="file-card" style="grid-column:1/-1;cursor:default">
        <div class="big">⚠️</div>
        <b>${drive==="cloud"?"Cloud Drive 연결 오류":"Local Drive 오류"}</b>
        <small>${escapeHtml(err.message)}</small>
      </div>`;
    }
  }

  function syncFolderButtons(){
    root.querySelectorAll(".folder-nav").forEach(btn=>{
      btn.classList.toggle("active",btn.dataset.folder===folder);
    });
  }

  root.querySelectorAll("[data-drive]").forEach(btn=>{
    btn.onclick=()=>{
      drive=btn.dataset.drive;
      root.querySelectorAll("[data-drive]").forEach(x=>x.classList.remove("active"));
      btn.classList.add("active");
      setDriveUI();
      load();
    };
  });

  root.querySelectorAll(".folder-nav").forEach(btn=>{
    btn.onclick=()=>{
      folder=btn.dataset.folder;
      syncFolderButtons();
      load();
    };
  });

  root.querySelector("#refreshBtn").onclick=load;
  root.querySelector("#uploadBtn").onclick=()=>input.click();

  input.onchange=async()=>{
    if(!input.files.length)return;
    try{
      for(const file of input.files){
        if(drive==="local"){
          await idbPut("files",{
            id:crypto.randomUUID(),
            name:file.name,
            kind:"file",
            folder,
            size:file.size,
            type:file.type,
            blob:file,
            createdAt:Date.now()
          });
        }else{
          const fd=new FormData();
          fd.append("file",file);
          fd.append("folder",folder);
          await cloudFetch("/api/upload",{method:"POST",body:fd});
        }
      }
      toast(drive==="local"?"Local에 저장했습니다.":"Cloud R2에 업로드했습니다.");
      input.value="";
      load();
    }catch(err){
      toast("업로드 실패: "+err.message);
    }
  };

  root.querySelector("#folderBtn").onclick=async()=>{
    const name=prompt("폴더 이름");
    if(!name)return;
    try{
      if(drive==="local"){
        await idbPut("files",{
          id:crypto.randomUUID(),
          name,
          kind:"folder",
          folder,
          size:0,
          createdAt:Date.now()
        });
      }else{
        await cloudFetch("/api/folders",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({name,folder})
        });
      }
      toast("폴더를 만들었습니다.");
      load();
    }catch(err){
      toast("폴더 생성 실패: "+err.message);
    }
  };

  setDriveUI();
  load();
}
async function renderNotes(root){
  root.innerHTML=`<div class="notes-wrap">
    <div class="notes-toolbar">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn primary" id="localNoteBtn">💻 Local</button>
        <button class="btn" id="cloudNoteBtn">☁️ Cloud</button>
        <span class="muted" id="noteStatus">Loading...</span>
      </div>
      <button class="btn" id="saveNote">Save</button>
    </div>
    <textarea class="notes" placeholder="메모를 입력하세요."></textarea>
  </div>`;

  let mode="local";
  const ta=root.querySelector("textarea");
  const st=root.querySelector("#noteStatus");
  const localBtn=root.querySelector("#localNoteBtn");
  const cloudBtn=root.querySelector("#cloudNoteBtn");

  async function cloudJson(path,options={}){
    const res=await fetch(API_BASE+path,options);
    if(!res.ok){
      let text="";
      try{
        const data=await res.json();
        text=data.error||JSON.stringify(data);
      }catch{
        text=await res.text();
      }
      throw new Error(text||`HTTP ${res.status}`);
    }
    return res.json();
  }

  async function load(){
    st.textContent="Loading...";
    try{
      if(mode==="local"){
        const row=await idbGet("notes","main");
        ta.value=row?.content||"";
        st.textContent="IndexedDB";
      }else{
        const row=await cloudJson("/api/notes");
        ta.value=row.content||"";
        st.textContent="D1";
      }
    }catch(err){
      st.textContent="Error";
      toast("Notes 불러오기 실패: "+err.message);
    }
  }

  async function save(){
    try{
      if(mode==="local"){
        await idbPut("notes",{id:"main",content:ta.value,updatedAt:Date.now()});
        st.textContent="Saved locally";
      }else{
        await cloudJson("/api/notes",{
          method:"PUT",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({content:ta.value})
        });
        st.textContent="Saved to D1";
      }
    }catch(err){
      st.textContent="Save failed";
      toast("Notes 저장 실패: "+err.message);
    }
  }

  function syncButtons(){
    localBtn.classList.toggle("primary",mode==="local");
    cloudBtn.classList.toggle("primary",mode==="cloud");
  }

  localBtn.onclick=()=>{mode="local";syncButtons();load();};
  cloudBtn.onclick=()=>{mode="cloud";syncButtons();load();};

  root.querySelector("#saveNote").onclick=async()=>{
    await save();
    toast(mode==="local"?"Local Notes 저장 완료":"Cloud Notes 저장 완료");
  };

  let timer;
  ta.oninput=()=>{
    st.textContent="Unsaved";
    clearTimeout(timer);
    timer=setTimeout(save,900);
  };

  syncButtons();
  load();
}
async function renderViewer(root,file){
  root.innerHTML=`<div class="viewer"><div class="muted">Loading...</div></div>`;
  const box=root.querySelector(".viewer");
  const actual=await idbGet("files",file.id);
  if(!actual?.blob){box.innerHTML="<p>파일 데이터를 찾을 수 없습니다.</p>";return;}

  const type=actual.type||"";
  if(type.startsWith("image/")){
    const url=URL.createObjectURL(actual.blob);
    box.innerHTML="";
    const img=document.createElement("img");img.src=url;
    box.appendChild(img);
  }else if(type.startsWith("text/")||/\.(txt|md|json|js|css|html|csv)$/i.test(actual.name)){
    const text=await actual.blob.text();
    box.innerHTML="";
    const pre=document.createElement("pre");pre.textContent=text;
    box.appendChild(pre);
  }else{
    box.innerHTML=`<div><div style="font-size:64px">📄</div><h3>${escapeHtml(actual.name)}</h3><p class="muted">${escapeHtml(type||"unknown type")} · ${formatBytes(actual.size||0)}</p><button class="btn primary" id="downloadBtn">Download</button></div>`;
    box.querySelector("#downloadBtn").onclick=()=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(actual.blob);
      a.download=actual.name;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    };
  }
}

async function renderStorage(root){
  root.innerHTML=`<div class="center"><div><div style="font-size:64px">💾</div><h1>IndexedDB Storage</h1><p class="muted" id="usage">Checking...</p><button class="btn" id="refreshUsage">Refresh</button></div></div>`;

  async function update(){
    let text="Local: CloudDeskDB(IndexedDB) · Cloud: D1 + R2";
    if(navigator.storage?.estimate){
      const e=await navigator.storage.estimate();
      text+=` 현재 사용량 약 ${formatBytes(e.usage||0)} / 브라우저 허용량 약 ${formatBytes(e.quota||0)}`;
    }
    root.querySelector("#usage").textContent=text;
  }
  root.querySelector("#refreshUsage").onclick=update;
  update();
}

function renderSettings(root){
  root.innerHTML=`<div class="settings"><h2 style="margin-top:0">Settings</h2>
    <div class="setting-row"><div><b>Appearance</b><div class="muted">Light / Dark</div></div><button class="pill" id="themeBtn"></button></div>
    <div class="setting-row"><div><b>Local Storage</b><div class="muted">CloudDeskDB / IndexedDB</div></div><span>💻</span></div><div class="setting-row"><div><b>Cloud Storage</b><div class="muted">D1 metadata + R2 objects</div></div><span>☁️</span></div>
    <div class="setting-row"><div><b>Reset</b><div class="muted">모든 파일·메모 삭제</div></div><button class="pill" id="resetBtn">Erase data</button></div>
  </div>`;

  const btn=root.querySelector("#themeBtn");
  const sync=()=>btn.textContent=document.documentElement.dataset.theme==="dark"?"Dark":"Light";
  sync();
  btn.onclick=()=>{
    const next=document.documentElement.dataset.theme==="dark"?"light":"dark";
    document.documentElement.dataset.theme=next;
    localStorage.setItem("clouddesk-theme",next);
    sync();
  };

  root.querySelector("#resetBtn").onclick=()=>{
    if(!confirm("CloudDesk의 IndexedDB 데이터를 모두 삭제할까요?"))return;
    db.close();
    const req=indexedDB.deleteDatabase(DB_NAME);
    req.onsuccess=()=>location.reload();
  };
}

function renderTerminal(root){
  const term=document.createElement("div");
  term.className="terminal";
  term.innerHTML=`<div class="terminal-line">CloudDesk Shell v0.3</div><div class="terminal-line">IndexedDB local mode</div><br>`;
  const row=document.createElement("div");
  row.className="terminal-input-row";
  row.innerHTML=`<span>guest@cloud:~$</span><input class="terminal-input" autocomplete="off">`;
  term.appendChild(row);
  root.appendChild(term);

  const input=row.querySelector("input");
  input.focus();
  input.onkeydown=async e=>{
    if(e.key!=="Enter")return;
    const cmd=input.value.trim();
    const line=document.createElement("div");
    line.className="terminal-line";line.textContent=`guest@cloud:~$ ${cmd}`;
    term.insertBefore(line,row);

    const res=document.createElement("div");
    res.className="terminal-line";
    res.textContent=await runCommand(cmd);
    term.insertBefore(res,row);

    input.value="";
    term.scrollTop=term.scrollHeight;
  };
}

async function runCommand(cmd){
  if(cmd==="help")return"help, date, ls, storage, clear, echo <text>";
  if(cmd==="date")return new Date().toString();
  if(cmd==="ls"){const files=await idbAll("files");return files.map(f=>f.name).join("  ")||"(empty)"}
  if(cmd==="storage")return`Local: CloudDeskDB / IndexedDB\nCloud: ${API_BASE} / D1 + R2`;
  if(cmd.startsWith("echo "))return cmd.slice(5);
  if(cmd==="clear"){setTimeout(()=>document.querySelectorAll(".terminal").forEach(t=>[...t.children].filter(c=>!c.classList.contains("terminal-input-row")).forEach(c=>c.remove())),0);return""}
  return cmd?`command not found: ${cmd}`:"";
}

function renderClock(root){
  root.innerHTML=`<div class="center"><div><div class="clock-big" id="bigClock"></div><div class="muted" id="bigDate"></div></div></div>`;
  const tick=()=>{
    const d=new Date();
    const c=root.querySelector("#bigClock"),dt=root.querySelector("#bigDate");
    if(!c)return;
    c.textContent=d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
    dt.textContent=d.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
  };
  tick();setInterval(tick,1000);
}

function fileIcon(file){
  const t=file.type||"";
  if(t.startsWith("image/"))return"🖼️";
  if(t.startsWith("audio/"))return"🎵";
  if(t.startsWith("video/"))return"🎬";
  if(t.includes("pdf"))return"📕";
  if(t.startsWith("text/"))return"📄";
  return"📦";
}
function escapeHtml(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function formatBytes(n){if(n<1024)return n+" B";if(n<1024*1024)return(n/1024).toFixed(1)+" KB";if(n<1024*1024*1024)return(n/1024/1024).toFixed(1)+" MB";return(n/1024/1024/1024).toFixed(1)+" GB"}
function updateClock(){const d=new Date();document.getElementById("clock").innerHTML=`${d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}<br>${d.toLocaleDateString("ko-KR",{month:"2-digit",day:"2-digit"})}`}

(async()=>{
  try{
    await openDatabase();
    updateClock();setInterval(updateClock,1000);
    setTimeout(()=>openApp("files"),180);
  }catch(e){
    alert("IndexedDB를 열지 못했습니다: "+e.message);
  }
})();
</script>
