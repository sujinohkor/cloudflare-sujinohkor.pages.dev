<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinyin to Mandarin</title>
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <!-- OpenCC-JS (간체/번체 변환용) -->
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }

        .app-container { display: flex; min-height: 100vh; width: 100%; }

        .sidebar { 
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 2000; 
            display: flex; flex-direction: column; gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .main-content { 
            margin-left: 300px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; 
            gap: 20px; overflow: hidden; transition: 0.3s; 
            width: calc(100% - 300px);
        }

        .menu-btn { 
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .mode-group { display: flex; gap: 8px; }
        .mode-btn {
            flex: 1; padding: 10px; background: rgba(255, 255, 255, 0.03);
            color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35);
            border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 0.8rem;
            text-align: center; transition: all 0.3s;
        }
        .mode-btn.active { background: rgba(255, 158, 64, 0.3); border-color: rgba(255, 158, 64, 0.8); }
        .mode-btn:hover { background: rgba(255, 158, 64, 0.2); }

        .info-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 158, 64, 0.25);
            border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
        }
        .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #ccc; }
        .info-row span:last-child { color: #ff9e40; font-weight: bold; }

        .bottom-btns { display: flex; flex-direction: column; gap: 10px; }
        .bottom-btns > .menu-btn { margin-bottom: 0; }

        .content-card { 
            border: 2px solid #ff9e40; border-radius: 16px; flex: 1; 
            display: flex; overflow: hidden; background: rgba(0, 0, 0, 0.2); 
            position: relative; flex-direction: column;
        }

        .candidate-box {
            min-height: 50px; background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 158, 64, 0.25);
            display: flex; flex-direction: column; padding: 10px 20px; gap: 8px; font-size: 0.9rem;
        }
        .input-row { display: flex; align-items: center; gap: 15px; }
        .candidate-label { color: #ff9e40; font-weight: bold; flex-shrink: 0; }
        #pinyin-input-box {
            flex: 1; background: transparent; border: none; color: #ff9e40;
            font-family: 'Consolas', monospace; font-size: 1rem; font-weight: bold; outline: none;
        }
        .candidates-list { display: flex; gap: 10px; flex-wrap: wrap; min-height: 24px; }
        .candidate-item {
            background: rgba(255, 158, 64, 0.15); border: 1px solid rgba(255, 158, 64, 0.4);
            color: #fff; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 0.95rem; transition: 0.2s;
        }
        .candidate-item:hover, .candidate-item.selected { background: #ff9e40; color: #101010; }

        .fullscreen-btn { 
            position: absolute; top: 15px; right: 15px; z-index: 10; 
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; 
            border: 1px solid rgba(255, 158, 64, 0.5); padding: 6px 14px; 
            border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); transition: all 0.3s; 
        }
        .fullscreen-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.8); }

        .content-card.fullscreen { 
            position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
            width: 100vw !important; height: 100vh !important; z-index: 9999 !important; 
            border-radius: 0 !important; border: none !important; padding: 0 !important; margin: 0 !important; background: #101010; 
        }
        .content-card.fullscreen .editor-wrapper { padding: 20px; width: 100%; height: 100%; }

        .editor-wrapper { display: flex; width: 100%; flex: 1; overflow: hidden; }
        .line-numbers { 
            width: 50px; padding: 40px 10px 40px 0; background: rgba(0, 0, 0, 0.2); 
            color: #666; font-family: 'Consolas', sans-serif; font-size: 1rem; 
            text-align: right; user-select: none; overflow: hidden; line-height: 1.5; 
        }
        textarea { 
            flex: 1; height: 100%; padding: 40px; background: transparent; border: none; 
            color: #fff; font-family: 'Consolas', sans-serif; font-size: 1rem; resize: none; 
            outline: none; line-height: 1.5; white-space: pre-wrap; word-break: break-all; overflow-y: auto; 
        }

        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { background: rgba(255, 255, 255, 0.3); border-color: rgba(243, 128, 32, 0.35); box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); }
        body.light-mode .menu-btn, body.light-mode .theme-toggle-btn, body.light-mode .mode-btn { background: rgba(0, 0, 0, 0.02); color: #F38020; border-color: rgba(243, 128, 32, 0.5); }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover, body.light-mode .mode-btn:hover { background: rgba(243, 128, 32, 0.15); color: #F38020; border-color: rgba(243, 128, 32, 0.4); }
        body.light-mode .mode-btn.active { background: rgba(243, 128, 32, 0.3); border-color: rgba(243, 128, 32, 0.8); }
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode textarea { color: #000; }
        body.light-mode .line-numbers { background: rgba(0, 0, 0, 0.05); color: #999; }
        body.light-mode .menu-toggle-btn { color: #ffffff; }
        body.light-mode .content-card { background: rgba(255, 255, 255, 0.5); border-color: #F38020; }
        body.light-mode .content-card.fullscreen { background: #fff !important; padding: 0 !important; }
        body.light-mode .fullscreen-btn { background: rgba(0, 0, 0, 0.02); color: #F38020; border-color: rgba(243, 128, 32, 0.5); }
        body.light-mode .fullscreen-btn:hover { background: rgba(243, 128, 32, 0.15); color: #F38020; border-color: rgba(243, 128, 32, 0.4); }
        body.light-mode .info-panel { background: rgba(0, 0, 0, 0.02); border-color: rgba(243, 128, 32, 0.5); }
        body.light-mode .info-row { color: #202020; }
        body.light-mode .info-row span:last-child { color: #F38020; }
        body.light-mode .candidate-box { background: rgba(0, 0, 0, 0.02); border-bottom-color: rgba(243, 128, 32, 0.35); }
        body.light-mode #pinyin-input-box { color: #F38020; }
        body.light-mode .candidate-item { background: rgba(243, 128, 32, 0.1); border-color: rgba(243, 128, 32, 0.4); color: #202020; }
        body.light-mode .candidate-item:hover, body.light-mode .candidate-item.selected { background: #F38020; color: #fff; }

        .menu-toggle-btn { display: none; position: fixed; bottom: 20px; left: 20px; z-index: 3000; padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; color: #ffffff; }

        @media (max-width: 900px) { 
            .menu-toggle-btn { display: block; } 
            .sidebar { transform: translateX(-320px); background: #101010 !important; box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; } 
            body.light-mode .sidebar { background: #ffffff !important; box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; }
            .sidebar.active { transform: translateX(0); } 
            .main-content { margin-left: 0; padding: 20px; width: 100vw; max-height: 100svh; } 
            .content-card { min-height: 0; height: 100%; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">Pinyin to Mandarin</div>
            <div class="sidebar-top">
                <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
            </div>

            <button class="menu-btn" onclick="location.href='../index'">Home</button>

            <div class="mode-group">
                <button class="mode-btn active" id="mode-simp" onclick="setMode('simplified')">간체 (Simp)</button>
                <button class="mode-btn" id="mode-trad" onclick="setMode('traditional')">번체 (Trad)</button>
            </div>

            <div class="info-panel">
                <div class="info-row">
                    <span>Characters</span>
                    <span id="char-count">0</span>
                </div>
                <div class="info-row">
                    <span>Status</span>
                    <span id="status-text">Ready</span>
                </div>
            </div>

            <div class="bottom-btns">
                <button class="menu-btn" onclick="copyText()">Copy</button>
                <button class="menu-btn" onclick="saveText()">Save</button>
                <button class="menu-btn" onclick="resetText()">Reset</button>
            </div>
        </aside>

        <main class="main-content" id="main-content">
            <header class="top-section">
                <h1>Pinyin to Mandarin</h1>
                <p>Type any pinyin (e.g., nihao, de, boshi) to get full IME suggestions instantly.</p>
            </header>

            <section class="content-card" id="content-card">
                <button class="fullscreen-btn" id="fullscreen-btn" onclick="toggleFullscreen()">Maximize ⛶</button>
                
                <div class="candidate-box">
                    <div class="input-row">
                        <span class="candidate-label">Pinyin:</span>
                        <input type="text" id="pinyin-input-box" placeholder="Type pinyin here (e.g. boshi)..." autocomplete="off" spellcheck="false">
                    </div>
                    <div id="candidates-container" class="candidates-list">
                        <span style="color: #666; font-size: 0.85rem;">Candidates will appear here...</span>
                    </div>
                </div>

                <div class="editor-wrapper">
                    <div id="line-numbers" class="line-numbers">1</div>
                    <textarea id="text-input" placeholder="Converted Chinese text will appear here..." readonly></textarea>
                </div>
            </section>
        </main>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const pinyinInputBox = document.getElementById('pinyin-input-box');
        const candidatesContainer = document.getElementById('candidates-container');
        const lineNumbers = document.getElementById('line-numbers');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        const contentCard = document.getElementById('content-card');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const statusText = document.getElementById('status-text');

        let currentMode = 'simplified';
        let currentMatches = [];
        const toTraditional = OpenCC.Converter({ from: 'cn', to: 't' });
        const toSimplified = OpenCC.Converter({ from: 't', to: 'cn' });

        // ⭐ 본인이 생성한 클라우드플레어 워커 주소로 변경하세요!
        const PROXY_URL = "https://pinyin-proxy.sujinohkor.workers.dev";

        window.toggleFullscreen = function() {
            contentCard.classList.toggle('fullscreen');
            if (contentCard.classList.contains('fullscreen')) {
                fullscreenBtn.textContent = 'Minimize 🗗';
            } else {
                fullscreenBtn.textContent = 'Maximize ⛶';
            }
        };

        function toggleSidebar() { sidebar.classList.toggle('active'); }

        sidebar.querySelectorAll('button').forEach(element => {
            element.addEventListener('click', () => {
                if (window.innerWidth <= 900) sidebar.classList.remove('active');
            });
        });

        document.getElementById('theme-toggle').addEventListener('click', () => { document.body.classList.toggle('light-mode'); });

        mainContent.addEventListener('click', (e) => { 
            if (sidebar.classList.contains('active') && !e.target.closest('.sidebar') && !e.target.closest('.menu-toggle-btn')) { 
                sidebar.classList.remove('active'); 
            } 
        });

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('mode-simp').classList.toggle('active', mode === 'simplified');
            document.getElementById('mode-trad').classList.toggle('active', mode === 'traditional');

            let text = textInput.value;
            if (text) {
                textInput.value = mode === 'traditional' ? toTraditional(text) : toSimplified(text);
                textInput.dispatchEvent(new Event('input'));
            }
        }

        // 실시간 입력 시 서버리스 프록시를 통해 대형 IME 엔진 검색 결과 요청
        let debounceTimer;
        pinyinInputBox.addEventListener('input', (e) => {
            let query = pinyinInputBox.value.trim().toLowerCase();
            if (!query) {
                currentMatches = [];
                candidatesContainer.innerHTML = `<span style="color: #666; font-size: 0.85rem;">Candidates will appear here...</span>`;
                statusText.textContent = "Ready";
                return;
            }

            statusText.textContent = "Searching...";
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`${PROXY_URL}?text=${encodeURIComponent(query)}`);
                    const data = await res.json();

                    if (data && data[0] === 'SUCCESS' && data[1] && data[1][0] && data[1][0][1]) {
                        currentMatches = data[1][0][1]; // 추천 한자 배열 리스트
                        renderCandidates(currentMatches);
                        statusText.textContent = "Ready";
                    } else {
                        currentMatches = [query];
                        renderCandidates([query]);
                        statusText.textContent = "Ready";
                    }
                } catch (err) {
                    console.error("Proxy fetch error:", err);
                    statusText.textContent = "Error";
                }
            }, 150); // 타이핑 속도에 맞춘 디바운스 최적화
        });

        function renderCandidates(list) {
            candidatesContainer.innerHTML = '';
            list.forEach((hanzi, index) => {
                let converted = currentMode === 'traditional' ? toTraditional(hanzi) : toSimplified(hanzi);
                let btn = document.createElement('div');
                btn.className = 'candidate-item' + (index === 0 ? ' selected' : '');
                btn.innerHTML = `<b>${index + 1}</b>. ${converted}`;
                btn.onclick = () => selectHanzi(converted);
                candidatesContainer.appendChild(btn);
            });
        }

        function selectHanzi(hanzi) {
            textInput.value += hanzi;
            textInput.dispatchEvent(new Event('input'));
            pinyinInputBox.value = '';
            currentMatches = [];
            candidatesContainer.innerHTML = `<span style="color: #666; font-size: 0.85rem;">Candidates will appear here...</span>`;
            pinyinInputBox.focus();
        }

        pinyinInputBox.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const firstCandidate = candidatesContainer.querySelector('.candidate-item');
                if (firstCandidate) firstCandidate.click();
            } else if (/^[1-5]$/.test(e.key)) {
                const index = parseInt(e.key) - 1;
                const candidateItems = candidatesContainer.querySelectorAll('.candidate-item');
                if (candidateItems[index]) {
                    e.preventDefault();
                    candidateItems[index].click();
                }
            }
        });

        textInput.addEventListener('input', () => {
            const text = textInput.value;
            document.getElementById('char-count').innerText = text.length;
            updateLineNumbers();
            saveToLocal();
        });

        function updateLineNumbers() {
            const text = textInput.value;
            const lines = text.split('\n');
            const measureDiv = document.createElement('div');
            measureDiv.style.font = window.getComputedStyle(textInput).font;
            measureDiv.style.width = (textInput.clientWidth - 80) + 'px';
            measureDiv.style.visibility = 'hidden';
            measureDiv.style.position = 'absolute';
            measureDiv.style.whiteSpace = 'pre-wrap';
            measureDiv.style.wordBreak = 'break-all';
            document.body.appendChild(measureDiv);

            let simpleResult = '';
            let currentLine = 1;

            lines.forEach((line) => {
                measureDiv.textContent = line === '' ? ' ' : line;
                const lineCount = Math.max(1, Math.round(measureDiv.clientHeight / parseFloat(window.getComputedStyle(textInput).lineHeight)));
                for (let i = 0; i < lineCount; i++) {
                    simpleResult += (i === 0 ? currentLine : '&nbsp;') + '<br>';
                }
                currentLine++;
            });

            document.body.removeChild(measureDiv);
            lineNumbers.innerHTML = simpleResult || '1';
        }

        textInput.addEventListener('scroll', () => { lineNumbers.scrollTop = textInput.scrollTop; });
        window.addEventListener('resize', updateLineNumbers);

        function resetText() {
            if (confirm('Are you sure you want to clear all text?')) {
                localStorage.removeItem('saved_pinyin_text');
                textInput.value = '';
                pinyinInputBox.value = '';
                currentMatches = [];
                candidatesContainer.innerHTML = `<span style="color: #666; font-size: 0.85rem;">Candidates will appear here...</span>`;
                textInput.dispatchEvent(new Event('input'));
            }
        }

        function copyText() {
            if (!textInput.value) return alert('No text to copy.');
            textInput.select();
            document.execCommand('copy');
            alert('Text copied!');
        }

        function saveText() {
            const text = textInput.value;
            if (!text.trim()) return alert("No text to save.");
            localStorage.setItem('saved_pinyin_text', text);
            const blob = new Blob(['\uFEFF', text], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'ChineseText.txt';
            link.click();
            URL.revokeObjectURL(link.href);
            alert('Text saved successfully.');
        }

        function saveToLocal() { localStorage.setItem('saved_pinyin_text', textInput.value); }

        function loadSavedText() {
            const savedText = localStorage.getItem('saved_pinyin_text');
            if (savedText !== null) {
                textInput.value = savedText;
                textInput.dispatchEvent(new Event('input')); 
            }
        }

        loadSavedText();
        updateLineNumbers();
    </script>
</body>
</html>
