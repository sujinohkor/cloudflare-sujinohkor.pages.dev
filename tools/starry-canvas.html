<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starry Canvas</title>
    <!-- 파비콘 설정 추가 -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }
        .app-container { display: flex; min-height: 100vh; width: 100%; position: relative; }
        
        /* 모바일 전용 투명 배경 레이어 (사이드바가 열렸을 때만 활성화) */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: transparent;
            z-index: 2500;
        }
        body.sidebar-is-active .sidebar-backdrop {
            display: block;
        }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar {
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px;
            background: rgba(16, 16, 16, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 3000;
            display: flex; flex-direction: column; gap: 12px;
            border: 1px solid rgba(255, 158, 64, 0.35);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, opacity 0.3s ease, background 0.3s, border 0.3s;
            overflow-y: auto;
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* 그룹 라벨 스타일 */
        .control-group { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }

        /* 메인 콘텐츠 영역 */
        .main-content {
            margin-left: 300px; padding: 40px; flex: 1;
            display: flex; flex-direction: column; height: 100vh;
            gap: 20px; overflow: hidden; transition: all 0.3s ease;
            width: calc(100% - 300px);
        }
        .menu-btn {
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35);
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }
        .menu-btn.active { background: rgba(255, 158, 64, 0.3); border-color: rgba(255, 158, 64, 0.8); }

        .content-card {
            border: 2px solid #ff9e40;
            border-radius: 16px;
            flex: 1;
            display: flex;
            overflow: hidden;
            background: radial-gradient(circle, #222 1px, transparent 1px) #101010;
            background-size: 20px 20px;
            position: relative;
            transition: all 0.3s ease;
        }

        /* 전체화면 버튼 스타일 */
        .fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            color: #ff9e40;
            border: 1px solid rgba(255, 158, 64, 0.5);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.3s;
        }
        .fullscreen-btn:hover {
            background: rgba(255, 158, 64, 0.2);
            color: #ff9e40;
            border-color: rgba(255, 158, 64, 0.8);
        }

        /* 전체화면 활성화 클래스 */
        .content-card.fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999 !important;
            border-radius: 0 !important;
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
            background: radial-gradient(circle, #222 1px, transparent 1px) #101010;
            background-size: 20px 20px;
        }

        .board-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: crosshair;
        }
        .board-container canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        /* Light Mode Styling */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(243, 128, 32, 0.35);
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15);
        }
        body.light-mode .menu-btn, body.light-mode .theme-toggle-btn {
            background: rgba(0, 0, 0, 0.02);
            color: #F38020;
            border-color: rgba(243, 128, 32, 0.5);
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover {
            background: rgba(243, 128, 32, 0.15);
            color: #F38020;
            border-color: rgba(243, 128, 32, 0.4);
        }
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode .menu-toggle-btn { color: #ffffff; }
        body.light-mode .content-card { background: radial-gradient(circle, #ddd 1px, transparent 1px) #fff; background-size: 20px 20px; }
        body.light-mode .content-card.fullscreen { background: radial-gradient(circle, #ddd 1px, transparent 1px) #fff !important; background-size: 20px 20px !important; }
        body.light-mode .fullscreen-btn {
            background: rgba(0, 0, 0, 0.02);
            color: #F38020;
            border-color: rgba(243, 128, 32, 0.5);
        }
        body.light-mode .fullscreen-btn:hover {
            background: rgba(243, 128, 32, 0.15);
            color: #F38020;
            border-color: rgba(243, 128, 32, 0.4);
        }

        .menu-toggle-btn {
            display: none; position: fixed; bottom: 20px; left: 20px; z-index: 4000;
            padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px;
            font-weight: bold; cursor: pointer; color: #ffffff;
        }

        @media (max-width: 900px) {
            .menu-toggle-btn { display: block; }
            .sidebar {
                transform: translateX(-320px);
                background: #101010 !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important;
                z-index: 3000;
            }
            body.light-mode .sidebar {
                background: #ffffff !important;
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important;
            }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px; width: 100vw; height: 100svh; }
            .content-card { min-height: 0; height: 100%; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    
    <div class="sidebar-backdrop" onclick="closeSidebar()"></div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">Starry Canvas</div>
            <div class="sidebar-top">
                <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
            </div>
            <button class="menu-btn" onclick="location.href='../index'">Home</button>
            <div class="control-group">
                <button class="menu-btn" id="btn-lock" onclick="toggleMode('lock')">Pin Stars (Off)</button>
                <button class="menu-btn" id="btn-reset" onclick="resetCanvas()">Reset</button>
            </div>
        </aside>
        
        <main class="main-content" id="main-content">
            <header class="top-section">
                <h1>Starry Canvas</h1>
                <p>Interactive Starry Night & Constellation Playground</p>
            </header>
            
            <section class="content-card" id="content-card">
                <button class="fullscreen-btn" id="fullscreen-btn" onclick="toggleFullscreen()">Maximize ⛶</button>
                <div class="board-container" id="board">
                    <canvas id="starCanvas"></canvas>
                </div>
            </section>
        </main>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const board = document.getElementById('board');
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        const contentCard = document.getElementById('content-card');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        let isStarLockActive = false;
        let fadingStars = [];
        let lockedStars = [];
        let isDrawing = false;

        function resizeCanvas() {
            canvas.width = board.clientWidth;
            canvas.height = board.clientHeight;
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
        });
        resizeCanvas();

        window.toggleFullscreen = function() {
            contentCard.classList.toggle('fullscreen');
            if (contentCard.classList.contains('fullscreen')) {
                fullscreenBtn.textContent = 'Minimize 🗗';
            } else {
                fullscreenBtn.textContent = 'Maximize ⛶';
            }
            setTimeout(resizeCanvas, 50);
        };

        function toggleMode(mode) {
            if (mode === 'lock') {
                isStarLockActive = !isStarLockActive;
                const btn = document.getElementById('btn-lock');
                if (isStarLockActive) {
                    btn.classList.add('active');
                    btn.textContent = 'Pin Stars (On)';
                } else {
                    btn.classList.remove('active');
                    btn.textContent = 'Pin Stars (Off)';
                }
            }
        }

        function resetCanvas() {
            fadingStars = [];
            lockedStars = [];
            isStarLockActive = false;
            const btn = document.getElementById('btn-lock');
            btn.classList.remove('active');
            btn.textContent = 'Pin Stars (Off)';
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            createStarsAtCoords(e.clientX, e.clientY);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                createStarsAtCoords(e.clientX, e.clientY);
            }
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            if (e.touches.length > 0) {
                createStarsAtCoords(e.touches[0].clientX, e.touches[0].clientY);
            }
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (isDrawing && e.touches.length > 0) {
                createStarsAtCoords(e.touches[0].clientX, e.touches[0].clientY);
            }
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchend', () => {
            isDrawing = false;
        });

        function createStarsAtCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            if (isStarLockActive) {
                lockedStars.push({
                    x: x,
                    y: y,
                    size: Math.random() * 3.5 + 1.5,
                    color: Math.random() > 0.3 ? '#ff9e40' : '#ffffff',
                    pulseSpeed: Math.random() * 0.05 + 0.02,
                    angle: Math.random() * Math.PI
                });
            } else {
                for (let i = 0; i < 2; i++) {
                    fadingStars.push({
                        x: x + (Math.random() - 0.5) * 15,
                        y: y + (Math.random() - 0.5) * 15,
                        size: Math.random() * 3 + 1,
                        alpha: 1,
                        decay: Math.random() * 0.02 + 0.01,
                        color: Math.random() > 0.3 ? '#ff9e40' : '#ffffff',
                        vx: (Math.random() - 0.5) * 0.6,
                        vy: (Math.random() - 0.5) * 0.6
                    });
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            lockedStars.forEach(star => {
                star.angle += star.pulseSpeed;
                let currentAlpha = 0.6 + Math.sin(star.angle) * 0.4;

                ctx.save();
                ctx.globalAlpha = currentAlpha;
                ctx.fillStyle = star.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = star.color;

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            for (let i = fadingStars.length - 1; i >= 0; i--) {
                let s = fadingStars[i];
                s.x += s.vx;
                s.y += s.vy;
                s.alpha -= s.decay;

                ctx.save();
                ctx.globalAlpha = Math.max(s.alpha, 0);
                ctx.fillStyle = s.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = s.color;

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (s.alpha <= 0) {
                    fadingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

        function toggleSidebar() {
            sidebar.classList.toggle('active');
            document.body.classList.toggle('sidebar-is-active', sidebar.classList.contains('active'));
        }

        function closeSidebar() {
            sidebar.classList.remove('active');
            document.body.classList.remove('sidebar-is-active');
        }

        sidebar.querySelectorAll('button').forEach(element => {
            element.addEventListener('click', () => {
                if (window.innerWidth <= 900) {
                    closeSidebar();
                }
            });
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
        });
    </script>
</body>
</html>
