<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GBA Emulator Online</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .container { width: 100%; max-width: 800px; padding: 20px; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 2rem; color: #38bdf8; }
        
        #loading-section {
            background: #111827;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
        }
        
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            background: #000;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <h1 id="title">GBA Emulator Online</h1>
        <div id="loading-section">
            <h2 style="color: #38bdf8;">게임을 불러오는 중입니다...</h2>
            <p style="color: #9ca3af; margin-top: 0.5rem;">잠시만 기다려주세요.</p>
        </div>
    </div>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script>
        // 프로젝트 내부의 상대 경로 지정 (동일한 깃헙/서버 내에 있는 경로)
        const romUrl = '/assets/pokemon/gb/pokemon-rocket-science-en.gba';

        async function autoLoadGame() {
            try {
                const response = await fetch(romUrl);
                if (!response.ok) throw new Error('파일을 불러오지 못했습니다.');
                
                const blob = await response.blob();
                const file = new File([blob], "pokemon-rocket-science-en.gba", { type: "application/octet-stream" });
                
                handleFile(file);
            } catch (error) {
                document.getElementById('loading-section').innerHTML = `
                    <h2 style="color: #ef4444;">게임을 불러오는데 실패했습니다.</h2>
                    <p style="color: #9ca3af; margin-top: 0.5rem;">파일 경로를 확인해주세요.</p>
                `;
                console.error(error);
            }
        }

        function handleFile(file) {
            const mainContainer = document.getElementById('main-container');
            const gameContainer = document.getElementById('game-container');

            mainContainer.style.display = 'none';
            gameContainer.style.display = 'block';

            const fileUrl = URL.createObjectURL(file);

            window.EJS_player = '#game';
            window.EJS_core = 'gba';
            window.EJS_startOnLoaded = true;
            window.EJS_biosUrl = '';
            window.EJS_gameUrl = fileUrl;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/latest/data/loader.js';
            document.body.appendChild(script);
        }

        window.addEventListener('DOMContentLoaded', autoLoadGame);
    </script>
</body>
</html>
