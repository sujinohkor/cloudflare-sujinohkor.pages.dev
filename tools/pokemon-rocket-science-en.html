<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GBA Emulator Online</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #000; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script>
        // 본인의 서버에 있는 상대 경로 또는 정상 작동하는 경로 지정
        const romUrl = '/assets/pokemon/gb/pokemon-rocket-science-en.gba';
        
        window.EJS_player = '#game';
        window.EJS_core = 'gba';
        window.EJS_startOnLoaded = true;
        window.EJS_biosUrl = '';
        window.EJS_gameUrl = romUrl;
        
        // 최신(latest) 버전 대신 안정적인 3.2.0 버전 경로를 사용하여 WASM 테이블 충돌 우회
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/3.2.0/data/';

        const script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/3.2.0/data/loader.js';
        document.body.appendChild(script);
    </script>
</body>
</html>
