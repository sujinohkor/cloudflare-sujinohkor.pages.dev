<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get My IP</title>
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        /* 1. Reset & Base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #202020; color: #fff; transition: background 0.3s; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }
                
        /* 2. Layout */
        .app-container { display: flex; min-height: 100vh; width: 100%; }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar { 
            width: 260px; 
            height: calc(100vh - 40px); 
            position: fixed; 
            left: 20px; 
            top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        /* DAY/NIGHT 버튼 최상단 배치 스타일 */
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .main-content { 
            margin-left: 300px; 
            padding: 40px; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            gap: 20px; 
            overflow: hidden; 
            transition: 0.3s; 
            width: calc(100% - 300px);
        }

        /* 3. Components */
        .menu-btn { 
            width: 100%; 
            padding: 11px 14px; 
            cursor: pointer; 
            text-align: center;
            background: rgba(255, 255, 255, 0.03); 
            color: #ff9e40; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; 
            font-weight: bold; 
            transition: all 0.3s; 
            font-size: 0.85rem;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .bottom-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bottom-btns > .menu-btn {
            margin-bottom: 0;
        }

        .content-top { 
            border: 2px solid #ff9e40; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            background: rgba(255, 158, 64, 0.02); 
            min-height: 140px; 
            flex-shrink: 0;
        }
        .ip-label { font-size: 1rem; color: #ff9e40; margin-bottom: 8px; font-weight: bold; letter-spacing: 1px; }
        .ip-address { font-size: 5rem; font-weight: bold; font-family: 'Consolas', monospace; color: #fff; text-align: center; width: 100%; padding: 0 15px; word-break: break-all; overflow-wrap: break-word; }

        .content-down { 
            flex: 1; 
            display: flex; 
            flex-direction: row; 
            gap: 20px; 
            overflow: hidden; 
            min-height: 0;
        }
        .half-box { 
            flex: 1; 
            border: 2px solid #ff9e40; 
            border-radius: 16px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }

        #map-container { width: 100%; height: 100%; min-height: 250px; background: #151515; z-index: 1; }
        
        #info-container { 
            padding: 24px;
            background: transparent;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px; 
        }
        
        .info-row { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 158, 64, 0.15);
            font-size: 0.9rem;
        }
        
        .info-label { 
            color: #ff9e40;
            font-weight: 600;
            flex-shrink: 0;
            margin-right: 12px;
        }
        
        .info-value { 
            color: #e0e0e0;
            font-family: 'Consolas', monospace;
            text-align: right;
            word-break: break-all;
        }

        /* 다크 모드 카드/패널 그림자 */
        .card, .content-down, .content-top, .half-box {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }
        
        body.light-mode .menu-btn, body.light-mode .theme-btn, body.light-mode .theme-toggle-btn { 
            background: rgba(0, 0, 0, 0.02); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.5); 
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover { 
            background: rgba(243, 128, 32, 0.15); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.4); 
        }
        
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode .ip-address { color: #202020; }
        body.light-mode .menu-toggle-btn { color: #ffffff; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        body.light-mode .info-value { color: #202020; }
        body.light-mode .info-row { border-bottom-color: rgba(243, 128, 32, 0.2); }
        body.light-mode .card, 
        body.light-mode .content-down,
        body.light-mode .content-top,
        body.light-mode .half-box {
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15);
        }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; color: #ffffff; }
        
        @media (max-width: 900px) {
            .menu-toggle-btn { display: block; }
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; 
            }
            body.light-mode .sidebar {
                background: #ffffff !important; 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; 
            }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px; width: 100vw; max-height: 100svh; height: auto; overflow-y: auto; }
            .content-down { flex-direction: column; flex: none; height: auto; min-height: 600px; }
            .content-down .half-box:nth-child(1) { flex: 1; min-height: 250px; }
            .content-down .half-box:nth-child(2) { flex: 3; min-height: 0; }
            .ip-address { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-title">Get My IP</div>
        <div class="sidebar-top">
            <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
        </div>
        <button class="menu-btn" onclick="location.href='../index'">Home</button>

        <div class="bottom-btns">
            <button class="menu-btn" onclick="copyIP()">Copy IP</button>
            <button class="menu-btn" onclick="fetchIPInfo()">Refresh</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-section">
            <h1>Get My IP</h1>
            <p>Check your public IP and geographical location.</p>
        </header>

        <section class="content-top">
            <div class="ip-label">YOUR PUBLIC IP ADDRESS</div>
            <div class="ip-address" id="user-ip">Loading...</div>
        </section>

        <section class="content-down">
            <div class="half-box">
                <div id="map-container"></div>
            </div>
            <div class="half-box" id="info-container">
                <div style="text-align: center; color: #ff9e40; margin-top: 20px;">Fetching IP Details...</div>
            </div>
        </section>
    </main>
</div>

<script>
    const sidebar = document.getElementById('sidebar');
    const userIpElement = document.getElementById('user-ip');
    const infoContainer = document.getElementById('info-container');
    let map = null;
    let marker = null;
    let currentIP = '';

    let gpsLocationData = {
        city: "Requesting...",
        region: "Requesting...",
        country: "Requesting...",
        postal: "Requesting..."
    };

    function toggleSidebar() { sidebar.classList.toggle('active'); }
    
    document.getElementById('theme-toggle').addEventListener('click', () => { 
        document.body.classList.toggle('light-mode'); 
    });
    
    document.querySelector('.main-content').addEventListener('click', (e) => { 
        if (sidebar.classList.contains('active') && !e.target.closest('.sidebar') && !e.target.closest('.menu-toggle-btn')) { 
            sidebar.classList.remove('active'); 
        } 
    });

    sidebar.querySelectorAll('button').forEach(element => {
        element.addEventListener('click', () => {
            if (window.innerWidth <= 900) {
                sidebar.classList.remove('active');
            }
        });
    });

    function getClientEnv() {
        const ua = navigator.userAgent;
        let os = "Unknown OS";
        let browser = "Unknown Browser";

        if (ua.indexOf("Android") !== -1) {
            const match = ua.match(/Android\s([0-9\.]+)/);
            os = match ? `Android ${match[1]}` : "Android";
        } else if (ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) {
            os = "iOS";
        } else if (ua.indexOf("Windows NT 10.0") !== -1) {
            os = "Windows 10/11";
        } else if (ua.indexOf("Mac OS X") !== -1) {
            os = "macOS";
        } else if (ua.indexOf("Linux") !== -1) {
            os = "Linux";
        }

        if (ua.indexOf("Chrome") !== -1 && ua.indexOf("Edg") === -1) {
            const match = ua.match(/Chrome\/([0-9\.]+)/);
            browser = match ? `Chrome ${match[1]}` : "Chrome";
        } else if (ua.indexOf("Edg") !== -1) {
            const match = ua.match(/Edg\/([0-9\.]+)/);
            browser = match ? `Edge ${match[1]}` : "Edge";
        } else if (ua.indexOf("Safari") !== -1 && ua.indexOf("Chrome") === -1) {
            const match = ua.match(/Version\/([0-9\.]+)/);
            browser = match ? `Safari ${match[1]}` : "Safari";
        } else if (ua.indexOf("Firefox") !== -1) {
            const match = ua.match(/Firefox\/([0-9\.]+)/);
            browser = match ? `Firefox ${match[1]}` : "Firefox";
        }

        return { os, browser };
    }

    async function fetchIPInfo() {
        userIpElement.innerText = "Loading...";

        try {
            const response = await fetch('https://ipwho.is/');
            if (!response.ok) throw new Error('Network response was not ok');

            const data = await response.json();
            if (!data.success) throw new Error(data.message || 'IP lookup failed');

            currentIP = data.ip;
            userIpElement.innerText = currentIP;

            renderDetails(data);

            if (data.latitude && data.longitude) {
                renderMap(data.latitude, data.longitude, `${data.city || 'IP Location'} (IP)`);
            }

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const gpsLat = position.coords.latitude;
                        const gpsLon = position.coords.longitude;
                        
                        renderMap(gpsLat, gpsLon, "My Exact Location (GPS)");

                        try {
                            const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${gpsLat}&lon=${gpsLon}&accept-language=en`);
                            const geoData = await geoRes.json();

                            if (geoData && geoData.address) {
                                const addr = geoData.address;
                                gpsLocationData.city = addr.suburb || addr.neighbourhood || addr.quarter || addr.town || addr.village || addr.city || addr.county || addr.district || "Unknown";
                                gpsLocationData.region = addr.state || addr.province || "Unknown";
                                gpsLocationData.country = addr.country || "Unknown";
                                gpsLocationData.postal = addr.postcode || "Unknown";
                            } else {
                                setGpsFailedStatus("Not Found");
                            }
                        } catch (geoErr) {
                            console.warn("Reverse geocoding failed:", geoErr);
                            setGpsFailedStatus("Error");
                        }

                        renderDetails(data);
                    },
                    (geoError) => {
                        console.warn("GPS permission denied or timeout, fallback to IP location.", geoError);
                        setGpsFailedStatus("Permission Denied");
                        renderDetails(data);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                setGpsFailedStatus("Not Supported");
                renderDetails(data);
            }
        } catch (error) {
            console.error("IP Fetch Error:", error);
            userIpElement.innerText = "Error Loading IP";
            infoContainer.innerHTML = `<div style="color: #ff4d4d; text-align: center;">Failed to load details.</div>`;
        }
    }

    function setGpsFailedStatus(statusText) {
        gpsLocationData.city = statusText;
        gpsLocationData.region = statusText;
        gpsLocationData.country = statusText;
        gpsLocationData.postal = statusText;
    }

    function renderDetails(data) {
        const env = getClientEnv();
        
        let tzOffset = "UTC";
        if (data.timezone && data.timezone.offset !== undefined) {
            const hours = data.timezone.offset / 3600;
            const sign = hours >= 0 ? "+" : "-";
            const absHours = Math.abs(hours).toString().padStart(2, '0');
            tzOffset = `UTC ${sign}${absHours}:00`;
        }

        const details = [
            { label: "City", value: data.city || "Unknown" },
            { label: "● State/Region", value: data.region || "Unknown" },
            { label: "● Country", value: data.country || "Unknown" },
            { label: "● Postal Code", value: data.postal || "Unknown" },
            { label: "City (GPS)", value: gpsLocationData.city },
            { label: "● State/Region (GPS)", value: gpsLocationData.region },
            { label: "● Country (GPS)", value: gpsLocationData.country },
            { label: "● Postal Code (GPS)", value: gpsLocationData.postal },
            { label: "Time Zone", value: tzOffset },
            { label: "ISP", value: data.connection?.isp || "Unknown" },
            { label: "ASN", value: data.connection?.asn || "Unknown" },
            { label: "AS Type", value: data.connection?.domain ? "Isp" : "Unknown" },
            { label: "Abuse contact", value: data.borders ? `abuse@${data.connection?.domain || 'isp.com'}` : "kornet_ip@kt.com" },
            { label: "Range", value: data.ip ? `${data.ip}/24` : "Unknown" },
            { label: "Name of your computer", value: "unknown" },
            { label: "Operating System", value: env.os },
            { label: "Your Browser", value: env.browser },
            { label: "Proxy", value: data.security?.proxy ? "Used" : "Not used" }
        ];

        infoContainer.innerHTML = details.map(item => `
            <div class="info-row">
                <span class="info-label">${item.label}:</span>
                <span class="info-value">${item.value}</span>
            </div>
        `).join('');
    }

    function renderMap(lat, lon, locationLabel) {
        if (!map) {
            map = L.map('map-container').setView([lat, lon], 13);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        } else {
            map.setView([lat, lon], 13);
        }

        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lon]).addTo(map)
            .bindPopup(`<b>Location:</b> ${locationLabel}`)
            .openPopup();

        setTimeout(() => {
            if (map) map.invalidateSize();
        }, 200);
    }

    function copyIP() {
        if (!currentIP || currentIP === 'Loading...') return alert('IP Address is not loaded yet.');
        navigator.clipboard.writeText(currentIP).then(() => {
            alert('IP Address copied to clipboard!');
        });
    }

    window.addEventListener('DOMContentLoaded', fetchIPInfo);
</script>
</body>
</html>
