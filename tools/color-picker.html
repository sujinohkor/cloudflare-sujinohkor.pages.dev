<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <!-- 파비콘 설정 추가 -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <!-- 분리한 색상 DB 파일 로드 -->
    <script src="/codes/ntcColors.js"></script>
        <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }

        .app-container { display: flex; min-height: 100vh; width: 100%; }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar { 
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 2000; 
            display: flex; flex-direction: column; gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
            overflow-y: auto;
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        /* DAY/NIGHT 버튼 최상단 배치 스타일 (데스크톱용) */
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* 메인 콘텐츠 영역 */
        .main-content { 
            margin-left: 300px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; 
            gap: 20px; overflow: hidden; transition: 0.3s; 
            width: calc(100% - 300px);
        }

        /* 3. Components */
        .menu-btn { 
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .menu-list { display: flex; flex-direction: column; gap: 10px; }
        .menu-item { display: flex; flex-direction: column; gap: 6px; }                
        .input-group { display: flex; align-items: center; justify-content: space-between; }
        .menu-list .color-label { color: #ff9e40; font-weight: bold; font-size: 0.85rem; }                
        
        .side-input { width: 110px; padding: 6px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 158, 64, 0.35); color: #ccc; border-radius: 50px; text-align: center; font-size: 0.85rem; }
        .multi-input-container { display: flex; gap: 4px; }
        .small-input { flex: 1; min-width: 0; padding: 6px 2px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 158, 64, 0.35); color: #ccc; border-radius: 50px; text-align: center; font-size: 0.85rem; }
        .name-input-field { width: 100%; padding: 6px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 158, 64, 0.35); color: #ccc; border-radius: 50px; text-align: center; font-size: 0.85rem; }                
        
        .side-input:focus, .small-input:focus, .name-input-field:focus { outline: none; border-color: rgba(255, 158, 64, 0.8); }

        .bottom-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bottom-btns > .menu-btn {
            margin-bottom: 0;
        }

        .content-card { 
            border: 2px solid #ff9e40; border-radius: 16px; flex: 1; 
            display: flex; overflow: hidden; background: rgba(0, 0, 0, 0.2); 
            padding: 20px; gap: 20px; align-items: center; justify-content: center;
        }
        
        canvas { border-radius: 12px; flex-shrink: 0; }
        #colorField { width: 500px; height: 500px; cursor: crosshair; }
        #hueSlider { width: 40px; height: 500px; cursor: pointer; }
        #previewBox { width: 80px; height: 500px; border-radius: 12px; border: 1px solid rgba(255, 158, 64, 0.35); }

        .menu-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: rgba(255, 255, 255, 0.1); color: #777; background: transparent; }

        /* 다크 모드 카드/패널/캔버스 그림자 */
        .card, .content-card, #colorField, #hueSlider, #previewBox {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }
        body.light-mode .menu-btn, body.light-mode .theme-toggle-btn { 
            background: rgba(0, 0, 0, 0.02); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.5); 
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover { 
            background: rgba(243, 128, 32, 0.15); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.4); 
        }
        body.light-mode .menu-list .color-label { color: #F38020; }
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode .side-input, body.light-mode .small-input, body.light-mode .name-input-field { background: rgba(0, 0, 0, 0.02); border-color: rgba(243, 128, 32, 0.5); color: #202020; }
        body.light-mode .menu-toggle-btn { color: #ffffff; }
        body.light-mode .content-card { background: rgba(255, 255, 255, 0.5); border-color: #F38020; }
        body.light-mode .menu-btn:disabled { border-color: rgba(0, 0, 0, 0.1); color: #aaa; background: transparent; }

        /* 데이 모드 카드/패널/캔버스 그림자 */
        body.light-mode .card,         
        body.light-mode .content-card,
        body.light-mode #colorField,
        body.light-mode #hueSlider,
        body.light-mode #previewBox {
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15);
        }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { 
            display: none; position: fixed; bottom: 20px; left: 20px; z-index: 3000; 
            padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; 
            font-weight: bold; cursor: pointer; color: #ffffff; 
        }

        @media (max-width: 900px) { 
            .menu-toggle-btn { display: block; } 
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; 
            } 
            body.light-mode .sidebar { 
                background: #ffffff !important; 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; 
            }
            .sidebar.active { transform: translateX(0); } 
            .main-content { margin-left: 0; padding: 20px; width: 100vw; max-height: 100svh; height: auto; overflow-y: auto; } 
            .content-card { flex-direction: column; gap: 15px; height: auto; align-items: center; }
            #colorField { width: 300px; height: 300px; }
            #hueSlider { width: 300px; height: 30px; }
            #previewBox { width: 300px; height: 40px; }
        }
    </style>
</head>
<body>
<button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-title">Color Picker</div>
        <div class="sidebar-top">
            <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
        </div>

        <button class="menu-btn" onclick="location.href='../index'">Home</button>

        <nav class="menu-list">
            <div class="input-group">
                <a class="color-label">Hex</a>
                <input type="text" id="hex-input" class="side-input" value="#" maxlength="7">
            </div>

            <div class="menu-item">
                <a class="color-label">RGB</a>
                <div class="multi-input-container">
                    <input type="text" id="r" class="small-input" placeholder="R" maxlength="3" oninput="limitRange(this, 255); syncFromRGB()">
                    <input type="text" id="g" class="small-input" placeholder="G" maxlength="3" oninput="limitRange(this, 255); syncFromRGB()">
                    <input type="text" id="b" class="small-input" placeholder="B" maxlength="3" oninput="limitRange(this, 255); syncFromRGB()">
                </div>
            </div>

            <div class="menu-item">
                <a class="color-label">CMYK</a>
                <div class="multi-input-container">
                    <input type="text" id="c" class="small-input" readonly placeholder="C" maxlength="3" oninput="limitRange(this, 100); syncFromCMYK()">
                    <input type="text" id="m" class="small-input" readonly placeholder="M" maxlength="3" oninput="limitRange(this, 100); syncFromCMYK()">
                    <input type="text" id="y" class="small-input" readonly placeholder="Y" maxlength="3" oninput="limitRange(this, 100); syncFromCMYK()">
                    <input type="text" id="k" class="small-input" readonly placeholder="K" maxlength="3" oninput="limitRange(this, 100); syncFromCMYK()">
                </div>
            </div>

            <div class="menu-item">
                <a class="color-label">HSV</a>
                <div class="multi-input-container">
                    <input type="text" id="h" class="small-input" readonly placeholder="H" maxlength="3" oninput="limitRange(this, 360); syncFromHSV()">
                    <input type="text" id="s" class="small-input" readonly placeholder="S" maxlength="3" oninput="limitRange(this, 100); syncFromHSV()">
                    <input type="text" id="v" class="small-input" readonly placeholder="V" maxlength="3" oninput="limitRange(this, 100); syncFromHSV()">
                </div>
            </div>

            <div class="menu-item">
                <a class="color-label">HSL</a>
                <div class="multi-input-container">
                    <input type="text" id="h_l" class="small-input" readonly placeholder="H" maxlength="3" oninput="limitRange(this, 360); syncFromHSL()">
                    <input type="text" id="s_l" class="small-input" readonly placeholder="S" maxlength="3" oninput="limitRange(this, 100); syncFromHSL()">
                    <input type="text" id="l_l" class="small-input" readonly placeholder="L" maxlength="3" oninput="limitRange(this, 100); syncFromHSL()">
                </div>
            </div>

            <div class="menu-item">
                <a class="color-label">Color Name</a>
                <input type="text" id="name-input" class="name-input-field" readonly placeholder="Name">
            </div>
        </nav>

        <div class="bottom-btns">
            <button id="copy-btn" class="menu-btn" onclick="copyColor()">Copy</button>
            <button id="save-btn" class="menu-btn" onclick="saveColor()">Save the Color Swatch</button>
        </div>
    </aside>

    <main class="main-content" id="main-content">
        <header class="top-section">
            <h1>Color Picker</h1>
            <p>Colors can be selected or entered via HEX or RGB. Other fields are currently read-only.</p>
        </header>

        <section class="content-card">
            <canvas id="colorField" width="500" height="500"></canvas>
            <canvas id="hueSlider" width="40" height="500"></canvas>
            <div id="previewBox"></div>
        </section>
    </main>
</div>

<script>
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('main-content');
    const hexInput = document.getElementById('hex-input');
    const field = document.getElementById('colorField');
    const ctx = field.getContext('2d');
    const slider = document.getElementById('hueSlider');
    const sCtx = slider.getContext('2d');
    const preview = document.getElementById('previewBox');

    let currentH = 0, currentS = 100, currentV = 100;
    let isDraggingField = false, isDraggingSlider = false;
    let hue = 0, sat = 100, val = 100;

    function toggleSidebar() { 
        sidebar.classList.toggle('active'); 
    }

    sidebar.querySelectorAll('button').forEach(element => {
        element.addEventListener('click', () => {
            if (window.innerWidth <= 900) {
                sidebar.classList.remove('active');
            }
        });
    });

    document.getElementById('theme-toggle').addEventListener('click', () => { 
        document.body.classList.toggle('light-mode'); 
    });

    mainContent.addEventListener('click', (e) => { 
        if (sidebar.classList.contains('active') && !e.target.closest('.sidebar') && !e.target.closest('.menu-toggle-btn')) { 
            sidebar.classList.remove('active'); 
        } 
    });

    hexInput.addEventListener('input', (e) => {
        let val = e.target.value;
        if (!val.startsWith('#')) val = '#' + val.replace(/#/g, '');
        let hexPart = val.substring(1).replace(/[^0-9a-fA-F]/g, '').toUpperCase();
        e.target.value = '#' + hexPart.substring(0, 6);
        
        const copyBtn = document.getElementById('copy-btn');
        const saveBtn = document.getElementById('save-btn');

        if (hexPart.length === 6) {
            updateAll('hex', { 
                r: parseInt(hexPart.substr(0, 2), 16), 
                g: parseInt(hexPart.substr(2, 2), 16), 
                b: parseInt(hexPart.substr(4, 2), 16) 
            });
            copyBtn.disabled = false;
            saveBtn.disabled = false;
        } else {
            copyBtn.disabled = true;
            saveBtn.disabled = true;
        }
    });

    function updateAll(sourceType, values) {
        if (sourceType === 'hex' || sourceType === 'rgb') {
            let hsv = rgbToHsv(values.r, values.g, values.b);
            hue = hsv.h; sat = hsv.s; val = hsv.v;
        } else if (sourceType === 'hsv') {
            if (values.h !== undefined) hue = values.h;
            if (values.s !== undefined) sat = values.s;
            if (values.v !== undefined) val = values.v;
        }

        let rgb = hsvToRgb(hue, sat, val);
        let r = rgb.r, g = rgb.g, b = rgb.b;
        let hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();

        let c = 1 - (r / 255), m = 1 - (g / 255), y = 1 - (b / 255);
        let k = Math.min(c, m, y);
        c = Math.round(((c - k) / (1 - k) || 0) * 100);
        m = Math.round(((m - k) / (1 - k) || 0) * 100);
        y = Math.round(((y - k) / (1 - k) || 0) * 100);
        k = Math.round(k * 100);

        let maxVal = Math.max(r,g,b)/255, minVal = Math.min(r,g,b)/255;
        let l = (maxVal + minVal) / 2 * 100;
        let s_l = 0;
        if (maxVal !== minVal) {
            s_l = (l > 50) ? (maxVal - minVal) / (2 - maxVal - minVal) : (maxVal - minVal) / (maxVal + minVal);
        }
        s_l = Math.round(s_l * 100);

        if (sourceType !== 'hex') hexInput.value = hex;
        document.getElementById('r').value = r;
        document.getElementById('g').value = g;
        document.getElementById('b').value = b;
        document.getElementById('c').value = c;
        document.getElementById('m').value = m;
        document.getElementById('y').value = y;
        document.getElementById('k').value = k;
        document.getElementById('h').value = Math.round(hue);
        document.getElementById('s').value = Math.round(sat);
        document.getElementById('v').value = Math.round(val);
        document.getElementById('h_l').value = Math.round(hue);
        document.getElementById('s_l').value = s_l;
        document.getElementById('l_l').value = Math.round(l);

        document.getElementById('name-input').value = getColorName(hex);
        document.getElementById('previewBox').style.backgroundColor = hex;

        drawField(Math.round(hue), Math.round(sat), Math.round(val));
        drawHue();
    }

    function syncFromRGB() { 
        updateAll('rgb', { 
            r: parseInt(document.getElementById('r').value)||0, 
            g: parseInt(document.getElementById('g').value)||0, 
            b: parseInt(document.getElementById('b').value)||0 
        }); 
    }

    function limitRange(input, max) {
        let value = input.value.replace(/[^0-9]/g, '');
        if (value !== '') {
            let num = parseInt(value);
            if (num > max) num = max;
            input.value = num;
        } else {
            input.value = '';
        }
    }

    function drawHue() {
        const isMobile = window.innerWidth <= 900;
        const width = isMobile ? 300 : 40;
        const height = isMobile ? 30 : 500;

        slider.width = width;
        slider.height = height;
        sCtx.clearRect(0, 0, width, height);

        let grad = isMobile ? 
            sCtx.createLinearGradient(0, 0, width, 0) : 
            sCtx.createLinearGradient(0, 0, 0, height);

        for(let i=0; i<=6; i++) grad.addColorStop(i/6, `hsl(${i*60}, 100%, 50%)`);
        sCtx.fillStyle = grad; 
        sCtx.fillRect(0, 0, width, height);

        let x = 0, y = 0;
        if (isMobile) {
            x = (hue / 360) * width;
            y = height / 2;
        } else {
            x = width / 2;
            y = (hue / 360) * height;
        }

        sCtx.strokeStyle = '#fff'; 
        sCtx.lineWidth = 3;
        sCtx.beginPath();
        let radius = isMobile ? (height / 2 - 4) : 15;
        sCtx.arc(x, y, radius, 0, Math.PI * 2);
        sCtx.stroke();
    }

    function drawField(h, s, v) {
        const isMobile = window.innerWidth <= 900;
        const size = isMobile ? 300 : 500;
        field.width = size;
        field.height = size;

        ctx.fillStyle = `hsl(${h}, 100%, 50%)`;
        ctx.fillRect(0, 0, size, size);
        let gradW = ctx.createLinearGradient(0, 0, size, 0); 
        gradW.addColorStop(0, '#fff'); 
        gradW.addColorStop(1, 'transparent');
        ctx.fillStyle = gradW; 
        ctx.fillRect(0, 0, size, size);
        
        let gradB = ctx.createLinearGradient(0, 0, 0, size); 
        gradB.addColorStop(0, 'transparent'); 
        gradB.addColorStop(1, '#000');
        ctx.fillStyle = gradB; 
        ctx.fillRect(0, 0, size, size);

        let px = (s / 100) * (size - 1), py = (1 - (v / 100)) * (size - 1);
        ctx.strokeStyle = '#fff'; 
        ctx.lineWidth = 2;
        ctx.beginPath(); 
        ctx.arc(px, py, 15, 0, Math.PI * 2); 
        ctx.stroke();
    }

    field.addEventListener('mousedown', (e) => { isDraggingField = true; updateFromField(e); });
    field.addEventListener('touchstart', (e) => { isDraggingField = true; updateFromField(e.touches[0]); e.preventDefault(); }, {passive: false});

    slider.addEventListener('mousedown', (e) => { isDraggingSlider = true; updateFromSlider(e); });
    slider.addEventListener('touchstart', (e) => { isDraggingSlider = true; updateFromSlider(e.touches[0]); e.preventDefault(); }, {passive: false});

    window.addEventListener('mousemove', (e) => {
        if (isDraggingField) updateFromField(e);
        else if (isDraggingSlider) updateFromSlider(e);
    });
    window.addEventListener('touchmove', (e) => {
        if (isDraggingField) updateFromField(e.touches[0]);
        else if (isDraggingSlider) updateFromSlider(e.touches[0]);
        e.preventDefault();
    }, {passive: false});

    window.addEventListener('mouseup', () => { isDraggingField = false; isDraggingSlider = false; });
    window.addEventListener('touchend', () => { isDraggingField = false; isDraggingSlider = false; });

    function updateFromField(e) {
        const rect = field.getBoundingClientRect();
        const scaleX = field.width / rect.width;
        const scaleY = field.height / rect.height;

        let x = Math.max(0, Math.min((e.clientX - rect.left) * scaleX, field.width - 1));
        let y = Math.max(0, Math.min((e.clientY - rect.top) * scaleY, field.height - 1));

        let s = (x / (field.width - 1)) * 100;
        let v = (1 - (y / (field.height - 1))) * 100;

        updateAll('hsv', { h: hue, s: s, v: v }); 
    }

    function updateFromSlider(e) {
        const rect = slider.getBoundingClientRect();
        const isMobile = window.innerWidth <= 900;

        let h;
        if (isMobile) {
            let x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            h = (x / rect.width) * 360;
        } else {
            let y = Math.max(0, Math.min(e.clientY - rect.top, rect.height));
            h = (y / rect.height) * 360;
        }

        let s = parseInt(document.getElementById('s').value) || 0;
        let v = parseInt(document.getElementById('v').value) || 0;

        updateAll('hsv', { h: h, s: s, v: v });
    }

    function getColorName(hex) {
        hex = hex.replace('#', '');
        let r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
        let minD = Infinity, name = "Unknown";
        for (let c of ntcColors) {
            let dr = parseInt(c[0].substr(0, 2), 16), dg = parseInt(c[0].substr(2, 2), 16), db = parseInt(c[0].substr(4, 2), 16);
            let d = Math.sqrt((r-dr)**2 + (g-dg)**2 + (b-db)**2);
            if (d < minD) { minD = d; name = c[1]; }
        }
        return name;
    }

    function hsvToRgb(h, s, v) {
        s /= 100; v /= 100;
        let i = Math.floor(h / 60), f = h / 60 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s), r, g, b;
        if (i % 6 == 0) { r = v; g = t; b = p; }
        else if (i % 6 == 1) { r = q; g = v; b = p; }
        else if (i % 6 == 2) { r = p; g = v; b = t; }
        else if (i % 6 == 3) { r = p; g = q; b = v; }
        else if (i % 6 == 4) { r = t; g = p; b = v; }
        else { r = v; g = p; b = q; }
        return { r: Math.round(r * 255), g: Math.round(g * 255), b: Math.round(b * 255) };
    }

    function copyColor() {
        const hex = document.getElementById('hex-input').value;
        const r = document.getElementById('r').value;
        const g = document.getElementById('g').value;
        const b = document.getElementById('b').value;
        const c = document.getElementById('c').value;
        const m = document.getElementById('m').value;
        const y = document.getElementById('y').value;
        const k = document.getElementById('k').value;
        const h = document.getElementById('h').value;
        const s = document.getElementById('s').value;
        const v = document.getElementById('v').value;
        const h_l = document.getElementById('h_l').value;
        const s_l = document.getElementById('s_l').value;
        const l_l = document.getElementById('l_l').value;
        const name = document.getElementById('name-input').value;

        const copyText = `Color Name: ${name}\nHEX: ${hex}\nRGB: (${r}, ${g}, ${b})\nCMYK: (${c}%, ${m}%, ${y}%, ${k}%)\nHSV: (${h}°, ${s}%, ${v}%)\nHSL: (${h_l}°, ${s_l}%, ${l_l}%)`;

        navigator.clipboard.writeText(copyText).then(() => {
            alert("Color information has been copied to the clipboard!\n\n" + copyText);
        }).catch(err => {
            console.error('Copy failed:', err);
            alert("Failed to copy.");
        });
    }

    function saveColor() {
        const hex = document.getElementById('hex-input').value;
        const name = document.getElementById('name-input').value;
        const filename = `${name}(${hex}).png`;

        const canvas = document.createElement('canvas');
        canvas.width = 500;
        canvas.height = 700;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = hex;
        ctx.fillRect(0, 0, 500, 500);

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 500, 500, 200);

        ctx.fillStyle = "#000000";
        ctx.font = "bold 30pt 'Times New Roman'";
        ctx.fillText(hex.toUpperCase(), 20, 570);

        const minorWords = ['of', 'in', 'the', 'a', 'and', 'at', 'on', 'or', 'for'];
        const capitalizedName = name.split(' ').map((word, index) => {
            if (index === 0 || !minorWords.includes(word.toLowerCase())) {
                return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
            }
            return word.toLowerCase();
        }).join(' ');
        ctx.fillText(capitalizedName, 20, 630);

        ctx.font = "bold 15pt 'Times New Roman'";
        const url = "www.sujinohkor.kr | sujinohkor.pages.dev";
        const textWidth = ctx.measureText(url).width;
        ctx.fillText(url, 500 - textWidth - 20, 680);

        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL("image/png");
        link.click();
    }

    function rgbToHsv(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        let max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, v = max;
        let d = max - min;
        s = max === 0 ? 0 : d / max;
        if (max === min) h = 0;
        else {
            if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
            else if (max === g) h = (b - r) / d + 2;
            else if (max === b) h = (r - g) / d + 4;
            h /= 6;
        }
        return { h: Math.round(h * 360), s: Math.round(s * 100), v: Math.round(v * 100) };
    }

    window.addEventListener('resize', () => {
        drawField(Math.round(hue), Math.round(sat), Math.round(val));
        drawHue();
    });

    updateAll('init', { r: 255, g: 0, b: 0 });
</script>
