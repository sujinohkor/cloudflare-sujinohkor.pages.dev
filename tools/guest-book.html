<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Book</title>
    <!-- Favicon settings -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }
                
        .app-container { display: flex; min-height: 100vh; width: 100%; }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar { 
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 1000; 
            display: flex; flex-direction: column; gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        /* DAY/NIGHT 버튼 최상단 배치 스타일 (데스크톱용) */
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* 메인 콘텐츠 영역 */
        .main-content { 
            margin-left: 300px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; 
            gap: 20px; overflow: hidden; transition: 0.3s; 
            width: calc(100% - 300px);
        }

        /* 3. Components */
        .menu-btn { 
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* 미니 패널(카드) 스타일 */
        .info-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 158, 64, 0.25);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #ccc;
        }
        .info-row span:last-child {
            color: #ff9e40;
        }

        .content-top { 
            flex: 0 0 auto; border: 2px solid #ff9e40; border-radius: 16px; 
            display: flex; flex-direction: column; padding: 16px; gap: 12px; 
            background: rgba(255, 158, 64, 0.02); 
        }
        .content-top input[type="text"] {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 158, 64, 0.35);
            border-radius: 50px; padding: 11px 16px; color: #fff; font-size: 0.9rem; outline: none;
            font-family: inherit; width: 100%; font-weight: bold;
        }
        .content-top input[type="text"]::placeholder { color: #888; }

        .content-down { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; 
            padding: 20px; overflow-y: auto; display: flex; flex-direction: column; 
            background: rgba(0, 0, 0, 0.2);
        }

        /* Guestbook List Styling */
        .guestbook-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .guestbook-item {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 158, 64, 0.35);
            border-radius: 12px; padding: 14px 18px; word-break: break-all;
        }
        .guestbook-item .author { color: #ff9e40; font-weight: bold; margin-bottom: 4px; font-size: 0.9rem; }
        .guestbook-item .body { color: #eee; font-size: 0.95rem; white-space: pre-wrap; margin-bottom: 8px; }
        .guestbook-item .meta { color: #aaa; font-size: 0.8rem; }

        /* 다크 모드 카드/패널 그림자 */
        .card, .content-down, .content-top {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }        
        body.light-mode .menu-btn, body.light-mode .theme-toggle-btn { 
            background: rgba(0, 0, 0, 0.02); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.5); 
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover { 
            background: rgba(243, 128, 32, 0.15); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.4); 
        }

        body.light-mode .info-panel {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(243, 128, 32, 0.5);
        }
        body.light-mode .info-row { color: #202020; }
        body.light-mode .info-row span:last-child { color: #F38020; }

        body.light-mode .content-top { border-color: #F38020; background: rgba(243, 128, 32, 0.02); }
        body.light-mode .content-down { border-color: #F38020; background: rgba(255, 255, 255, 0.5); }
        body.light-mode .content-top input[type="text"] {
            background: rgba(0, 0, 0, 0.02);
            color: #202020;
            border-color: rgba(243, 128, 32, 0.5);
        }
        body.light-mode .content-top input[type="text"]::placeholder { color: #888; }

        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode .guestbook-item { 
            background: rgba(0, 0, 0, 0.02); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 2px 5px rgba(243, 128, 32, 0.05);
        }
        body.light-mode .guestbook-item .author { color: #F38020; }
        body.light-mode .guestbook-item .body { color: #202020; }
        body.light-mode .guestbook-item .meta { color: #666; }
        body.light-mode .menu-toggle-btn { color: #ffffff; }

        body.light-mode .card, 
        body.light-mode .content-down,
        body.light-mode .content-top {
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15);
        }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { 
            display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; 
            padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; 
            font-weight: bold; cursor: pointer; color: #ffffff; 
        }        

        @media (max-width: 900px) { 
            .menu-toggle-btn { display: block; } 
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; 
            } 
            body.light-mode .sidebar { 
                background: #ffffff !important; 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; 
            }
            .sidebar.active { transform: translateX(0); } 
            .main-content { margin-left: 0; padding: 20px; width: 100vw; max-height: 100svh; } 
        }
    </style>
</head>
<body>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">Guest Book</div>
            <div class="sidebar-top">
                <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
            </div>
            
            <button class="menu-btn" onclick="location.href='../index'">Home</button>
            <button class="menu-btn" id="submit-btn">Save Note</button>

            <div class="info-panel">
                <div class="info-row">
                    <span>Total Entries</span>
                    <span id="note-count-all">0</span>
                </div>
                <div class="info-row">
                    <span>Character Count</span>
                    <span><span id="char-count">0</span>/1,000</span>
                </div>
            </div>
        </aside>

        <main class="main-content" id="main-content">
            <header class="top-section">
                <h1>Guest Book</h1>
                <p>Leave a message below.</p>
            </header>

            <form id="guestbook-form" style="display: contents;">
                <section class="content-top">
                    <input type="text" id="nickname" placeholder="Nickname" maxlength="20" required autocomplete="off">
                    <input type="text" id="content" placeholder="Enter your message here..." maxlength="1000" required autocomplete="off">
                </section>
            </form>

            <section class="content-down">
                <ul id="guestbook-list" class="guestbook-list"></ul>
            </section>
        </main>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        const themeToggle = document.getElementById('theme-toggle');
        const nicknameInput = document.getElementById('nickname');
        const contentInput = document.getElementById('content');
        const charCount = document.getElementById('char-count');
        const guestbookForm = document.getElementById('guestbook-form');

        function toggleSidebar() { 
            sidebar.classList.toggle('active'); 
        }

        sidebar.querySelectorAll('button').forEach(element => {
            element.addEventListener('click', () => {
                if (window.innerWidth <= 900) {
                    sidebar.classList.remove('active');
                }
            });
        });

        themeToggle.addEventListener('click', () => { 
            document.body.classList.toggle('light-mode'); 
        });

        mainContent.addEventListener('click', () => { 
            if (sidebar.classList.contains('active')) { 
                sidebar.classList.remove('active'); 
            } 
        });

        contentInput.addEventListener('input', () => {
            charCount.textContent = contentInput.value.length;
        });

        nicknameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                contentInput.focus();
            }
        });

        contentInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                guestbookForm.requestSubmit();
            }
        });

        document.getElementById('submit-btn').addEventListener('click', () => {
            guestbookForm.requestSubmit();
        });
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot }       from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBaH4OIqC_x0-6jIq4RnJv_wCD9efC4wUU",
            authDomain: "test-73099.firebaseapp.com",
            projectId: "test-73099",
            storageBucket: "test-73099.firebasestorage.app",
            messagingSenderId: "226251046164",
            appId: "1:226251046164:web:18e6465b25137163fa1601"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const collectionRef = collection(db, "GUEST-BOOK");

        async function getCountry() {
            try {
                const res = await fetch("https://ipwho.is/");
                const data = await res.json();
                if (data.success && data.country_code) return data.country_code;
            } catch (e) {}

            try {
                const res = await fetch("https://ipapi.co/json/");
                const data = await res.json();
                if (data.country_code) return data.country_code;
            } catch (e) {}

            try {
                const res = await fetch("https://freeipapi.com/api/json");
                const data = await res.json();
                if (data.countryCode) return data.countryCode;
            } catch (e) {}

            return "Unknown";
        }

        guestbookForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const nicknameVal = nicknameInput.value.trim();
            const contentVal = contentInput.value.trim();

            if (!nicknameVal || !contentVal) return;

            const countryVal = await getCountry();

            try {
                await addDoc(collectionRef, {
                    nickname: nicknameVal,
                    content: contentVal,
                    country: countryVal,
                    createdAt: serverTimestamp()
                });

                nicknameInput.value = "";
                contentInput.value = "";
                charCount.textContent = "0";
            } catch (error) {
                console.error("저장 실패:", error);
            }
        });

        const q = query(collectionRef, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const listElement = document.getElementById("guestbook-list");
            const countElement = document.getElementById("note-count-all");
            
            listElement.innerHTML = "";
            countElement.textContent = snapshot.docs.length;

            snapshot.docs.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement("li");
                li.className = "guestbook-item";

                const authorDiv = document.createElement("div");
                authorDiv.className = "author";
                authorDiv.textContent = data.nickname || "Anonymous";

                const bodyDiv = document.createElement("div");
                bodyDiv.className = "body";
                bodyDiv.textContent = data.content || "";

                let dateString = "Just Now";
                if (data.createdAt) {
                    dateString = data.createdAt.toDate().toLocaleString("en-US");
                }
                const countryVal = data.country || "Unknown";

                const metaDiv = document.createElement("div");
                metaDiv.className = "meta";
                metaDiv.textContent = `${dateString} | Location: ${countryVal}`;

                li.appendChild(authorDiv);
                li.appendChild(bodyDiv);
                li.appendChild(metaDiv);
                listElement.appendChild(li);
            });
        });
    </script>
</body>
</html>
