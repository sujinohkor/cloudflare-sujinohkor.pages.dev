<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architecture Diagram SVG Generator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:#101010; --panel:rgba(16,16,16,.28); --text:#fff; --muted:#888;
  --accent:#ff9e40; --field:rgba(255,255,255,.04); --border:rgba(255,158,64,.38);
}
body {
  background:var(--bg); color:var(--text); font-family:"Segoe UI",sans-serif;
  min-height:100vh; overflow:hidden; transition:.25s;
}
body.light {
  --bg:#fff; --panel:rgba(255,255,255,.45); --text:#202020;
  --muted:#666; --field:rgba(0,0,0,.025);
}
.app { display:flex; min-height:100vh; width:100%; }

.sidebar {
  width:260px; height:calc(100vh - 40px); position:fixed; left:20px; top:20px; z-index:10;
  padding:25px 20px; display:flex; flex-direction:column; gap:12px;
  border:1px solid var(--border); border-radius:24px; background:var(--panel);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 20px 40px rgba(0,0,0,.35);
}
body.light .sidebar {
  background:rgba(255,255,255,.3);
  border-color:rgba(243,128,32,.35);
  box-shadow:0 20px 40px rgba(243,128,32,.15);
}
.sidebar-title {
  color:#ff9e40; font-size:1.1rem; font-weight:bold; margin-bottom:5px;
  text-align:center; letter-spacing:1px;
}
.sidebar-top { display:flex; flex-direction:column; gap:10px; margin-bottom:5px; }

.theme-toggle-btn {
  width:100%; padding:11px; background:rgba(255,255,255,.03); color:#ff9e40;
  border:1px solid rgba(255,158,64,.5); border-radius:50px; font-weight:bold;
  cursor:pointer; transition:.3s; text-align:center;
}
.theme-toggle-btn:hover { background:rgba(255,158,64,.2); border-color:rgba(255,158,64,.6); }

.menu-btn {
  width:100%; padding:11px 14px; cursor:pointer; text-align:center;
  background:rgba(255,255,255,.03); color:#ff9e40; border:1px solid rgba(255,158,64,.35);
  border-radius:50px; font-weight:bold; transition:all .3s; font-size:.85rem;
  display:flex; align-items:center; justify-content:center; line-height:1;
}
.menu-btn:hover { background:rgba(255,158,64,.2); border-color:rgba(255,158,64,.6); }

body.light .menu-btn,
body.light .theme-toggle-btn {
  background:rgba(0,0,0,.02); color:#F38020; border-color:rgba(243,128,32,.5);
}
body.light .menu-btn:hover,
body.light .theme-toggle-btn:hover {
  background:rgba(243,128,32,.15); border-color:rgba(243,128,32,.4);
}

.palette-btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.palette-btns .menu-btn.active {
  background:rgba(255,158,64,.2); border-color:rgba(255,158,64,.75);
}

.controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:4px 0; }
.control { display:flex; flex-direction:column; gap:5px; }
.control label { font-size:11px; color:var(--muted); padding-left:4px; }
.control input {
  width:100%; padding:9px 10px; border:1px solid rgba(255,255,255,.13);
  border-radius:10px; background:var(--field); color:var(--text); outline:none;
}
body.light .control input { border-color:rgba(0,0,0,.14); }

.main {
  margin-left:300px; padding:40px; flex:1; height:100vh; width:calc(100% - 300px);
  display:flex; flex-direction:column; gap:20px; overflow:hidden;
}
header h1 { font-size:1.8rem; margin-bottom:5px; }
header p { font-size:.95rem; color:var(--muted); }

.workspace { display:flex; gap:20px; flex:1; min-height:0; }

.panel {
  border:2px solid var(--accent); border-radius:16px; background:rgba(0,0,0,.12);
  box-shadow:0 10px 20px rgba(0,0,0,.28); padding:20px; min-height:0;
}
body.light .panel {
  background:rgba(255,255,255,.5); border-color:#F38020;
  box-shadow:0 10px 20px rgba(243,128,32,.15);
}

.left { flex:1; display:flex; flex-direction:column; gap:12px; }
.left label { color:var(--accent); font-weight:700; }

textarea {
  width:100%; flex:1; resize:none; border-radius:12px; padding:15px;
  border:1px solid rgba(255,255,255,.15); background:var(--field); color:var(--text);
  font-size:16px; font-family:inherit; line-height:1.5; outline:none;
}
body.light textarea {
  background:rgba(0,0,0,.02); color:#202020; border-color:rgba(0,0,0,.15);
}
textarea:focus { border-color:var(--accent); }

.hint { font-size:12px; color:var(--muted); line-height:1.5; }

.right {
  flex:1.2; overflow:auto; display:flex; align-items:flex-start; justify-content:flex-start;
}
.preview-wrap { min-width:760px; flex:0 0 auto; }
.preview-wrap svg { width:760px; min-width:760px; height:auto; display:block; }

.menu-toggle {
  display:none; position:fixed; left:20px; bottom:20px; z-index:20; width:auto;
  padding:10px 15px; background:var(--accent); color:#fff; border:none;
  border-radius:50px; font-weight:bold;
}

@media(max-width:900px) {
  body { overflow:auto; }
  .menu-toggle { display:block; }
  .sidebar {
    transform:translateX(-320px); transition:.25s; background:var(--bg);
  }
  .sidebar.active { transform:translateX(0); }
  .main {
    margin-left:0; padding:20px; width:100vw; height:auto; min-height:100svh;
  }
  .workspace { flex-direction:column; }
  .left { min-height:330px; }
  .right { min-height:300px; }
}
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle">MENU</button>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Architecture SVG Animator</div>

    <div class="sidebar-top">
      <button class="theme-toggle-btn" id="themeBtn">DAY / NIGHT</button>
    </div>

    <button class="menu-btn" onclick="location.href='../index'">Home</button>

    <div class="palette-btns">
      <button class="menu-btn active" id="blackBtn">Black</button>
      <button class="menu-btn" id="whiteBtn">White</button>
    </div>

    <div class="controls">
      <div class="control">
        <label for="nodeDelay">Node Delay</label>
        <input id="nodeDelay" type="number" min="0" step="0.1" value="0.65">
      </div>
      <div class="control">
        <label for="duration">Fade Duration</label>
        <input id="duration" type="number" min="0.05" step="0.05" value="0.35">
      </div>
      <div class="control">
        <label for="fontSize">Font Size</label>
        <input id="fontSize" type="number" min="10" step="1" value="17">
      </div>
      <div class="control">
        <label for="canvasWidth">Width</label>
        <input id="canvasWidth" type="number" min="520" step="10" value="900">
      </div>
    </div>

    <button class="menu-btn" id="applyBtn">Apply Animation</button>
    <button class="menu-btn" id="replayBtn">Replay</button>
    <button class="menu-btn" id="copyBtn">Copy SVG Code</button>
    <button class="menu-btn" id="downloadBtn">Download SVG</button>
    <button class="menu-btn" id="resetBtn">Reset</button>
  </aside>

  <main class="main" id="main">
    <header>
      <h1>Architecture Diagram Generator</h1>
      <p>Enter system components in sequence to automatically generate an animated architecture diagram.</p>
    </header>

    <div class="workspace">
      <section class="panel left">
        <label for="architectureInput">Architecture</label>
        <textarea id="architectureInput" spellcheck="false"></textarea>
        <div class="hint">
          Separate components with <strong>→</strong> or use one component per line.
          Example: <strong>Client → API Gateway → Application Server → Database</strong>.
        </div>
      </section>

      <section class="panel right">
        <div class="preview-wrap" id="previewWrap"></div>
      </section>
    </div>
  </main>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";
const architectureInput = document.getElementById("architectureInput");
const previewWrap = document.getElementById("previewWrap");
const blackBtn = document.getElementById("blackBtn");
const whiteBtn = document.getElementById("whiteBtn");

let architectureTheme = "black";

const defaults = {
  text: `Client → API Gateway → Application Server → Database`,
  nodeDelay: 0.65,
  duration: 0.35,
  fontSize: 17,
  canvasWidth: 900
};

function escapeXml(value) {
  return value.replace(/[<>&'"]/g, ch => ({
    "<":"&lt;", ">":"&gt;", "&":"&amp;", "'":"&apos;", '"':"&quot;"
  }[ch]));
}

function num(id, fallback) {
  const value = Number(document.getElementById(id).value);
  return Number.isFinite(value) ? value : fallback;
}

function palette() {
  if (architectureTheme === "white") {
    return {
      bg:"#f3f3f3",
      border:"#cfcfcf",
      node:"#e2e2e2",
      nodeStroke:"#bcbcbc",
      text:"#202020",
      line:"#9a9a9a",
      active:"#333333",
      activeText:"#ffffff"
    };
  }

  return {
    bg:"#181818",
    border:"#333333",
    node:"#262626",
    nodeStroke:"#454545",
    text:"#f1f1f1",
    line:"#555555",
    active:"#ffffff",
    activeText:"#181818"
  };
}

function parseNodes() {
  return architectureInput.value
    .replace(/\r/g, "")
    .split(/\n|→/g)
    .map(s => s.trim())
    .filter(Boolean);
}

function measureText(text, fontSize) {
  const canvas = measureText.canvas || (measureText.canvas = document.createElement("canvas"));
  const ctx = canvas.getContext("2d");
  ctx.font = `${fontSize}px "Segoe UI", sans-serif`;
  return ctx.measureText(text).width;
}

function buildSvg() {
  const nodes = parseNodes();
  const nodeDelay = Math.max(0, num("nodeDelay", defaults.nodeDelay));
  const duration = Math.max(0.05, num("duration", defaults.duration));
  const fontSize = Math.max(10, num("fontSize", defaults.fontSize));
  const requestedWidth = Math.max(520, num("canvasWidth", defaults.canvasWidth));
  const p = palette();

  const padX = 36;
  const padY = 42;
  const nodeHeight = 64;
  const gap = 72;
  const minNodeWidth = 120;
  const maxNodeWidth = 220;

  const nodeWidths = nodes.map(label =>
    Math.min(maxNodeWidth, Math.max(minNodeWidth, Math.ceil(measureText(label, fontSize) + 42)))
  );

  const contentWidth = nodeWidths.reduce((a,b) => a + b, 0) + Math.max(0, nodes.length - 1) * gap;
  const width = Math.max(requestedWidth, contentWidth + padX * 2);
  const height = 190;
  const y = padY + 18;

  let x = padX;
  const centers = [];
  const parts = [];

  nodes.forEach((label, index) => {
    const w = nodeWidths[index];
    centers.push({ x: x + w / 2, left: x, right: x + w, width: w });

    const begin = (index * nodeDelay).toFixed(3);

    parts.push(`
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="${begin}s" dur="${duration}s" fill="freeze"/>
  <rect x="${x}" y="${y}" width="${w}" height="${nodeHeight}" rx="14"
        fill="${p.node}" stroke="${p.nodeStroke}" stroke-width="2"/>
  <text x="${x + w/2}" y="${y + nodeHeight/2 + fontSize*.35}"
        fill="${p.text}" font-size="${fontSize}" font-family="'Segoe UI', sans-serif"
        text-anchor="middle" font-weight="600">${escapeXml(label)}</text>
</g>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="${begin}s" dur="${duration}s" fill="freeze"/>
  <rect x="${x}" y="${y}" width="${w}" height="${nodeHeight}" rx="14"
        fill="${p.active}" opacity="0.12"/>
</g>`);

    x += w + gap;
  });

  centers.forEach((node, index) => {
    if (index >= centers.length - 1) return;

    const next = centers[index + 1];
    const x1 = node.right + 12;
    const x2 = next.left - 18;
    const cy = y + nodeHeight / 2;
    const begin = ((index + 1) * nodeDelay - duration * 0.25).toFixed(3);

    parts.push(`
<line x1="${x1}" y1="${cy}" x2="${x2}" y2="${cy}"
      stroke="${p.line}" stroke-width="3" stroke-linecap="round"/>
<line x1="${x1}" y1="${cy}" x2="${x2}" y2="${cy}"
      stroke="${p.active}" stroke-width="3" stroke-linecap="round"
      pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
  <animate attributeName="stroke-dashoffset" from="1" to="0"
           begin="${Math.max(0, Number(begin)).toFixed(3)}s" dur="${duration}s" fill="freeze"/>
</line>
<polygon points="${x2},${cy} ${x2-10},${cy-6} ${x2-10},${cy+6}"
         fill="${p.active}" opacity="0">
  <animate attributeName="opacity" from="0" to="1"
           begin="${((index + 1) * nodeDelay).toFixed(3)}s" dur="${duration}s" fill="freeze"/>
</polygon>`);
  });

  if (nodes.length === 0) {
    parts.push(`<text x="${width/2}" y="${height/2}" fill="${p.text}" font-size="${fontSize}" font-family="'Segoe UI', sans-serif" text-anchor="middle">Enter architecture components</text>`);
  }

  return `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="${NS}">
  <rect width="${width}" height="${height}" rx="16" fill="${p.bg}" stroke="${p.border}" stroke-width="2"/>
  ${parts.join("\n")}
</svg>`;
}

function render() {
  const svg = buildSvg();
  previewWrap.innerHTML = svg.replace(/^<\?xml[^>]*>\s*/i, "");
  return svg;
}

function replay() {
  const svg = buildSvg();
  previewWrap.innerHTML = "";
  requestAnimationFrame(() => {
    previewWrap.innerHTML = svg.replace(/^<\?xml[^>]*>\s*/i, "");
  });
}

async function copySvg() {
  try {
    await navigator.clipboard.writeText(buildSvg());
  } catch {}
}

function downloadSvg() {
  const blob = new Blob([buildSvg()], { type:"image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "architecture-diagram.svg";

  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function setArchitectureTheme(theme) {
  architectureTheme = theme === "white" ? "white" : "black";

  blackBtn.classList.toggle("active", architectureTheme === "black");
  whiteBtn.classList.toggle("active", architectureTheme === "white");

  replay();
}

function resetAll() {
  architectureInput.value = defaults.text;
  document.getElementById("nodeDelay").value = defaults.nodeDelay;
  document.getElementById("duration").value = defaults.duration;
  document.getElementById("fontSize").value = defaults.fontSize;
  document.getElementById("canvasWidth").value = defaults.canvasWidth;

  architectureTheme = "black";
  blackBtn.classList.add("active");
  whiteBtn.classList.remove("active");

  render();
}

document.getElementById("applyBtn").addEventListener("click", replay);
document.getElementById("replayBtn").addEventListener("click", replay);
document.getElementById("copyBtn").addEventListener("click", copySvg);
document.getElementById("downloadBtn").addEventListener("click", downloadSvg);
document.getElementById("resetBtn").addEventListener("click", resetAll);

document.getElementById("themeBtn").addEventListener("click", () => {
  document.body.classList.toggle("light");
});

document.getElementById("menuToggle").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("active");
});

document.getElementById("main").addEventListener("click", () => {
  document.getElementById("sidebar").classList.remove("active");
});

blackBtn.addEventListener("click", () => setArchitectureTheme("black"));
whiteBtn.addEventListener("click", () => setArchitectureTheme("white"));

let renderTimer = null;
[architectureInput, ...document.querySelectorAll(".control input")].forEach(el => {
  el.addEventListener("input", () => {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(replay, 120);
  });
});

window.addEventListener("load", resetAll);
</script>
</body>
</html>
