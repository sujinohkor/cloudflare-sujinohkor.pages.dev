<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to ASCII</title>
    <!-- 파비콘 설정 추가 -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }

        .app-container { display: flex; min-height: 100vh; width: 100%; }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar { 
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 2000; 
            display: flex; flex-direction: column; gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        /* DAY/NIGHT 버튼 최상단 배치 스타일 (데스크톱용) */
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* 메인 콘텐츠 영역 */
        .main-content { 
            margin-left: 300px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; 
            gap: 20px; overflow: hidden; transition: 0.3s; 
            width: calc(100% - 300px);
        }

        /* 3. Components */
        .menu-btn { 
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        .bottom-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bottom-btns > .menu-btn {
            margin-bottom: 0;
        }

        .content-mid { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; display: flex; overflow: hidden; 
            padding: 20px; color: #888; font-family: 'Consolas', 'Courier New', 'Monaco', monospace, sans-serif; font-size: 1rem;
            cursor: pointer; transition: all 0.3s ease; user-select: none;
            flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;
            background: rgba(255, 255, 255, 0.02);
        }
        .content-mid.dragover { background-color: rgba(255, 158, 64, 0.1); border-style: dashed; color: #ff9e40; }
        .content-mid.has-file {
            background-color: rgba(255, 158, 64, 0.05);
            color: #ff9e40;
            font-weight: bold;
        }

        .content-down { 
            flex: 3; border: 2px solid #ff9e40; border-radius: 16px; 
            display: flex; overflow: hidden; background: rgba(0, 0, 0, 0.2); 
        }

        textarea { 
            flex: 1; padding: 20px; background: transparent; border: none; 
            color: #fff; font-family: 'Consolas', 'Courier New', 'Monaco', monospace, sans-serif; 
            font-size: 1rem; line-height: 1rem; resize: none; outline: none; overflow-y: auto; white-space: pre; 
        }

        /* 다크 모드 카드/패널 그림자 */
        .card, .content-mid, .content-down { 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5); 
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }
        body.light-mode .menu-btn, body.light-mode .theme-toggle-btn { 
            background: rgba(0, 0, 0, 0.02); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.5); 
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover { 
            background: rgba(243, 128, 32, 0.15); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.4); 
        }
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode textarea { color: #000; }
        body.light-mode .content-mid { color: #666; background: rgba(0, 0, 0, 0.02); }
        body.light-mode .content-mid.dragover { background-color: rgba(243, 128, 32, 0.1); border-style: dashed; color: #f38020; }
        body.light-mode .content-mid.has-file { background-color: rgba(243, 128, 32, 0.05); color: #F38020; }
        body.light-mode .menu-toggle-btn { color: #ffffff; }
        body.light-mode .content-mid, body.light-mode .content-down { background: rgba(255, 255, 255, 0.5); border-color: #F38020; }
        body.light-mode .card, body.light-mode .content-mid, body.light-mode .content-down { 
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15); 
        }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { 
            display: none; position: fixed; bottom: 20px; left: 20px; z-index: 3000; 
            padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; 
            font-weight: bold; cursor: pointer; color: #ffffff; 
        }

        @media (max-width: 900px) { 
            .menu-toggle-btn { display: block; } 
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; 
            } 
            body.light-mode .sidebar { 
                background: #ffffff !important; 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; 
            }
            .sidebar.active { transform: translateX(0); } 
            .main-content { margin-left: 0; padding: 20px; width: 100vw; max-height: 100svh; } 
            #ascii-output { font-family: monospace; white-space: pre; overflow-x: auto; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    <input type="file" id="file-selector" accept="image/*" style="display: none;">
    
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">Image to ASCII</div>
            <div class="sidebar-top">
                <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
            </div>

            <button class="menu-btn" onclick="location.href='../index'">Home</button>

            <div class="bottom-btns">
                <button class="menu-btn" onclick="uploadFile()">Upload</button>
                <button class="menu-btn" onclick="copyASCII()">Copy</button>
                <button class="menu-btn" onclick="saveASCII()">Save as Text File</button>
                <button class="menu-btn" onclick="resetAll()">Reset</button>
            </div>
        </aside>

        <main class="main-content" id="main-content">
            <header class="top-section">
                <h1>Image to ASCII</h1>
                <p>Upload an image below to generate ASCII art.</p>
            </header>

            <section class="content-mid"></section>
            
            <section class="content-down">
                <textarea id="ascii-output" placeholder="Generated ASCII image will appear here." readonly></textarea>
            </section>
        </main>
    </div>

    <script>
        const asciiOutput = document.getElementById('ascii-output');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        const contentMid = document.querySelector('.content-mid');
        const fileSelector = document.getElementById('file-selector');

        const chars = " .:-=+*#%@";

        function toggleSidebar() { 
            sidebar.classList.toggle('active'); 
        }

        sidebar.querySelectorAll('button').forEach(element => {
            element.addEventListener('click', () => {
                if (window.innerWidth <= 900) {
                    sidebar.classList.remove('active');
                }
            });
        });

        document.getElementById('theme-toggle').addEventListener('click', () => { 
            document.body.classList.toggle('light-mode'); 
        });

        mainContent.addEventListener('click', (e) => { 
            if (sidebar.classList.contains('active') && !e.target.closest('.sidebar') && !e.target.closest('.menu-toggle-btn')) { 
                sidebar.classList.remove('active'); 
            } 
        });

        function setInitialUI() {
            contentMid.classList.remove('has-file');
            contentMid.innerHTML = `<div style="font-size: 3rem;">🖼️</div><div>Drag & Drop an image file here or click to upload.</div>`;
        }
        setInitialUI();

        function handleFile(file) {
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file.');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    const baseWidth = 80; 
                    canvas.width = baseWidth;
                    canvas.height = Math.floor((img.height / img.width) * baseWidth * 0.5);

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                    let asciiStr = "";
                    for (let y = 0; y < canvas.height; y++) {
                        for (let x = 0; x < canvas.width; x++) {
                            const offset = (y * canvas.width + x) * 4;
                            const avg = (imageData.data[offset] + imageData.data[offset+1] + imageData.data[offset+2]) / 3;
                            const charIndex = Math.min(Math.floor((avg / 255) * (chars.length - 1)), chars.length - 1);
                            asciiStr += chars[charIndex];
                        }
                        asciiStr += "\n";
                    }

                    asciiOutput.value = asciiStr;

                    contentMid.classList.add('has-file');
                    contentMid.innerHTML = `
                        <div style="font-size: 3rem;">🖼️</div>
                        <div style="word-break: break-all;">Uploaded File: ${file.name}</div>
                        <div style="font-size: 0.8rem; font-weight: normal; opacity: 0.7;">(Click or drag another image to change)</div>
                    `;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        contentMid.addEventListener('dragover', (e) => { e.preventDefault(); contentMid.classList.add('dragover'); });
        contentMid.addEventListener('dragleave', () => { contentMid.classList.remove('dragover'); });
        contentMid.addEventListener('drop', (e) => { 
            e.preventDefault(); 
            contentMid.classList.remove('dragover'); 
            const file = e.dataTransfer.files[0]; 
            handleFile(file); 
        });
        contentMid.addEventListener('click', () => { fileSelector.click(); });

        function uploadFile() { fileSelector.click(); }

        fileSelector.addEventListener('change', (e) => {
            const file = e.target.files[0];
            handleFile(file);
            e.target.value = ''; 
        });

        function copyASCII() {
            if (!asciiOutput.value) return alert('No ASCII image to copy.');
            asciiOutput.select();
            document.execCommand('copy');
            alert('ASCII art copied to clipboard!');
        }

        function saveASCII() {
            const text = asciiOutput.value;
            if (!text.trim()) return alert("No ASCII image to save.");
            const blob = new Blob(['\uFEFF', text], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'ImageASCII.txt';
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function resetAll() {
            setInitialUI();
            asciiOutput.value = '';
            fileSelector.value = '';
        }
    </script>
</body>
</html>
