<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before / After SVG Animation Generator</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }

:root {
  --bg:#101010; --panel:rgba(16,16,16,.28); --text:#fff; --muted:#888;
  --accent:#ff9e40; --field:rgba(255,255,255,.04); --border:rgba(255,158,64,.38);
}
body {
  background:var(--bg); color:var(--text); font-family:"Segoe UI",sans-serif;
  min-height:100vh; overflow:hidden; transition:.25s;
}
body.light {
  --bg:#fff; --panel:rgba(255,255,255,.45); --text:#202020;
  --muted:#666; --field:rgba(0,0,0,.025);
}
.app { display:flex; min-height:100vh; width:100%; }

.sidebar {
  width:260px; height:calc(100vh - 40px); position:fixed; left:20px; top:20px; z-index:10;
  padding:25px 20px; display:flex; flex-direction:column; gap:12px;
  border:1px solid var(--border); border-radius:24px; background:var(--panel);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 20px 40px rgba(0,0,0,.35);
}
body.light .sidebar {
  background:rgba(255,255,255,.3);
  border-color:rgba(243,128,32,.35);
  box-shadow:0 20px 40px rgba(243,128,32,.15);
}
.sidebar-title {
  color:#ff9e40; font-size:1.1rem; font-weight:bold; margin-bottom:5px;
  text-align:center; letter-spacing:1px;
}
.sidebar-top { display:flex; flex-direction:column; gap:10px; margin-bottom:5px; }

.theme-toggle-btn {
  width:100%; padding:11px; background:rgba(255,255,255,.03); color:#ff9e40;
  border:1px solid rgba(255,158,64,.5); border-radius:50px; font-weight:bold;
  cursor:pointer; transition:.3s; text-align:center;
}
.theme-toggle-btn:hover {
  background:rgba(255,158,64,.2);
  border-color:rgba(255,158,64,.6);
}

.menu-btn {
  width:100%; padding:11px 14px; cursor:pointer; text-align:center;
  background:rgba(255,255,255,.03); color:#ff9e40; border:1px solid rgba(255,158,64,.35);
  border-radius:50px; font-weight:bold; transition:all .3s; font-size:.85rem;
  display:flex; align-items:center; justify-content:center; line-height:1;
}
.menu-btn:hover {
  background:rgba(255,158,64,.2);
  border-color:rgba(255,158,64,.6);
}
body.light .menu-btn,
body.light .theme-toggle-btn {
  background:rgba(0,0,0,.02); color:#F38020; border-color:rgba(243,128,32,.5);
}
body.light .menu-btn:hover,
body.light .theme-toggle-btn:hover {
  background:rgba(243,128,32,.15);
  border-color:rgba(243,128,32,.4);
}

.palette-btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.palette-btns .menu-btn.active {
  background:rgba(255,158,64,.2);
  border-color:rgba(255,158,64,.75);
}

.controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:4px 0; }
.control { display:flex; flex-direction:column; gap:5px; }
.control label { font-size:11px; color:var(--muted); padding-left:4px; }
.control input {
  width:100%; padding:9px 10px; border:1px solid rgba(255,255,255,.13);
  border-radius:10px; background:var(--field); color:var(--text); outline:none;
}
body.light .control input { border-color:rgba(0,0,0,.14); }

.main {
  margin-left:300px; padding:40px; flex:1; height:100vh; width:calc(100% - 300px);
  display:flex; flex-direction:column; gap:20px; overflow:hidden;
}
header h1 { font-size:1.8rem; margin-bottom:5px; }
header p { font-size:.95rem; color:var(--muted); }

.workspace { display:flex; gap:20px; flex:1; min-height:0; }

.panel {
  border:2px solid var(--accent); border-radius:16px; background:rgba(0,0,0,.12);
  box-shadow:0 10px 20px rgba(0,0,0,.28); padding:20px; min-height:0;
}
body.light .panel {
  background:rgba(255,255,255,.5); border-color:#F38020;
  box-shadow:0 10px 20px rgba(243,128,32,.15);
}

.left { flex:1; display:flex; flex-direction:column; gap:12px; }
.left label { color:var(--accent); font-weight:700; }

textarea {
  width:100%; flex:1; resize:none; border-radius:12px; padding:15px;
  border:1px solid rgba(255,255,255,.15); background:var(--field); color:var(--text);
  font-size:16px; font-family:inherit; line-height:1.5; outline:none;
}
body.light textarea {
  background:rgba(0,0,0,.02); color:#202020; border-color:rgba(0,0,0,.15);
}
textarea:focus { border-color:var(--accent); }

.hint { font-size:12px; color:var(--muted); line-height:1.5; }

.right {
  flex:1.2; overflow:auto; display:flex; align-items:flex-start; justify-content:flex-start;
}
.preview-wrap { min-width:620px; flex:0 0 auto; }
.preview-wrap svg { width:620px; min-width:620px; height:auto; display:block; }

.menu-toggle {
  display:none; position:fixed; left:20px; bottom:20px; z-index:20; width:auto;
  padding:10px 15px; background:var(--accent); color:#fff; border:none;
  border-radius:50px; font-weight:bold;
}

@media(max-width:900px) {
  body { overflow:auto; }
  .menu-toggle { display:block; }
  .sidebar { transform:translateX(-320px); transition:.25s; background:var(--bg); }
  .sidebar.active { transform:translateX(0); }
  .main { margin-left:0; padding:20px; width:100vw; height:auto; min-height:100svh; }
  .workspace { flex-direction:column; }
  .left { min-height:330px; }
  .right { min-height:300px; }
}
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle">MENU</button>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Before / After SVG Animator</div>

    <div class="sidebar-top">
      <button class="theme-toggle-btn" id="themeBtn">DAY / NIGHT</button>
    </div>

    <button class="menu-btn" onclick="location.href='../index'">Home</button>

    <div class="palette-btns">
      <button class="menu-btn active" id="blackBtn">Black</button>
      <button class="menu-btn" id="whiteBtn">White</button>
    </div>

    <div class="controls">
      <div class="control">
        <label for="holdDuration">Hold Duration</label>
        <input id="holdDuration" type="number" min="0.5" step="0.1" value="2.0">
      </div>
      <div class="control">
        <label for="fadeDuration">Fade Duration</label>
        <input id="fadeDuration" type="number" min="0.1" step="0.1" value="0.5">
      </div>
      <div class="control">
        <label for="fontSize">Font Size</label>
        <input id="fontSize" type="number" min="10" step="1" value="18">
      </div>
      <div class="control">
        <label for="canvasWidth">Width</label>
        <input id="canvasWidth" type="number" min="420" step="10" value="760">
      </div>
    </div>

    <button class="menu-btn" id="applyBtn">Apply Animation</button>
    <button class="menu-btn" id="replayBtn">Replay</button>
    <button class="menu-btn" id="copyBtn">Copy SVG Code</button>
    <button class="menu-btn" id="downloadBtn">Download SVG</button>
    <button class="menu-btn" id="resetBtn">Reset</button>
  </aside>

  <main class="main" id="main">
    <header>
      <h1>Before / After SVG Generator</h1>
      <p>Enter two states to generate a looping comparison animation that alternates between Before and After.</p>
    </header>

    <div class="workspace">
      <section class="panel left">
        <label for="compareInput">Before / After</label>
        <textarea id="compareInput" spellcheck="false"></textarea>
        <div class="hint">
          Use two lines in the format <strong>Before | Text</strong> and <strong>After | Text</strong>.
          Longer text is automatically wrapped inside the comparison card.
        </div>
      </section>

      <section class="panel right">
        <div class="preview-wrap" id="previewWrap"></div>
      </section>
    </div>
  </main>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";
const compareInput = document.getElementById("compareInput");
const previewWrap = document.getElementById("previewWrap");
const blackBtn = document.getElementById("blackBtn");
const whiteBtn = document.getElementById("whiteBtn");

let compareTheme = "black";

const defaults = {
  text:
`Before | Manual repetitive work with several separate steps.
After | One automated workflow that produces the result instantly.`,
  holdDuration: 2.0,
  fadeDuration: 0.5,
  fontSize: 18,
  canvasWidth: 760
};

function escapeXml(value) {
  return value.replace(/[<>&'"]/g, ch => ({
    "<":"&lt;", ">":"&gt;", "&":"&amp;", "'":"&apos;", '"':"&quot;"
  }[ch]));
}

function num(id, fallback) {
  const value = Number(document.getElementById(id).value);
  return Number.isFinite(value) ? value : fallback;
}

function palette() {
  if (compareTheme === "white") {
    return {
      bg:"#f3f3f3",
      border:"#cfcfcf",
      card:"#e5e5e5",
      cardBorder:"#bfbfbf",
      title:"#202020",
      text:"#404040",
      muted:"#747474",
      marker:"#333333"
    };
  }

  return {
    bg:"#181818",
    border:"#333333",
    card:"#242424",
    cardBorder:"#464646",
    title:"#ffffff",
    text:"#d2d2d2",
    muted:"#9b9b9b",
    marker:"#ffffff"
  };
}

function parseData() {
  const lines = compareInput.value.replace(/\r/g, "").split("\n").filter(line => line.trim());

  let before = "";
  let after = "";

  lines.forEach((line, index) => {
    const i = line.indexOf("|");
    let label = "";
    let value = line.trim();

    if (i !== -1) {
      label = line.slice(0, i).trim().toLowerCase();
      value = line.slice(i + 1).trim();
    }

    if (label === "before") before = value;
    else if (label === "after") after = value;
    else if (!before) before = value;
    else if (!after) after = value;
  });

  return { before, after };
}

function wrapText(text, maxChars) {
  if (!text) return [""];

  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let current = "";

  words.forEach(word => {
    const test = current ? `${current} ${word}` : word;

    if (test.length > maxChars && current) {
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  });

  if (current) lines.push(current);
  return lines.length ? lines : [""];
}

function buildStateGroup(label, text, x, y, cardW, cardH, fontSize, p, opacityValues, keyTimes, dur) {
  const titleSize = Math.round(fontSize * .82);
  const bodySize = fontSize;
  const lineHeight = Math.round(fontSize * 1.42);
  const padX = 28;
  const textTop = y + 78;
  const maxChars = Math.max(18, Math.floor((cardW - padX * 2) / (fontSize * .54)));
  const lines = wrapText(text, maxChars);

  const tspans = lines.map((line, i) =>
    `<tspan x="${x + padX}" y="${textTop + i * lineHeight}">${escapeXml(line)}</tspan>`
  ).join("");

  return `
<g>
  <animate attributeName="opacity"
           values="${opacityValues}"
           keyTimes="${keyTimes}"
           dur="${dur}s"
           repeatCount="indefinite"/>
  <rect x="${x}" y="${y}" width="${cardW}" height="${cardH}" rx="18"
        fill="${p.card}" stroke="${p.cardBorder}" stroke-width="1.5"/>
  <rect x="${x + 22}" y="${y + 22}" width="10" height="10" rx="5" fill="${p.marker}"/>
  <text x="${x + 44}" y="${y + 33}" fill="${p.title}"
        font-size="${titleSize}" font-family="'Segoe UI', sans-serif"
        font-weight="700" letter-spacing="1">${escapeXml(label.toUpperCase())}</text>
  <line x1="${x + 22}" y1="${y + 52}" x2="${x + cardW - 22}" y2="${y + 52}"
        stroke="${p.cardBorder}" stroke-width="1"/>
  <text fill="${p.text}" font-size="${bodySize}" font-family="'Segoe UI', sans-serif">
    ${tspans}
  </text>
</g>`;
}

function buildSvg() {
  const data = parseData();
  const hold = Math.max(0.5, num("holdDuration", defaults.holdDuration));
  const fade = Math.max(0.1, num("fadeDuration", defaults.fadeDuration));
  const fontSize = Math.max(10, num("fontSize", defaults.fontSize));
  const width = Math.max(420, num("canvasWidth", defaults.canvasWidth));
  const p = palette();

  const pad = 30;
  const cardW = width - pad * 2;
  const lineHeight = Math.round(fontSize * 1.42);
  const maxChars = Math.max(18, Math.floor((cardW - 56) / (fontSize * .54)));

  const beforeLines = wrapText(data.before, maxChars).length;
  const afterLines = wrapText(data.after, maxChars).length;
  const maxLines = Math.max(beforeLines, afterLines, 1);

  const cardH = Math.max(170, 106 + maxLines * lineHeight);
  const height = cardH + pad * 2;

  const cycle = hold * 2 + fade * 2;
  const t1 = hold / cycle;
  const t2 = (hold + fade) / cycle;
  const t3 = (hold * 2 + fade) / cycle;

  const beforeValues = "1;1;0;0;1";
  const afterValues = "0;0;1;1;0";
  const keyTimes = `0;${t1.toFixed(4)};${t2.toFixed(4)};${t3.toFixed(4)};1`;

  const beforeGroup = buildStateGroup(
    "Before", data.before, pad, pad, cardW, cardH, fontSize, p,
    beforeValues, keyTimes, cycle.toFixed(3)
  );

  const afterGroup = buildStateGroup(
    "After", data.after, pad, pad, cardW, cardH, fontSize, p,
    afterValues, keyTimes, cycle.toFixed(3)
  );

  return `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="${NS}">
  <rect width="${width}" height="${height}" rx="16" fill="${p.bg}" stroke="${p.border}" stroke-width="2"/>
  ${beforeGroup}
  ${afterGroup}
</svg>`;
}

function render() {
  const svg = buildSvg();
  previewWrap.innerHTML = svg.replace(/^<\?xml[^>]*>\s*/i, "");
  return svg;
}

function replay() {
  const svg = buildSvg();
  previewWrap.innerHTML = "";
  requestAnimationFrame(() => {
    previewWrap.innerHTML = svg.replace(/^<\?xml[^>]*>\s*/i, "");
  });
}

async function copySvg() {
  try {
    await navigator.clipboard.writeText(buildSvg());
  } catch {}
}

function downloadSvg() {
  const blob = new Blob([buildSvg()], { type:"image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "before-after-animation.svg";

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}

function setCompareTheme(theme) {
  compareTheme = theme === "white" ? "white" : "black";

  blackBtn.classList.toggle("active", compareTheme === "black");
  whiteBtn.classList.toggle("active", compareTheme === "white");

  replay();
}

function resetAll() {
  compareInput.value = defaults.text;
  document.getElementById("holdDuration").value = defaults.holdDuration;
  document.getElementById("fadeDuration").value = defaults.fadeDuration;
  document.getElementById("fontSize").value = defaults.fontSize;
  document.getElementById("canvasWidth").value = defaults.canvasWidth;

  compareTheme = "black";
  blackBtn.classList.add("active");
  whiteBtn.classList.remove("active");

  render();
}

document.getElementById("applyBtn").addEventListener("click", replay);
document.getElementById("replayBtn").addEventListener("click", replay);
document.getElementById("copyBtn").addEventListener("click", copySvg);
document.getElementById("downloadBtn").addEventListener("click", downloadSvg);
document.getElementById("resetBtn").addEventListener("click", resetAll);

document.getElementById("themeBtn").addEventListener("click", () => {
  document.body.classList.toggle("light");
});

document.getElementById("menuToggle").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("active");
});

document.getElementById("main").addEventListener("click", () => {
  document.getElementById("sidebar").classList.remove("active");
});

blackBtn.addEventListener("click", () => setCompareTheme("black"));
whiteBtn.addEventListener("click", () => setCompareTheme("white"));

let renderTimer = null;
[compareInput, ...document.querySelectorAll(".control input")].forEach(el => {
  el.addEventListener("input", () => {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(replay, 120);
  });
});

window.addEventListener("load", resetAll);
</script>
</body>
</html>
