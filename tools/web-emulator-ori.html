<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GBA & GB Emulator Online</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .container { width: 100%; max-width: 800px; padding: 20px; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 2rem; color: #38bdf8; }
        
        /* 업로드 박스 디자인 */
        #upload-section {
            background: #111827;
            border: 2px dashed #9ca3af;
            border-radius: 12px;
            padding: 3rem 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #upload-section:hover, #upload-section.drag-over {
            background: #38bdf81a;
            border-color: #38bdf8;
        }
        #file-input { display: none; }
        
        /* 에뮬레이터 화면 영역 */
        #game-container {
            display: none;
            width: 100%;
            height: 70vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        #game { width: 100%; height: 100%; }
        
        .back-btn {
            margin-top: 1rem;
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            color: #0f172a;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            display: none;
        }
        .back-btn:hover { background: #0ea5e9; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="title">Emulator Online</h1>
        
        <!-- 롬 파일 업로드 영역 (GB, GBC 확장자 추가) -->
        <div id="upload-section">
            <h2>롬 파일을 여기에 드래그하거나 클릭하여 업로드하세요</h2>
            <p style="color: #9ca3af; margin-top: 0.5rem;">지원 형식: .gba, .gb, .gbc, .nes, .snes</p>
            <input type="file" id="file-input" accept=".gba,.gb,.gbc,.nes,.snes">
        </div>

        <!-- 에뮬레이터가 실행될 화면 -->
        <div id="game-container">
            <div id="game"></div>
        </div>
        
        <button id="back-btn" class="back-btn">다른 게임 선택하기</button>
    </div>

    <script>
        const uploadSection = document.getElementById('upload-section');
        const fileInput = document.getElementById('file-input');
        const gameContainer = document.getElementById('game-container');
        const titleElem = document.getElementById('title');
        const backBtn = document.getElementById('back-btn');

        // 업로드 박스 클릭 시 파일 선택창 열기
        uploadSection.addEventListener('click', () => fileInput.click());

        // 드래그 오버 효과
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('drag-over');
        });
        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('drag-over');
        });

        // 파일 드롭 처리
        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        // 파일 선택창에서 파일 선택 시 처리
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            const fileName = file.name.toLowerCase();
            let core = 'gba'; // 기본값

            // 확장자에 따른 코어 분기 처리
            if (fileName.endsWith('.nes')) {
                core = 'nes';
            } else if (fileName.endsWith('.snes') || fileName.endsWith('.smc')) {
                core = 'snes';
            } else if (fileName.endsWith('.gb') || fileName.endsWith('.gbc')) {
                core = 'gb'; // GB / GBC 전용 코어 매칭
            } else if (!fileName.endsWith('.gba')) {
                alert('지원하지 않는 파일 형식입니다.');
                return;
            }

            // 업로드 화면 숨기고 게임 화면 표시
            uploadSection.style.display = 'none';
            titleElem.style.display = 'none';
            gameContainer.style.display = 'block';
            backBtn.style.display = 'inline-block';

            // Blob URL 생성
            const fileUrl = URL.createObjectURL(file);

            // EmulatorJS 설정 전역 변수 주입
            window.EJS_player = '#game';
            window.EJS_core = core;
            window.EJS_startOnLoaded = true;
            window.EJS_biosUrl = '';
            window.EJS_gameUrl = fileUrl;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';

            // EmulatorJS 로더 동적 스크립트 로드
            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/latest/data/loader.js';
            document.body.appendChild(script);
        }

        // 돌아가기 버튼
        backBtn.addEventListener('click', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
