<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Typing SVG Animation Generator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #101010;
  --panel: rgba(16,16,16,.28);
  --text: #fff;
  --muted: #888;
  --accent: #ff9e40;
  --field: rgba(255,255,255,.04);
  --border: rgba(255,158,64,.38);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", sans-serif;
  min-height: 100vh;
  overflow: hidden;
  transition: .25s;
}

body.light {
  --bg: #fff;
  --panel: rgba(255,255,255,.45);
  --text: #202020;
  --muted: #666;
  --field: rgba(0,0,0,.025);
}

.app { display: flex; min-height: 100vh; width: 100%; }

.sidebar {
  width: 260px;
  height: calc(100vh - 40px);
  position: fixed;
  left: 20px;
  top: 20px;
  z-index: 10;
  padding: 25px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  border: 1px solid var(--border);
  border-radius: 24px;
  background: var(--panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 20px 40px rgba(0,0,0,.35);
}

body.light .sidebar {
  background: rgba(255,255,255,.3);
  border-color: rgba(243,128,32,.35);
  box-shadow: 0 20px 40px rgba(243,128,32,.15);
}

.sidebar-title {
  color: #ff9e40;
  font-size: 1.1rem;
  font-weight: bold;
  margin-bottom: 5px;
  text-align: center;
  letter-spacing: 1px;
}

.sidebar-top {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 5px;
}

.theme-toggle-btn {
  width: 100%;
  padding: 11px;
  background: rgba(255,255,255,.03);
  color: #ff9e40;
  border: 1px solid rgba(255,158,64,.5);
  border-radius: 50px;
  font-weight: bold;
  cursor: pointer;
  transition: .3s;
  text-align: center;
}

.theme-toggle-btn:hover {
  background: rgba(255,158,64,.2);
  border-color: rgba(255,158,64,.6);
}

.menu-btn {
  width: 100%;
  padding: 11px 14px;
  cursor: pointer;
  text-align: center;
  background: rgba(255,255,255,.03);
  color: #ff9e40;
  border: 1px solid rgba(255,158,64,.35);
  border-radius: 50px;
  font-weight: bold;
  transition: all .3s;
  font-size: .85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.menu-btn:hover {
  background: rgba(255,158,64,.2);
  border-color: rgba(255,158,64,.6);
}

body.light .menu-btn,
body.light .theme-toggle-btn {
  background: rgba(0,0,0,.02);
  color: #F38020;
  border-color: rgba(243,128,32,.5);
}

body.light .menu-btn:hover,
body.light .theme-toggle-btn:hover {
  background: rgba(243,128,32,.15);
  border-color: rgba(243,128,32,.4);
}

.palette-btns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.palette-btns .menu-btn.active {
  background: rgba(255,158,64,.2);
  border-color: rgba(255,158,64,.75);
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 4px 0;
}

.control {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.control label {
  font-size: 11px;
  color: var(--muted);
  padding-left: 4px;
}

.control input {
  width: 100%;
  padding: 9px 10px;
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 10px;
  background: var(--field);
  color: var(--text);
  outline: none;
}

body.light .control input { border-color: rgba(0,0,0,.14); }

.main {
  margin-left: 300px;
  padding: 40px;
  flex: 1;
  height: 100vh;
  width: calc(100% - 300px);
  display: flex;
  flex-direction: column;
  gap: 20px;
  overflow: hidden;
}

header h1 { font-size: 1.8rem; margin-bottom: 5px; }
header p { font-size: .95rem; color: var(--muted); }

.workspace {
  display: flex;
  gap: 20px;
  flex: 1;
  min-height: 0;
}

.panel {
  border: 2px solid var(--accent);
  border-radius: 16px;
  background: rgba(0,0,0,.12);
  box-shadow: 0 10px 20px rgba(0,0,0,.28);
  padding: 20px;
  min-height: 0;
}

body.light .panel {
  background: rgba(255,255,255,.5);
  border-color: #F38020;
  box-shadow: 0 10px 20px rgba(243,128,32,.15);
}

.left {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.left label {
  color: var(--accent);
  font-weight: 700;
}

textarea {
  width: 100%;
  flex: 1;
  resize: none;
  border-radius: 12px;
  padding: 15px;
  border: 1px solid rgba(255,255,255,.15);
  background: var(--field);
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  line-height: 1.5;
  outline: none;
}

body.light textarea {
  background: rgba(0,0,0,.02);
  color: #202020;
  border-color: rgba(0,0,0,.15);
}

textarea:focus { border-color: var(--accent); }

.hint {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}

.right {
  flex: 1.2;
  overflow: auto;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
}

.preview-wrap {
  min-width: 640px;
  flex: 0 0 auto;
}

.preview-wrap svg {
  width: 640px;
  min-width: 640px;
  height: auto;
  display: block;
}

.menu-toggle {
  display: none;
  position: fixed;
  left: 20px;
  bottom: 20px;
  z-index: 20;
  width: auto;
  padding: 10px 15px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 50px;
  font-weight: bold;
}

@media(max-width:900px) {
  body { overflow: auto; }
  .menu-toggle { display: block; }
  .sidebar {
    transform: translateX(-320px);
    transition: .25s;
    background: var(--bg);
  }
  .sidebar.active { transform: translateX(0); }
  .main {
    margin-left: 0;
    padding: 20px;
    width: 100vw;
    height: auto;
    min-height: 100svh;
  }
  .workspace { flex-direction: column; }
  .left { min-height: 330px; }
  .right { min-height: 300px; }
}
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle">MENU</button>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Code SVG Animator</div>

    <div class="sidebar-top">
      <button class="theme-toggle-btn" id="themeBtn">DAY / NIGHT</button>
    </div>

    <button class="menu-btn" onclick="location.href='../index'">Home</button>

    <div class="palette-btns">
      <button class="menu-btn active" id="blackBtn">Black</button>
      <button class="menu-btn" id="whiteBtn">White</button>
    </div>

    <div class="controls">
      <div class="control">
        <label for="charSpeed">Typing Speed</label>
        <input id="charSpeed" type="number" min="0.01" step="0.01" value="0.045">
      </div>
      <div class="control">
        <label for="lineDelay">Line Delay</label>
        <input id="lineDelay" type="number" min="0" step="0.1" value="0.3">
      </div>
      <div class="control">
        <label for="fontSize">Font Size</label>
        <input id="fontSize" type="number" min="10" step="1" value="17">
      </div>
      <div class="control">
        <label for="codeWidth">Width</label>
        <input id="codeWidth" type="number" min="420" step="10" value="760">
      </div>
    </div>

    <button class="menu-btn" id="applyBtn">Apply Animation</button>
    <button class="menu-btn" id="replayBtn">Replay</button>
    <button class="menu-btn" id="copyBtn">Copy SVG Code</button>
    <button class="menu-btn" id="downloadBtn">Download SVG</button>
    <button class="menu-btn" id="resetBtn">Reset</button>
  </aside>

  <main class="main" id="main">
    <header>
      <h1>Code Typing SVG Generator</h1>
      <p>Enter source code to generate a line-by-line typing animation as a standalone SVG.</p>
    </header>

    <div class="workspace">
      <section class="panel left">
        <label for="codeInput">Source Code</label>
        <textarea id="codeInput" spellcheck="false"></textarea>
        <div class="hint">
          Code is typed one line at a time while preserving indentation and spaces. The preview keeps a readable size and scrolls when the generated SVG becomes long.
        </div>
      </section>

      <section class="panel right">
        <div class="preview-wrap" id="previewWrap"></div>
      </section>
    </div>
  </main>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";
const codeInput = document.getElementById("codeInput");
const previewWrap = document.getElementById("previewWrap");
const blackBtn = document.getElementById("blackBtn");
const whiteBtn = document.getElementById("whiteBtn");

let codeTheme = "black";

const defaults = {
  text:
`function greet(name) {
    const message = \`Hello, \${name}!\`;

    console.log(message);

    return message;
}

greet("Sujin");`,
  charSpeed: 0.045,
  lineDelay: 0.3,
  fontSize: 17,
  codeWidth: 760
};

function escapeXml(value) {
  return value.replace(/[<>&'"]/g, ch => ({
    "<": "&lt;",
    ">": "&gt;",
    "&": "&amp;",
    "'": "&apos;",
    '"': "&quot;"
  }[ch]));
}

function num(id, fallback) {
  const value = Number(document.getElementById(id).value);
  return Number.isFinite(value) ? value : fallback;
}

function palette() {
  if (codeTheme === "white") {
    return {
      bg: "#f3f3f3",
      top: "#e3e3e3",
      border: "#cccccc",
      lineNo: "#8a8a8a",
      text: "#202020",
      cursor: "#202020"
    };
  }

  return {
    bg: "#181818",
    top: "#252525",
    border: "#333333",
    lineNo: "#777777",
    text: "#f2f2f2",
    cursor: "#ffffff"
  };
}

function buildSvg() {
  const charSpeed = Math.max(0.01, num("charSpeed", defaults.charSpeed));
  const lineDelay = Math.max(0, num("lineDelay", defaults.lineDelay));
  const fontSize = Math.max(10, num("fontSize", defaults.fontSize));
  const width = Math.max(420, num("codeWidth", defaults.codeWidth));

  const lines = codeInput.value.replace(/\r/g, "").split("\n");
  const lineHeight = Math.round(fontSize * 1.55);
  const topBar = 40;
  const padTop = 20;
  const padBottom = 28;
  const lineNoWidth = 54;
  const codeX = lineNoWidth + 18;
  const p = palette();

  const height = Math.max(
    150,
    topBar + padTop + Math.max(1, lines.length) * lineHeight + padBottom
  );

  let currentTime = 0;
  const parts = [];

  lines.forEach((line, index) => {
    const y = topBar + padTop + index * lineHeight + fontSize;
    const lineNo = index + 1;
    const chars = [...line];

    parts.push(
`<text x="${lineNoWidth - 12}" y="${y}" fill="${p.lineNo}" font-size="${fontSize}" font-family="Consolas, 'Courier New', monospace" text-anchor="end" opacity="0">${lineNo}
  <animate attributeName="opacity" from="0" to="1" begin="${currentTime.toFixed(3)}s" dur="0.12s" fill="freeze"/>
</text>`
    );

    if (chars.length === 0) {
      currentTime += lineDelay;
      return;
    }

    chars.forEach((char, charIndex) => {
      const begin = currentTime + charIndex * charSpeed;
      const visibleText = chars.slice(0, charIndex + 1).join("");

      parts.push(
`<text x="${codeX}" y="${y}" fill="${p.text}" font-size="${fontSize}" font-family="Consolas, 'Courier New', monospace" xml:space="preserve" opacity="0">${escapeXml(visibleText)}
  <animate attributeName="opacity" from="0" to="1" begin="${begin.toFixed(3)}s" dur="0.01s" fill="freeze"/>
  <animate attributeName="opacity" from="1" to="0" begin="${(begin + charSpeed).toFixed(3)}s" dur="0.01s" fill="freeze"/>
</text>`
      );
    });

    const finalBegin = currentTime + Math.max(0, chars.length - 1) * charSpeed;

    parts.push(
`<text x="${codeX}" y="${y}" fill="${p.text}" font-size="${fontSize}" font-family="Consolas, 'Courier New', monospace" xml:space="preserve" opacity="0">${escapeXml(line)}
  <animate attributeName="opacity" from="0" to="1" begin="${finalBegin.toFixed(3)}s" dur="0.01s" fill="freeze"/>
</text>`
    );

    currentTime += chars.length * charSpeed + lineDelay;
  });

  const cursorY = topBar + padTop + Math.max(0, lines.length - 1) * lineHeight + fontSize + 5;

  return `<?xml version="1.0" encoding="UTF-8"?>
<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="${NS}">
  <rect width="${width}" height="${height}" rx="16" fill="${p.bg}" stroke="${p.border}" stroke-width="2"/>
  <path d="M16 0 H${width - 16} Q${width} 0 ${width} 16 V40 H0 V16 Q0 0 16 0 Z" fill="${p.top}"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="6" fill="#febc2e"/>
  <circle cx="60" cy="20" r="6" fill="#28c840"/>
  <line x1="${lineNoWidth}" y1="40" x2="${lineNoWidth}" y2="${height - 12}" stroke="${p.border}" stroke-width="1"/>
  ${parts.join("\n  ")}
  <rect x="${codeX}" y="${cursorY}" width="${Math.max(7, Math.round(fontSize * .52))}" height="${Math.max(2, Math.round(fontSize * .15))}" fill="${p.cursor}">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>`;
}

function render() {
  const svg = buildSvg();
  previewWrap.innerHTML = svg.replace(/^<\?xml[^>]*>\s*/i, "");
  return svg;
}

function replay() {
  const svg = buildSvg();
  previewWrap.innerHTML = "";
  requestAnimationFrame(() => {
    previewWrap.innerHTML = svg.replace(/^<\?xml[^>]*>\s*/i, "");
  });
}

async function copySvg() {
  try {
    await navigator.clipboard.writeText(buildSvg());
  } catch {}
}

function downloadSvg() {
  const blob = new Blob([buildSvg()], {
    type: "image/svg+xml;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "code-typing-animation.svg";

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}

function setCodeTheme(theme) {
  codeTheme = theme === "white" ? "white" : "black";

  blackBtn.classList.toggle("active", codeTheme === "black");
  whiteBtn.classList.toggle("active", codeTheme === "white");

  replay();
}

function resetAll() {
  codeInput.value = defaults.text;
  document.getElementById("charSpeed").value = defaults.charSpeed;
  document.getElementById("lineDelay").value = defaults.lineDelay;
  document.getElementById("fontSize").value = defaults.fontSize;
  document.getElementById("codeWidth").value = defaults.codeWidth;

  codeTheme = "black";
  blackBtn.classList.add("active");
  whiteBtn.classList.remove("active");

  render();
}

document.getElementById("applyBtn").addEventListener("click", replay);
document.getElementById("replayBtn").addEventListener("click", replay);
document.getElementById("copyBtn").addEventListener("click", copySvg);
document.getElementById("downloadBtn").addEventListener("click", downloadSvg);
document.getElementById("resetBtn").addEventListener("click", resetAll);

document.getElementById("themeBtn").addEventListener("click", () => {
  document.body.classList.toggle("light");
});

document.getElementById("menuToggle").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("active");
});

document.getElementById("main").addEventListener("click", () => {
  document.getElementById("sidebar").classList.remove("active");
});

blackBtn.addEventListener("click", () => setCodeTheme("black"));
whiteBtn.addEventListener("click", () => setCodeTheme("white"));

let renderTimer = null;

[codeInput, ...document.querySelectorAll(".control input")].forEach(el => {
  el.addEventListener("input", () => {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(replay, 120);
  });
});

window.addEventListener("load", resetAll);
</script>
</body>
</html>
