<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Label Sheet Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#101010;--panel:rgba(16,16,16,.28);--text:#fff;--muted:#888;
  --accent:#ff9e40;--field:rgba(255,255,255,.04);--border:rgba(255,158,64,.38);
}
body{
  background:var(--bg);color:var(--text);font-family:"Segoe UI",sans-serif;
  min-height:100vh;overflow:hidden;transition:.25s
}
body.light{
  --bg:#fff;--panel:rgba(255,255,255,.45);--text:#202020;--muted:#666;
  --field:rgba(0,0,0,.025)
}
.app{display:flex;min-height:100vh;width:100%}
.sidebar{
  width:260px;height:calc(100vh - 40px);position:fixed;left:20px;top:20px;z-index:10;
  padding:25px 20px;display:flex;flex-direction:column;gap:12px;
  border:1px solid var(--border);border-radius:24px;background:var(--panel);
  backdrop-filter:blur(16px);box-shadow:0 20px 40px rgba(0,0,0,.35)
}
body.light .sidebar{
  background:rgba(255,255,255,.3);border-color:rgba(243,128,32,.35);
  box-shadow:0 20px 40px rgba(243,128,32,.15)
}
.sidebar-title{
  color:#ff9e40;font-size:1.1rem;font-weight:bold;margin-bottom:5px;
  text-align:center;letter-spacing:1px
}
button{
  width:100%;padding:11px 14px;border-radius:999px;border:1px solid var(--border);
  background:var(--field);color:var(--accent);font-weight:700;cursor:pointer;transition:.2s
}
button:hover{background:rgba(255,158,64,.16)}
.sidebar-top{display:flex;flex-direction:column;gap:10px;margin-bottom:5px}
.theme-toggle-btn,.menu-btn{
  width:100%;padding:11px 14px;background:rgba(255,255,255,.03);color:#ff9e40;
  border:1px solid rgba(255,158,64,.35);border-radius:50px;font-weight:bold;
  cursor:pointer;transition:.3s;text-align:center;font-size:.85rem
}
.theme-toggle-btn:hover,.menu-btn:hover{background:rgba(255,158,64,.2)}
body.light .theme-toggle-btn,body.light .menu-btn{
  background:rgba(0,0,0,.02);color:#F38020;border-color:rgba(243,128,32,.35)
}
.menu-btn.active{
  background:#ff9e40;color:#111;border-color:#ff9e40;
}
body.light .menu-btn.active{
  background:#F38020;color:#fff;border-color:#F38020;
}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0}
.control{display:flex;flex-direction:column;gap:5px}
.control label{font-size:11px;color:var(--muted);padding-left:4px}
.control input{
  width:100%;padding:9px 10px;border:1px solid rgba(255,255,255,.13);
  border-radius:10px;background:var(--field);color:var(--text);outline:none
}
body.light .control input{border-color:rgba(0,0,0,.14)}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:auto}

.main{
  margin-left:300px;width:calc(100vw - 300px);height:100vh;padding:30px;
  display:flex;flex-direction:column;overflow:auto
}
header{margin-bottom:18px}
header h1{font-size:24px;margin-bottom:6px}
header p{font-size:13px;color:var(--muted)}

.preview-area{
  flex:1;min-height:560px;border:1px solid var(--border);border-radius:24px;
  display:flex;align-items:flex-start;justify-content:center;padding:24px;
  background:var(--panel);overflow:auto
}

/* 기본 프레임은 유지하고, 프리뷰 안에 견출지 4장을 2 x 2로 배치 */
.reference-stage{
  width:760px;
  height:1040px;
  min-width:760px;
  min-height:1040px;
  background:#fff;
  position:relative;
  display:grid;
  grid-template-columns:repeat(2,300px);
  grid-template-rows:repeat(2,438px);
  column-gap:34px;
  row-gap:38px;
  justify-content:center;
  align-content:center;
}
.sheet{
  position:relative;
  width:300px;height:438px;
  border:1px solid #222;
  background:#fff;
  overflow:hidden;
}
.sheet .labels{
  transform-origin:top left;
}
.labels{
  position:absolute;
  left:9px;top:13px;
  width:280px;
  display:grid;
  grid-template-columns:repeat(4,66px);
  column-gap:5px;
}
.label-cell{
  position:relative;
  width:66px;height:27px;
  margin-bottom:3px;
}
.label{
  width:66px;height:27px;
  border:2px solid #ff3d3d;
  background:#fff;
  border-radius:0 0 7px 7px;
  outline:none;
  font:12px/1.1 "Segoe UI",sans-serif;
  color:#222;text-align:center;
  padding:3px 3px 2px;
}
.label-cell:nth-child(8n+1) .label,
.label-cell:nth-child(8n+2) .label,
.label-cell:nth-child(8n+3) .label,
.label-cell:nth-child(8n+4) .label{
  border-radius:0 0 7px 7px;
}
.label-cell:nth-child(8n+5) .label,
.label-cell:nth-child(8n+6) .label,
.label-cell:nth-child(8n+7) .label,
.label-cell:nth-child(8n+8) .label{
  border-radius:7px 7px 0 0;
}
.label-cell:nth-child(8n+5),
.label-cell:nth-child(8n+6),
.label-cell:nth-child(8n+7),
.label-cell:nth-child(8n+8){
  margin-bottom:13px;
}
.mirror-text{
  display:none;
  position:absolute;
  inset:2px;
  align-items:center;
  justify-content:center;
  padding:1px 3px;
  color:#222;
  font:12px/1.1 "Segoe UI",sans-serif;
  text-align:center;
  pointer-events:none;
  overflow:hidden;
  white-space:nowrap;
  transform:rotate(180deg);
}
.label.upper{
  color:transparent !important;
  caret-color:#222;
}
.label.upper + .mirror-text{
  display:flex;
}
body.mirror-mode .label.upper{
  caret-color:transparent;
}

.menu-toggle{
  display:none;position:fixed;left:20px;bottom:20px;z-index:20;width:auto;
  padding:10px 15px;background:var(--accent);color:#fff
}

@media(max-width:900px){
  body{
    overflow:auto;
  }

  .menu-toggle{
    display:block;
  }

  .sidebar{
    transform:translateX(-320px);
    transition:.25s;
    background:var(--bg);
  }

  .sidebar.active{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    padding:20px;
    width:100%;
    height:auto;
    min-height:100svh;
  }

  .preview-area{
    justify-content:flex-start;
    align-items:flex-start;
    overflow:auto;

    /* 스크롤 시작점에서 내용이 잘리지 않도록 */
    padding:20px;
  }

  .reference-stage{
    flex:none;
    margin:0;
  }
}

@media print{
  html,body{
    margin:0!important;
    padding:0!important;
    background:#fff!important;
    overflow:hidden!important;
  }
  .sidebar,.menu-toggle,header{display:none!important}
  .app{
    margin:0!important;
    padding:0!important;
    width:100%!important;
    height:100%!important;
    display:block!important;
  }
  .main{
    margin:0!important;
    padding:0!important;
    width:100%!important;
    height:100%!important;
    overflow:visible!important;
    display:block!important;
  }
  .preview-area{
    position:fixed!important;
    inset:0!important;
    margin:0!important;
    padding:0!important;
    width:100%!important;
    height:100%!important;
    border:0!important;
    border-radius:0!important;
    background:#fff!important;
    overflow:hidden!important;
  }
  .reference-stage{
    position:absolute!important;
    left:50%!important;
    top:50%!important;
    margin:0!important;
    transform:translate(-50%,-50%)!important;
    background:#fff!important;
  }
}

/* 추가 설정 UI - 기존 사이드바 프레임/버튼 디자인 유지 */
.mode-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.mode-buttons .menu-btn{
  margin:0;
  padding:11px 6px;
  font-size:12px;
}
.sidebar{
  overflow:auto;
}
.settings-section{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:4px 0;
}
.settings-title{
  font-size:12px;
  font-weight:800;
  color:var(--muted);
  letter-spacing:.4px;
  padding-left:4px;
  margin-top:2px;
}
.control.full{grid-column:1 / -1}
.control select,
.control input[type="color"]{
  width:100%;
  padding:9px 10px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:10px;
  background:var(--field);
  color:var(--text);
  outline:none;
}
.control select option{
  background:#fff;
  color:#222;
}
body.light .control select,
body.light .control input[type="color"]{
  border-color:rgba(0,0,0,.14);
}
.control input[type="color"]{
  height:38px;
  padding:4px 7px;
}
.align-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}
.align-buttons button{
  padding:8px 6px;
  border-radius:10px;
  font-size:12px;
}
.small-note{
  font-size:11px;
  color:var(--muted);
  line-height:1.45;
  padding:0 4px;
}

/* 세로 견출지 전용 레이아웃
   - 기존 가로 견출지를 90도 돌린 것과 같은 짝 모양을 직접 재현
   - 한 쌍: 왼쪽(lower, 직접입력) + 오른쪽(upper, 복사/직접입력)
   - 쌍 내부 간격 3px, 쌍 사이 간격 13px
   - 글자는 위→아래 세로쓰기 */
body.vertical-label-mode .labels{
  width:407px;
  height:279px;
  display:block;
  position:absolute;
}

body.vertical-label-mode .label-cell{
  position:absolute;
  width:27px;
  height:66px;
  margin:0 !important;
}

body.vertical-label-mode .label{
  width:27px;
  height:66px;
  writing-mode:vertical-rl;
  text-orientation:upright;
  text-align:center;
  padding:3px 2px;
}

/* 왼쪽 견출지: 마주보는 오른쪽 모서리를 둥글게 */
body.vertical-label-mode .label-cell.lower-cell .label{
  border-radius:0 7px 7px 0;
}

/* 오른쪽 견출지: 마주보는 왼쪽 모서리를 둥글게 */
body.vertical-label-mode .label-cell.upper-cell .label{
  border-radius:7px 0 0 7px;
}

body.vertical-label-mode .mirror-text{
  writing-mode:vertical-rl;
  text-orientation:upright;
  transform:none;
}

</style>
</head>
<body>
<button class="menu-toggle" id="menuToggle">MENU</button>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Label Sheet</div>
    <div class="sidebar-top">
      <button class="theme-toggle-btn" id="themeBtn">DAY / NIGHT</button>
    </div>

    <button class="menu-btn" onclick="location.href='../index'">Home</button>

    <div class="mode-buttons">
      <button class="menu-btn active" id="horizontalModeBtn">가로 견출지</button>
      <button class="menu-btn" id="verticalModeBtn">세로 견출지</button>
    </div>
    
    <div class="settings-section">
      <div class="controls">
        <!-- 용지 크기 -->
        <div class="control full">
          <label for="paperSize">용지 크기</label>
          <select id="paperSize">
            <option value="a4" selected>A4 (210 × 297 mm)</option>
            <option value="a3">A3 (297 × 420 mm)</option>
            <option value="letter">Letter (8.5 × 11 in)</option>
          </select>
        </div>
    
        <!-- 여백 / 간격 -->
        <div class="control">
          <label for="pageMargin">여백 (mm)</label>
          <input id="pageMargin" type="number" min="0" max="40" step="1" value="10">
        </div>
        <div class="control">
          <label for="sheetGap">간격 (mm)</label>
          <input id="sheetGap" type="number" min="0" max="40" step="1" value="10">
        </div>
    
        <!-- 글자 크기 / 색상 -->
        <div class="control">
          <label for="fontSize">글자 크기</label>
          <input id="fontSize" type="number" min="6" max="24" step="1" value="12">
        </div>
        <div class="control">
          <label for="fontColor">글자 색상</label>
          <input id="fontColor" type="color" value="#222222">
        </div>
    
        <!-- 글꼴 -->
        <div class="control full">
          <label for="fontFamily">글꼴</label>
          <select id="fontFamily">
            <option value='"Segoe UI","Noto Sans KR",sans-serif'>맑은 고딕</option>
            <option value='Arial,sans-serif'>Arial</option>
            <option value='"Times New Roman",serif'>Times New Roman</option>
          </select>
          <div class="align-buttons">
            <button class="menu-btn" data-style="bold">굵게</button>
            <button class="menu-btn" data-style="italic">기울임</button>
            <button class="menu-btn" data-style="underline">밑줄</button>
          </div>
        </div>
    
        <!-- 정렬 -->
        <div class="control full">
          <label>정렬</label>
          <div class="align-buttons">
            <button class="menu-btn" data-align="left">왼쪽</button>
            <button class="menu-btn active" data-align="center">가운데</button>
            <button class="menu-btn" data-align="right">오른쪽</button>
          </div>
        </div>
    
        <!-- 선 -->
        <div class="control">
          <label for="borderWidth">선 두께</label>
          <input id="borderWidth" type="number" min="1" max="4" step="0.5" value="2">
        </div>
        <div class="control">
          <label for="borderColor">선 색상</label>
          <input id="borderColor" type="color" value="#ff3d3d">
        </div>
      </div>
    </div>

    <div class="mode-buttons">
      <button class="menu-btn" id="mirrorModeBtn">윗칸 반전복사</button>
      <button class="menu-btn active" id="freeModeBtn">윗칸 직접입력</button>
    </div>

    <div class="mode-buttons">
      <button class="menu-btn" id="clearBtn">Clear Text</button>
      <button class="menu-btn" id="printBtn">인쇄/PDF</button>
    </div>
    
    <div class="mode-buttons">
      <button class="menu-btn" id="jsonSaveBtn">JSON 저장</button>
      <button class="menu-btn" id="jsonLoadBtn">JSON 읽기</button>
    </div>
    <input type="file" id="jsonFileInput" accept="application/json,.json" hidden>
</aside>

  <main class="main">
    <header>
      <h1>Label Sheet Generator</h1>
      <p>4열 × 12행 견출지 레이아웃</p>
    </header>

    <section class="preview-area">
      <div class="reference-stage" id="referenceStage">
        <div class="sheet"><div class="labels"></div></div>
        <div class="sheet"><div class="labels"></div></div>
        <div class="sheet"><div class="labels"></div></div>
        <div class="sheet"><div class="labels"></div></div>
      </div>
    </section>
  </main>
</div>

<script>
const labelGroups = [...document.querySelectorAll('.labels')];
const horizontalModeBtn = document.getElementById('horizontalModeBtn');
const verticalModeBtn = document.getElementById('verticalModeBtn');
const mirrorModeBtn = document.getElementById('mirrorModeBtn');
const freeModeBtn = document.getElementById('freeModeBtn');
const stage = document.getElementById('referenceStage');
let mirrorMode = false;
let labelOrientation = 'horizontal';

labelGroups.forEach((labels, sheetIndex)=>{
  for(let i=0;i<48;i++){
    const cell = document.createElement('div');
    cell.className = 'label-cell';

    const input = document.createElement('input');
    input.className = 'label';
    input.type = 'text';
    input.maxLength = 12;
    input.setAttribute('aria-label', `견출지 ${sheetIndex+1}-${i+1}`);

    const pos = i % 8;
    if(pos < 4){
      input.classList.add('upper');
      cell.classList.add('upper-cell');
    }else{
      input.classList.add('lower');
      cell.classList.add('lower-cell');
    }

    const mirrorText = document.createElement('span');
    mirrorText.className = 'mirror-text';

    cell.appendChild(input);
    cell.appendChild(mirrorText);
    labels.appendChild(cell);
  }
});

function getInputs(){
  return [...document.querySelectorAll('.label')];
}

function syncPairFromLower(lowerInput){
  const labels = lowerInput.closest('.labels');
  const inputs = [...labels.querySelectorAll('.label')];
  const lowerIndex = inputs.indexOf(lowerInput);
  if(lowerIndex < 0) return;

  const pos = lowerIndex % 8;
  if(pos < 4) return;

  const upperIndex = lowerIndex - 4;
  const upper = inputs[upperIndex];
  const mirrorText = upper.parentElement.querySelector('.mirror-text');

  upper.value = lowerInput.value;
  mirrorText.textContent = lowerInput.value;
}

function syncAllPairs(){
  labelGroups.forEach(labels=>{
    const inputs = [...labels.querySelectorAll('.label')];
    for(let group=0; group<6; group++){
      for(let col=0; col<4; col++){
        const upperIndex = group*8 + col;
        const lowerIndex = upperIndex + 4;
        const upper = inputs[upperIndex];
        const lower = inputs[lowerIndex];
        upper.value = lower.value;
        upper.parentElement.querySelector('.mirror-text').textContent = lower.value;
      }
    }
  });
}

function setMirrorMode(enabled){
  mirrorMode = enabled;
  document.body.classList.toggle('mirror-mode', enabled);

  getInputs().forEach(input=>{
    if(input.classList.contains('upper')){
      input.disabled = enabled;
    }
  });

  if(enabled) syncAllPairs();

  mirrorModeBtn.classList.toggle('active', enabled);
  freeModeBtn.classList.toggle('active', !enabled);
}

labelGroups.forEach(labels=>{
  labels.addEventListener('input', e=>{
    if(e.target.classList.contains('upper')){
      const mirrorText = e.target.parentElement.querySelector('.mirror-text');
      mirrorText.textContent = e.target.value;
      return;
    }

    if(mirrorMode && e.target.classList.contains('lower')){
      syncPairFromLower(e.target);
    }
  });
});

function applyCellOrder(){
  labelGroups.forEach(labels=>{
    const cells = [...labels.querySelectorAll('.label-cell')];

    cells.forEach((cell, i)=>{
      if(labelOrientation === 'vertical'){
        /*
          기존 8개 단위 pair
          upper: 0~3 / lower: 4~7

          세로 모드에서는 각 pair를 좌우로 배치합니다.
          lower = 왼쪽, upper = 오른쪽

          27px + 3px + 27px = 한 쌍 57px
          다음 쌍까지 13px 간격 -> pair pitch 70px
          세로 방향은 66px + 5px -> row pitch 71px
        */
        const group = Math.floor(i / 8); // 0~5
        const pos = i % 8;
        const row = pos % 4;             // 0~3
        const isUpper = pos < 4;

        const pairX = group * 70;
        const x = pairX + (isUpper ? 30 : 0);
        const y = row * 71;

        cell.style.left = x + 'px';
        cell.style.top = y + 'px';
        cell.style.order = '';
      }else{
        // 가로 견출지로 돌아오면 세로 모드에서 준 절대좌표를 제거합니다.
        cell.style.left = '';
        cell.style.top = '';
        cell.style.order = '';
      }
    });
  });
}

function setLabelOrientation(mode){
  labelOrientation = mode;

  const isVertical = mode === 'vertical';

  horizontalModeBtn.classList.toggle('active', !isVertical);
  verticalModeBtn.classList.toggle('active', isVertical);
  document.body.classList.toggle('vertical-label-mode', isVertical);

  // 방향에 따라 복사 모드 버튼 문구 변경
  if(isVertical){
    mirrorModeBtn.textContent = '우측 복사';
    freeModeBtn.textContent = '우측 직접입력';
  }else{
    mirrorModeBtn.textContent = '윗칸 반전복사';
    freeModeBtn.textContent = '윗칸 직접입력';
  }

  applyCellOrder();
  applyPageSettings();
}

horizontalModeBtn.addEventListener('click',()=>setLabelOrientation('horizontal'));
verticalModeBtn.addEventListener('click',()=>setLabelOrientation('vertical'));

mirrorModeBtn.addEventListener('click',()=>setMirrorMode(true));
freeModeBtn.addEventListener('click',()=>setMirrorMode(false));

document.getElementById('themeBtn').addEventListener('click',()=>{
  document.body.classList.toggle('light');
});

const menuToggle = document.getElementById('menuToggle');
const sidebar = document.getElementById('sidebar');

function isMobile(){
  return window.matchMedia('(max-width: 900px)').matches;
}

function closeSidebar(){
  if(isMobile()){
    sidebar.classList.remove('active');
  }
}

/* MENU 버튼: 열기/닫기 */
menuToggle.addEventListener('click', (e)=>{
  e.stopPropagation();

  if(isMobile()){
    sidebar.classList.toggle('active');
  }
});

/* 사이드바 내부의 "버튼"을 누르면 닫기 */
sidebar.addEventListener('click', (e)=>{
  if(!isMobile()) return;

  const button = e.target.closest('button');

  if(button){
    closeSidebar();
  }
});

/* 사이드바 바깥을 누르면 닫기 */
document.addEventListener('click', (e)=>{
  if(!isMobile()) return;

  if(
    sidebar.classList.contains('active') &&
    !sidebar.contains(e.target) &&
    !menuToggle.contains(e.target)
  ){
    closeSidebar();
  }
});

document.getElementById('clearBtn').addEventListener('click',()=>{
  document.querySelectorAll('.label').forEach(el=>el.value='');
  document.querySelectorAll('.mirror-text').forEach(el=>el.textContent='');
});

document.getElementById('printBtn').addEventListener('click', () => {
  let printStyle = document.getElementById('dynamicPrintPage');

  if(!printStyle){
    printStyle = document.createElement('style');
    printStyle.id = 'dynamicPrintPage';
    document.head.appendChild(printStyle);
  }

  const paper = document.getElementById('paperSize').value;

  const paperNames = {
    a4: 'A4',
    a3: 'A3',
    letter: 'letter'
  };

  const orientation =
    labelOrientation === 'vertical'
      ? 'landscape'
      : 'portrait';

  printStyle.textContent = `
    @page {
      size: ${paperNames[paper]} ${orientation};
      margin: 0;
    }
  `;

  window.print();
});

document.getElementById('fontSize').addEventListener('input',e=>{
  document.querySelectorAll('.label,.mirror-text').forEach(el=>el.style.fontSize=e.target.value+'px');
});

document.getElementById('fontColor').addEventListener('input',e=>{
  document.querySelectorAll('.label:not(.upper),.mirror-text').forEach(el=>{
    el.style.color = e.target.value;
  });
});

document.getElementById('fontFamily').addEventListener('change',e=>{
  document.querySelectorAll('.label,.mirror-text').forEach(el=>el.style.fontFamily=e.target.value);
});

document.getElementById('borderWidth').addEventListener('input',e=>{
  document.querySelectorAll('.label').forEach(el=>el.style.borderWidth=e.target.value+'px');
});

document.getElementById('borderColor').addEventListener('input',e=>{
  document.querySelectorAll('.label').forEach(el=>{
    el.style.borderColor = e.target.value;
  });
});

document.querySelectorAll('[data-align]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-align]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const align = btn.dataset.align;

    document.querySelectorAll('.label').forEach(el=>el.style.textAlign=align);
    document.querySelectorAll('.mirror-text').forEach(el=>{
      el.style.textAlign=align;
      el.style.justifyContent = align==='left' ? 'flex-start' : align==='right' ? 'flex-end' : 'center';
    });
  });
});

document.querySelectorAll('[data-style]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    btn.classList.toggle('active');

    const boldBtn = document.querySelector('[data-style="bold"]');
    const italicBtn = document.querySelector('[data-style="italic"]');
    const underlineBtn = document.querySelector('[data-style="underline"]');

    const isBold = boldBtn.classList.contains('active');
    const isItalic = italicBtn.classList.contains('active');
    const isUnderline = underlineBtn.classList.contains('active');

    document.querySelectorAll('.label,.mirror-text').forEach(el=>{
      el.style.fontWeight = isBold ? '700' : '400';
      el.style.fontStyle = isItalic ? 'italic' : 'normal';
      el.style.textDecoration = isUnderline ? 'underline' : 'none';
    });
  });
});

function applyPageSettings(){
  const paper = document.getElementById('paperSize').value;
  const marginMm = Math.max(0, Number(document.getElementById('pageMargin').value || 0));
  const gapMm = Math.max(0, Number(document.getElementById('sheetGap').value || 0));

  const sizes = {
    a4:[210,297],
    a3:[297,420],
    letter:[215.9,279.4]
  };
  let [paperWmm,paperHmm] = sizes[paper];

  // 세로 견출지 모드에서는 용지를 가로 방향(landscape)으로 전환합니다.
  if(labelOrientation === 'vertical'){
    [paperWmm,paperHmm] = [paperHmm,paperWmm];
  }

  // 화면 미리보기 비율
  const pxPerMm = 96 / 25.4;

  const pageW = paperWmm * pxPerMm;
  const pageH = paperHmm * pxPerMm;
  const margin = marginMm * pxPerMm;
  const gap = gapMm * pxPerMm;

  // 핵심:
  // 페이지 전체 크기에서 좌우/상하여백과 가운데 간격을 뺀 나머지를
  // 정확히 2등분하여 각 견출지 크기로 사용합니다.
  const sheetW = Math.max(80, (pageW - margin * 2 - gap) / 2);
  const sheetH = Math.max(120, (pageH - margin * 2 - gap) / 2);

  stage.style.width = pageW + 'px';
  stage.style.height = pageH + 'px';
  stage.style.minWidth = pageW + 'px';
  stage.style.minHeight = pageH + 'px';
  stage.style.padding = margin + 'px';
  stage.style.columnGap = gap + 'px';
  stage.style.rowGap = gap + 'px';
  stage.style.gridTemplateColumns = `repeat(2, ${sheetW}px)`;
  stage.style.gridTemplateRows = `repeat(2, ${sheetH}px)`;
  stage.style.justifyContent = 'center';
  stage.style.alignContent = 'center';

  // 가로 견출지: 기본 300×438.
  // 세로 견출지: 큰 견출지 판을 438×300으로 눕히고, 내부 빨간 견출지 전체를 90도 회전합니다.
  const isVertical = labelOrientation === 'vertical';
  const baseW = isVertical ? 438 : 300;
  const baseH = isVertical ? 300 : 438;
  const scaleX = sheetW / baseW;
  const scaleY = sheetH / baseH;

  document.querySelectorAll('.sheet').forEach(sheet=>{
    sheet.style.width = sheetW + 'px';
    sheet.style.height = sheetH + 'px';

    const labels = sheet.querySelector('.labels');

    if(isVertical){
      // 407×279 내부 배열을 438×300 기준 판의 정중앙에 배치합니다.
      labels.style.left = '15.5px';
      labels.style.top = '10.5px';
      labels.style.transformOrigin = 'top left';
      labels.style.transform = `scale(${scaleX}, ${scaleY})`;
    }else{
      labels.style.left = '9px';
      labels.style.top = '13px';
      labels.style.transformOrigin = 'top left';
      labels.style.transform = `scale(${scaleX}, ${scaleY})`;
    }
  });
}

['paperSize','pageMargin','sheetGap'].forEach(id=>{
  document.getElementById(id).addEventListener('input',applyPageSettings);
  document.getElementById(id).addEventListener('change',applyPageSettings);
});

document.getElementById('jsonSaveBtn').addEventListener('click', ()=>{
  const activeAlignBtn = document.querySelector('[data-align].active');
  const sheets = labelGroups.map(labels =>
    [...labels.querySelectorAll('.label')].map(input => input.value)
  );

  const data = {
    version: 1,
    savedAt: new Date().toISOString(),
    pageSettings: {
      paperSize: document.getElementById('paperSize').value,
      pageMargin: Number(document.getElementById('pageMargin').value),
      sheetGap: Number(document.getElementById('sheetGap').value)
    },
    textSettings: {
      fontSize: Number(document.getElementById('fontSize').value),
      fontColor: document.getElementById('fontColor').value,
      fontFamily: document.getElementById('fontFamily').value,
      align: activeAlignBtn ? activeAlignBtn.dataset.align : 'center',
      borderWidth: Number(document.getElementById('borderWidth').value),
      borderColor: document.getElementById('borderColor').value,
      bold: document.querySelector('[data-style="bold"]').classList.contains('active'),
      italic: document.querySelector('[data-style="italic"]').classList.contains('active'),
      underline: document.querySelector('[data-style="underline"]').classList.contains('active')
    },
    mode: {
      mirrorMode,
      labelOrientation
    },
    sheets
  };

  const blob = new Blob(
    [JSON.stringify(data, null, 2)],
    {type:'application/json;charset=utf-8'}
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'label-sheet.json';
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
});

document.getElementById('jsonLoadBtn').addEventListener('click', ()=>{
  document.getElementById('jsonFileInput').click();
});

document.getElementById('jsonFileInput').addEventListener('change', async (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;

  try{
    const data = JSON.parse(await file.text());

    if(data.pageSettings){
      if(data.pageSettings.paperSize != null)
        document.getElementById('paperSize').value = data.pageSettings.paperSize;

      if(data.pageSettings.pageMargin != null)
        document.getElementById('pageMargin').value = data.pageSettings.pageMargin;

      if(data.pageSettings.sheetGap != null)
        document.getElementById('sheetGap').value = data.pageSettings.sheetGap;
    }

    if(data.textSettings){
      if(data.textSettings.fontSize != null){
        document.getElementById('fontSize').value = data.textSettings.fontSize;
        document.querySelectorAll('.label,.mirror-text')
          .forEach(el=>el.style.fontSize = data.textSettings.fontSize + 'px');
      }

      if(data.textSettings.fontColor){
        document.getElementById('fontColor').value = data.textSettings.fontColor;

        document.querySelectorAll('.label:not(.upper),.mirror-text')
          .forEach(el=>el.style.color = data.textSettings.fontColor);
      
        document.querySelectorAll('.label.upper')
          .forEach(el=>el.style.color = 'transparent');
      }

      if(data.textSettings.fontFamily){
        document.getElementById('fontFamily').value = data.textSettings.fontFamily;
        document.querySelectorAll('.label,.mirror-text')
          .forEach(el=>el.style.fontFamily = data.textSettings.fontFamily);
      }

      if(data.textSettings.borderWidth != null){
        document.getElementById('borderWidth').value = data.textSettings.borderWidth;
        document.querySelectorAll('.label')
          .forEach(el=>el.style.borderWidth = data.textSettings.borderWidth + 'px');
      }

      if(data.textSettings.borderColor){
        document.getElementById('borderColor').value = data.textSettings.borderColor;
        document.querySelectorAll('.label')
          .forEach(el=>el.style.borderColor = data.textSettings.borderColor);
      }

      const align = data.textSettings.align || 'center';
      document.querySelectorAll('[data-align]').forEach(btn=>{
        btn.classList.toggle('active', btn.dataset.align === align);
      });

      document.querySelectorAll('.label').forEach(el=>el.style.textAlign = align);
      document.querySelectorAll('.mirror-text').forEach(el=>{
        el.style.textAlign = align;
        el.style.justifyContent =
          align === 'left' ? 'flex-start' :
          align === 'right' ? 'flex-end' : 'center';
      });

      /* 여기부터 추가 */
      const bold = Boolean(data.textSettings.bold);
      const italic = Boolean(data.textSettings.italic);
      const underline = Boolean(data.textSettings.underline);
      
      const boldBtn = document.querySelector('[data-style="bold"]');
      const italicBtn = document.querySelector('[data-style="italic"]');
      const underlineBtn = document.querySelector('[data-style="underline"]');
      
      boldBtn.classList.toggle('active', bold);
      italicBtn.classList.toggle('active', italic);
      underlineBtn.classList.toggle('active', underline);
      
      document.querySelectorAll('.label,.mirror-text').forEach(el=>{
        el.style.fontWeight = bold ? '700' : '400';
        el.style.fontStyle = italic ? 'italic' : 'normal';
        el.style.textDecoration = underline ? 'underline' : 'none';
      });
      /* 여기까지 추가 */
    }

    if(Array.isArray(data.sheets)){
      labelGroups.forEach((labels, sheetIndex)=>{
        const values = Array.isArray(data.sheets[sheetIndex])
          ? data.sheets[sheetIndex]
          : [];

        [...labels.querySelectorAll('.label')].forEach((input, i)=>{
          input.value = values[i] ?? '';
          const mirrorText = input.parentElement.querySelector('.mirror-text');
          if(mirrorText) mirrorText.textContent = input.value;
        });
      });
    }

    setMirrorMode(Boolean(data.mode && data.mode.mirrorMode));
    setLabelOrientation(data.mode && data.mode.labelOrientation === 'vertical' ? 'vertical' : 'horizontal');

  }catch(err){
    alert('JSON 파일을 읽을 수 없습니다.');
    console.error(err);
  }finally{
    e.target.value = '';
  }
});

// 시작 상태: 가로 견출지 + 윗칸 직접입력
setMirrorMode(false);
setLabelOrientation('horizontal');
</script>
