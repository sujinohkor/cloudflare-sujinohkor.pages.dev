<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Object Remover</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #202020; color: #fff; }
        .app-container { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; height: 100vh; position: fixed; left: 0; top: 0; background-color: #101010; padding: 20px; display: flex; flex-direction: column; }
        .main-content { margin-left: 250px; padding: 40px; flex: 1; display: flex; flex-direction: column; height: 100vh; gap: 20px; overflow: hidden; }
        .workspace-container { display: flex; flex: 1; gap: 20px; min-height: 0; }
        .menu-btn { width: 100%; padding: 10px; margin-bottom: 10px; cursor: pointer; background: #202020; color: #ff9e40; border: 2px solid #ff9e40; border-radius: 50px; font-weight: bold; text-align: center; }
        .content-box { flex: 1; border: 2px solid #ff9e40; border-radius: 16px; display: flex; padding: 20px; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; }
        .image-preview-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .preview-img, .preview-canvas { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .empty-msg { color: #888; font-family: 'Consolas', monospace; }
        #loading-msg { display: none; color: #ff9e40; font-weight: bold; margin-top: 10px; }
        @media (max-width: 600px) {
            .sidebar { transform: translateX(-250px); }
            .main-content { margin-left: 0; padding: 20px; width: 100%; }
            .workspace-container { flex-direction: column; }
        }
    </style>
</head>
<body>
<input type="file" id="file-selector" accept="image/*" style="display: none;">

<div class="app-container">
    <aside class="sidebar">
        <button class="menu-btn" onclick="uploadFile()">Upload Image</button>
        <button class="menu-btn" onclick="resetAll()">Reset</button>
    </aside>
    <main class="main-content">
        <h1>Fast Object Background Remover</h1>
        <div class="workspace-container">
            <section class="content-box" id="drop-zone">
                <div class="image-preview-container" id="original-container">
                    <div class="empty-msg">Click to upload image</div>
                </div>
            </section>
            <section class="content-box">
                <div class="image-preview-container" id="result-container">
                    <div class="empty-msg">Result will appear here</div>
                </div>
                <div id="loading-msg">⚡ 3-second fast processing...</div>
            </section>
        </div>
    </main>
</div>

<script>
    const originalContainer = document.getElementById('original-container');
    const resultContainer = document.getElementById('result-container');
    const fileSelector = document.getElementById('file-selector');
    const loadingMsg = document.getElementById('loading-msg');
    const dropZone = document.getElementById('drop-zone');

    async function processFastVerticalObject(file) {
        loadingMsg.style.display = 'block';
        
        const startTime = performance.now();

        createImageBitmap(file).then(bitmap => {
            const width = bitmap.width;
            const height = bitmap.height;

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(bitmap, 0, 0);

            const originalUrl = URL.createObjectURL(file);
            originalContainer.innerHTML = `<img src="${originalUrl}" alt="Original" class="preview-img">`;

            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;

            // 상하좌우 경계에서 배경 색상 추출 (모서리 평균)
            let bgR = (data[0] + data[(width-1)*4] + data[(width*(height-1))*4] + data[(width*height-1)*4]) / 4;
            let bgG = (data[1] + data[(width-1)*4+1] + data[(width*(height-1))*4+1] + data[(width*height-1)*4+1]) / 4;
            let bgB = (data[2] + data[(width-1)*4+2] + data[(width*(height-1))*4+2] + data[(width*height-1)*4+2]) / 4;

            // 세로형 중앙 객체(유산균 스틱 등)를 타겟팅하기 위한 수직 투영 및 픽셀 마스킹
            // 좌우측 배경 영역을 먼저 빠르게 투명화 처리
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const r = data[idx], g = data[idx+1], b = data[idx+2];

                    // 배경과의 색상 차이 계산
                    const diff = Math.abs(r - bgR) + Math.abs(g - bgG) + Math.abs(b - bgB);

                    // 배경과 유사한 색상은 투명화
                    if (diff < 35) {
                        data[idx + 3] = 0;
                    }
                }
            }

            ctx.putImageData(imgData, 0, 0);

            const resultCanvas = document.createElement('canvas');
            resultCanvas.width = width;
            resultCanvas.height = height;
            resultCanvas.className = 'preview-canvas';
            const resCtx = resultCanvas.getContext('2d');
            resCtx.drawImage(canvas, 0, 0);

            const endTime = performance.now();
            console.log(`Processing time: ${Math.round(endTime - startTime)}ms`);

            resultContainer.innerHTML = '';
            resultContainer.appendChild(resultCanvas);
            loadingMsg.style.display = 'none';
        }).catch(err => {
            console.error(err);
            loadingMsg.style.display = 'none';
        });
    }

    dropZone.addEventListener('click', () => fileSelector.click());
    fileSelector.addEventListener('change', (e) => processFastVerticalObject(e.target.files[0]));

    window.uploadFile = () => fileSelector.click();
    window.resetAll = () => {
        originalContainer.innerHTML = `<div class="empty-msg">Click to upload image</div>`;
        resultContainer.innerHTML = `<div class="empty-msg">Result will appear here</div>`;
        loadingMsg.style.display = 'none';
        fileSelector.value = '';
    };
</script>
</body>
</html>
