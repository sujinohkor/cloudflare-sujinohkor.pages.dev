<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Background & Signature Remover</title>
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #202020; color: #fff; transition: background 0.3s; }
                
        .app-container { display: flex; min-height: 100vh; }
        .sidebar { 
            width: 250px; height: 100vh; position: fixed; left: 0; top: 0; 
            background-color: #101010; padding: 20px; z-index: 1000; 
            display: flex; flex-direction: column; transition: transform 0.3s ease; 
        }
        .main-content { 
            margin-left: 250px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; gap: 20px; overflow: hidden; transition: 0.3s; 
        }
        .workspace-container {
            display: flex;
            flex-direction: row;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }

        .menu-btn, .theme-btn { 
            width: 100%; padding: 10px; margin-bottom: 10px; cursor: pointer;
            background: #202020; color: #ff9e40; border: 2px solid #ff9e40; 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; text-align: center;
        }
        .menu-btn:hover, .menu-btn.active { background: #ff9e40; color: #101010; }
        .theme-btn:hover { background-color: #FDF5E6; color: #F38020; border-color: #FDF5E6; }

        .control-group {
            background: #181818;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            margin-bottom: 10px;
            text-align: left;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #ff9e40;
            font-weight: bold;
        }
        .control-group input[type="range"] {
            width: 100%;
            accent-color: #ff9e40;
            cursor: pointer;
        }

        .content-box { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; display: flex; 
            padding: 20px; background: transparent; flex-direction: column; 
            align-items: center; justify-content: center; gap: 10px; text-align: center;
            overflow: hidden; position: relative;
            cursor: pointer;
        }
        .content-mid.dragover { background-color: rgba(255, 158, 64, 0.1); border-style: dashed; }
        .image-preview-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            position: relative;
        }
        .preview-img, .preview-canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        .empty-msg {
            color: #888;
            font-family: 'Consolas', monospace;
            font-size: 1rem;
        }
        #loading-msg {
            display: none;
            color: #ff9e40;
            font-weight: bold;
            font-size: 0.95rem;
            margin-top: 10px;
        }

        .card, .content-box {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        body.light-mode { background-color: #fff; }
        body.light-mode .sidebar { background-color: #FDF5E6; box-shadow: 4px 0 15px rgba(0, 0, 0, 0.05); }
        body.light-mode .menu-btn, body.light-mode .theme-btn { background: #FDF5E6; color: #F38020; border-color: #F38020; }
        body.light-mode .menu-btn:hover, body.light-mode .menu-btn.active { background: #F38020; color: #ffffff; border-color: #F38020; }
        body.light-mode .theme-btn:hover { background-color: #202020; color: #ff9e40; border-color: #202020; }
        body.light-mode .control-group { background: #fff5e6; border-color: #f38020; }
        body.light-mode .card, body.light-mode .content-box { box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15); }

        .menu-toggle-btn { display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }                
        
        @media (max-width: 600px) {            
            .menu-toggle-btn { display: block; color: #ffffff; }
            .sidebar { transform: translateX(-250px); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px; width: 100%; max-height: 100svh; flex: 1; display: flex; flex-direction: column; }
            .workspace-container { flex-direction: column; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    <input type="file" id="file-selector" accept="image/*" style="display: none;">
    
    <div class="app-container">    
        <aside class="sidebar" id="sidebar">        
            <button class="menu-btn" onclick="location.href='../index'">Home</button>
            <button id="theme-toggle" class="theme-btn">DAY / NIGHT</button>                        
            <button class="menu-btn active" id="btn-ai-bg" onclick="switchMode('ai')">AI BG Remover</button>
            <button class="menu-btn" id="btn-sig" onclick="switchMode('signature')">Signature Remover</button>
            
            <div class="control-group" id="signature-controls" style="display: none;">            
                <label for="thresholdRange">                
                    <span>제거 강도</span>                
                    <span id="thresholdVal">50</span>            
                </label>            
                <input type="range" id="thresholdRange" min="0" max="100" value="50">        
            </div>
            
            <button class="menu-btn" onclick="uploadFile()">Upload</button>        
            <button class="menu-btn" onclick="resetAll()">Reset</button>    
        </aside>
        
        <main class="main-content">        
            <header class="top-section" id="header-section">            
                <h1 id="page-title">AI Background Remover</h1>            
                <p id="page-desc">Upload an image to remove background instantly.</p>        
            </header>
            
            <div class="workspace-container">            
                <section class="content-box content-mid" id="drop-zone">                
                    <div class="image-preview-container" id="original-container">                    
                        <div class="empty-msg">Drag & Drop an image file here or click to upload.</div>                
                    </div>            
                </section>
                
                <section class="content-box content-down" id="result-zone">                
                    <div class="image-preview-container" id="result-container">                    
                        <div class="empty-msg">Result image will appear here.</div>                
                    </div>                
                    <div id="loading-msg">✨ Processing...</div>            
                </section>        
            </div>    
        </main>
    </div>

    <!-- ONNX Runtime Web 엔진 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script>
        // WASM 경로 설정 (CDN 기반 바이너리 로드 오류 방지)
        ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";
        ort.env.wasm.numThreads = Math.max(1, Math.min(4, navigator.hardwareConcurrency || 2));
        ort.env.logLevel = "warning";

        const sidebar = document.getElementById('sidebar');    
        const dropZone = document.getElementById('drop-zone');    
        const originalContainer = document.getElementById('original-container');    
        const resultContainer = document.getElementById('result-container');    
        const fileSelector = document.getElementById('file-selector');    
        const loadingMsg = document.getElementById('loading-msg');            
        const btnAiBg = document.getElementById('btn-ai-bg');    
        const btnSig = document.getElementById('btn-sig');    
        const signatureControls = document.getElementById('signature-controls');    
        const pageTitle = document.getElementById('page-title');    
        const pageDesc = document.getElementById('page-desc');            
        const thresholdRange = document.getElementById('thresholdRange');    
        const thresholdVal = document.getElementById('thresholdVal');

        let currentMode = 'ai';    
        let currentFile = null;
        let aiSession = null;

        const localBaseUrl = new URL("./", window.location.href);
        const modelU2NetpUrl = new URL("/models/u2netp.onnx", localBaseUrl);

        const C = {
            get resultCanvas() {
                let canvas = resultContainer.querySelector('canvas.preview-canvas');
                if (!canvas) {
                    canvas = document.createElement('canvas');
                    canvas.className = 'preview-canvas';
                    canvas.style.display = 'none';
                }
                return canvas;
            },
            get resultPlaceholder() {
                let msg = resultContainer.querySelector('.empty-msg');
                if (!msg) {
                    msg = document.createElement('div');
                    msg.className = 'empty-msg';
                    msg.textContent = 'Result image will appear here.';
                }
                return msg;
            }
        };

        window.toggleSidebar = function() { 
            sidebar.classList.toggle('active'); 
        };    
        
        document.getElementById('theme-toggle').addEventListener('click', () => { 
            document.body.classList.toggle('light-mode'); 
        });    
        
        document.querySelector('.main-content').addEventListener('click', (e) => {         
            if (sidebar.classList.contains('active') && !e.target.closest('.sidebar')) {             
                sidebar.classList.remove('active');         
            }     
        });

        window.switchMode = function(mode) {        
            currentMode = mode;        
            setInitialUI();

            if (mode === 'ai') {            
                btnAiBg.classList.add('active');            
                btnSig.classList.remove('active');            
                signatureControls.style.display = 'none';            
                pageTitle.textContent = "AI Background Remover";            
                pageDesc.textContent = "Upload an image to remove background instantly.";        
            } else {            
                btnSig.classList.add('active');            
                btnAiBg.classList.remove('active');            
                signatureControls.style.display = 'block';            
                pageTitle.textContent = "Stamp & Signature Remover";            
                pageDesc.textContent = "Upload a document image to remove white background instantly.";        
            }    
        };

        thresholdRange.addEventListener('input', (e) => {        
            thresholdVal.textContent = e.target.value;        
            if (currentFile && currentMode === 'signature') {            
                processSignatureImage(currentFile);        
            }    
        });

        function setInitialUI() {        
            originalContainer.innerHTML = `<div class="empty-msg">Drag & Drop an image file here or click to upload.</div>`;        
            resultContainer.innerHTML = `<div class="empty-msg">Result image will appear here.</div>`;        
            loadingMsg.style.display = 'none';        
            fileSelector.value = '';        
            currentFile = null;    
        }
        
        setInitialUI();

        // 1. 도장·서명 배경 제거 방식 (캔버스 밝기 분석)
        function qf(e, r, i) {
            const u = Math.max(1, Math.round(Math.min(r, i) * .06)), s = [[], [], []];
            for (let p = 0; p < i; p += 1) {
                for (let q = 0; q < r; q += 1) {
                    if (q >= u && q < r - u && p >= u && p < i - u) continue;
                    const H = (p * r + q) * 4;
                    e[H + 3] < 16 || (s[0].push(e[H]), s[1].push(e[H + 1]), s[2].push(e[H + 2]));
                }
            }
            const Vf = arr => {
                if (arr.length === 0) return 255;
                arr.sort((a, b) => a - b);
                const mid = Math.floor(arr.length / 2);
                return arr.length % 2 === 0 ? (arr[mid - 1] + arr[mid]) / 2 : arr[mid];
            };
            const f = s.map(p => Math.round(Vf(p))),
                  m = f[0] * .2126 + f[1] * .7152 + f[2] * .0722;
            const D = m >= 220 && Math.max(...f) - Math.min(...f) <= 30;
            const ae = D;
            return { background: f, isLightNeutralBackground: D, isFlatArtwork: ae };
        }

        function pt(val, min = 0, max = 1) {
            return Math.max(min, Math.min(max, val));
        }

        function jf(i) {
            return 0.01 + (i / 100) * 0.05;
        }

        function Hf(e, r, i = 50) {
            const u = [Math.max(1, Number(r?.[0]) || 255), Math.max(1, Number(r?.[1]) || 255), Math.max(1, Number(r?.[2]) || 255)],
                  s = jf(i);
            for (let f = 0; f < e.length; f += 4) {
                const c = e[f + 3] / 255;
                if (c <= 0) { e[f] = 0; e[f + 1] = 0; e[f + 2] = 0; continue; }
                const h = [pt(e[f] / u[0]), pt(e[f + 1] / u[1]), pt(e[f + 2] / u[2])],
                      m = 1 - Math.min(...h),
                      g = pt((m - s) / (1 - s)),
                      v = g * c;
                if (v <= 1 / 255) { e[f] = 0; e[f + 1] = 0; e[f + 2] = 0; e[f + 3] = 0; continue; }
                for (let b = 0; b < 3; b += 1) {
                    const T = (e[f + b] - u[b] * (1 - g)) / Math.max(g, .00392156862745098);
                    e[f + b] = Math.round(pt(T, 0, 255));
                }
                e[f + 3] = Math.round(v * 255);
            }
            return e;
        }

        // 2. 빠른 AI 배경 제거 방식 (U²-NetP ONNX 직접 연동)
        const de = 320;
        
        async function getAiSession() {
            if (aiSession) return aiSession;
            loadingMsg.style.display = 'block';
            loadingMsg.textContent = "✨ Loading Fast AI Model...";
            try {
                aiSession = await ort.InferenceSession.create(modelU2NetpUrl.href, { 
                    executionProviders: ['webgpu', 'wasm'], 
                    graphOptimizationLevel: "all" 
                });
            } catch (err) {
                console.warn("WebGPU initialization failed, falling back to WASM:", err);
                aiSession = await ort.InferenceSession.create(modelU2NetpUrl.href, { 
                    executionProviders: ['wasm'], 
                    graphOptimizationLevel: "all" 
                });
            }
            return aiSession;
        }

        function gc(e) {
            const r = document.createElement("canvas");
            r.width = de, r.height = de;
            const i = r.getContext("2d", { willReadFrequently: !0 });
            i.drawImage(e, 0, 0, de, de);
            const u = i.getImageData(0, 0, de, de).data,
                  s = de * de,
                  f = new Float32Array(s * 3);
            let c = 1;
            for (let h = 0; h < u.length; h += 4) c = Math.max(c, u[h], u[h + 1], u[h + 2]);
            for (let h = 0; h < s; h += 1) {
                const m = h * 4;
                f[h] = (u[m] / c - .485) / .229,
                f[s + h] = (u[m + 1] / c - .456) / .224,
                f[s * 2 + h] = (u[m + 2] / c - .406) / .225;
            }
            return new ort.Tensor('float32', f, [1, 3, de, de]);
        }

        function Cc(e) {
            let r = Number.POSITIVE_INFINITY, i = Number.NEGATIVE_INFINITY;
            for (const m of e) Number.isFinite(m) && (r = Math.min(r, m), i = Math.max(i, m));
            const u = Math.max(i - r, Number.EPSILON),
                  s = document.createElement("canvas");
            s.width = de, s.height = de;
            const f = s.getContext("2d"),
                  c = f.createImageData(de, de),
                  h = Math.min(e.length, de * de);
            for (let m = 0; m < h; m += 1) {
                const g = Math.round(Math.max(0, Math.min(1, (e[m] - r) / u)) * 255),
                      v = m * 4;
                c.data[v] = 255, c.data[v + 1] = 255, c.data[v + 2] = 255, c.data[v + 3] = g;
            }
            f.putImageData(c, 0, 0);
            return s;
        }

        // 4. 최종 결과 합성 (destination-in)
        function wi(e, r, i, u) {
            const s = C.resultCanvas.getContext("2d");
            C.resultCanvas.width = i;
            C.resultCanvas.height = u;
            s.clearRect(0, 0, i, u);
            s.imageSmoothingEnabled = !0;
            s.imageSmoothingQuality = "high";
            
            s.drawImage(e, 0, 0, i, u);
            s.globalCompositeOperation = "destination-in";
            s.drawImage(r, 0, 0, i, u);
            s.globalCompositeOperation = "source-over";
            
            C.resultCanvas.hidden = !1;
            C.resultPlaceholder.hidden = !0;
            
            resultContainer.innerHTML = '';
            resultContainer.appendChild(C.resultCanvas);
        }

        async function handleAiFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const imageUrl = e.target.result;
                originalContainer.innerHTML = `<img src="${imageUrl}" alt="Original Preview" class="preview-img">`;
            };
            reader.readAsDataURL(file);

            resultContainer.innerHTML = `<div class="empty-msg">Processing...</div>`;
            loadingMsg.style.display = 'block';
            loadingMsg.textContent = "✨ Initializing Web ML engine...";

            try {            
                const session = await getAiSession();
                loadingMsg.textContent = "✨ Running AI inference...";

                const imgBitmap = await createImageBitmap(file);
                const width = imgBitmap.width;
                const height = imgBitmap.height;

                const inputTensor = gc(imgBitmap);
                const feeds = { [session.inputNames[0]]: inputTensor };
                const results = await session.run(feeds);
                const outputData = results[session.outputNames[0]].data;

                const maskCanvas = Cc(outputData);
                wi(imgBitmap, maskCanvas, width, height);
            } catch (error) {            
                console.error("AI Processing Error:", error);            
                alert('Error occurred while removing background: ' + error.message);            
                resultContainer.innerHTML = `<div class="empty-msg">Error occurred</div>`;        
            } finally {            
                loadingMsg.style.display = 'none';        
            }    
        }

        function processSignatureImage(file) {        
            loadingMsg.style.display = 'block';
            loadingMsg.textContent = "✨ Processing stamp & signature precisely...";

            const reader = new FileReader();
            reader.onload = (e) => {            
                const imageUrl = e.target.result;
                originalContainer.innerHTML = `<img src="${imageUrl}" alt="Original Preview" class="preview-img">`;

                const img = new Image();
                img.onload = () => {                
                    const canvas = document.createElement('canvas');                
                    canvas.width = img.width;                
                    canvas.height = img.height;                
                    const ctx = canvas.getContext('2d');

                    ctx.drawImage(img, 0, 0);                
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);                
                    const data = imgData.data;                
                    const threshold = parseInt(thresholdRange.value);

                    const analysisInfo = qf(data, canvas.width, canvas.height);
                    Hf(data, analysisInfo.background, threshold);

                    ctx.putImageData(imgData, 0, 0);

                    const resultCanvas = document.createElement('canvas');                
                    resultCanvas.width = canvas.width;                
                    resultCanvas.height = canvas.height;                
                    resultCanvas.className = 'preview-canvas';                
                    const resCtx = resultCanvas.getContext('2d');                
                    resCtx.drawImage(canvas, 0, 0);

                    resultContainer.innerHTML = '';                
                    resultContainer.appendChild(resultCanvas);                
                    loadingMsg.style.display = 'none';            
                };            
                img.src = imageUrl;        
            };
            reader.readAsDataURL(file);    
        }

        function handleFile(file) {        
            if (!file) return;        
            if (!file.type.startsWith('image/')) {            
                alert('Please upload an image file.');            
                return;        
            }

            currentFile = file;        
            if (currentMode === 'ai') {            
                handleAiFile(file);        
            } else {            
                processSignatureImage(file);        
            }    
        }

        dropZone.addEventListener('dragover', (e) => { 
            e.preventDefault(); 
            dropZone.classList.add('dragover'); 
        });    
        dropZone.addEventListener('dragleave', () => { 
            dropZone.classList.remove('dragover'); 
        });    
        dropZone.addEventListener('drop', (e) => {         
            e.preventDefault();         
            dropZone.classList.remove('dragover');         
            const file = e.dataTransfer.files[0];         
            handleFile(file);     
        });    
        dropZone.addEventListener('click', () => { 
            fileSelector.click(); 
        });

        window.uploadFile = function() { 
            fileSelector.click(); 
        };

        fileSelector.addEventListener('change', (e) => {        
            const file = e.target.files[0];        
            handleFile(file);    
        });

        window.resetAll = function() { 
            setInitialUI(); 
        };
    </script>
</body>
</html>
