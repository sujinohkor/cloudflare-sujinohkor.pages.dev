<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Background & Signature Remover</title>
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #202020; color: #fff; transition: background 0.3s; }

        .app-container { display: flex; min-height: 100vh; }
        .sidebar { 
            width: 250px; height: 100vh; position: fixed; left: 0; top: 0; 
            background-color: #101010; padding: 20px; z-index: 1000; 
            display: flex; flex-direction: column; transition: transform 0.3s ease; 
        }
        .main-content { 
            margin-left: 250px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; gap: 20px; overflow: hidden; transition: 0.3s; 
        }
        .workspace-container {
            display: flex;
            flex-direction: row;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }

        .menu-btn, .theme-btn { 
            width: 100%; padding: 10px; margin-bottom: 10px; cursor: pointer;
            background: #202020; color: #ff9e40; border: 2px solid #ff9e40; 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; text-align: center;
        }
        .menu-btn:hover, .menu-btn.active { background: #ff9e40; color: #101010; }
        .theme-btn:hover { background-color: #FDF5E6; color: #F38020; border-color: #FDF5E6; }

        .control-group {
            background: #181818;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            margin-bottom: 10px;
            text-align: left;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #ff9e40;
            font-weight: bold;
        }
        .control-group input[type="range"] {
            width: 100%;
            accent-color: #ff9e40;
            cursor: pointer;
        }

        .content-box { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; display: flex; 
            padding: 20px; background: transparent; flex-direction: column; 
            align-items: center; justify-content: center; gap: 10px; text-align: center;
            overflow: hidden; position: relative;
            cursor: pointer;
        }
        .content-mid.dragover { background-color: rgba(255, 158, 64, 0.1); border-style: dashed; }
        .image-preview-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            position: relative;
            background-image: linear-gradient(45deg, #2a2a2a 25%, transparent 25%), 
                              linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #2a2a2a 75%), 
                              linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }
        .preview-img, .preview-canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        .empty-msg {
            color: #888;
            font-family: 'Consolas', monospace;
            font-size: 1rem;
        }
        #loading-msg {
            display: none;
            color: #ff9e40;
            font-weight: bold;
            font-size: 0.95rem;
            margin-top: 10px;
        }

        .card, .content-box {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        body.light-mode { background-color: #fff; }
        body.light-mode .sidebar { background-color: #FDF5E6; box-shadow: 4px 0 15px rgba(0, 0, 0, 0.05); }
        body.light-mode .menu-btn, body.light-mode .theme-btn { background: #FDF5E6; color: #F38020; border-color: #F38020; }
        body.light-mode .menu-btn:hover, body.light-mode .menu-btn.active { background: #F38020; color: #ffffff; border-color: #F38020; }
        body.light-mode .theme-btn:hover { background-color: #202020; color: #ff9e40; border-color: #202020; }
        body.light-mode .control-group { background: #fff5e6; border-color: #f38020; }
        body.light-mode .card, body.light-mode .content-box { box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15); }

        .menu-toggle-btn { display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }

        @media (max-width: 600px) {
            .menu-toggle-btn { display: block; color: #ffffff; }
            .sidebar { transform: translateX(-250px); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px; width: 100%; max-height: 100svh; flex: 1; display: flex; flex-direction: column; }
            .workspace-container { flex-direction: column; }
        }
    </style>
</head>
<body>
<button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
<input type="file" id="file-selector" accept="image/jpeg,image/png,image/webp" style="display: none;">

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <button class="menu-btn" onclick="location.href='../index'">Home</button>
        <button id="theme-toggle" class="theme-btn">DAY / NIGHT</button>

        <button class="menu-btn active" id="btn-auto" onclick="switchMode('auto')">자동 AI</button>
        <button class="menu-btn" id="btn-subject" onclick="switchMode('subject')">빠른 처리</button>
        <button class="menu-btn" id="btn-portrait" onclick="switchMode('portrait')">인물 정밀</button>
        <button class="menu-btn" id="btn-signature" onclick="switchMode('stamp')">도장·서명</button>

        <div class="control-group" id="signature-controls" style="display: none;">
            <label for="thresholdRange">
                <span>제거 강도</span>
                <span id="thresholdVal">50</span>
            </label>
            <input type="range" id="thresholdRange" min="0" max="100" value="50">
        </div>

        <button class="menu-btn" onclick="uploadFile()">Upload</button>
        <button class="menu-btn" onclick="resetAll()">Reset</button>
    </aside>

    <main class="main-content">
        <header class="top-section" id="header-section">
            <h1 id="page-title">AI Background Remover</h1>
            <p id="page-desc">브라우저 내 Web ML 엔진으로 고속 누끼를 처리합니다.</p>
        </header>

        <div class="workspace-container">
            <section class="content-box content-mid" id="drop-zone">
                <div class="image-preview-container" id="original-container">
                    <div class="empty-msg">Drag & Drop an image file here or click to upload.</div>
                </div>
            </section>
            <section class="content-box content-down" id="result-zone">
                <div class="image-preview-container" id="result-container">
                    <canvas id="resultCanvas" class="preview-canvas" style="display: none;"></canvas>
                    <div id="empty-result-msg" class="empty-msg">Result image will appear here.</div>
                </div>
                <div id="loading-msg">✨ AI is processing...</div>
            </section>
        </div>
    </main>
</div>

<!-- ONNX Runtime Web 엔진 -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<script>
    ort.env.wasm.numThreads = globalThis.crossOriginIsolated ? Math.max(1, Math.min(4, navigator.hardwareConcurrency || 2)) : 1;
    ort.env.logLevel = "warning";

    const sidebar = document.getElementById('sidebar');
    const dropZone = document.getElementById('drop-zone');
    const originalContainer = document.getElementById('original-container');
    const resultContainer = document.getElementById('result-container');
    const resultCanvas = document.getElementById('resultCanvas');
    const emptyResultMsg = document.getElementById('empty-result-msg');
    const fileSelector = document.getElementById('file-selector');
    const loadingMsg = document.getElementById('loading-msg');

    const btnAuto = document.getElementById('btn-auto');
    const btnSubject = document.getElementById('btn-subject');
    const btnPortrait = document.getElementById('btn-portrait');
    const btnSignature = document.getElementById('btn-signature');
    const signatureControls = document.getElementById('signature-controls');

    const thresholdRange = document.getElementById('thresholdRange');
    const thresholdVal = document.getElementById('thresholdVal');

    let currentMode = 'auto';
    let currentFile = null;
    let originalImageBitmap = null;
    let backgroundAnalysisResult = null;

    // 모델 파일 및 리소스 상태 관리 객체
    const AIState = {
        session: null,
        portraitSession: null,
        provider: "",
        portraitProvider: ""
    };

    const localBaseUrl = new URL("./", window.location.href);
    const modelU2NetpUrl = new URL("models/u2netp-320-v1.onnx", localBaseUrl);
    const modelModNetUrl = new URL("models/modnet-portrait-fp16.onnx", localBaseUrl);

    window.toggleSidebar = function() { sidebar.classList.toggle('active'); }
    document.getElementById('theme-toggle').addEventListener('click', () => { document.body.classList.toggle('light-mode'); });
    document.querySelector('.main-content').addEventListener('click', (e) => { 
        if (sidebar.classList.contains('active') && !e.target.closest('.sidebar')) { 
            sidebar.classList.remove('active'); 
        } 
    });

    window.switchMode = function(mode) {
        currentMode = mode;
        [btnAuto, btnSubject, btnPortrait, btnSignature].forEach(btn => btn.classList.remove('active'));
        if (mode === 'auto') btnAuto.classList.add('active');
        if (mode === 'subject') btnSubject.classList.add('active');
        if (mode === 'portrait') btnPortrait.classList.add('active');
        if (mode === 'stamp') btnSignature.classList.add('active');

        if (mode === 'stamp') {
            signatureControls.style.display = 'block';
        } else {
            signatureControls.style.display = 'none';
        }

        if (currentFile) {
            processFilePipeline(currentFile);
        }
    };

    thresholdRange.addEventListener('input', (e) => {
        thresholdVal.textContent = e.target.value + " · 조절중";
        if (currentFile && currentMode === 'stamp' && backgroundAnalysisResult) {
            processStampMode(originalImageBitmap, backgroundAnalysisResult);
        }
    });

    function setInitialUI() {
        originalContainer.innerHTML = `<div class="empty-msg">Drag & Drop an image file here or click to upload.</div>`;
        resultCanvas.style.display = 'none';
        resultCanvas.width = 0;
        resultCanvas.height = 0;
        emptyResultMsg.style.display = 'block';
        loadingMsg.style.display = 'none';
        fileSelector.value = '';
        currentFile = null;
        originalImageBitmap = null;
        backgroundAnalysisResult = null;
    }
    setInitialUI();

    // 픽셀 통계 분석 및 도장 판별 함수
    function analyzeBackground(canvasEl, width, height) {
        const ctx = canvasEl.getContext('2d', { willReadFrequently: true });
        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;
        const u = Math.max(1, Math.round(Math.min(width, height) * 0.06));
        const s = [[], [], []];

        for (let p = 0; p < height; p += 1) {
            for (let q = 0; q < width; q += 1) {
                if (q >= u && q < width - u && p >= u && p < height - u) continue;
                const H = (p * width + q) * 4;
                if (data[H + 3] < 16) continue;
                s[0].push(data[H]);
                s[1].push(data[H + 1]);
                s[2].push(data[H + 2]);
            }
        }

        const median = arr => {
            if (arr.length === 0) return 255;
            arr.sort((a, b) => a - b);
            const r = Math.floor(arr.length / 2);
            return arr.length % 2 === 0 ? (arr[r - 1] + arr[r]) / 2 : arr[r];
        };

        const bg = [median(s[0]), median(s[1]), median(s[2])];
        const luminance = bg[0] * 0.2126 + bg[1] * 0.7152 + bg[2] * 0.0722;
        const isLightNeutralBackground = luminance >= 220 && Math.max(...bg) - Math.min(...bg) <= 30;
        
        return { background: bg, isFlatArtwork: isLightNeutralBackground };
    }

    // 도장 픽셀 제거 알고리즘
    function processStampMode(imgElement, analysis) {
        const width = imgElement.width || imgElement.naturalWidth;
        const height = imgElement.height || imgElement.naturalHeight;
        
        resultCanvas.width = width;
        resultCanvas.height = height;
        const ctx = resultCanvas.getContext('2d', { willReadFrequently: true });
        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(imgElement, 0, 0, width, height);

        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;
        const rangeVal = Number(thresholdRange.value);
        const sensitivity = 0.01 + (rangeVal / 100) * 0.05;
        const bg = analysis.background;

        for (let f = 0; f < data.length; f += 4) {
            const alpha = data[f + 3] / 255;
            if (alpha <= 0) { data[f] = 0; data[f+1] = 0; data[f+2] = 0; continue; }
            
            const ratios = [Math.max(0, Math.min(1, data[f] / Math.max(1, bg[0]))),
                            Math.max(0, Math.min(1, data[f+1] / Math.max(1, bg[1]))),
                            Math.max(0, Math.min(1, data[f+2] / Math.max(1, bg[2])))];
            const m = 1 - Math.min(...ratios);
            const g = Math.max(0, Math.min(1, (m - sensitivity) / (1 - sensitivity)));
            const v = g * alpha;

            if (v <= 1 / 255) {
                data[f] = 0; data[f+1] = 0; data[f+2] = 0; data[f+3] = 0;
                continue;
            }

            for (let b = 0; b < 3; b += 1) {
                const val = (data[f + b] - bg[b] * (1 - g)) / Math.max(g, 0.00392156);
                data[f + b] = Math.round(Math.max(0, Math.min(255, val)));
            }
            data[f + 3] = Math.round(v * 255);
        }

        ctx.putImageData(imgData, 0, 0);
        resultCanvas.style.display = 'block';
        emptyResultMsg.style.display = 'none';
        loadingMsg.style.display = 'none';
    }

    // ONNX 런타임 세션 생성기
    async function initSession(modelPath, providerName) {
        const response = await fetch(modelPath);
        const buffer = await response.arrayBuffer();
        try {
            return await ort.InferenceSession.create(buffer, { executionProviders: [providerName], graphOptimizationLevel: "all" });
        } catch (err) {
            if (providerName === 'webgpu') {
                return await ort.InferenceSession.create(buffer, { executionProviders: ['wasm'], graphOptimizationLevel: "all" });
            }
            throw err;
        }
    }

    async function getFastSession() {
        if (AIState.session) return AIState.session;
        loadingMsg.style.display = 'block';
        loadingMsg.textContent = "✨ Loading Fast AI Model...";
        AIState.session = await initSession(modelU2NetpUrl, 'webgpu');
        return AIState.session;
    }

    async function getPortraitSession() {
        if (AIState.portraitSession) return AIState.portraitSession;
        loadingMsg.style.display = 'block';
        loadingMsg.textContent = "✨ Loading MODNet Portrait Model (approx 13MB)...";
        AIState.portraitSession = await initSession(modelModNetUrl, 'webgpu');
        return AIState.portraitSession;
    }

    // AI 마스크를 원본에 적용하는 컴포지팅
    function applyMaskToCanvas(originalImg, maskCanvas, width, height) {
        resultCanvas.width = width;
        resultCanvas.height = height;
        const ctx = resultCanvas.getContext('2d');
        ctx.clearRect(0, 0, width, height);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        
        ctx.drawImage(originalImg, 0, 0, width, height);
        ctx.globalCompositeOperation = "destination-in";
        ctx.drawImage(maskCanvas, 0, 0, width, height);
        ctx.globalCompositeOperation = "source-over";

        resultCanvas.style.display = 'block';
        emptyResultMsg.style.display = 'none';
    }

    // 빠른 처리 (U²-NetP) 파이프라인
    async function runFastAI(imgElement, width, height) {
        const session = await getFastSession();
        
        // 320x320 텐서 변환
        const canvas = document.createElement('canvas');
        canvas.width = 320; canvas.height = 320;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgElement, 0, 0, 320, 320);
        const imgData = ctx.getImageData(0, 0, 320, 320).data;
        const floatArr = new Float32Array(320 * 320 * 3);
        let maxVal = 1;
        for (let i = 0; i < imgData.length; i += 4) maxVal = Math.max(maxVal, imgData[i], imgData[i+1], imgData[i+2]);
        for (let i = 0; i < 320 * 320; i++) {
            const idx = i * 4;
            floatArr[i] = (imgData[idx] / maxVal - 0.485) / 0.229;
            floatArr[320 * 320 + i] = (imgData[idx+1] / maxVal - 0.456) / 0.224;
            floatArr[2 * 320 * 320 + i] = (imgData[idx+2] / maxVal - 0.406) / 0.225;
        }
        const inputTensor = new ort.Tensor('float32', floatArr, [1, 3, 320, 320]);
        
        const outputName = session.outputNames[0];
        const results = await session.run({ [session.inputNames[0]]: inputTensor });
        const outputData = results[outputName].data;

        // 마스크 생성
        let min = Infinity, max = -Infinity;
        for (let val of outputData) { if (Number.isFinite(val)) { min = Math.min(min, val); max = Math.max(max, val); } }
        const range = Math.max(max - min, 1e-5);

        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = 320; maskCanvas.height = 320;
        const mCtx = maskCanvas.getContext('2d');
        const mImgData = mCtx.createImageData(320, 320);
        for (let i = 0; i < 320 * 320; i++) {
            const alpha = Math.round(Math.max(0, Math.min(1, (outputData[i] - min) / range)) * 255);
            const p = i * 4;
            mImgData.data[p] = 255; mImgData.data[p+1] = 255; mImgData.data[p+2] = 255; mImgData.data[p+3] = alpha;
        }
        mCtx.putImageData(mImgData, 0, 0);

        applyMaskToCanvas(imgElement, maskCanvas, width, height);
    }

    // 인물 정밀 (MODNet) 파이프라인
    async function runPortraitAI(imgElement, width, height) {
        const session = await getPortraitSession();
        
        const scale = Math.min(512 / Math.min(width, height), 1024 / Math.max(width, height));
        const pW = Math.min(1024, Math.round((width * scale) / 32) * 32);
        const pH = Math.min(1024, Math.round((height * scale) / 32) * 32);

        const canvas = document.createElement('canvas');
        canvas.width = pW; canvas.height = pH;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, pW, pH);
        ctx.drawImage(imgElement, 0, 0, pW, pH);
        const imgData = ctx.getImageData(0, 0, pW, pH).data;
        
        const floatArr = new Float32Array(pW * pH * 3);
        const size = pW * pH;
        for (let i = 0; i < size; i++) {
            const idx = i * 4;
            floatArr[i] = imgData[idx] / 127.5 - 1;
            floatArr[size + i] = imgData[idx+1] / 127.5 - 1;
            floatArr[2 * size + i] = imgData[idx+2] / 127.5 - 1;
        }
        const inputTensor = new ort.Tensor('float32', floatArr, [1, 3, pH, pW]);
        const outputName = session.outputNames[0];
        const results = await session.run({ [session.inputNames[0]]: inputTensor });
        const outputData = results[outputName].data;

        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = pW; maskCanvas.height = pH;
        const mCtx = maskCanvas.getContext('2d');
        const mImgData = mCtx.createImageData(pW, pH);
        for (let i = 0; i < size; i++) {
            const alpha = Math.round(Math.max(0, Math.min(1, outputData[i])) * 255);
            const p = i * 4;
            mImgData.data[p] = 255; mImgData.data[p+1] = 255; mImgData.data[p+2] = 255; mImgData.data[p+3] = alpha;
        }
        mCtx.putImageData(mImgData, 0, 0);

        applyMaskToCanvas(imgElement, maskCanvas, width, height);
    }

    async function processFilePipeline(file) {
        if (!file) return;
        currentFile = file;
        
        const originalUrl = URL.createObjectURL(file);
        originalContainer.innerHTML = `<img src="${originalUrl}" alt="Original Preview" class="preview-img">`;

        loadingMsg.style.display = 'block';
        loadingMsg.textContent = "✨ Analyzing image...";
        resultCanvas.style.display = 'none';
        emptyResultMsg.style.display = 'block';

        try {
            const imgBitmap = await createImageBitmap(file);
            originalImageBitmap = imgBitmap;
            const width = imgBitmap.width;
            const height = imgBitmap.height;

            const analysis = analyzeBackground(originalContainer.querySelector('img') || imgBitmap, width, height);
            backgroundAnalysisResult = analysis;

            let modeToRun = currentMode;
            if (currentMode === 'auto') {
                modeToRun = analysis.isFlatArtwork ? 'stamp' : 'subject';
            }

            if (modeToRun === 'stamp') {
                loadingMsg.textContent = "✨ Processing stamp & signature...";
                processStampMode(imgBitmap, analysis);
            } else if (modeToRun === 'portrait') {
                await runPortraitAI(imgBitmap, width, height);
                loadingMsg.style.display = 'none';
            } else {
                await runFastAI(imgBitmap, width, height);
                loadingMsg.style.display = 'none';
            }
        } catch (error) {
            console.error(error);
            alert('Error occurred while processing image.');
            loadingMsg.style.display = 'none';
            emptyResultMsg.textContent = "Error occurred";
        }
    }

    function handleFile(file) {
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            alert('Please upload an image file.');
            return;
        }
        processFilePipeline(file);
    }

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', (e) => { 
        e.preventDefault(); 
        dropZone.classList.remove('dragover'); 
        const file = e.dataTransfer.files[0]; 
        handleFile(file); 
    });
    dropZone.addEventListener('click', () => { fileSelector.click(); });

    window.uploadFile = function() { fileSelector.click(); };

    fileSelector.addEventListener('change', (e) => {
        const file = e.target.files[0];
        handleFile(file);
    });

    window.resetAll = function() { setInitialUI(); };
</script>
</body>
</html>
