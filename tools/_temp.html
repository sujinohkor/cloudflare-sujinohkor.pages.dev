<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배경 제거</title>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.7/dist/bundle.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #202020; color: #fff; }

        .app-container { display: flex; min-height: 100vh; }
        .sidebar { 
            width: 250px; height: 100vh; position: fixed; left: 0; top: 0; 
            background-color: #101010; padding: 20px; z-index: 1000; 
            display: flex; flex-direction: column; 
        }
        .main-content { 
            margin-left: 250px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; gap: 20px; overflow: hidden; 
        }
        .workspace-container {
            display: flex; flex-direction: row; flex: 1; gap: 20px; min-height: 0;
        }
        .menu-btn { 
            width: 100%; padding: 12px; margin-bottom: 10px; cursor: pointer;
            background: #202020; color: #ff9e40; border: 2px solid #ff9e40; 
            border-radius: 50px; font-weight: bold; text-align: center;
        }
        .menu-btn:hover { background: #ff9e40; color: #101010; }
        .content-box { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; display: flex; 
            padding: 20px; background: transparent; flex-direction: column; 
            align-items: center; justify-content: center; gap: 10px; text-align: center;
            overflow: hidden; position: relative; cursor: pointer;
        }
        .image-preview-container {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 8px; position: relative;
            background-image: linear-gradient(45deg, #2a2a2a 25%, transparent 25%), 
                              linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #2a2a2a 75%), 
                              linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        .preview-img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
        .empty-msg { color: #888; font-family: 'Consolas', monospace; font-size: 1rem; }
        .action-btn {
            width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; display: none;
        }
        .action-btn:hover { background: #1d4ed8; }
        @media (max-width: 600px) {
            .sidebar { transform: translateX(-250px); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px; width: 100%; }
            .workspace-container { flex-direction: column; }
        }
    </style>
</head>
<body>
<input type="file" id="file-selector" accept="image/*" style="display: none;">

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <button class="menu-btn" onclick="uploadFile()">이미지 선택</button>
        <button class="menu-btn" onclick="resetAll()">처음부터</button>
    </aside>

    <main class="main-content">
        <h1>배경 제거</h1>
        <div class="workspace-container">
            <section class="content-box" id="drop-zone">
                <div class="image-preview-container" id="original-container">
                    <div class="empty-msg">원본 이미지</div>
                </div>
            </section>
            <section class="content-box" id="result-zone" style="gap: 15px;">
                <div class="image-preview-container" id="result-container">
                    <div class="empty-msg">누끼 결과 이미지</div>
                </div>
                <button id="download-btn" class="action-btn" onclick="downloadResult()">투명 PNG 다운로드 ↓</button>
            </section>
        </div>
    </main>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const originalContainer = document.getElementById('original-container');
    const resultContainer = document.getElementById('result-container');
    const fileSelector = document.getElementById('file-selector');
    const downloadBtn = document.getElementById('download-btn');

    let lastResultBlob = null;

    function uploadFile() { fileSelector.click(); }
    window.uploadFile = uploadFile;

    function resetAll() {
        originalContainer.innerHTML = `<div class="empty-msg">원본 이미지</div>`;
        resultContainer.innerHTML = `<div class="empty-msg">누끼 결과 이미지</div>`;
        downloadBtn.style.display = 'none';
        fileSelector.value = '';
        lastResultBlob = null;
    }
    window.resetAll = resetAll;

    async function processImage(file) {
        if (!file || !file.type.startsWith('image/')) return;

        const originalUrl = URL.createObjectURL(file);
        originalContainer.innerHTML = `<img src="${originalUrl}" alt="Original" class="preview-img">`;
        resultContainer.innerHTML = `<div class="empty-msg">AI 누끼 따는 중...</div>`;
        downloadBtn.style.display = 'none';

        try {
            const blob = await imglyRemoveBackground(file, {
                model: 'small'
            });

            lastResultBlob = blob;
            const resultUrl = URL.createObjectURL(blob);
            resultContainer.innerHTML = `<img src="${resultUrl}" alt="Result" class="preview-img">`;
            downloadBtn.style.display = 'block';
        } catch (err) {
            console.error(err);
            resultContainer.innerHTML = `<div class="empty-msg">오류 발생</div>`;
        }
    }

    function downloadResult() {
        if (!lastResultBlob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(lastResultBlob);
        a.download = 'transparent_object.png';
        a.click();
    }
    window.downloadResult = downloadResult;

    dropZone.addEventListener('click', () => fileSelector.click());
    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            processImage(e.dataTransfer.files[0]);
        }
    });
    fileSelector.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            processImage(e.target.files[0]);
        }
    });
</script>
</body>
</html>
