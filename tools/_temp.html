<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배경 제거</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #202020; color: #fff; transition: background 0.3s; }

        .app-container { display: flex; min-height: 100vh; }
        .sidebar { 
            width: 250px; height: 100vh; position: fixed; left: 0; top: 0; 
            background-color: #101010; padding: 20px; z-index: 1000; 
            display: flex; flex-direction: column; transition: transform 0.3s ease; 
        }
        .main-content { 
            margin-left: 250px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; gap: 20px; overflow: hidden; transition: 0.3s; 
        }
        .workspace-container {
            display: flex;
            flex-direction: row;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }

        .menu-btn, .theme-btn { 
            width: 100%; padding: 12px; margin-bottom: 10px; cursor: pointer;
            background: #202020; color: #ff9e40; border: 2px solid #ff9e40; 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; text-align: center;
        }
        .menu-btn:hover, .menu-btn.active { background: #ff9e40; color: #101010; }
        .theme-btn:hover { background-color: #FDF5E6; color: #F38020; border-color: #FDF5E6; }

        .content-box { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; display: flex; 
            padding: 20px; background: transparent; flex-direction: column; 
            align-items: center; justify-content: center; gap: 10px; text-align: center;
            overflow: hidden; position: relative;
            cursor: pointer;
        }
        .image-preview-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            position: relative;
        }
        .preview-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        .empty-msg {
            color: #888;
            font-family: 'Consolas', monospace;
            font-size: 1rem;
        }
        
        .status-box {
            background: #18281d;
            border: 1px solid #2e7d32;
            padding: 12px 20px;
            border-radius: 12px;
            color: #a5d6a7;
            font-weight: bold;
            font-size: 0.95rem;
            display: none;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }
        .action-btn:hover { background: #1d4ed8; }

        body.light-mode { background-color: #fff; }
        body.light-mode .sidebar { background-color: #FDF5E6; box-shadow: 4px 0 15px rgba(0, 0, 0, 0.05); }
        body.light-mode .menu-btn, body.light-mode .theme-btn { background: #FDF5E6; color: #F38020; border-color: #F38020; }
        body.light-mode .menu-btn:hover, body.light-mode .menu-btn.active { background: #F38020; color: #ffffff; border-color: #F38020; }
        body.light-mode .theme-btn:hover { background-color: #202020; color: #ff9e40; border-color: #202020; }

        .menu-toggle-btn { display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }

        @media (max-width: 600px) {
            .menu-toggle-btn { display: block; color: #ffffff; }
            .sidebar { transform: translateX(-250px); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px; width: 100%; max-height: 100svh; display: flex; flex-direction: column; }
            .workspace-container { flex-direction: column; }
        }
    </style>
</head>
<body>
<button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
<input type="file" id="file-selector" accept="image/*" style="display: none;">

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <button class="menu-btn" onclick="location.href='../index'">Home</button>
        <button id="theme-toggle" class="theme-btn">DAY / NIGHT</button>
        <button class="menu-btn active">배경 제거</button>
        <button class="menu-btn" onclick="uploadFile()">이미지 선택</button>
        <button class="menu-btn" onclick="resetAll()">처음부터</button>
    </aside>

    <main class="main-content">
        <header class="top-section">
            <h1>배경 제거</h1>
            <p>사진을 업로드하면 고속 WebGPU AI가 자동으로 피사체를 감지하여 배경을 제거합니다.</p>
        </header>

        <div class="workspace-container">
            <section class="content-box content-mid" id="drop-zone">
                <div class="image-preview-container" id="original-container">
                    <div class="empty-msg">여기에 이미지를 드래그하거나 클릭하여 업로드</div>
                </div>
            </section>
            <section class="content-box" id="result-zone" style="gap: 15px;">
                <div class="image-preview-container" id="result-container">
                    <div class="empty-msg">결과 이미지가 여기에 표시됩니다.</div>
                </div>
                <div id="status-box" class="status-box">
                    배경 제거가 완료되었어요<br>
                    <span id="metrics-txt" style="font-size: 0.85rem; font-weight: normal; color: #a5d6a7;"></span>
                </div>
                <button id="download-btn" class="action-btn" onclick="downloadResult()">투명 PNG 다운로드 ↓</button>
            </section>
        </div>
    </main>
</div>

<script type="module">
    import { removeBackground } from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.7/+esm';

    const sidebar = document.getElementById('sidebar');
    const dropZone = document.getElementById('drop-zone');
    const originalContainer = document.getElementById('original-container');
    const resultContainer = document.getElementById('result-container');
    const fileSelector = document.getElementById('file-selector');
    const statusBox = document.getElementById('status-box');
    const metricsTxt = document.getElementById('metrics-txt');
    const downloadBtn = document.getElementById('download-btn');

    let lastResultBlob = null;

    window.toggleSidebar = function() { sidebar.classList.toggle('active'); }
    document.getElementById('theme-toggle').addEventListener('click', () => { document.body.classList.toggle('light-mode'); });

    // 백그라운드에서 모델을 미리 캐싱하여 다음 실행부터 3초 내로 진입 유도
    async function preloadModel() {
        try {
            // 빈 Blob으로 사전 로드 트리거하여 브라우저 캐시에 모델 적재
            const dummyCanvas = document.createElement('canvas');
            dummyCanvas.width = 10; dummyCanvas.height = 10;
            dummyCanvas.toBlob(async (blob) => {
                await removeBackground(blob, { model: 'small' }).catch(() => {});
            });
        } catch(e) {}
    }
    preloadModel();

    async function processImage(file) {
        if (!file || !file.type.startsWith('image/')) return;

        const originalUrl = URL.createObjectURL(file);
        originalContainer.innerHTML = `<img src="${originalUrl}" alt="Original" class="preview-img">`;

        resultContainer.innerHTML = `<div class="empty-msg">⚡ 빠른 AI · WebGPU 처리 중...</div>`;
        statusBox.style.display = 'none';
        downloadBtn.style.display = 'none';

        const startTime = performance.now();

        try {
            // 캐시된 모델을 활용하여 스마트폰 환경에서 초고속 누끼 추출
            const blob = await removeBackground(file, {
                model: 'small',
                publicPath: 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.7/dist/'
            });

            lastResultBlob = blob;
            const resultUrl = URL.createObjectURL(blob);
            
            resultContainer.innerHTML = `<img src="${resultUrl}" alt="Result" class="preview-img">`;

            const duration = ((performance.now() - startTime) / 1000).toFixed(1);
            metricsTxt.textContent = `${duration}초 · 자동 감지 · 빠른 AI · WebGPU · 원본 크기 유지`;
            statusBox.style.display = 'block';
            downloadBtn.style.display = 'block';

        } catch (err) {
            console.error(err);
            resultContainer.innerHTML = `<div class="empty-msg">처리 중 오류가 발생했습니다.</div>`;
        }
    }

    window.downloadResult = function() {
        if (!lastResultBlob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(lastResultBlob);
        a.download = 'removed_background.png';
        a.click();
    };

    dropZone.addEventListener('click', () => fileSelector.click());
    fileSelector.addEventListener('change', (e) => processImage(e.target.files[0]));

    window.uploadFile = () => fileSelector.click();
    window.resetAll = () => {
        originalContainer.innerHTML = `<div class="empty-msg">여기에 이미지를 드래그하거나 클릭하여 업로드</div>`;
        resultContainer.innerHTML = `<div class="empty-msg">결과 이미지가 여기에 표시됩니다.</div>`;
        statusBox.style.display = 'none';
        downloadBtn.style.display = 'none';
        fileSelector.value = '';
        lastResultBlob = null;
    };
</script>
</body>
</html>
