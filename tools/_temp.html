<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U2NetP 브라우저 배경 제거 샘플</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 최신 ONNX Runtime Web CDN 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.25.1/dist/ort.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-white rounded-2xl shadow-xl p-6 space-y-4">
        <h1 class="text-xl font-bold text-center">웹 브라우저 AI 배경 제거 (U²-NetP)</h1>
        <p class="text-xs text-gray-500 text-center">서버로 이미지를 보내지 않고 기기(WebGPU / WASM) 안에서 처리합니다.</p>

        <!-- 파일 업로드 영역 -->
        <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center cursor-pointer hover:border-blue-500 transition">
            <input type="file" id="fileInput" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <!-- 상태 표시 -->
        <div id="status" class="text-sm font-medium text-center text-blue-600">준비 완료. 이미지를 선택해주세요.</div>

        <!-- 결과 프리뷰 화면 -->
        <div class="grid grid-cols-2 gap-4">
            <div class="flex flex-col items-center">
                <span class="text-xs font-semibold mb-1">원본</span>
                <img id="originalImg" class="max-h-48 object-contain border rounded-lg bg-gray-50" alt="원본">
            </div>
            <div class="flex flex-col items-center">
                <span class="text-xs font-semibold mb-1">배경 제거 결과</span>
                <canvas id="resultCanvas" class="max-h-48 object-contain border rounded-lg bg-[linear-gradient(45deg,#ccc_25%,transparent_25%),linear-gradient(-45deg,#ccc_25%,transparent_25%),linear-gradient(45deg,transparent_75%,#ccc_75%),linear-gradient(-45deg,transparent_75%,#ccc_75%)] bg-[size:16px_16px] bg-[position:0_0,0_8px,8px_-8px,-8px_0px]"></canvas>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('status');
        const originalImg = document.getElementById('originalImg');
        const resultCanvas = document.getElementById('resultCanvas');

        let session = null;

        // 1. ONNX Runtime 세션 초기화 (WebGPU 우선 시도, 안되면 WASM 폴백)
        async function initModel() {
            if (session) return session;
            statusDiv.textContent = "AI 모델을 불러오는 중입니다...";
            
            // ONNX Runtime Web 설정
            ort.env.wasm.numThreads = 4;
            ort.env.wasm.simd = true;

            const modelUrl = 'https://huggingface.co/Xenova/u2netp/resolve/main/onnx/model.onnx'; // 공개된 U2NetP ONNX 모델 예시

            try {
                // WebGPU 지원 확인 후 가속 시도
                session = await ort.InferenceSession.create(modelUrl, {
                    executionProviders: ['webgpu', 'wasm'],
                    graphOptimizationLevel: 'all'
                });
                statusDiv.textContent = "AI 모델 준비 완료!";
            } catch (err) {
                console.error(err);
                statusDiv.textContent = "AI 모델 로드 실패: " + err.message;
            }
            return session;
        }

        // 2. 이미지 전처리 (320x320 크기로 변환 및 정규화)
        async function preprocessImage(imgElement) {
            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 320;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(imgElement, 0, 0, 320, 320);
            const imgData = ctx.getImageData(0, 0, 320, 320).data;

            const input = new Float32Array(3 * 320 * 320);
            for (let i = 0; i < 320 * 320; i++) {
                const r = imgData[i * 4] / 255.0;
                const g = imgData[i * 4 + 1] / 255.0;
                const b = imgData[i * 4 + 2] / 255.0;

                // U2Net 표준 정규화 (Mean / Std)
                input[i] = (r - 0.485) / 0.229;
                input[320 * 320 + i] = (g - 0.456) / 0.224;
                input[2 * 320 * 320 + i] = (b - 0.406) / 0.225;
            }
            return new ort.Tensor('float32', input, [1, 3, 320, 320]);
        }

        // 3. 이미지 업로드 및 추론 실행
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const imageUrl = URL.createObjectURL(file);
            originalImg.src = imageUrl;

            const img = new Image();
            img.src = imageUrl;
            await img.decode();

            const aiSession = await initModel();
            if (!aiSession) return;

            statusDiv.textContent = "배경을 제거하는 중...";
            const startTime = performance.now();

            // 전처리
            const tensorInput = await preprocessImage(img);
            const feeds = { [aiSession.inputNames[0]]: tensorInput };

            // 추론(Run)
            const results = await aiSession.run(feeds);
            const output = results[aiSession.outputNames[0]];

            // 마스크 결과 가공 및 캔버스 합성
            applyMaskToCanvas(img, output.data);

            const duration = ((performance.now() - startTime) / 1000).toFixed(2);
            statusDiv.textContent = `배경 제거 완료! (${duration}초 소요)`;
        });

        // 4. AI 마스크를 원본 이미지에 적용해 투명 PNG 캔버스 생성
        function applyMaskToCanvas(img, maskData) {
            const width = img.naturalWidth;
            const height = img.naturalHeight;

            resultCanvas.width = width;
            resultCanvas.height = height;
            const ctx = resultCanvas.getContext('2d');

            // 1단계: 원본 이미지 그리기
            ctx.drawImage(img, 0, 0);
            const imgData = ctx.getImageData(0, 0, width, height);

            // 2단계: 320x320 마스크를 원본 크기에 맞춰 알파값(투명도)으로 적용
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 320;
            tempCanvas.height = 320;
            const tempCtx = tempCanvas.getContext('2d');
            const maskImageData = tempCtx.createImageData(320, 320);

            // 마스크 최소/최대값 정규화
            let min = Math.min(...maskData);
            let max = Math.max(...maskData);
            let range = max - min || 1;

            for (let i = 0; i < 320 * 320; i++) {
                let val = Math.round(((maskData[i] - min) / range) * 255);
                maskImageData.data[i * 4] = 255;
                maskImageData.data[i * 4 + 1] = 255;
                maskImageData.data[i * 4 + 2] = 255;
                maskImageData.data[i * 4 + 3] = val;
            }
            tempCtx.putImageData(maskImageData, 0, 0);

            // 원본 크기로 마스크를 확대해서 기존 이미지 알파 채널에 덮어씌우기
            ctx.globalCompositeOperation = 'destination-in';
            ctx.drawImage(tempCanvas, 0, 0, width, height);
            ctx.globalCompositeOperation = 'source-over';
        }
    </script>
</body>
</html>
