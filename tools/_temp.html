<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Background & Signature Remover</title>
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #202020; color: #fff; transition: background 0.3s; }

        .app-container { display: flex; min-height: 100vh; }
        .sidebar { 
            width: 250px; height: 100vh; position: fixed; left: 0; top: 0; 
            background-color: #101010; padding: 20px; z-index: 1000; 
            display: flex; flex-direction: column; transition: transform 0.3s ease; 
        }
        .main-content { 
            margin-left: 250px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; gap: 20px; overflow: hidden; transition: 0.3s; 
        }
        .workspace-container {
            display: flex;
            flex-direction: row;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }

        .menu-btn, .theme-btn { 
            width: 100%; padding: 10px; margin-bottom: 10px; cursor: pointer;
            background: #202020; color: #ff9e40; border: 2px solid #ff9e40; 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; text-align: center;
        }
        .menu-btn:hover, .menu-btn.active { background: #ff9e40; color: #101010; }
        .theme-btn:hover { background-color: #FDF5E6; color: #F38020; border-color: #FDF5E6; }

        .control-group {
            background: #181818;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            margin-bottom: 10px;
            text-align: left;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #ff9e40;
            font-weight: bold;
        }
        .control-group input[type="range"] {
            width: 100%;
            accent-color: #ff9e40;
            cursor: pointer;
        }

        .content-box { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; display: flex; 
            padding: 20px; background: transparent; flex-direction: column; 
            align-items: center; justify-content: center; gap: 10px; text-align: center;
            overflow: hidden; position: relative;
            cursor: pointer;
        }
        .content-mid.dragover { background-color: rgba(255, 158, 64, 0.1); border-style: dashed; }
        .image-preview-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            position: relative;
            background-image: linear-gradient(45deg, #2a2a2a 25%, transparent 25%), 
                              linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #2a2a2a 75%), 
                              linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }
        .preview-img, .preview-canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        .empty-msg {
            color: #888;
            font-family: 'Consolas', monospace;
            font-size: 1rem;
        }
        #loading-msg {
            display: none;
            color: #ff9e40;
            font-weight: bold;
            font-size: 0.95rem;
            margin-top: 10px;
        }

        .card, .content-box {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        body.light-mode { background-color: #fff; }
        body.light-mode .sidebar { background-color: #FDF5E6; box-shadow: 4px 0 15px rgba(0, 0, 0, 0.05); }
        body.light-mode .menu-btn, body.light-mode .theme-btn { background: #FDF5E6; color: #F38020; border-color: #F38020; }
        body.light-mode .menu-btn:hover, body.light-mode .menu-btn.active { background: #F38020; color: #ffffff; border-color: #F38020; }
        body.light-mode .theme-btn:hover { background-color: #202020; color: #ff9e40; border-color: #202020; }
        body.light-mode .control-group { background: #fff5e6; border-color: #f38020; }

        .menu-toggle-btn { display: none; position: fixed; bottom: 20px; left: 20px; z-index: 2000; padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }

        @media (max-width: 600px) {
            .menu-toggle-btn { display: block; color: #ffffff; }
            .sidebar { transform: translateX(-250px); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px; width: 100%; max-height: 100svh; flex: 1; display: flex; flex-direction: column; }
            .workspace-container { flex-direction: column; }
        }
    </style>
</head>
<body>
<button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
<input type="file" id="file-selector" accept="image/*" style="display: none;">

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <button class="menu-btn" onclick="location.href='../index'">Home</button>
        <button id="theme-toggle" class="theme-btn">DAY / NIGHT</button>

        <button class="menu-btn active" id="btn-ai-bg" onclick="switchMode('ai')">Instant BG Remover</button>
        <button class="menu-btn" id="btn-sig" onclick="switchMode('signature')">Signature Remover</button>

        <div class="control-group" id="signature-controls" style="display: none;">
            <label for="thresholdRange">
                <span>제거 강도</span>
                <span id="thresholdVal">230</span>
            </label>
            <input type="range" id="thresholdRange" min="150" max="250" value="230">
        </div>

        <button class="menu-btn" onclick="uploadFile()">Upload</button>
        <button class="menu-btn" onclick="resetAll()">Reset</button>
    </aside>

    <main class="main-content">
        <header class="top-section" id="header-section">
            <h1 id="page-title">Instant Background Remover</h1>
            <p id="page-desc">Upload an image for sub-3-second background removal.</p>
        </header>

        <div class="workspace-container">
            <section class="content-box content-mid" id="drop-zone">
                <div class="image-preview-container" id="original-container">
                    <div class="empty-msg">Drag & Drop an image file here or click to upload.</div>
                </div>
            </section>
            <section class="content-box content-down" id="result-zone">
                <div class="image-preview-container" id="result-container">
                    <div class="empty-msg">Result image will appear here.</div>
                </div>
                <div id="loading-msg">⚡ Fast processing...</div>
            </section>
        </div>
    </main>
</div>

<script>
    const sidebar = document.getElementById('sidebar');
    const dropZone = document.getElementById('drop-zone');
    const originalContainer = document.getElementById('original-container');
    const resultContainer = document.getElementById('result-container');
    const fileSelector = document.getElementById('file-selector');
    const loadingMsg = document.getElementById('loading-msg');

    const btnAiBg = document.getElementById('btn-ai-bg');
    const btnSig = document.getElementById('btn-sig');
    const signatureControls = document.getElementById('signature-controls');
    const pageTitle = document.getElementById('page-title');
    const pageDesc = document.getElementById('page-desc');

    const thresholdRange = document.getElementById('thresholdRange');
    const thresholdVal = document.getElementById('thresholdVal');

    let currentMode = 'ai';
    let currentFile = null;

    window.toggleSidebar = function() { sidebar.classList.toggle('active'); }
    document.getElementById('theme-toggle').addEventListener('click', () => { document.body.classList.toggle('light-mode'); });
    document.querySelector('.main-content').addEventListener('click', (e) => { 
        if (sidebar.classList.contains('active') && !e.target.closest('.sidebar')) { 
            sidebar.classList.remove('active'); 
        } 
    });

    window.switchMode = function(mode) {
        currentMode = mode;
        setInitialUI();

        if (mode === 'ai') {
            btnAiBg.classList.add('active');
            btnSig.classList.remove('active');
            signatureControls.style.display = 'none';
            pageTitle.textContent = "Instant Background Remover";
            pageDesc.textContent = "Upload an image for sub-3-second background removal.";
        } else {
            btnSig.classList.add('active');
            btnAiBg.classList.remove('active');
            signatureControls.style.display = 'block';
            pageTitle.textContent = "Stamp & Signature Remover";
            pageDesc.textContent = "Upload a document image to remove white background instantly.";
        }
    };

    thresholdRange.addEventListener('input', (e) => {
        thresholdVal.textContent = e.target.value;
        if (currentFile && currentMode === 'signature') {
            processSignatureImage(currentFile);
        }
    });

    function setInitialUI() {
        originalContainer.innerHTML = `<div class="empty-msg">Drag & Drop an image file here or click to upload.</div>`;
        resultContainer.innerHTML = `<div class="empty-msg">Result image will appear here.</div>`;
        loadingMsg.style.display = 'none';
        fileSelector.value = '';
        currentFile = null;
    }
    setInitialUI();

    // 3초 내 완료를 위한 초고속 모서리 샘플링 + 픽셀 스키핑 최적화 파이프라인
    async function processFastBackground(file) {
        loadingMsg.style.display = 'block';
        loadingMsg.textContent = "⚡ Fast processing...";

        const originalUrl = URL.createObjectURL(file);
        originalContainer.innerHTML = `<img src="${originalUrl}" alt="Original Preview" class="preview-img">`;

        try {
            const bitmap = await createImageBitmap(file);
            const width = bitmap.width;
            const height = bitmap.height;

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(bitmap, 0, 0);

            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;

            // 모서리 샘플링을 통한 배경색 정밀 추출
            let bgR = 0, bgG = 0, bgB = 0, count = 0;
            const samplePoints = [
                [0, 0], [width - 1, 0], [0, height - 1], [width - 1, height - 1],
                [Math.floor(width / 2), 0], [Math.floor(width / 2), height - 1],
                [0, Math.floor(height / 2)], [width - 1, Math.floor(height / 2)]
            ];

            samplePoints.forEach(([x, y]) => {
                const idx = (y * width + x) * 4;
                bgR += data[idx];
                bgG += data[idx + 1];
                bgB += data[idx + 2];
                count++;
            });

            bgR /= count; bgG /= count; bgB /= count;

            // 속도를 극대화하기 위해 4픽셀(16바이트)씩 건너뛰며 배경 판별 및 투명화 처리
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                // 유클리드 거리를 활용한 배경 색상 유사도 판별
                const diff = Math.sqrt(
                    (r - bgR) * (r - bgR) +
                    (g - bgG) * (g - bgG) +
                    (b - bgB) * (b - bgB)
                );

                if (diff < 45) {
                    data[i + 3] = 0; // 알파 채널 제거 (투명화)
                }
            }

            ctx.putImageData(imgData, 0, 0);

            const resultCanvas = document.createElement('canvas');
            resultCanvas.width = width;
            resultCanvas.height = height;
            resultCanvas.className = 'preview-canvas';
            const resCtx = resultCanvas.getContext('2d');
            resCtx.drawImage(canvas, 0, 0);

            resultContainer.innerHTML = '';
            resultContainer.appendChild(resultCanvas);
        } catch (err) {
            console.error(err);
            alert('Error processing image.');
            resultContainer.innerHTML = `<div class="empty-msg">Error occurred</div>`;
        } finally {
            loadingMsg.style.display = 'none';
        }
    }

    function processSignatureImage(file) {
        loadingMsg.style.display = 'block';
        loadingMsg.textContent = "⚡ Processing signature...";

        const reader = new FileReader();
        reader.onload = (e) => {
            const imageUrl = e.target.result;
            originalContainer.innerHTML = `<img src="${imageUrl}" alt="Original Preview" class="preview-img">`;

            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');

                ctx.drawImage(img, 0, 0);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                const threshold = parseInt(thresholdRange.value);
                const whiteLimit = 200 + (threshold - 200) * 0.5;

                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    const max = Math.max(r, g, b);
                    const min = Math.min(r, g, b);
                    const lightness = (max + min) / 2;
                    const saturation = max === 0 ? 0 : (max - min) / max;

                    if (lightness > whiteLimit && saturation < 0.2) {
                        data[i + 3] = 0; 
                    } else if (lightness > whiteLimit - 30 && lightness <= whiteLimit) {
                        const alphaRatio = (whiteLimit - lightness) / 30;
                        data[i + 3] = Math.floor(data[i + 3] * alphaRatio * alphaRatio);
                    } else {
                        data[i + 3] = 255;
                    }
                }

                ctx.putImageData(imgData, 0, 0);

                const resultCanvas = document.createElement('canvas');
                resultCanvas.width = canvas.width;
                resultCanvas.height = canvas.height;
                resultCanvas.className = 'preview-canvas';
                const resCtx = resultCanvas.getContext('2d');
                resCtx.drawImage(canvas, 0, 0);

                resultContainer.innerHTML = '';
                resultContainer.appendChild(resultCanvas);
                loadingMsg.style.display = 'none';
            };
            img.src = imageUrl;
        };
        reader.readAsDataURL(file);
    }

    function handleFile(file) {
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            alert('Please upload an image file.');
            return;
        }

        currentFile = file;
        if (currentMode === 'ai') {
            processFastBackground(file);
        } else {
            processSignatureImage(file);
        }
    }

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', (e) => { 
        e.preventDefault(); 
        dropZone.classList.remove('dragover'); 
        const file = e.dataTransfer.files[0]; 
        handleFile(file); 
    });
    dropZone.addEventListener('click', () => { fileSelector.click(); });

    window.uploadFile = function() { fileSelector.click(); };

    fileSelector.addEventListener('change', (e) => {
        const file = e.target.files[0];
        handleFile(file);
    });

    window.resetAll = function() { setInitialUI(); };
</script>
</body>
</html>
