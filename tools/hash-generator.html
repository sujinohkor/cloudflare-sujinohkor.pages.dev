<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash Generator</title>
    <!-- 파비콘 설정 추가 -->
    <link rel="icon" type="image/png" href="/assets/LOGO-orange.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/md5.min.js"></script>
    <style>
        /* 1. Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; transition: background 0.3s, color 0.3s; min-height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; display: block; }

        .app-container { display: flex; min-height: 100vh; width: 100%; }

        /* 완전 투명한 플로팅 사이드바 (데스크톱 전용) */
        .sidebar { 
            width: 260px; height: calc(100vh - 40px); position: fixed; left: 20px; top: 20px; 
            background: rgba(16, 16, 16, 0.25); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 25px 20px; z-index: 2000; 
            display: flex; flex-direction: column; gap: 12px; 
            border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, background 0.3s, border 0.3s; 
        }
        .sidebar-title { color: #ff9e40; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; text-align: center; letter-spacing: 1px; }

        /* DAY/NIGHT 버튼 최상단 배치 스타일 (데스크톱용) */
        .sidebar-top { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .theme-toggle-btn { width: 100%; padding: 11px; background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.5); border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .theme-toggle-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* 메인 콘텐츠 영역 */
        .main-content { 
            margin-left: 300px; padding: 40px; flex: 1; 
            display: flex; flex-direction: column; height: 100vh; 
            gap: 20px; overflow: hidden; transition: 0.3s; 
            width: calc(100% - 300px);
        }

        /* 3. Components */
        .menu-btn { 
            width: 100%; padding: 11px 14px; cursor: pointer; text-align: center;
            background: rgba(255, 255, 255, 0.03); color: #ff9e40; border: 1px solid rgba(255, 158, 64, 0.35); 
            border-radius: 50px; font-weight: bold; transition: all 0.3s; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .menu-btn:hover { background: rgba(255, 158, 64, 0.2); color: #ff9e40; border-color: rgba(255, 158, 64, 0.6); }

        /* 통계 패널(카드) 스타일 */
        .info-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 158, 64, 0.25);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #ccc;
        }
        .info-row span:last-child {
            color: #ff9e40;
            font-weight: bold;
        }

        .bottom-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bottom-btns > .menu-btn {
            margin-bottom: 0;
        }

        .content-top { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; 
            display: flex; overflow: hidden; background: rgba(0, 0, 0, 0.2); 
            position: relative; 
        }

        .content-mid { 
            flex: 1; border: 2px solid #ff9e40; border-radius: 16px; 
            display: flex; overflow: hidden; padding: 20px; color: #888; 
            font-family: 'Consolas', 'Courier New', 'Monaco', monospace, sans-serif; 
            font-size: 1rem; cursor: pointer; transition: all 0.3s ease; 
            user-select: none; flex-direction: column; align-items: center; 
            justify-content: center; gap: 10px; text-align: center;
            background: rgba(255, 255, 255, 0.02);
        }
        .content-mid.dragover { background-color: rgba(255, 158, 64, 0.1); border-style: dashed; color: #ff9e40; }
        .content-mid.has-file { background-color: rgba(255, 158, 64, 0.05); color: #ff9e40; font-weight: bold; }
        body.light-mode .content-mid.has-file { background-color: rgba(243, 128, 32, 0.05); color: #F38020; }

        .content-down { 
            flex: 2; border: 2px solid #ff9e40; border-radius: 16px; 
            display: flex; overflow: hidden; background: rgba(0, 0, 0, 0.2); 
        }

        textarea { 
            flex: 1; padding: 20px; background: transparent; border: none; 
            color: #fff; font-family: 'Consolas', 'Courier New', 'Monaco', monospace, sans-serif; 
            font-size: 1rem; resize: none; outline: none; overflow-y: auto; white-space: pre; 
        }

        /* 다크 모드 카드/패널 그림자 */
        .card, .content-top, .content-mid, .content-down { 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5); 
        }

        /* 4. Theme (Light Mode) */
        body.light-mode { background-color: #fff; color: #202020; }
        body.light-mode .sidebar { 
            background: rgba(255, 255, 255, 0.3); 
            border-color: rgba(243, 128, 32, 0.35); 
            box-shadow: 0 20px 40px rgba(243, 128, 32, 0.15); 
        }
        body.light-mode .menu-btn, body.light-mode .theme-toggle-btn { 
            background: rgba(0, 0, 0, 0.02); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.5); 
        }
        body.light-mode .menu-btn:hover, body.light-mode .theme-toggle-btn:hover { 
            background: rgba(243, 128, 32, 0.15); 
            color: #F38020; 
            border-color: rgba(243, 128, 32, 0.4); 
        }
        body.light-mode .top-section h1, body.light-mode .top-section p { color: #202020; }
        body.light-mode textarea { color: #000; }
        body.light-mode .content-mid { color: #666; background: rgba(0, 0, 0, 0.02); }
        body.light-mode .content-mid.dragover { background-color: rgba(243, 128, 32, 0.1); border-style: dashed; color: #f38020; }
        body.light-mode .menu-toggle-btn { color: #ffffff; }
        body.light-mode .content-top, body.light-mode .content-mid, body.light-mode .content-down { background: rgba(255, 255, 255, 0.5); border-color: #F38020; }
        body.light-mode .info-panel {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(243, 128, 32, 0.5);
        }
        body.light-mode .info-row { color: #202020; }
        body.light-mode .info-row span:last-child { color: #F38020; }
        body.light-mode .card, body.light-mode .content-top, body.light-mode .content-mid, body.light-mode .content-down { 
            box-shadow: 0 10px 20px rgba(243, 128, 32, 0.15); 
        }

        /* 5. Mobile Responsive */
        .menu-toggle-btn { 
            display: none; position: fixed; bottom: 20px; left: 20px; z-index: 3000; 
            padding: 10px 15px; background: #ff9e40; border: none; border-radius: 50px; 
            font-weight: bold; cursor: pointer; color: #ffffff; 
        }

        @media (max-width: 900px) { 
            .menu-toggle-btn { display: block; } 
            .sidebar { 
                transform: translateX(-320px); 
                background: #101010 !important; 
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7) !important; 
            } 
            body.light-mode .sidebar { 
                background: #ffffff !important; 
                box-shadow: 10px 0 30px rgba(243, 128, 32, 0.35) !important; 
            }
            .sidebar.active { transform: translateX(0); } 
            .main-content { margin-left: 0; padding: 20px; width: 100vw; max-height: 100svh; } 
            .content-top, .content-mid, .content-down { flex-direction: column; overflow-y: visible; }
            #hash-output { font-family: monospace; white-space: pre; overflow-x: auto; word-break: keep-all; }
        }
    </style>
</head>
<body>
    <button class="menu-toggle-btn" onclick="toggleSidebar()">MENU</button>
    <input type="file" id="file-selector" style="display: none;">
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-title">Hash Generator</div>
            <div class="sidebar-top">
                <button class="theme-toggle-btn" id="theme-toggle">DAY / NIGHT</button>
            </div>

            <button class="menu-btn" onclick="location.href='../index'">Home</button>

            <div class="info-panel">
                <div class="info-row">
                    <span>Characters (with spaces)</span>
                    <span id="char-count-all">0</span>
                </div>
                <div class="info-row">
                    <span>Characters (no spaces)</span>
                    <span id="char-count-no-space">0</span>
                </div>
                <div class="info-row">
                    <span>Word Count</span>
                    <span id="word-count">0</span>
                </div>
                <div class="info-row">
                    <span>Paragraph Count</span>
                    <span id="para-count">0</span>
                </div>
                <div class="info-row">
                    <span>Byte Count</span>
                    <span id="byte-count">0</span>
                </div>
            </div>

            <div class="bottom-btns">
                <button class="menu-btn" onclick="uploadFile()">Upload</button>
                <button class="menu-btn" onclick="copyHashes()">Copy</button>
                <button class="menu-btn" onclick="saveHashes()">Save as Text File</button>
                <button class="menu-btn" onclick="resetAll()">Reset</button>
            </div>
        </aside>

        <main class="main-content" id="main-content">
            <header class="top-section">
                <h1>Hash Generator</h1>
                <p>Enter text below to generate hash values.</p>
            </header>

            <section class="content-top">
                <textarea id="text-input" placeholder="Enter text here."></textarea>
            </section>

            <section class="content-mid">
            </section>

            <section class="content-down">
                <textarea id="hash-output" placeholder="Hashes will be generated here." readonly></textarea>
            </section>
        </main>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const hashOutput = document.getElementById('hash-output');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        const contentMid = document.querySelector('.content-mid');
        const fileSelector = document.getElementById('file-selector');

        function toggleSidebar() { 
            sidebar.classList.toggle('active'); 
        }

        sidebar.querySelectorAll('button').forEach(element => {
            element.addEventListener('click', () => {
                if (window.innerWidth <= 900) {
                    sidebar.classList.remove('active');
                }
            });
        });

        document.getElementById('theme-toggle').addEventListener('click', () => { 
            document.body.classList.toggle('light-mode'); 
        });

        mainContent.addEventListener('click', () => { 
            if (sidebar.classList.contains('active')) { 
                sidebar.classList.remove('active'); 
            } 
        });

        function clearCounters() {
            document.getElementById('char-count-all').innerText = '0';
            document.getElementById('char-count-no-space').innerText = '0';
            document.getElementById('word-count').innerText = '0';
            document.getElementById('para-count').innerText = '0';
            document.getElementById('byte-count').innerText = '0';
        }

        textInput.addEventListener('input', () => {
            const text = textInput.value;

            if (contentMid.classList.contains('has-file')) {
                contentMid.classList.remove('has-file');
                contentMid.innerHTML = `<div style="font-size: 3rem;">📄</div><div>Drag & Drop a file here or click to upload.</div>`;
            }

            document.getElementById('char-count-all').innerText = text.length;
            document.getElementById('char-count-no-space').innerText = text.replace(/\s/g, '').length;
            document.getElementById('word-count').innerText = text.trim().split(/\s+/).filter(w => w.length > 0).length;
            document.getElementById('para-count').innerText = text.split('\n').filter(p => p.trim().length > 0).length;

            let bytes = 0;
            for (let i = 0; i < text.length; i++) {
                bytes += (text.charCodeAt(i) > 127) ? 2 : 1;
            }
            document.getElementById('byte-count').innerText = bytes;

            generateHashes(text);
        });

        function generateHashes(targetData) {
            if (!targetData) { 
                hashOutput.value = ''; 
                return; 
            }
            try {
                const md5Hash = CryptoJS.MD5(targetData).toString();
                const sha1Hash = CryptoJS.SHA1(targetData).toString();
                const sha256Hash = CryptoJS.SHA256(targetData).toString();
                const sha224Hash = CryptoJS.SHA224(targetData).toString();
                const sha512Hash = CryptoJS.SHA512(targetData).toString();
                const sha384Hash = CryptoJS.SHA384(targetData).toString();
                const sha3Hash = CryptoJS.SHA3(targetData).toString();
                const ripemd160Hash = CryptoJS.RIPEMD160(targetData).toString();

                hashOutput.value = [
                    `MD5: ${md5Hash}\n`,
                    `SHA-1: ${sha1Hash}\n`,
                    `SHA-256: ${sha256Hash}\n`,
                    `SHA-224: ${sha224Hash}\n`,
                    `SHA-512: ${sha512Hash}\n`,
                    `SHA-384: ${sha384Hash}\n`,
                    `SHA-3: ${sha3Hash}\n`,
                    `RIPEMD-160: ${ripemd160Hash}`
                ].join('\n');
            } catch (error) {
                hashOutput.value = "Hash generation failed.";
                console.error(error);
            }
        }

        contentMid.innerHTML = `<div style="font-size: 3rem;">📄</div><div>Drag & Drop a file here or click to upload.</div>`;

        function handleFile(file) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const arrayBuffer = e.target.result;
                const wordArray = CryptoJS.lib.WordArray.create(arrayBuffer);

                clearCounters();
                document.getElementById('byte-count').innerText = file.size;

                textInput.value = ''; 
                generateHashes(wordArray);

                contentMid.classList.add('has-file');
                contentMid.innerHTML = `
                    <div style="font-size: 3rem;">✅</div>
                    <div style="word-break: break-all;">Uploaded File: ${file.name}</div>
                    <div style="font-size: 0.8rem; font-weight: normal; opacity: 0.7;">(Click or drag another file to change)</div>
                `;
            };
            reader.readAsArrayBuffer(file);
        }

        contentMid.addEventListener('dragover', (e) => { e.preventDefault(); contentMid.classList.add('dragover'); });
        contentMid.addEventListener('dragleave', () => { contentMid.classList.remove('dragover'); });
        contentMid.addEventListener('drop', (e) => { e.preventDefault(); contentMid.classList.remove('dragover'); const file = e.dataTransfer.files[0]; handleFile(file); });
        contentMid.addEventListener('click', () => { fileSelector.click(); });

        function uploadFile() { fileSelector.click(); }

        fileSelector.addEventListener('change', (e) => {
            const file = e.target.files[0];
            handleFile(file);
            e.target.value = ''; 
        });

        function copyHashes() {
            if (!hashOutput.value || hashOutput.value === 'Hashes will be generated here.') return alert('No hash values to copy.');
            hashOutput.select();
            document.execCommand('copy');
            alert('Hash values copied!');
        }

        function saveHashes() {
            const text = hashOutput.value;
            if (!text.trim() || text === 'Hashes will be generated here.') return alert("No hash values to save.");
            const blob = new Blob(['\uFEFF', text], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Hashes.txt';
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function resetAll() {
            textInput.value = ''; 
            contentMid.classList.remove('has-file');
            contentMid.innerHTML = `<div style="font-size: 3rem;">📄</div><div>Drag & Drop a file here or click to upload.</div>`;
            clearCounters();
            generateHashes('');
        }
    </script>
</body>
</html>
