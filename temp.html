<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 이미지 설명기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #101010; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; background: #202020; padding: 30px; border-radius: 16px; border: 1px solid rgba(255,158,64,0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #ff9e40; font-size: 1.8rem; margin-bottom: 20px; text-align: center; }
        .upload-box { border: 2px dashed #ff9e40; padding: 30px; text-align: center; border-radius: 12px; cursor: pointer; margin-bottom: 20px; transition: 0.3s; }
        .upload-box:hover { background: rgba(255,158,64,0.1); }
        input[type="file"] { display: none; }
        #preview { max-width: 100%; max-height: 300px; border-radius: 8px; margin-bottom: 20px; display: none; }
        button { width: 100%; padding: 12px; background: #ff9e40; color: #101010; border: none; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e08b35; }
        .result-box { margin-top: 25px; background: #151515; padding: 20px; border-radius: 10px; border: 1px solid #333; white-space: pre-wrap; line-height: 1.6; display: none; }
        .loading { text-align: center; color: #ff9e40; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Image Explainer</h1>
        
        <label class="upload-box" for="file-input">
            <p>📁 이곳을 클릭하여 이미지를 업로드하세요</p>
        </label>
        <input type="file" id="file-input" accept="image/*">
        
        <div style="text-align: center;">
            <img id="preview" alt="미리보기">
        </div>
        
        <button id="submit-btn" style="display: none;">AI에게 물어보기</button>
        <div class="loading" id="loading">AI가 이미지를 분석하는 중입니다... ⏳</div>
        
        <div class="result-box" id="result-box"></div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const submitBtn = document.getElementById('submit-btn');
        const loading = document.getElementById('loading');
        const resultBox = document.getElementById('result-box');
        
        let selectedFile = null;

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'inline-block';
                    submitBtn.style.display = 'block';
                    resultBox.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        submitBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('image', selectedFile);

            submitBtn.style.display = 'none';
            loading.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                // 본인의 Cloudflare Worker 엔드포인트 URL로 교체하세요
                const workerUrl = 'https://image-explainer.sujinohkor.workers.dev';
                
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (data.response) {
                    resultBox.innerText = data.response;
                } else {
                    resultBox.innerText = '설명을 불러오지 못했습니다.';
                }
                resultBox.style.display = 'block';
            } catch (err) {
                console.error(err);
                resultBox.innerText = '오류가 발생했습니다. 다시 시도해주세요.';
                resultBox.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                submitBtn.style.display = 'block';
            }
        });
    </script>
</body>
</html>
